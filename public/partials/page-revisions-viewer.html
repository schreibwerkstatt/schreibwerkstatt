<!-- Fragment: Viewer der Revisionsliste (natives <dialog>, geoeffnet via
     showModal() in page-revisions/viewer.js#openViewer). Eingebunden per
     Include-Marker in page-revisions.html, im Scope von pageRevisionsCard. -->
<!-- Scroll-Sperre der Seite als Klasse am <html> (page-revision-viewer.css):
     globaler Zustand als Klasse, nie per html:has() (public/css/CLAUDE.md). -->
<dialog class="revision-viewer"
        x-ref="viewerDialog"
        x-effect="document.documentElement.classList.toggle('revision-viewer-open', viewerOpen)"
        @close="viewerOpen && dismissViewer()"
        @keydown.escape="dismissViewer()"
        @keydown.left="onViewerArrow($event, 'prev')"
        @keydown.right="onViewerArrow($event, 'next')"
        @keydown.window.capture.enter="onViewerRestoreKey($event)">
  <template x-if="viewerOpen && viewerRev">
    <div class="revision-viewer__inner">
      <header class="revision-viewer__head">
        <div class="revision-viewer__meta">
          <!-- Anheften + Name im Titel. Angeheftet = von der Retention
               ausgenommen; mit Schreibrecht ist der Name direkt im Titel
               editierbar, ohne Schreibrecht steht er als Text. -->
          <h2 class="revision-viewer__title">
            <button type="button"
                    class="revision-viewer__pin"
                    x-show="canWrite() || viewerRev.pinned"
                    :class="{ 'is-active': viewerRev.pinned }"
                    @click="togglePin(viewerRev)"
                    :disabled="!canWrite() || pinningId === viewerRev.id"
                    :aria-pressed="!!viewerRev.pinned"
                    :aria-label="$app.t(viewerRev.pinned ? 'editor.revisions.unpin' : 'editor.revisions.pin')"
                    :data-tip="$app.t(viewerRev.pinned ? 'editor.revisions.unpinTitle' : 'editor.revisions.pinTitle')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#pin"/></svg></button>
            <span x-show="!(viewerRev.pinned && canWrite())" x-text="revisionTitle(viewerRev)"></span>
            <input type="text"
                   class="revision-viewer__label"
                   x-show="viewerRev.pinned && canWrite()"
                   x-model="viewerLabelDraft"
                   maxlength="120"
                   :placeholder="$app.t('editor.revisions.labelPlaceholder')"
                   :aria-label="$app.t('editor.revisions.labelPlaceholder')"
                   data-spellcheck="spelling"
                   @keydown.enter="$enter($event, () => saveViewerLabel())"
                   @blur="saveViewerLabel()">
            <span class="revision-viewer__date" x-show="viewerRev.pinned && (viewerRev.label || canWrite())"
                  x-text="$app.formatDate(viewerRev.created_at)"></span>
          </h2>
          <span class="badge badge-ok" x-text="sourceLabel(viewerRev.source)"></span>
          <span class="tag" x-show="summaryLabel(viewerRev)" x-text="summaryLabel(viewerRev)"></span>
          <span x-user-chip="viewerRev.user_email"
                x-show="$app.bookSharedFlags?.[$store.nav.selectedBookId]"></span>
          <span class="tag" x-text="formatChars(viewerRev.chars) + ' ' + $app.t('editor.revisions.chars')"></span>
          <span class="tag" x-show="viewerRev.client"
                :data-tip="$app.t('editor.revisions.clientTitle')"
                x-text="viewerRev.client"></span>
        </div>
        <button type="button"
                class="revision-viewer__close"
                @click="dismissViewer()"
                :data-tip="$app.t('editor.revisions.viewer.close')"
                :aria-label="$app.t('editor.revisions.viewer.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
      </header>

      <!-- Tab+Panel-Set ueber Alpine.data('tabs') (DESIGN.md «Tabs»): ARIA,
           Roving-Tabindex und Pfeil-Tastatur kommen aus der Komponente. Der
           aktive Tab ist `viewerMode`; `tab-change` zieht den Diff nach. Auf der
           Tab-Leiste blaettern ←/→ nicht durch die Revisionen (onViewerArrow).
           Wrapper ohne eigene Box (display: contents), die Spaltenaufteilung
           des Dialogs bleibt. -->
      <div class="revision-viewer__tabset"
           x-data="tabs(['content', 'diff'])" x-modelable="value" x-model="viewerMode"
           @tab-change="setViewerMode($event.detail)">
        <div class="revision-viewer__tabs" x-bind="tablist">
          <button class="revision-viewer__tab" x-bind="tabBtn('content')"
                  x-text="$app.t('editor.revisions.viewer.tabContent')"></button>
          <button class="revision-viewer__tab" x-bind="tabBtn('diff')"
                  x-text="$app.t('editor.revisions.viewer.tabDiff')"></button>
        </div>

        <div class="revision-viewer__body">
          <div x-show="viewerLoading" x-skeleton="6" x-cloak></div>
          <div x-show="viewerError" x-cloak class="revision-viewer__hint revision-viewer__hint--error"
               role="alert" x-text="viewerError"></div>

          <!-- Inhalt-Tab: gerendertes Body-HTML der Revision. Der Server liefert
               es ohne aktive Inhalte aus (stripActiveContent in der Detail-Route). -->
          <div x-bind="panel('content')">
            <div x-show="!viewerLoading && !viewerError" x-cloak
                 class="revision-viewer__content page-content-view"
                 x-html="viewerBody"></div>
          </div>

          <!-- Vergleichs-Tab: Block-/Wort-Diff gegen Vorgaengerin oder aktuellen Stand. -->
          <div x-bind="panel('diff')">
            <div x-show="!viewerLoading && !viewerError" x-cloak class="revision-viewer__diff">
            <!-- Modus-Toggle (DESIGN.md „Tabs / Modus-Toggle"), kein Panel-Set. -->
            <div class="revision-viewer__compare">
              <span class="revision-viewer__compare-label" x-text="$app.t('editor.revisions.viewer.compareLabel')"></span>
              <div class="tabs">
                <button type="button" class="tabs-btn"
                        :class="{ 'tabs-btn--active': viewerCompare === 'prev' }"
                        :aria-pressed="viewerCompare === 'prev'"
                        @click="setViewerCompare('prev')"
                        x-text="$app.t('editor.revisions.viewer.compareWithPrev')"></button>
                <button type="button" class="tabs-btn"
                        :class="{ 'tabs-btn--active': viewerCompare === 'current' }"
                        :aria-pressed="viewerCompare === 'current'"
                        @click="setViewerCompare('current')"
                        x-text="$app.t('editor.revisions.viewer.compareWithCurrent')"></button>
              </div>
            </div>
            <!-- Vergleich «aktuell» ohne Server: lief gegen den lokalen Stand. -->
            <div x-show="!viewerDiffLoading && !viewerDiffError && viewerDiffLocal" x-cloak
                 class="revision-viewer__hint"
                 x-text="$app.t('editor.revisions.viewer.currentLocal')"></div>
            <div x-show="viewerDiffLoading" x-cloak class="revision-viewer__hint"
                 x-text="$app.t('editor.revisions.viewer.diffLoading')"></div>
            <div x-show="!viewerDiffLoading && viewerDiffError" x-cloak
                 class="revision-viewer__hint revision-viewer__hint--error"
                 role="alert" x-text="viewerDiffError"></div>
            <div x-show="!viewerDiffLoading && !viewerDiffError && viewerDiffUnchanged" x-cloak
                 class="revision-viewer__hint"
                 x-text="$app.t(viewerCompare === 'current' ? 'editor.revisions.viewer.noChangesCurrent' : 'editor.revisions.viewer.noChanges')"></div>
            <div x-show="!viewerDiffLoading && !viewerDiffError && !viewerDiffUnchanged && viewerDiffHtml" x-cloak>
              <div class="revision-diff-header" aria-hidden="true">
                <span x-text="$app.t(viewerCompare === 'current' ? 'editor.revisions.viewer.colCurrent' : 'editor.revisions.viewer.colPrev')"></span>
                <span x-text="$app.t('editor.revisions.viewer.colThis')"></span>
              </div>
              <div class="revision-diff-body" x-html="viewerDiffHtml"></div>
            </div>
            </div>
          </div>
        </div>
      </div>

      <footer class="revision-viewer__foot">
        <div class="revision-viewer__nav">
          <button type="button"
                  class="revision-viewer__btn"
                  @click="gotoRev('prev')"
                  :disabled="!hasPrevRev()"
                  :data-tip="$app.t('editor.revisions.viewer.prevTitle')">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#arrow-left"/></svg>
            <span x-text="$app.t('editor.revisions.viewer.prev')"></span>
          </button>
          <button type="button"
                  class="revision-viewer__btn"
                  @click="gotoRev('next')"
                  :disabled="!hasNextRev()"
                  :data-tip="$app.t('editor.revisions.viewer.nextTitle')">
            <span x-text="$app.t('editor.revisions.viewer.next')"></span>
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#arrow-right"/></svg>
          </button>
        </div>
        <div class="revision-viewer__foot-actions">
          <button type="button"
                  class="revision-viewer__btn"
                  @click="dismissViewer()"
                  x-text="$app.t('editor.revisions.viewer.close')"></button>
          <button type="button"
                  class="revision-viewer__btn"
                  x-show="canWrite() && hasViewerPrev()"
                  @click="restorePreviousFromViewer()"
                  :disabled="!canRestore() || restoringId !== null || viewerLoading"
                  :data-tip="restorePrevTip(viewerRev)"
                  x-text="$app.t('editor.revisions.restorePrev')"></button>
          <button type="button"
                  class="revision-viewer__btn revision-viewer__btn--primary"
                  x-show="canWrite()"
                  @click="restoreFromViewer()"
                  :disabled="!canRestore() || restoringId !== null || viewerLoading"
                  :data-tip="restoreTip('')"
                  x-text="restoringId === viewerRev?.id ? $app.t('editor.revisions.restoring') : $app.t('editor.revisions.viewer.restore')"></button>
        </div>
      </footer>
    </div>
  </template>
</dialog>
