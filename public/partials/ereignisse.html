<!-- Globale Ereignisse -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/ereignisse-card.js.
  Fachdaten (globalZeitstrahl) leben in Alpine.store('catalog') und werden
  direkt als $store.catalog.globalZeitstrahl gelesen (kein Root-Proxy). ereignisseFilters
  bleibt am Root (app-navigation schreibt darauf). Meta-State + UI-Helper
  (filteredEreignisse, ereignisseKapitelListe, ereignisseSeitenListe,
  ereignisseSubtypListe, formatEventDate, eventSpanYears) leben hier in der
  Sub-Komponente.

  Kanonform: jedes Event kommt durch cards/ereignisse/model.js#normalizeEvent —
  kapitel/seiten/page_ids/figuren sind IMMER Arrays. Keine Nachnormalisierung
  im Template.

  Zwei Index-Raeume, darum zwei Namen: `data-ev-index` = Position in der
  gefilterten Liste (Bruecke Liste ↔ Band-Marker), `data-event-id` = die
  DB-ID des Ereignisses (Sprungziel von openEreignisById/Deep-Link).
-->
<div class="card card--ereignisse" x-data="ereignisseCard" x-show="$app.showEreignisseCard" x-cloak>
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('events.title')"></span>
      <div class="card-subline" x-show="$store.jobs.alleAktualisierenLastRun && !ereignisseLoading && !zeitstrahlConsolidating">
        <span class="card-timestamp" x-text="$app.t('common.asOf', { date: $store.jobs.alleAktualisierenLastRun })"></span>
      </div>
    </div>
  </div>

  <!-- Jahres-Stand pro Kapitel (nur bei „echter Zeitlinie" in den Buch-Einstellungen).
       Klappbar: Trigger zeigt die Gesamt-Zeitspanne, Panel die Kapitel-Aufschlüsselung. -->
  <div class="gz-chronology" x-data="collapsible()"
       x-show="$store.catalog.zeitstrahlChronology && $store.catalog.globalZeitstrahl.length > 0" x-cloak>
    <button type="button" class="collapsible-toggle gz-chronology-toggle" x-bind="trigger"
            :disabled="!$store.catalog.zeitstrahlChronology?.chapters?.length">
      <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
      <span class="gz-chronology-total-label" x-text="$app.t('events.chronologySpan')"></span>
      <span class="gz-chronology-total-value"
            x-text="$store.catalog.zeitstrahlChronology ? ($store.catalog.zeitstrahlChronology.minYear === $store.catalog.zeitstrahlChronology.maxYear ? String($store.catalog.zeitstrahlChronology.minYear) : $app.t('events.span', { start: $store.catalog.zeitstrahlChronology.minYear, ende: $store.catalog.zeitstrahlChronology.maxYear })) : ''"></span>
    </button>
    <ul class="gz-chronology-list" x-bind="panel" x-cloak>
      <template x-for="c in ($store.catalog.zeitstrahlChronology?.chapters || [])" :key="c.chapter_id">
        <li class="gz-chronology-row">
          <span class="gz-chronology-kap" x-text="c.name"></span>
          <span class="gz-chronology-year" x-text="c.minYear === c.maxYear ? String(c.minYear) : $app.t('events.span', { start: c.minYear, ende: c.maxYear })"></span>
        </li>
      </template>
    </ul>
  </div>

  <!-- Fortschritt Ermittlung -->
  <div x-show="ereignisseLoading && ereignisseProgress > 0" class="progress-bar-wrap">
    <div class="progress-bar" :style="{ '--progress': ereignisseProgress + '%' }"></div>
  </div>
  <div x-show="ereignisseStatus && !zeitstrahlConsolidating" class="card-status" x-html="ereignisseStatus"></div>

  <!-- Fortschritt Konsolidierung -->
  <div x-show="zeitstrahlConsolidating && zeitstrahlProgress > 0" class="progress-bar-wrap">
    <div class="progress-bar" :style="{ '--progress': zeitstrahlProgress + '%' }"></div>
  </div>
  <div x-show="zeitstrahlStatus && !ereignisseLoading" class="card-status" x-html="zeitstrahlStatus"></div>

  <!-- Leer-Hinweis mit CTA -->
  <div x-show="$store.catalog.globalZeitstrahl.length === 0 && !zeitstrahlConsolidating && !ereignisseLoading" class="card-empty">
    <p class="card-empty-text" x-text="$app.t('common.noAnalysisYet')"></p>
    <p class="card-empty-hint" x-text="$app.t('empty.ereignisse.hint')"></p>
    <button type="button" class="primary card-empty-cta"
            @click="$app.alleAktualisieren()"
            :disabled="$store.jobs.alleAktualisierenLoading || !$store.nav.selectedBookId">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg>
      <span x-text="$app.t('header.updateAll')"></span>
    </button>
  </div>

  <!-- Filter -->
  <div x-show="$store.catalog.globalZeitstrahl.length > 0" class="filter-bar">
    <span class="filter-search-wrap">
      <input type="text" x-model="$store.catalogUi.ereignisseFilters.suche" :placeholder="$app.t('common.search')" :aria-label="$app.t('common.search')" class="filter-search-input">
      <button type="button" class="search-clear--icon" x-show="$store.catalogUi.ereignisseFilters.suche" @click="$store.catalogUi.ereignisseFilters.suche=''" :aria-label="$app.t('search.clear')" :data-tip="$app.t('search.clear')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
    </span>
    <div x-data="catalogFilter('figur')"
         x-modelable="value" x-model="$store.catalogUi.ereignisseFilters.figurId"
         x-effect="options = $store.catalog.figuren.filter(f => $store.catalog.globalZeitstrahl.some(ev => ev.figuren.some(fr => fr.id === f.id))).map(f => ({value: f.id, label: f.kurzname || f.name}))"
         >
    </div>
    <div x-data="catalogFilter('subtyp')"
         x-modelable="value" x-model="$store.catalogUi.ereignisseFilters.subtyp"
         x-effect="options = ereignisseSubtypListe().map(s => ({value: s, label: $app.t('events.subtyp.' + s)}))"
         >
    </div>
    <div x-data="catalogFilter('chapter')"
         x-modelable="value" x-model="$store.catalogUi.ereignisseFilters.kapitel"
         x-effect="options = ereignisseKapitelListe().map(k => ({value: k, label: k}))"
         @combobox-change="$store.catalogUi.ereignisseFilters.seite = ''"
         >
    </div>
    <div x-data="catalogFilter('page')"
         x-modelable="value" x-model="$store.catalogUi.ereignisseFilters.seite"
         x-effect="_disabled = !$store.catalogUi.ereignisseFilters.kapitel || ereignisseSeitenListe().length === 0; options = ereignisseSeitenListe().map(s => ({value: s, label: s}))"
         :class="{'combobox-wrap--disabled': _disabled}"
         >
    </div>
    <span class="filter-count" x-text="filteredEreignisse().length + ' / ' + $store.catalog.globalZeitstrahl.length"></span>
  </div>

  <!-- Zeitleiste: Jahres-Band (selbstgebaut, farbcodierte Marker pro Subtyp) + Liste darunter -->
  <div x-show="$store.catalog.globalZeitstrahl.length > 0" class="gz-layout">
    <div class="gz-band" x-show="timelineItemCount > 0" role="group"
         :aria-label="$app.t('events.timelineNav')"
         :style="{ '--gz-band-lanes': bandModel().lanes }">
      <div class="gz-band-track" x-ref="bandTrack">
        <!-- Achse: Jahres-Ticks (Gridline + Label) -->
        <template x-for="tick in bandModel().ticks" :key="'t' + tick.year">
          <div class="gz-band-tick" :style="{ left: tick.x.toFixed(3) + '%' }">
            <span class="gz-band-tick-label" x-text="tick.year"></span>
          </div>
        </template>
        <!-- Marker: Einzel-Events (Punkt/Spanne) + gebündelte „+N"-Chips bei dichten Jahren -->
        <template x-for="m in bandModel().markers" :key="m.kind + m.id">
          <button type="button"
                  class="gz-band-marker"
                  :class="[ m.kind === 'more' ? 'gz-band-marker--more' : '', m.isRange ? 'gz-band-marker--range' : '', (selectedEventIndex === m.id && m.kind !== 'more') ? 'gz-band-marker--selected' : '' ]"
                  :style="bandMarkerStyle(m)"
                  :data-ev-index="m.id"
                  :data-tip="m.kind === 'more' ? $app.t('events.timelineCluster', { count: m.count }) : m.content"
                  :aria-label="m.kind === 'more' ? $app.t('events.timelineCluster', { count: m.count }) : m.content"
                  @click="onBandMarkerClick(m.id)"><span x-show="m.kind === 'more'" x-text="'+' + m.count"></span></button>
        </template>
      </div>
    </div>
    <div class="gz-timeline-hint internal-link" x-show="timelineItemCount < filteredEreignisse().length"
         @click="scrollToFirstUndated()" :data-tip="$app.t('events.timelineUndatedHint')"
         x-text="$app.t('events.timelineUndated', { count: filteredEreignisse().length - timelineItemCount })"></div>
    <div class="global-zeitstrahl-body global-zeitstrahl-body--card">
    <template x-for="(ev, i) in filteredEreignisse()" :key="ev.id ?? i">
      <div class="gz-item"
           :data-ev-index="i"
           :data-event-id="ev.id ?? null"
           :data-section-label="(i === firstUndatedIndex() && i > 0) ? $app.t('events.undatedSection') : null"
           :class="[
             ev.typ === 'extern' ? 'gz-item--extern' : '',
             'gz-item--subtyp-' + (ev.subtyp || 'sonstiges'),
             eventSpanYears(ev) > 0 ? 'gz-item--span' : '',
             !eventHasYear(ev) && ev.story_tag == null ? 'gz-item--unknown' : '',
             ev.manually_edited ? 'gz-item--manual' : '',
             (i === firstUndatedIndex() && i > 0) ? 'gz-item--section-start' : '',
             (ev.id != null && $store.catalogUi.selectedEreignisId === ev.id) ? 'gz-item--selected' : '',
           ]"
           :style="eventSpanYears(ev) > 0 ? ('--span-years:' + eventSpanYears(ev)) : null">
        <div class="gz-marker" :class="ev.typ === 'extern' ? 'gz-marker--extern' : ''"></div>
        <div class="gz-content">
          <div class="gz-datum-row">
            <span class="gz-datum"
                  :class="{ 'gz-datum--unsicher': ev.datum_unsicher && eventHasYear(ev), 'internal-link': eventHasYear(ev) }"
                  :title="ev.datum_unsicher && eventHasYear(ev) ? $app.t('events.estimatedHint') : null"
                  :data-tip="eventHasYear(ev) ? $app.t('events.showOnTimeline') : null"
                  @click="eventHasYear(ev) && selectTimelineEvent(i)"
                  x-text="formatEventDate(ev)"></span>
            <span class="gz-subtyp-badge"
                  :class="'gz-subtyp-badge--' + (ev.subtyp || 'sonstiges')">
              <svg class="icon gz-subtyp-icon" aria-hidden="true"><use :href="'/icons.svg#' + subtypIcon(ev.subtyp || 'sonstiges')"/></svg>
              <span x-text="$app.t('events.subtyp.' + (ev.subtyp || 'sonstiges'))"></span>
            </span>
            <template x-if="ev.typ === 'extern'">
              <span class="gz-extern-badge" x-text="$app.t('events.worldEvent')"></span>
            </template>
            <template x-if="ev.manually_edited">
              <span class="gz-manual-badge" :title="$app.t('events.manuallyEdited')" x-text="$app.t('events.manuallyEdited')"></span>
            </template>
          </div>
          <div class="gz-ereignis"
               :class="{ 'internal-link': eventHasTarget(ev) }"
               :data-tip="eventHasTarget(ev) ? $app.t('events.openText') : null"
               @click="eventHasTarget(ev) && openEventText(ev)"
               x-text="ev.ereignis"></div>
          <!-- Meta-Zeile: Kapitel + Seiten („wo") in einer fliessenden Zeile.
               kapitel[i] gehört zu chapter_ids[i], seiten[i] zu page_ids[i]
               (gleiche Push-Reihenfolge in der /zeitstrahl-Route); im
               Figuren-Fallback fehlen die IDs, dann löst der Name auf. -->
          <div x-show="ev.kapitel.length || ev.seiten.length" class="entity-refs gz-meta">
            <template x-for="(kap, ki) in ev.kapitel" :key="'k' + ki">
              <button type="button" class="entity-ref" x-entity-ref="{ type: 'kapitel', id: (ev.chapter_ids || [])[ki], name: kap }"></button>
            </template>
            <template x-for="(s, si) in ev.seiten" :key="'s' + si">
              <button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', id: (ev.page_ids || [])[si], name: s, kapitel: ev.kapitel[0] }"></button>
            </template>
          </div>
          <div x-show="ev.bedeutung" class="gz-bedeutung" x-text="ev.bedeutung"></div>
          <div class="entity-refs gz-figuren-row">
            <template x-for="(fref, fi) in ev.figuren" :key="fi">
              <button type="button" class="entity-ref" x-entity-ref="{ type: 'figur', id: fref.id, name: fref.name }"></button>
            </template>
          </div>
        </div>
      </div>
    </template>
    </div>
  </div>
</div>
