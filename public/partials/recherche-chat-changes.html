<!--
  Fragment (per String-Include in recherche-chat.html, in der Nachrichten-Schleife;
  Scope: `msg`): Änderungsvorschläge des Recherche-Chats an BESTEHENDEN
  Fundstücken — ergänzen/umschreiben/Status, archivieren, zusammenführen.
  Methoden: chat/research-chat-changes.js. Jeder Vorschlag einzeln übernehmen
  oder verwerfen; kein «alle übernehmen». Alle KI-Felder per x-text — kein x-html.
-->
<template x-if="msg.role === 'assistant' && researchChangeProposals(msg).length">
  <div class="chat-vorschlaege chat-vorschlaege--wide research-chat-changes">
    <template x-for="e in researchChangeProposals(msg)" :key="e.idx">
      <div class="chat-vorschlag"
           :class="{ 'chat-vorschlag--applied': researchChangeState(e.p) === 'applied', 'chat-vorschlag--discarded': researchChangeState(e.p) === 'discarded' }">
        <div class="chat-vorschlag-header">
          <span class="chat-vorschlag-label" x-text="researchChangeLabel(e.p)"></span>
          <span class="chat-vorschlag-actions" x-show="$app.canEdit() && researchChangeState(e.p) !== 'applied'">
            <button type="button" class="chat-vorschlag-btn" x-show="researchChangeState(e.p) === 'open'"
                    @click="applyResearchChange(msg, e.idx)" :disabled="isResearchChangeBusy(msg, e.idx)">
              <span x-show="isResearchChangeBusy(msg, e.idx)" class="spinner"></span>
              <span x-text="$app.t('recherche.chat.change.apply')"></span>
            </button>
            <button type="button" class="chat-vorschlag-btn chat-vorschlag-btn--ghost" x-show="researchChangeEditable(e.p)"
                    @click="toggleResearchChangeEdit(msg, e.idx)" :disabled="isResearchChangeBusy(msg, e.idx)"
                    x-text="$app.t(researchChangeEdit(msg, e.idx) ? 'recherche.chat.proposalEditDone' : 'recherche.chat.proposalEdit')"></button>
            <button type="button" class="chat-vorschlag-btn chat-vorschlag-btn--ghost"
                    @click="toggleDiscardResearchChange(msg, e.idx)" :disabled="isResearchChangeBusy(msg, e.idx)"
                    x-text="researchChangeState(e.p) === 'discarded' ? $app.t('chat.restore') : $app.t('chat.discard')"></button>
          </span>
        </div>

        <!-- Welcher Eintrag (beim Zusammenführen: welcher in welchen) -->
        <div class="research-chat-change-target">
          <template x-if="e.p.type === 'research_merge'">
            <span class="research-chat-change-merge">
              <button type="button" class="entity-ref" x-entity-ref="{ type: 'recherche', id: e.p.merge_item_id, label: e.p.labels?.merge_item }"></button>
              <span class="muted-msg" x-text="$app.t('recherche.chat.change.mergeInto')"></span>
            </span>
          </template>
          <button type="button" class="entity-ref" x-entity-ref="{ type: 'recherche', id: e.p.item_id, label: e.p.labels?.item }"></button>
        </div>

        <template x-if="e.p.type === 'research_archive'">
          <div class="muted-msg muted-msg--sm" x-text="$app.t('recherche.chat.change.archiveHint')"></div>
        </template>
        <template x-if="e.p.type === 'research_merge'">
          <div class="research-chat-change-preview">
            <div class="muted-msg muted-msg--sm" x-text="$app.t('recherche.chat.change.mergeHint')"></div>
            <div class="chat-vorschlag-text research-chat-change-preview-text" x-show="e.p.merge_preview?.body && !e.p.fields?.body" x-text="e.p.merge_preview?.body"></div>
          </div>
        </template>

        <!-- Bearbeiten vor dem Übernehmen: nur der vorgeschlagene Text -->
        <template x-if="researchChangeEdit(msg, e.idx)">
          <div class="research-chat-proposal-edit">
            <template x-if="'title' in researchChangeEdit(msg, e.idx)">
              <input type="text" class="recherche-input" x-model="researchChangeEdit(msg, e.idx).title"
                     :placeholder="$app.t('recherche.field.title')" :aria-label="$app.t('recherche.field.title')" data-spellcheck="spelling">
            </template>
            <template x-if="'body' in researchChangeEdit(msg, e.idx)">
              <textarea class="recherche-input" rows="4" x-model="researchChangeEdit(msg, e.idx).body"
                        :placeholder="$app.t('recherche.field.body')" :aria-label="$app.t('recherche.field.body')" data-spellcheck="spelling"></textarea>
            </template>
            <template x-if="'append' in researchChangeEdit(msg, e.idx)">
              <textarea class="recherche-input" rows="3" x-model="researchChangeEdit(msg, e.idx).append"
                        :placeholder="$app.t('recherche.chat.change.field.append')" :aria-label="$app.t('recherche.chat.change.field.append')" data-spellcheck="spelling"></textarea>
            </template>
          </div>
        </template>

        <template x-if="!researchChangeEdit(msg, e.idx)">
          <div>
            <!-- Ersetzte Felder vorher → nachher, Status -->
            <template x-for="row in researchChangeRows(e.p)" :key="row.key">
              <div class="chat-vorschlag-row">
                <span class="chat-vorschlag-field" x-text="row.label"></span>
                <span class="chat-vorschlag-change"><span class="chat-vorschlag-before" x-show="row.before" x-text="row.before"></span><svg class="icon chat-vorschlag-arrow" aria-hidden="true" x-show="row.before"><use href="/icons.svg#arrow-right"/></svg><span class="chat-vorschlag-after" x-text="row.after"></span></span>
              </div>
            </template>
            <template x-if="e.p.type === 'research_merge' && (e.p.fields?.title || e.p.fields?.body)">
              <div class="chat-vorschlag-row">
                <span class="chat-vorschlag-field" x-text="$app.t('recherche.chat.change.mergedText')"></span>
                <span class="chat-vorschlag-text"><strong x-show="e.p.fields?.title" x-text="e.p.fields?.title"></strong> <span x-text="e.p.fields?.body || ''"></span></span>
              </div>
            </template>
            <template x-if="e.p.fields?.append">
              <div class="chat-vorschlag-row">
                <span class="chat-vorschlag-field" x-text="$app.t('recherche.chat.change.field.append')"></span>
                <span class="chat-vorschlag-text" x-text="e.p.fields.append"></span>
              </div>
            </template>
            <template x-if="(e.p.fields?.tags || []).length">
              <div class="chat-vorschlag-row">
                <span class="chat-vorschlag-field" x-text="$app.t('recherche.chat.change.field.tags')"></span>
                <span x-text="e.p.fields.tags.join(' · ')"></span>
              </div>
            </template>
          </div>
        </template>

        <!-- Neue URLs: gleiche Zeilen wie bei neuen Fundstücken (ungeprüfte vorab abgewählt) -->
        <template x-if="(e.p.urls || []).length">
          <div class="chat-vorschlag-row">
            <span class="chat-vorschlag-field" x-text="$app.t('recherche.chat.change.field.urls')"></span>
            <span class="research-chat-change-urls">
              <template x-for="(u, ui) in e.p.urls" :key="ui">
                <span class="research-chat-proposal-url-row"
                      :class="{ 'research-chat-proposal-url-row--removed': isProposalUrlRemoved(msg, e.idx, u), 'research-chat-proposal-url-row--unverified': isProposalUrlUnverified(u) }">
                  <a class="research-chat-proposal-url url-short" :href="u.url" target="_blank" rel="noopener noreferrer" :data-tip="u.url" x-text="urlText(u)"></a>
                  <span class="research-chat-proposal-url-host" x-show="proposalUrlHost(u)" x-text="proposalUrlHost(u)"></span>
                  <span class="research-chat-proposal-url-unverified" x-show="isProposalUrlUnverified(u)"
                        :data-tip="$app.t('recherche.chat.proposalUrlUnverifiedTip')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#alert-triangle"/></svg><span x-text="$app.t('recherche.chat.proposalUrlUnverified')"></span></span>
                  <button type="button" class="icon-btn icon-btn--ghost" x-show="researchChangeState(e.p) === 'open'"
                          @click="toggleProposalUrl(msg, e.idx, u)"
                          :data-tip="$app.t(isProposalUrlRemoved(msg, e.idx, u) ? 'recherche.chat.proposalUrlRestore' : 'recherche.chat.proposalUrlRemove')"
                          :aria-label="$app.t(isProposalUrlRemoved(msg, e.idx, u) ? 'recherche.chat.proposalUrlRestore' : 'recherche.chat.proposalUrlRemove')"><svg class="icon" aria-hidden="true"><use :href="isProposalUrlRemoved(msg, e.idx, u) ? '/icons.svg#undo' : '/icons.svg#x'"/></svg></button>
                </span>
              </template>
            </span>
          </div>
        </template>

        <!-- Beleg für «eingearbeitet»: beim Vorschlag geprüft, Sprung in den Abschnitt -->
        <template x-if="e.p.beleg?.text">
          <div class="chat-vorschlag-row research-chat-change-beleg">
            <span class="chat-vorschlag-field" x-text="$app.t('recherche.chat.change.field.beleg')"></span>
            <span>
              <q class="chat-vorschlag-quote" x-text="e.p.beleg.text"></q>
              <button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', id: e.p.beleg.page_id, label: e.p.labels?.beleg_page }"></button>
            </span>
          </div>
        </template>

        <div x-show="e.p.begruendung" class="chat-vorschlag-begruendung" x-text="e.p.begruendung"></div>
        <div x-show="e.p._error" class="chat-vorschlag-error" x-text="e.p._error"></div>
      </div>
    </template>
  </div>
</template>
