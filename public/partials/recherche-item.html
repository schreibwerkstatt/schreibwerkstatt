<!-- Eine Zeile der Recherche-Liste (Muster Figuren/Orte: Klick klappt auf).
     Zugeklappt: Titel, Vorschaubild, Zeilen-Cap-Anriss und Chips. Aufgeklappt
     (`detailItemId === item.id`, hoechstens eine Zeile): Lesen und Bearbeiten in
     der Zeile selbst (recherche-item-detail.html).
     Ausgelagert als string-seitiges Fragment (@include), damit der Inhalt Teil
     des x-for-Template-Contents bleibt und pro Eintrag normal geklont wird.
     Scope + Methoden kommen aus rechercheCard (public/partials/recherche.html).
     Aktionsmenue und Verknuepfungs-/Tag-Block sind eigene Fragmente, weil die
     aufgeklappte Zeile und die Board-Karte sie wortgleich mitbenutzen. -->
    <template x-for="item in items" :key="item.id">
      <div class="research-item hover-reveal-host" :data-research-id="item.id"
           @contextmenu="if (!busy) openItemMenu($event, 'list', item)" x-long-press :class="{ 'research-item--pinned': item.pinned, 'research-item--archived': item.archived, 'research-item--open': detailItemId === item.id, 'research-item--selected': isSelected(item.id) }">
        <div class="research-item-body">
          <!-- Kopf: Klick klappt auf/zu (Lesen). Die Flaeche ist Maus-Abkuerzung,
               kein role=button: sie traegt Knoepfe und Links, die fuer Screenreader
               sonst unsichtbar wuerden. Tastatur: der Chevron-<button> klappt auf,
               der Titel-<button> oeffnet das Bearbeiten. -->
          <div class="research-item-head research-item-body--clickable" @click="onItemBodyClick(item, $event)">
            <!-- Mehrfachauswahl: Haken immer da, die Leiste erscheint ab der
                 ersten Markierung (bulk.js). -->
            <input type="checkbox" class="research-item-select"
                   :checked="isSelected(item.id)" @change="toggleSelect(item.id)"
                   :aria-label="$app.t('recherche.bulk.select', { title: item.title || kindLabel(item.kind) })">
            <span class="research-kind-badge palette-badge" :class="'research-kind-badge--' + item.kind" x-text="kindLabel(item.kind)"></span>
            <!-- Titel als Button: oeffnet die Zeile aufgeklappt im Bearbeiten-
                 Formular (items.js#openItemForEdit). Ohne eigenen Titel steht die
                 Typ-Bezeichnung da — sonst gaebe es kein Klickziel. -->
            <button type="button" class="research-item-title text-link"
                    @click="openItemForEdit(item)" :disabled="busy"
                    x-text="item.title || kindLabel(item.kind)"></button>
            <!-- Einarbeitungs-Status: dieselbe Aussage wie die Spalte im
                 Status-Board, damit beide Ansichten nicht verschieden aussehen.
                 Immer da (auch «offen»), damit jede Zeile ein festes Klickziel
                 hat: der Klick oeffnet das Aktionsmenue nur mit dem Status-
                 Abschnitt (board.js#openItemMenu, only = 'status'). -->
            <button type="button" class="research-status-badge" :class="'research-status-badge--' + itemStatus(item)"
                    @click="openItemMenu($event, 'list', item, 'status')" :disabled="busy"
                    :data-tip="statusTip(item)" :aria-label="$app.t('recherche.status.change', { status: statusLabel(itemStatus(item)) })"
                    x-text="statusLabel(itemStatus(item))"></button>
            <div class="research-item-actions hover-reveal" x-data="{ menuCtx: 'list' }">
              <button type="button" class="icon-btn" x-show="!(detailEditing && detailItemId === item.id)"
                      @click="openDetail(item, { edit: true })" :disabled="busy" :data-tip="$app.t('recherche.edit')" :aria-label="$app.t('recherche.edit')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#pencil"/></svg></button>
              <!-- @include recherche-item-menu-trigger -->
            </div>
            <!-- Aufklappen zum Lesen: der tastaturerreichbare Weg (Listen-Anriss). -->
            <button type="button" class="row-expand"
                    @click="toggleDetail(item)" :aria-expanded="detailItemId === item.id"
                    :data-tip="$app.t(detailItemId === item.id ? 'recherche.detail.close' : 'recherche.detail.open')"
                    :aria-label="$app.t(detailItemId === item.id ? 'recherche.detail.close' : 'recherche.detail.open')">
              <span class="history-chevron" :class="{ open: detailItemId === item.id }" aria-hidden="true"></span>
            </button>
          </div>

          <!-- Zugeklappt: Anriss. Klick darauf klappt auf. -->
          <template x-if="detailItemId !== item.id">
            <div class="research-item-preview research-item-body--clickable" @click="onItemBodyClick(item, $event)">
              <!-- Vorschaubild: klein (vier grosse Bilder waeren keine Uebersicht mehr);
                   gross steht es in der aufgeklappten Zeile. x-if statt x-show: ein
                   `src`-Binding hinter display:none laedt trotzdem und liefert bei
                   Fundstuecken ohne Bild einen 404. -->
              <template x-if="item.has_image">
                <button type="button" class="research-item-thumb" @click="openDetail(item)"
                        :data-tip="$app.t('recherche.detail.open')" :aria-label="$app.t('recherche.detail.open')">
                  <img class="research-item-image" :src="imageUrl(item)" :alt="item.title || ''" loading="lazy">
                </button>
              </template>

              <template x-if="item.has_doc">
                <a class="research-item-doc" :href="docUrl(item)" target="_blank" rel="noopener noreferrer">
                  <svg class="icon" aria-hidden="true"><use href="/icons.svg#file-plus"/></svg>
                  <span class="research-item-doc-name truncate" x-text="item.doc_name || $app.t('recherche.doc.fallbackName')"></span>
                  <span class="research-item-doc-meta" x-show="item.doc_pages" x-text="$app.tn('recherche.doc.pages', item.doc_pages)"></span>
                </a>
              </template>

              <!-- Anriss mit festem Zeilen-Cap (CSS); der Volltext steht in der
                   aufgeklappten Zeile, lesbar gesetzt. -->
              <div class="research-item-text" x-show="item.body"
                   :class="{ 'research-item-text--quote': item.kind === 'quote' }"
                   x-html="itemBodyHtml(item)"></div>

              <!-- @include recherche-item-urls -->

              <div x-show="item.source" class="research-item-source" x-text="item.source"></div>

              <!-- Recherche-Abgleich: Manuskript weicht vom Fundstueck ab. Details +
                   Sprung zur Stelle in der aufgeklappten Zeile (recherche-findings.html). -->
              <template x-if="itemFindings(item).length">
                <button type="button" class="research-findings-chip"
                        @click="openDetail(item)"
                        x-text="$app.t('recherche.crosscheck.chip', { n: itemFindings(item).length })"></button>
              </template>

              <!-- @include recherche-item-relations -->
            </div>
          </template>

          <!-- Aufgeklappt: Lesen + Bearbeiten in der Zeile. -->
          <template x-if="detailItemId === item.id">
            <!-- @include recherche-item-detail -->
          </template>
        </div>
      </div>
    </template>
