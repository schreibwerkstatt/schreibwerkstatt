<!-- Eine Schnipsel-Karte des Recherche-Boards — reiner Anriss. Lesen und
     Bearbeiten passieren im Detail-Dialog (recherche-detail.html): ein Klick auf
     den Eintrag oeffnet ihn. Deshalb steht hier nur Titel, Vorschaubild, ein
     Zeilen-Cap-Anriss des Texts und die Chips.
     Ausgelagert als string-seitiges Fragment (@include), damit der Inhalt Teil
     des x-for-Template-Contents bleibt und pro Eintrag normal geklont wird.
     Scope + Methoden kommen aus rechercheCard (public/partials/recherche.html).
     Aktionsmenue und Verknuepfungs-/Tag-Block sind eigene Fragmente, weil der
     Detail-Dialog sie wortgleich mitbenutzt. -->
    <template x-for="item in items" :key="item.id">
      <div class="research-item hover-reveal-host" :data-research-id="item.id" :class="{ 'research-item--pinned': item.pinned, 'research-item--archived': item.archived, 'research-item--open': detailItemId === item.id, 'research-item--selected': bulkMode && isBulkSelected(item) }">
        <div class="research-item-body research-item-body--clickable" @click="onItemBodyClick(item, $event)">
          <div class="research-item-head">
            <!-- Mehrfachauswahl: Checkbox nur im Auswahl-Modus (bulk.js). -->
            <input type="checkbox" class="research-item-select" x-show="bulkMode" x-cloak
                   :checked="isBulkSelected(item)" @change="toggleBulkSelect(item)"
                   :aria-label="$app.t('recherche.bulk.select', { title: item.title || kindLabel(item.kind) })">
            <span class="research-kind-badge palette-badge" :class="'research-kind-badge--' + item.kind" x-text="kindLabel(item.kind)"></span>
            <!-- Titel als Button: der tastaturerreichbare Weg in die Detailansicht
                 (der Klick auf die ganze Zeile ist nur Maus-Komfort). Ohne eigenen
                 Titel steht die Typ-Bezeichnung da — sonst gaebe es kein Sprungziel. -->
            <button type="button" class="research-item-title" @click="openDetail(item)"
                    x-text="item.title || kindLabel(item.kind)"></button>
            <!-- Einarbeitungs-Status: dieselbe Aussage wie die Spalte im
                 Status-Board, damit beide Ansichten nicht verschieden aussehen.
                 Gesetzt wird er im Aktionsmenue (oder per Drag im Board). -->
            <span class="research-status-badge" :class="'research-status-badge--' + itemStatus(item)"
                  x-show="showStatusBadge(item)" x-cloak
                  :data-tip="statusTip(item)" x-text="statusLabel(itemStatus(item))"></span>
            <div class="research-item-actions hover-reveal" x-data="{ menuCtx: 'list' }">
              <button type="button" class="icon-btn" @click="openDetail(item, { edit: true })" :disabled="busy" :data-tip="$app.t('recherche.edit')" :aria-label="$app.t('recherche.edit')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#pencil"/></svg></button>
              <!-- @include recherche-item-menu -->
            </div>
          </div>

          <!-- Vorschaubild: klein (vier grosse Bilder waeren keine Uebersicht mehr)
               und oeffnet den Detail-Dialog, nicht die Rohdatei im neuen Tab.
               x-if statt x-show: ein `src`-Binding hinter display:none laedt
               trotzdem und liefert bei Fundstuecken ohne Bild einen 404. -->
          <template x-if="item.has_image">
            <button type="button" class="research-item-thumb" @click="openDetail(item)"
                    :data-tip="$app.t('recherche.detail.open')" :aria-label="$app.t('recherche.detail.open')">
              <img class="research-item-image" :src="imageUrl(item)" :alt="item.title || ''" loading="lazy">
            </button>
          </template>

          <a x-show="item.has_doc" class="research-item-doc" :href="docUrl(item)" target="_blank" rel="noopener noreferrer">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#file-plus"/></svg>
            <span class="research-item-doc-name" x-text="item.doc_name || $app.t('recherche.doc.fallbackName')"></span>
            <span class="research-item-doc-meta" x-show="item.doc_pages" x-text="$app.t('recherche.doc.pages', { n: item.doc_pages })"></span>
          </a>

          <!-- Anriss mit festem Zeilen-Cap (CSS). Kein Inline-Ausklappen: der
               Volltext gehoert in die Detailansicht, wo er auch lesbar gesetzt ist
               — ein erfasster Artikel mit 20 000 Zeichen macht die Liste sonst
               unbenutzbar, egal wie viele Zeilen der Cap zulaesst. -->
          <div class="research-item-text" x-show="item.body"
               :class="{ 'research-item-text--quote': item.kind === 'quote' }"
               x-text="item.body"></div>

          <!-- @include recherche-item-urls -->

          <div x-show="item.source" class="research-item-source" x-text="item.source"></div>

          <!-- Recherche-Abgleich: Manuskript weicht vom Fundstueck ab. Details +
               Sprung zur Stelle im Detail-Dialog (recherche-findings.html). -->
          <button type="button" class="research-findings-chip" x-show="itemFindings(item).length" x-cloak
                  @click="openDetail(item)"
                  x-text="$app.t('recherche.crosscheck.chip', { n: itemFindings(item).length })"></button>

          <!-- @include recherche-item-relations -->
        </div>
      </div>
    </template>
