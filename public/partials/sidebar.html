<!-- Seitenbaum -->
<div class="card" :class="{ 'tree-card--loading': treeSwitching }">
  <div class="card-header">
    <div class="card-actions">
      <button type="button" class="icon-btn icon-btn--ghost" @click="loadPages({ source: 'manual' })"
              :data-tip="t('sidebar.loadPages')" :aria-label="t('sidebar.loadPages')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg>
      </button>
      <button type="button" class="icon-btn icon-btn--ghost" x-show="$store.session.offlineCapable"
              @click="toggleBookOffline($store.nav.selectedBookId)" :disabled="!$store.nav.selectedBookId"
              :class="{ 'is-active': isBookOffline($store.nav.selectedBookId) }"
              :aria-pressed="isBookOffline($store.nav.selectedBookId)"
              :data-tip="offlineBookTip($store.nav.selectedBookId)" :aria-label="offlineBookTip($store.nav.selectedBookId)">
        <svg class="icon" aria-hidden="true"><use :href="isBookOffline($store.nav.selectedBookId) ? '/icons.svg#cloud-check' : '/icons.svg#cloud-download'"/></svg>
      </button>
      <button type="button" class="icon-btn icon-btn--ghost" @click="toggleBookOrganizerCard()" :disabled="!$store.nav.selectedBookId"
              :class="{ 'is-active': showBookOrganizerCard }"
              :data-tip="t('tile.bookOrganizer.title')" :aria-label="t('tile.bookOrganizer')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#list-tree"/></svg>
      </button>
      <button type="button" class="icon-btn icon-btn--ghost" @click="toggleBookEditorCard()" :disabled="!$store.nav.pages.length"
              :class="{ 'is-active': showBookEditorCard }"
              :data-tip="t('tile.bookEditor.title')" :aria-label="t('tile.bookEditor')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#scroll"/></svg>
      </button>
      <button type="button" class="icon-btn icon-btn--ghost" @click="batchCheck()" :disabled="!$store.nav.pages.length"
              :data-tip="t('sidebar.checkAllTitle')" :aria-label="t('sidebar.checkAll')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#spell-check"/></svg>
      </button>
    </div>
  </div>
  <!-- Suche + Expand/Collapse -->
  <div class="search-wrap sidebar-search-wrap">
    <span class="search-affix">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#search"/></svg>
      <input type="text" x-model.debounce.200ms="pageSearch" @keydown="onPageSearchKeydown($event)" :placeholder="t('sidebar.searchPage')" :aria-label="t('sidebar.searchPage')" :data-tip="withHotkey(t('sidebar.searchPageTitle'), 'treeSearch')" class="page-search">
      <button type="button" class="search-clear--icon" x-show="pageSearch" @click="pageSearch=''" :aria-label="t('search.clear')" :data-tip="t('search.clear')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
    </span>
    <div class="btn-group sidebar-action-group">
      <button type="button" class="icon-btn"
              x-show="isTagebuch()"
              :aria-pressed="sidebarMode === 'calendar'"
              @click="toggleSidebarMode()"
              :data-tip="sidebarMode === 'calendar' ? t('sidebar.modeToggle.tree') : t('sidebar.modeToggle.calendar')"
              :aria-label="sidebarMode === 'calendar' ? t('sidebar.modeToggle.tree') : t('sidebar.modeToggle.calendar')">
        <svg class="icon" aria-hidden="true">
          <use :href="sidebarMode === 'calendar' ? '/icons.svg#list' : '/icons.svg#calendar'"/>
        </svg>
      </button>
      <button type="button" class="icon-btn"
              x-show="sidebarMode !== 'calendar'"
              @click="setAllChaptersOpen(true)"
              :disabled="!!pageSearch"
              :data-tip="t('sidebar.expandAll')"
              :aria-label="t('sidebar.expandAll')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#chevron-down"/></svg></button>
      <button type="button" class="icon-btn"
              x-show="sidebarMode !== 'calendar'"
              @click="setAllChaptersOpen(false)"
              :disabled="!!pageSearch"
              :data-tip="t('sidebar.collapseAll')"
              :aria-label="t('sidebar.collapseAll')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#chevron-up"/></svg></button>
    </div>
  </div>

  <!-- Diary-Calendar — eingebettetes Partial. Lädt nested via _loadPartials. -->
  <div id="partial-sidebar-calendar" x-show="sidebarMode === 'calendar'" x-cloak></div>

  <div x-show="sidebarMode !== 'calendar'" class="display-contents">
  <div x-show="!pageSearch && tokTotals.any" class="tok-totals">
    <span class="tok-badge tok-neutral" x-text="'∑ ' + tokTotals.chars.toLocaleString(_numLocale) + ' ' + t('bookstats.unit.z')"></span>
    <span class="tok-badge tok-neutral" x-text="'∑ ' + tokTotals.normseiten.toLocaleString(_numLocale, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' ' + t('bookstats.unit.ns')"></span>
    <span class="tok-badge tok-neutral" x-text="'∑ ' + tokTotals.words.toLocaleString(_numLocale) + ' ' + t('bookstats.unit.w')"></span>
    <span class="tok-badge tok-neutral" x-text="'∑ ' + tokTotals.tok.toLocaleString(_numLocale) + ' ' + t('bookstats.unit.t')"></span>
  </div>
  <!-- Batch-Fortschritt -->
  <div x-show="batchLoading || batchStatus" class="batch-wrap">
    <div class="progress-bar-wrap" x-show="batchLoading">
      <div class="progress-bar" :style="{ '--progress': batchProgress + '%' }"></div>
    </div>
    <div class="batch-status" x-html="batchStatus"></div>
  </div>
  <!-- ARIA-Tree mit EINEM Tab-Stopp (_treeTabStop); Pfeiltasten + Fokus in
       book/tree/keyboard.js. Flach gerendert → Ebene via aria-level, die
       Wrapper sind role="none". -->
  <div class="page-tree" role="tree" :aria-label="t('sidebar.treeLabel')"
       x-effect="_syncTreeTabStop()"
       @keydown="_onTreeKeydown($event)"
       @focusin="_onTreeFocusIn($event)">
  <template x-for="item in filteredTree" :key="item.id">
    <div class="tree-chapter" role="none"
         :class="{ ['tree-chapter--depth-' + (item.depth || 1)]: true, 'tree-chapter--solo': item.solo, 'tree-chapter--single': _isSingleSectionChapter(item), 'tree-chapter--excluded': item.excluded || _chapterExcludedByAncestor(item) }"
         :style="{ '--depth': item.depth || 1 }">
      <!-- Ein-Abschnitt-Kapitel (_isSingleSectionChapter): kein Kopf, die
           Abschnittszeile traegt Kapitelname, Kapitel-Plaketten und das
           kombinierte Kontextmenue (tree-context-menu.js, target.single). -->
      <div x-show="!item.solo && !_isSingleSectionChapter(item)"
           class="tree-chapter-header"
           role="treeitem"
           data-tree-kind="chapter"
           :data-tree-key="'c' + item.id"
           :data-tree-parent="item.parent_id ? 'c' + item.parent_id : null"
           :aria-level="item.depth || 1"
           :tabindex="_treeTabStop === 'c' + item.id ? 0 : -1"
           :aria-expanded="(item.pages.length > 0 || item.hasChildren) ? (item.open ? 'true' : 'false') : null"
           :class="{
             'tree-chapter-header--empty': item.pages.length === 0 && !item.hasChildren,
             'tree-chapter-header--active': showKapitelReviewCard && String(kapitelReviewChapterId) === String(item.id),
             'tree-chapter-header--reviewable': _bookQualifiesForChapterReview() && (item.pages.length > 0 || item.hasChildren),
           }"
           :data-tip="!pageSearch
             ? ((item.pages.length === 0 && !item.hasChildren)
                 ? t('sidebar.emptyChapterTitle', { name: item.name })
                 : (_bookQualifiesForChapterReview() && (item.pages.length > 0 || item.hasChildren) ? t('sidebar.reviewChapterTitle', { name: item.name }) : ''))
             : ''"
           @keydown.enter.prevent="_onChapterHeaderActivate(item)"
           @keydown.space.prevent="_onChapterHeaderActivate(item)"
           @click="_onChapterHeaderActivate(item)"
           @contextmenu="_openPagetreeContextMenu($event, { kind: 'chapter', id: item.id, name: item.name, excluded: item.excluded })">
        <span class="history-chevron" :class="{ open: item.open }" x-show="item.pages.length > 0 || item.hasChildren"
              @click.stop="if (!pageSearch && (item.pages.length > 0 || item.hasChildren)) toggleChapterOpen(item)"></span>
        <span x-text="item.name"></span>
        <span class="tree-chapter-meta">
          <span class="tag tree-chapter-excluded-tag" x-show="item.excluded" x-text="t('sidebar.excludedBadge')"
                :data-tip="t('sidebar.excludedTitle', { name: item.name })"></span>
          <span class="tag" x-show="_chapterPageCount(item) >= 1" x-text="t('sidebar.pagesCountShort', { n: _chapterPageCount(item) })"
                :data-tip="_chapterPageCount(item) === 1 ? t('sidebar.pagesCountOne') : t('sidebar.pagesCount', { n: _chapterPageCount(item) })"
                :aria-label="_chapterPageCount(item) === 1 ? t('sidebar.pagesCountOne') : t('sidebar.pagesCount', { n: _chapterPageCount(item) })"></span>
          <template x-if="item.stats">
            <span class="tok-badge tok-neutral"
              x-text="item.stats.badge"
              @mouseenter.stop="_showTokTip($el, item.stats, { _chapterOnly: true })"
              @mouseleave.stop="_hideTokTip()"></span>
          </template>
          <span x-show="!item.solo && $store.badges.chapterIdeenCounts[item.id] > 0"
                class="ideen-count-badge internal-link"
                @click.stop="openIdeenForChapter(item.id)"
                x-text="$store.badges.chapterIdeenCounts[item.id]"
                :data-tip="t('ideen.openCountTitle', { n: $store.badges.chapterIdeenCounts[item.id] })"
                :aria-label="t('ideen.openCountTitle', { n: $store.badges.chapterIdeenCounts[item.id] })"></span>
          <span x-show="!item.solo && $store.badges.chapterRechercheCounts[item.id] > 0"
                class="recherche-count-badge internal-link"
                @click.stop="openRechercheForChapter(item.id)"
                x-text="$store.badges.chapterRechercheCounts[item.id]"
                :data-tip="t('recherche.openCountTitle', { n: $store.badges.chapterRechercheCounts[item.id] })"
                :aria-label="t('recherche.openCountTitle', { n: $store.badges.chapterRechercheCounts[item.id] })"></span>
        </span>
      </div>
      <div x-show="item.solo || item.open || _isSingleSectionChapter(item)" class="tree-chapter-pages" role="none">
        <template x-for="page in item.pages" :key="page.id">
          <!-- Echter Link: Mittelklick/Ctrl-/Cmd-Klick/"In neuem Tab öffnen"/
               "Link kopieren" nutzen die Hash-Route der Seite. Der normale Klick
               bleibt in der App (selectPage, mit Dirty-Rückfrage) — dafür
               preventDefault nur ohne Modifier. Plaketten darin brauchen
               @click.stop.prevent, sonst navigierte der Link mit. -->
          <a class="page-item"
               :class="{ selected: currentPage?.id === page.id, 'page-item--empty': tokEsts[page.id] && tokEsts[page.id].words === 0, 'page-item--kb-active': _pageSearchActiveId === page.id, 'page-item--remote-edit': $store.collab.recentRemoteEdits.has(page.id) }"
               :href="'#book/' + $store.nav.selectedBookId + '/page/' + page.id"
               :data-page-id="page.id"
               role="treeitem"
               data-tree-kind="page"
               :data-tree-key="'p' + page.id"
               :data-tree-parent="item.solo ? null : (_isSingleSectionChapter(item) ? (item.parent_id ? 'c' + item.parent_id : null) : 'c' + item.id)"
               :aria-level="item.solo ? 1 : (item.depth || 1) + (_isSingleSectionChapter(item) ? 0 : 1)"
               :tabindex="_treeTabStop === 'p' + page.id ? 0 : -1"
               :aria-current="currentPage?.id === page.id ? 'page' : null"
               :data-tip="remoteEditTip(page.id)"
               @click="if ($event.button === 0 && !$event.ctrlKey && !$event.metaKey && !$event.shiftKey && !$event.altKey) { $event.preventDefault(); selectPage(page); _clearRemoteEditMark(page.id); }"
               @keydown.space.self.prevent="$el.click()"
               @contextmenu="_openPagetreeContextMenu($event, _isSingleSectionChapter(item)
                 ? { kind: 'page', id: page.id, name: item.name, single: true, chapterId: item.id, excluded: item.excluded }
                 : { kind: 'page', id: page.id, name: page.name })">
            <span class="page-name">
              <span class="page-status-dot" :class="'page-status-' + pageStatus(page)"
                @mouseenter.stop="_showStatusTip($el, page)"
                @mouseleave.stop="_hideStatusTip()"></span>
              <span x-text="_isSingleSectionChapter(item) ? item.name : page.name"></span>
              <span class="page-item-section-name" x-show="_isSingleSectionChapter(item) && !sameStructureTitle(item.name, page.name)" x-text="page.name"></span>
              <template x-for="p in presenceFor(page.id)" :key="p.device_id || p.user_email">
                <span class="presence-pip"
                      :class="{ 'presence-pip--self': p.is_self }"
                      :style="`--avatar-hue: ${userAvatarHue(p.user_email)}`"
                      :data-tip="p.is_self
                        ? t('presence.self.editing', { device: p.device_label || t('presence.device.unknown') })
                        : t('collab.presence.editing', { user: p.user_display_name })"
                      x-text="userInitials(p.user_email)"></span>
              </template>
            </span>
            <span x-show="tokEsts[page.id] || $store.badges.ideenCounts[page.id] > 0 || $store.badges.rechercheCounts[page.id] > 0 || _isSingleSectionChapter(item)" class="tok-stats">
              <span class="tag tree-chapter-excluded-tag" x-show="item.excluded && _isSingleSectionChapter(item)" x-text="t('sidebar.excludedBadge')"
                    :data-tip="t('sidebar.excludedTitle', { name: item.name })"></span>
              <template x-if="tokEsts[page.id]?.words > 0">
                <span class="tok-stats-wrap">
                  <span class="tok-badge tok-neutral"
                    x-text="charBadge(tokEsts[page.id].chars)"
                    @mouseenter.stop="_showTokTip($el, tokEsts[page.id])"
                    @mouseleave.stop="_hideTokTip()"></span>
                </span>
              </template>
              <template x-if="tokEsts[page.id] && tokEsts[page.id].words === 0">
                <span class="tok-badge tok-empty" x-text="t('sidebar.empty')"></span>
              </template>
              <span x-show="$store.badges.ideenCounts[page.id] > 0"
                    class="ideen-count-badge internal-link"
                    @click.stop.prevent="openIdeenForPage(page.id)"
                    x-text="$store.badges.ideenCounts[page.id]"
                    :data-tip="t('ideen.openCountTitle', { n: $store.badges.ideenCounts[page.id] })"
                    :aria-label="t('ideen.openCountTitle', { n: $store.badges.ideenCounts[page.id] })"></span>
              <span x-show="$store.badges.rechercheCounts[page.id] > 0"
                    class="recherche-count-badge internal-link"
                    @click.stop.prevent="openRechercheForPage(page.id)"
                    x-text="$store.badges.rechercheCounts[page.id]"
                    :data-tip="t('recherche.openCountTitle', { n: $store.badges.rechercheCounts[page.id] })"
                    :aria-label="t('recherche.openCountTitle', { n: $store.badges.rechercheCounts[page.id] })"></span>
              <template x-if="_isSingleSectionChapter(item)">
                <span class="tok-stats-wrap">
                  <span x-show="$store.badges.chapterIdeenCounts[item.id] > 0" class="ideen-count-badge internal-link"
                        @click.stop.prevent="openIdeenForChapter(item.id)" x-text="$store.badges.chapterIdeenCounts[item.id]"
                        :data-tip="t('ideen.openCountTitle', { n: $store.badges.chapterIdeenCounts[item.id] })"
                        :aria-label="t('ideen.openCountTitle', { n: $store.badges.chapterIdeenCounts[item.id] })"></span>
                  <span x-show="$store.badges.chapterRechercheCounts[item.id] > 0" class="recherche-count-badge internal-link"
                        @click.stop.prevent="openRechercheForChapter(item.id)" x-text="$store.badges.chapterRechercheCounts[item.id]"
                        :data-tip="t('recherche.openCountTitle', { n: $store.badges.chapterRechercheCounts[item.id] })"
                        :aria-label="t('recherche.openCountTitle', { n: $store.badges.chapterRechercheCounts[item.id] })"></span>
                </span>
              </template>
            </span>
          </a>
        </template>
      </div>
    </div>
  </template>
  </div><!-- /page-tree -->
  <template x-if="filteredTree.length === 0 && pageSearch">
    <div class="muted-msg muted-msg--sm" x-text="t('sidebar.noPagesFound')"></div>
  </template>
  <template x-if="!pageSearch && $store.nav.selectedBookId && $store.nav.tree.length === 0 && !treeLoading">
    <div class="sidebar-empty-book">
      <div class="muted-msg muted-msg--sm" x-text="t('sidebar.emptyBook')"></div>
      <button type="button" x-show="canEdit()" @click="createChapterPrompt()" x-text="t('bookOrganizer.newChapter')"></button>
    </div>
  </template>
  </div><!-- /sidebarMode !== 'calendar' -->
</div>

<!-- Pagetree-Rechtsklick-Menü — nested Partial (lädt via _loadPartials).
     Der Placeholder MUSS ausserhalb des `.card`-Wrappers stehen (transform-freier
     Containing-Block fuer das position:fixed-Menue). Details im Partial. -->
<div id="partial-sidebar-pagetree-menu"></div>
