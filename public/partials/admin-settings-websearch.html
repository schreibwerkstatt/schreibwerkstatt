    <!-- Websuche-Tab: Suchweg für Recherche-Chat + Weltfakten-Faktencheck.
         Claude hat eine eigene Achse (Anthropic oder SearXNG), alle anderen
         Provider können nur über SearXNG suchen. Logik: lib/websearch/. -->
    <section x-show="adminSettingsTab === 'websearch'" class="admin-settings-section">
      <p class="muted-msg muted-msg--sm" x-text="$app.t('admin.settings.websearch.hint')"></p>
      <div x-data="settingField({ k: 'websearch.provider', type: 'select', base: 'websearch.provider', help: true, opts: [{ value: 'off', label: $app.t('admin.settings.websearch.provider.off') }, { value: 'searxng', label: 'SearXNG' }] })"></div>
      <div x-data="settingField({ k: 'websearch.claude', type: 'select', base: 'websearch.claude', help: true, opts: [{ value: 'anthropic', label: $app.t('admin.settings.websearch.claude.anthropic') }, { value: 'searxng', label: 'SearXNG' }] })"></div>

      <h4 class="admin-settings-subheading"><span x-text="$app.t('admin.settings.websearch.searxngTitle')"></span></h4>
      <div x-data="settingField({ k: 'websearch.searxng.url', type: 'url', base: 'websearch.searxngUrl', help: true })"></div>
      <div x-data="settingField({ k: 'websearch.searxng.timeout_ms', type: 'num', base: 'websearch.timeout', num: { integer: true, min: 1000, max: 30000 }, help: true })"></div>
      <div x-data="settingField({ k: 'websearch.max_results', type: 'num', base: 'websearch.maxResults', num: { integer: true, min: 1, max: 20 }, help: true })"></div>
      <div class="admin-settings-actions">
        <button type="button" @click="adminSettingsTest('websearch')" x-text="$app.t('admin.settings.test.websearch')"></button>
      </div>
    </section>
