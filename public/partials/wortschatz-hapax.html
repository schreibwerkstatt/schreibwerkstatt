<!-- Einmalwörter der Wortschatz-Analyse: Wörter mit genau einem Vorkommen im
     ganzen Buch (Hapax legomena). Fragment von wortschatz.html (String-Include
     `<!-- @include wortschatz-hapax -->`) — Begründung siehe wortschatz-terms.html.

     Die Liste ist gedeckelt, und der Deckel steht als erste Zeile drüber: rund die
     Hälfte aller Wortformen eines Buchs kommt genau einmal vor: ein Ausschnitt, der
     nicht als solcher gekennzeichnet ist, liest sich als Vollständigkeit. -->
<div x-show="wortschatzTab === 'hapax'">
  <p class="wortschatz-list-hint" x-text="$app.t('wortschatz.hapax.hint')"></p>
  <p class="wortschatz-list-hint" x-show="wsHapaxCapped()" x-text="wsHapaxCapped()"></p>
  <div x-show="!wortschatzHapax.length" class="muted-msg muted-msg--spaced" x-text="$app.t('wortschatz.hapax.empty')"></div>
  <div class="table-scroll" x-show="wortschatzHapax.length">
    <table class="wortschatz-table"
           x-data="sortableTable({
             rows: () => wortschatzHapax,
             defaultKey: 'sort_rank',
             defaultDir: 'asc',
             persistKey: 'wortschatz.hapax',
             types: { sort_rank: 'number', len: 'number', term: 'string' },
           })">
      <thead><tr>
        <th class="sortable-th" :class="sortClass('sort_rank')" :aria-sort="ariaSort('sort_rank')"
            @click="sortBy('sort_rank')" :title="$app.t('wortschatz.col.rankTip')"
            x-text="$app.t('wortschatz.col.rank')"></th>
        <th class="sortable-th" :class="sortClass('term')" :aria-sort="ariaSort('term')"
            @click="sortBy('term')" x-text="$app.t('wortschatz.col.term')"></th>
        <th class="sortable-th" :class="sortClass('len')" :aria-sort="ariaSort('len')"
            @click="sortBy('len')" x-text="$app.t('wortschatz.col.length')"></th>
        <th x-text="$app.t('wortschatz.col.firstPage')"></th>
      </tr></thead>
      <tbody>
        <template x-for="h in sorted" :key="h.term">
          <tr>
            <td class="wortschatz-num" x-text="wsNum(h.sort_rank)"></td>
            <td class="wortschatz-term">
              <span x-text="h.term"></span>
              <span class="tag wortschatz-kind" x-show="h.novel === 1"
                    :title="$app.t('wortschatz.hapax.novelTitle')"
                    x-text="$app.t('wortschatz.hapax.novel')"></span>
            </td>
            <td class="wortschatz-num" x-text="wsNum(h.len)"></td>
            <td>
              <button type="button" class="entity-ref" x-show="h.first_page_id"
                      x-entity-ref="{ type: 'seite', id: h.first_page_id, label: h.first_page_name || undefined }"></button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
