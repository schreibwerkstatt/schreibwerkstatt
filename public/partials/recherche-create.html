<!-- Anlegen eines Fundstuecks — Inline-Formular in der Karte, Bauform wie das
     Quellen-Formular (sources-form.html): Block zwischen Toolbar und Liste,
     Felder aus dem geteilten Fragment recherche-form-fields (Raster
     .card-form-grid), Aktionen darunter. Kein Modal: Anlegen ist ein kurzes
     Formular ohne Lese-Inhalt daneben, und die Liste bleibt dabei sichtbar.
     Sichtbarkeit haengt an `creating` (items.js#startCreate/closeCreate). -->
<div class="recherche-create" x-show="creating" x-cloak
     @keydown="$editKeys($event, { save: () => createItem(), cancel: () => closeCreate() })">
  <div class="card-section-head">
    <span class="card-section-title" x-text="$app.t('recherche.new')"></span>
    <button type="button" class="icon-btn icon-btn--ghost" @click="closeCreate()"
            :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
  </div>

  <div class="recherche-form">
    <!-- @include recherche-form-fields -->

    <!-- Datei-Anhang nur beim Anlegen (Bild/PDF nachtraeglich haengt am
         Fundstueck selbst, nicht am Formular). Das echte File bleibt im
         Input — ein Alpine-Proxy bricht File.arrayBuffer. -->
    <div class="card-form-grid">
      <div x-id="['fld']" class="card-form-row">
        <span :id="$id('fld')" class="card-form-label" x-text="$app.t('recherche.form.attach')"></span>
        <div class="recherche-attach" role="group" :aria-labelledby="$id('fld')">
          <label class="btn-compact recherche-attach-btn">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#file-plus"/></svg>
            <span x-text="$app.t('recherche.field.attach')"></span>
            <input type="file" accept="image/*,application/pdf" x-ref="createFile" @change="onCreateFilePick($event)">
          </label>
          <span class="recherche-attach-name" x-show="draft.fileName" x-text="draft.fileName"></span>
          <button type="button" class="icon-btn" x-show="draft.fileName" @click="clearCreateFile()"
                  :data-tip="$app.t('recherche.field.attachClear')" :aria-label="$app.t('recherche.field.attachClear')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
        </div>
      </div>
    </div>
  </div>

  <div class="recherche-create-actions">
    <button type="button" class="primary" @click="createItem()" :disabled="busy">
      <span x-show="busy" class="spinner"></span>
      <span x-text="busy ? $app.t('common.saving') : $app.t('recherche.save')"></span>
    </button>
    <button type="button" @click="closeCreate()" :disabled="busy" x-text="$app.t('recherche.cancel')"></button>
  </div>
</div>
