<!-- Buchlandkarte, Tabs „Landkarte" und „Verlauf": die Abschnitte über dem Embedding-Index -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/buchlandkarte-card.js.
  Eingebunden in buchlandkarte.html (Tab-Hülle). Beide Tabs lesen DASSELBE
  Job-Ergebnis, darum eine Komponente: Landkarte = Punktwolke (unten),
  Verlauf = Ähnlichkeitsmatrix in Lesereihenfolge (buchlandkarte-matrix).
  Rein rückwärtsgewandt: liest den Semantik-Index, schreibt nie in den Buchtext.

  Die Achsen sind beschriftet: Pol-Achsen mit ihren Polen, PCA-Achsen mit
  Nummer und Streuungsanteil (bzw. den KI-Labels) — was sie trennen, zeigen die
  Abschnitte an ihren Enden unter der Karte.
-->
<div class="buchlandkarte-panel" x-data="buchlandkarteCard"
     x-show="$app.buchlandkarteTab === 'map' || $app.buchlandkarteTab === 'matrix'"
     role="tabpanel" id="buchlandkarte-panel-map"
     :aria-labelledby="$app.buchlandkarteTab === 'matrix' ? 'buchlandkarte-tab-matrix' : 'buchlandkarte-tab-map'">
  <!-- @include buchlandkarte-map-controls -->

  <p class="buchlandkarte-intro" x-show="bookMapCanRun"
     x-text="$app.t($app.buchlandkarteTab === 'matrix' ? 'buchlandkarte.matrix.intro' : 'buchlandkarte.intro')"></p>

  <!-- Gating: Backend aus / kein Index / Index-Stand unbekannt -->
  <div x-show="!bookMapAvailable" class="muted-msg muted-msg--spaced" x-text="$app.t('buchlandkarte.needBackend')"></div>
  <div x-show="bookMapAvailable && !bookMapHasIndex && !bookMapIndexError" class="muted-msg muted-msg--spaced" x-text="$app.t('buchlandkarte.needIndex')"></div>
  <div x-show="bookMapAvailable && bookMapIndexError" class="card-hint--warn" x-text="$app.t('buchlandkarte.indexUnknown')"></div>

  <div x-show="bookMapLoading && bookMapProgress > 0" class="progress-bar-wrap">
    <div class="progress-bar" :style="{ '--progress': bookMapProgress + '%' }"></div>
  </div>
  <div x-show="bookMapStatus" class="card-status" x-text="bookMapStatus"></div>

  <!-- Ergebnis -->
  <template x-if="bookMapResult">
    <div class="buchlandkarte-result">
      <div class="buchlandkarte-meta">
        <span x-text="$app.t('buchlandkarte.meta.summary', {
          pages: bookMapResult.pages.length, chapters: bookMapResult.chapters.length })"></span>
        <span x-show="bookMapResult.projection?.granularity === 'chunk'"
              x-text="$app.t('buchlandkarte.meta.passages', { n: bookMapResult.projection?.points?.length || 0 })"></span>
        <span x-show="bookMapIndexNote()" x-text="bookMapIndexNote()"></span>
        <span x-show="bookMapResult.stalePages > 0" class="card-hint--warn"
              x-text="$app.t('buchlandkarte.meta.stale', { n: bookMapResult.stalePages })"></span>
        <span x-show="bookMapResult.truncatedPages > 0" class="card-hint--warn"
              x-text="$app.t('buchlandkarte.meta.capped', { n: bookMapResult.truncatedPages })"></span>
        <span x-show="bookMapResult.projection?.thinned > 0" class="card-hint--warn"
              x-text="$app.t('buchlandkarte.meta.thinned', { n: bookMapResult.projection?.thinned })"></span>
      </div>

      <div x-show="$app.buchlandkarteTab === 'map'">
        <div x-show="!bookMapHasMap()" class="muted-msg muted-msg--spaced"
             x-text="$app.t('buchlandkarte.empty')"></div>

        <template x-if="bookMapHasMap()">
          <div>
            <!-- Anzeige: Achsenpaar + Färbung (dieselben Daten, kein neuer Lauf) -->
            <div class="buchlandkarte-view">
              <label class="buchlandkarte-view-label" x-text="$app.t('buchlandkarte.view.axes')"></label>
              <div x-data="combobox($app.t('buchlandkarte.view.axes'))"
                   x-modelable="value" x-model="bookMapAxisPair"
                   x-effect="bookMapResult; bookMapLabels; options = bookMapAxisPairOptions()"></div>
              <span class="buchlandkarte-view-label" x-text="$app.t('buchlandkarte.view.color')"></span>
              <div class="seg-toggle" role="group" :aria-label="$app.t('buchlandkarte.view.color')">
                <button type="button" :class="{ 'seg-toggle--active': bookMapColorMode === 'chapter' }"
                        :aria-pressed="bookMapColorMode === 'chapter' ? 'true' : 'false'"
                        @click="bookMapColorMode = 'chapter'" x-text="$app.t('buchlandkarte.color.chapter')"></button>
                <button type="button" :class="{ 'seg-toggle--active': bookMapColorMode === 'order' }"
                        :aria-pressed="bookMapColorMode === 'order' ? 'true' : 'false'"
                        @click="bookMapColorMode = 'order'" x-text="$app.t('buchlandkarte.color.order')"></button>
              </div>
            </div>

            <div class="buchlandkarte-canvas-wrap">
              <canvas id="bookMapCanvas" role="img"></canvas>
            </div>
            <div x-show="bookMapColorMode === 'order'" class="buchlandkarte-scale">
              <span x-text="$app.t('buchlandkarte.color.start')"></span>
              <span class="buchlandkarte-scale-bar buchlandkarte-scale-bar--order" aria-hidden="true"></span>
              <span x-text="$app.t('buchlandkarte.color.end')"></span>
            </div>
            <p class="buchlandkarte-variance" :class="'buchlandkarte-variance--' + bookMapVarianceInfo().cls"
               x-text="bookMapVarianceInfo().text"></p>
            <p class="buchlandkarte-hint" x-text="$app.t('buchlandkarte.clickHint')"></p>

            <!-- Was die Achsen trennen: die Abschnitte an beiden Enden -->
            <div class="buchlandkarte-section">
              <div class="buchlandkarte-section-head">
                <h3 class="section-heading" x-text="$app.t('buchlandkarte.axes.title')"></h3>
                <button type="button" class="secondary" x-show="bookMapResult.projection?.mode === 'pca'"
                        :disabled="!bookMapCanLabel()" @click="runBookMapLabels()"
                        x-text="$app.t(bookMapLabels ? 'buchlandkarte.labels.rerun' : 'buchlandkarte.labels.run')"></button>
              </div>
              <p class="buchlandkarte-section-hint"
                 x-text="$app.t(bookMapResult.projection?.mode === 'poles' ? 'buchlandkarte.axes.hintPoles' : 'buchlandkarte.axes.hint')"></p>
              <div x-show="bookMapLabelStatus" class="card-status" x-text="bookMapLabelStatus"></div>
              <template x-for="ax in bookMapAxisEnds()" :key="ax.k">
                <div class="buchlandkarte-axis">
                  <div class="buchlandkarte-axis-title" x-text="ax.title"></div>
                  <p x-show="ax.diff" class="buchlandkarte-axis-diff" x-text="ax.diff"></p>
                  <div class="buchlandkarte-axis-end">
                    <span class="buchlandkarte-axis-end-label" x-text="'← ' + ax.negLabel"></span>
                    <template x-for="p in ax.neg" :key="p.id">
                      <button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', id: p.id, label: p.name }"></button>
                    </template>
                  </div>
                  <div class="buchlandkarte-axis-end">
                    <span class="buchlandkarte-axis-end-label" x-text="ax.posLabel + ' →'"></span>
                    <template x-for="p in ax.pos" :key="p.id">
                      <button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', id: p.id, label: p.name }"></button>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- @include buchlandkarte-tables -->
      </div>

      <!-- @include buchlandkarte-matrix -->
    </div>
  </template>
</div>
