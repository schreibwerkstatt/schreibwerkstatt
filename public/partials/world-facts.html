<!-- Welt-Fakten / Weltregeln -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/world-facts-card.js.
  Daten aus der Komplettanalyse plus vom Autor gepflegte Fakten. Gruppiert nach Kategorie.
-->
<div class="card card--weltfakten" x-data="worldFactsCard" x-show="$app.showWorldFactsCard" x-cloak>
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('weltfakten.title')"></span>
      <div class="card-subline" x-show="wfUpdatedAt && !cardLoading">
        <span class="card-timestamp" x-text="$app.t('common.asOf', { date: $app.formatLastRun(wfUpdatedAt) })"></span>
      </div>
    </div>
    <div class="card-actions">
      <button type="button" class="btn-compact"
              x-show="$store.nav.selectedBookId"
              :disabled="wfEdit.mode !== null"
              @click="wfStartCreate()">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
        <span x-text="$app.t('weltfakten.edit.new')"></span>
      </button>
    </div>
  </div>

  <template x-if="wfEdit.mode === 'new'">
    <!-- @include world-facts-edit -->
  </template>

  <div x-show="fakten.length === 0 && !cardLoading && wfEdit.mode !== 'new'" class="card-empty">
    <p class="card-empty-text" x-text="$app.t(wfScanned ? 'weltfakten.emptyScanned' : 'weltfakten.empty')"></p>
    <button type="button" class="primary card-empty-cta"
            @click="$app.alleAktualisieren()"
            :disabled="$store.jobs.alleAktualisierenLoading || !$store.nav.selectedBookId">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg>
      <span x-text="$app.t('header.updateAll')"></span>
    </button>
  </div>

  <!-- Skeleton während Loading vor erstem Datensatz -->
  <div x-show="cardLoading && fakten.length === 0" x-skeleton="6" class="entity-list--accented" x-cloak></div>

  <!-- Filter-Leiste -->
  <div x-show="fakten.length > 0" class="filter-bar">
    <span class="filter-search-wrap">
      <input type="text" x-model="wfFilters.suche" :placeholder="$app.t('common.search')" :aria-label="$app.t('common.search')" class="filter-search-input">
      <button type="button" class="search-clear--icon" x-show="wfFilters.suche" @click="wfFilters.suche=''" :aria-label="$app.t('search.clear')" :data-tip="$app.t('search.clear')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
    </span>
    <div x-show="wfKapitelOptionen.length > 0"
         x-data="catalogFilter('chapter')"
         x-modelable="value" x-model="wfFilters.kapitelId"
         x-effect="options = wfKapitelOptionen"></div>
    <div class="tabs tabs--scrollable" role="group" :aria-label="$app.t('weltfakten.title')">
      <button type="button" class="tabs-btn"
              :class="{ 'tabs-btn--active': wfFilters.kategorie === '' }"
              :aria-pressed="wfFilters.kategorie === ''"
              @click="wfFilters.kategorie = ''">
        <span x-text="$app.t('common.all')"></span>
        <span class="tabs-btn-count" x-text="fakten.length"></span>
      </button>
      <template x-for="k in wfKategorieListe" :key="k">
        <button type="button" class="tabs-btn"
                :class="{ 'tabs-btn--active': wfFilters.kategorie === k }"
                :aria-pressed="wfFilters.kategorie === k"
                @click="wfFilters.kategorie = wfFilters.kategorie === k ? '' : k">
          <svg class="icon" aria-hidden="true"><use :href="'/icons.svg#' + wfKatIcon(k)"/></svg>
          <span x-text="wfKatLabel(k)"></span>
          <span class="tabs-btn-count" x-text="wfKatCount(k)"></span>
        </button>
      </template>
      <button type="button" class="tabs-btn" x-show="wfRefutedCount > 0" x-cloak
              :class="{ 'tabs-btn--active': wfFilters.widerlegt }"
              :aria-pressed="wfFilters.widerlegt"
              :data-tip="$app.t('weltfakten.widerlegtTip')"
              @click="wfFilters.widerlegt = !wfFilters.widerlegt">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#alert-triangle"/></svg>
        <span x-text="$app.t('weltfakten.widerlegt')"></span>
        <span class="tabs-btn-count" x-text="wfRefutedCount"></span>
      </button>
    </div>
    <span class="filter-count" x-text="wfFiltered.length + ' / ' + fakten.length"></span>
  </div>

  <!-- Fakten nach Kategorie gruppiert -->
  <div x-show="fakten.length > 0" class="weltfakten-groups">
    <!-- Gruppe = klappbare Sektion (collapsible); der Klappzustand liegt je Kategorie
         in wfOpenGroups (x-modelable). Bei aktivem Filter öffnet wfGroupForced die
         Gruppe, damit Treffer sichtbar sind; bei gewählter Kategorie fehlt der Kopf. -->
    <template x-for="g in wfGrouped" :key="g.kategorie">
      <div class="weltfakten-group" x-data="collapsible(true)" x-modelable="open" x-model="wfOpenGroups[g.kategorie]"
           x-effect="if (wfGroupForced()) open = true">
        <button type="button" class="collapsible-toggle weltfakten-group-head" x-bind="trigger"
                x-show="!wfFilters.kategorie">
          <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
          <span class="tag entity-typ-tag weltfakten-kat-tag truncate">
            <svg class="icon" aria-hidden="true"><use :href="'/icons.svg#' + wfKatIcon(g.kategorie)"/></svg>
            <span x-text="wfKatLabel(g.kategorie)"></span>
          </span>
          <span class="weltfakten-group-count" x-text="g.fakten.length"></span>
        </button>
        <div x-bind="panel" x-cloak>
        <div class="entity-list entity-list--accented">
          <template x-for="f in listWindowed(g.fakten, g.kategorie)" :key="f.id">
            <div class="weltfakten-item">
              <!-- Zeile (DESIGN.md «Listen-Anriss»): die Aussage ist der Titel-Knopf und
                   öffnet das Bearbeiten; Chevron-Knopf und übriger Zeilenkörper klappen
                   das Detail auf/zu. ⋯, Rechtsklick und Long-Press öffnen das Menü. -->
              <div class="weltfakten-row hover-reveal-host"
                   :class="{ 'weltfakten-row--nosubj': !f.subjekt, 'weltfakten-row--selected': wfOpenId === f.id }"
                   @click="wfRowBodyClick(f, $event)"
                   @contextmenu="wfOpenMenu($event, f)" x-long-press>
                <span x-show="f.subjekt" class="weltfakten-subjekt" x-text="f.subjekt"></span>
                <div class="weltfakten-row-body">
                  <div class="weltfakten-row-line">
                    <button type="button" class="weltfakten-fakt text-link" @click.stop="wfOpenEdit(f)"
                            :data-tip="$app.t('weltfakten.edit.editTitle')" x-text="f.fakt"></button>
                    <span x-show="f.manuell" class="tag weltfakten-manual-tag"
                          :data-tip="$app.t('weltfakten.manualHint')" x-text="$app.t('weltfakten.manual')"></span>
                    <span x-show="f.widerlegt" class="badge badge-warn weltfakten-widerlegt"
                          :data-tip="$app.t('weltfakten.widerlegtTip')" x-text="$app.t('weltfakten.widerlegt')"></span>
                    <template x-if="wfFcFactId === f.id"><span class="spinner" aria-hidden="true"></span></template>
                    <span class="row-end">
                      <button type="button" class="icon-btn icon-btn--ghost hover-reveal"
                              aria-haspopup="menu" :aria-expanded="isActionMenuOpen('fakt:' + f.id)"
                              @click="wfOpenMenu($event, f)"
                              :data-tip="$app.t('common.moreActions')" :aria-label="$app.t('common.moreActions')">
                        <svg class="icon" aria-hidden="true"><use href="/icons.svg#more-horizontal"/></svg>
                      </button>
                      <button type="button" class="row-expand" :aria-expanded="wfOpenId === f.id"
                              @click="wfToggleOpen(f)" :aria-label="$app.t('common.details')">
                        <span class="history-chevron" :class="{ open: wfOpenId === f.id }" aria-hidden="true"></span>
                      </button>
                    </span>
                  </div>
                  <div class="entity-refs weltfakten-row-meta" x-show="f.chapter_refs?.length || f.seite">
                    <template x-for="k in (f.chapter_refs || [])" :key="k.chapter_id">
                      <button type="button" class="entity-ref" x-entity-ref="{ type: 'kapitel', id: k.chapter_id, name: k.chapter_name }"></button>
                    </template>
                    <template x-if="f.seite">
                      <button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', name: f.seite, kapitel: (f.kapitel || [])[0] }"></button>
                    </template>
                  </div>
                </div>
              </div>
              <!-- @include world-facts-detail -->
            </div>
          </template>
          <button type="button" class="btn-compact list-window-more"
                  x-show="listWindowRest(g.fakten, g.kategorie) > 0" x-cloak
                  x-list-more="listWindowMore(g.kategorie)" @click="listWindowMore(g.kategorie)"
                  x-text="$app.t('common.showMore', { n: listWindowRest(g.fakten, g.kategorie) })"></button>
        </div>
        </div>
      </div>
    </template>
    <p class="muted-msg muted-msg--sm" x-show="wfFiltered.length === 0" x-text="$app.t('common.noMatch')"></p>
  </div>

  <!-- Aktionsmenü eines Fakts (⋯, Rechtsklick, Long-Press): eine Instanz je Karte. -->
  <template x-teleport="body">
    <div class="context-menu" x-ref="actionMenu" x-bind="actionMenuPanel()" x-cloak>
      <template x-if="wfMenuFakt()">
        <div>
          <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon"
                  :disabled="wfEdit.mode === 'new'"
                  @click="wfOpenEdit(wfMenuFakt())">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#pencil"/></svg>
            <span x-text="$app.t('common.edit')"></span>
          </button>
          <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon"
                  x-show="wfCanRecheck(wfMenuFakt())" :disabled="wfFcRunning"
                  @click="wfFactcheckRun(wfMenuFakt().id)">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg>
            <span x-text="$app.t('weltfakten.factcheck.recheck')"></span>
          </button>
          <div class="context-menu-sep" role="separator"></div>
          <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon context-menu-item--danger"
                  @click="wfDelete(wfMenuFakt())">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
            <span x-text="$app.t('common.delete')"></span>
          </button>
        </div>
      </template>
    </div>
  </template>

  <!-- Verworfene Analyse-Aussagen: gelöscht oder durch einen gepflegten Fakt ersetzt. Die
       Analyse legt sie (und ihre Umformulierungen) nicht wieder an, bis sie hier zurückkommen. -->
  <div class="collapsible-wrap card-section" x-show="wfAusgeblendet.length > 0" x-cloak x-data="collapsible()">
    <button type="button" class="collapsible-toggle" x-bind="trigger">
      <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
      <span x-text="$app.tn('weltfakten.ausgeblendet.title', wfAusgeblendet.length)"></span>
    </button>
    <div x-bind="panel" class="collapsible-section" x-cloak>
      <p class="card-hint" x-text="$app.t('weltfakten.ausgeblendet.hint')"></p>
      <ul class="entity-list weltfakten-ausgeblendet">
        <template x-for="s in wfAusgeblendet" :key="s.id">
          <li class="weltfakten-ausgeblendet-row">
            <span class="weltfakten-ausgeblendet-text">
              <span x-show="s.subjekt" class="weltfakten-subjekt" x-text="s.subjekt"></span>
              <span x-text="s.fakt"></span>
              <span x-show="s.replaced_by" class="tag" x-text="$app.t('weltfakten.ausgeblendet.ersetzt')"></span>
            </span>
            <button type="button" class="btn-compact" @click="wfRestore(s)" x-text="$app.t('weltfakten.ausgeblendet.restore')"></button>
          </li>
        </template>
      </ul>
    </div>
  </div>

  <!-- Weltfakten-Faktencheck: prüft die Fakten per Web-Suche gegen die reale Faktenlage
       (Job /jobs/faktencheck). Nur bei instanzweiter Freigabe; ohne Buch-Opt-in
       deaktiviert mit Hinweis auf die Bucheinstellungen. -->
  <div class="collapsible-wrap weltfakten-factcheck card-section" x-show="$store.config.factcheckEnabled && fakten.length > 0" x-cloak x-data="collapsible()">
    <button type="button" class="collapsible-toggle" x-bind="trigger">
      <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
      <span x-text="$app.t('weltfakten.factcheck.title')"></span>
    </button>
    <div x-bind="panel" class="collapsible-section" x-cloak>
      <p class="card-hint card-section" x-text="$app.t(wfFactcheck.bookOptIn ? 'weltfakten.factcheck.hint' : 'weltfakten.factcheck.notEnabled')"></p>
      <div class="card-section">
        <button type="button" class="secondary"
                @click="wfFactcheckRun()"
                :disabled="wfFcRunning || !wfFactcheck.bookOptIn || !$store.nav.selectedBookId">
          <span x-text="$app.t(wfFcRunning ? 'weltfakten.factcheck.starting' : 'weltfakten.factcheck.start')"></span>
        </button>
      </div>
      <div x-show="wfFcProgress > 0" class="progress-bar-wrap">
        <div class="progress-bar" :style="{ '--progress': wfFcProgress + '%' }"></div>
      </div>
      <p class="card-status" x-show="wfFcRunning && wfFcStatusKey" x-text="$app.t(wfFcStatusKey, wfFcStatusParams || {})"></p>
      <p class="card-status error-msg" x-show="wfFcError" x-text="wfFcError"></p>
      <template x-if="wfFcResult">
        <div class="card-section">
          <p class="card-status" x-text="$app.t('weltfakten.factcheck.result', wfFcResult)"></p>
          <ul class="komplett-warnings" x-show="wfFcResult.warnings.length">
            <template x-for="(w, wi) in wfFcResult.warnings" :key="w.key + '-' + wi">
              <li class="komplett-warning-item" x-text="$app.t(w.key, w.params || {})"></li>
            </template>
          </ul>
        </div>
      </template>
    </div>
  </div>
</div>
