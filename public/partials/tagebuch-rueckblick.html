<!-- Tagebuch-Rückblick (nur Buchtyp 'tagebuch') -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/tagebuch-rueckblick-card.js.
  `showTagebuchRueckblickCard` bleibt am Root (Hash-Router + Exklusivität).

  Split mit Leiste (layout/aside-split.css): links der gewählte Zeitraum, rechts
  die Navigation (Kalender | Liste, Fragment tagebuch-rueckblick-overview). Beide
  Karten teilen den Scope — darum trägt der Split x-data und Sichtbarkeit.
  Schmal steht die Navigation über dem Zeitraum (`--aside-first`).

  Ein Klick in Kalender oder Liste wählt immer nur den Zeitraum; was der
  Hauptbereich dann zeigt, hängt am Zustand des Zeitraums (rbPeriodState):
  Rückblick, «noch keiner — erstellen», «vorhanden — anzeigen» oder leer.
  Der Verlauf über die Monate ist eine zweite Ansicht des Hauptbereichs.
  KI-Felder via x-text (auto-escaped) — kein x-html-Sink ausser dem Job-Status.
-->
<div class="aside-split aside-split--aside-first rb-split" id="tagebuch-rueckblick-split"
     x-data="tagebuchRueckblickCard" x-show="$app.showTagebuchRueckblickCard" x-cloak
     x-aside-resize :class="{ 'aside-split--on': rbHasCalendar() }">
<div class="card card--tagebuchRueckblick" id="tagebuch-rueckblick-card">
  <div class="card-header">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('rueckblick.title')"></span>
    </div>
    <div class="card-actions">
      <div class="tabs" x-show="rbHasVerlauf()" x-cloak>
        <button type="button" class="tabs-btn" :class="{ 'tabs-btn--active': rbMainView === 'period' }"
                :aria-pressed="rbMainView === 'period'" @click="rbMainView = 'period'"
                x-text="$app.t('rueckblick.viewPeriod')"></button>
        <button type="button" class="tabs-btn" :class="{ 'tabs-btn--active': rbMainView === 'verlauf' }"
                :aria-pressed="rbMainView === 'verlauf'" @click="rbMainView = 'verlauf'"
                x-text="$app.t('rueckblick.viewVerlauf')"></button>
      </div>
    </div>
  </div>

  <!-- Zeitraum-Leiste: ‹ Zeitraum ›, Kennzahlen, Aktionen, Aktualität -->
  <div class="rb-period" x-show="rbMainView === 'period' && rueckblickZeitraum" x-cloak>
    <div class="rb-period-row">
      <div class="rb-period-nav">
        <button type="button" class="icon-btn icon-btn--ghost" @click="gotoNeighbor(-1)"
                :disabled="rueckblickLoading || !rbNeighbor(-1)"
                :data-tip="$app.t('rueckblick.prev')" :aria-label="$app.t('rueckblick.prev')">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#chevron-left"/></svg>
        </button>
        <h2 class="rb-period-label" x-text="zeitraumLabel(rueckblickZeitraum)"></h2>
        <button type="button" class="icon-btn icon-btn--ghost" @click="gotoNeighbor(1)"
                :disabled="rueckblickLoading || !rbNeighbor(1)"
                :data-tip="$app.t('rueckblick.next')" :aria-label="$app.t('rueckblick.next')">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#chevron-right"/></svg>
        </button>
      </div>
      <!-- Neu erstellen nur, wo es schon einen Rückblick gibt; der erste Lauf
           startet aus dem Leerzustand darunter. Gewichtung folgt der Aktualität. -->
      <div class="rb-period-actions" x-show="rbLatestEntry() || rueckblickLoading">
        <button type="button" class="btn-compact"
                :class="{ 'btn-compact--ghost': rueckblickUpToDate() }"
                @click="runTagebuchRueckblick()" :disabled="!canRunRueckblick()">
          <span x-show="rueckblickLoading" class="spinner"></span>
          <span x-text="$app.t('rueckblick.rerun')"></span>
        </button>
      </div>
    </div>
    <p class="card-hint rb-period-meta" x-show="hasRueckblickResult() ? rbViewedMeta() : rbEntryCount()"
       :data-tip="rueckblickFreshness().state === 'model' ? $app.t('rueckblick.fresh.model', { model: rueckblickFreshness().model, current: rueckblickFreshness().current }) : null"
       x-text="hasRueckblickResult() ? rbViewedMeta() : rbCountLabel(rbEntryCount())"></p>
    <p class="card-hint rb-fresh" x-show="!rueckblickLoading && rbFreshnessHint()" x-cloak
       :class="{ 'card-hint--warn': rueckblickFreshness().state === 'changed' }"
       x-text="rbFreshnessHint()"></p>
  </div>

  <div class="progress-bar-wrap" x-show="rueckblickProgress > 0">
    <div class="progress-bar" :style="{ '--progress': rueckblickProgress + '%' }"></div>
  </div>
  <div class="card-status" x-html="rueckblickStatus"></div>

  <div class="rb-main" x-show="rbMainView === 'period'">
    <!-- Noch kein Rückblick: der Erstellen-Aufruf steht dort, wo der Rückblick
         erscheinen wird. -->
    <div class="card-empty rb-state" x-show="rbPeriodState() === 'create'" x-cloak>
      <p class="card-empty-text" x-text="$app.t('rueckblick.create.title', { period: zeitraumLabel(rueckblickZeitraum) })"></p>
      <p class="card-empty-hint" x-text="$app.t('rueckblick.create.hint')"></p>
      <button type="button" class="primary card-empty-cta"
              @click="runTagebuchRueckblick()" :disabled="!canRunRueckblick()">
        <span x-text="$app.t('rueckblick.start')"></span>
      </button>
    </div>

    <!-- Rückblick vorhanden, aber geschlossen (Browser-Zurück aus dem Permalink) -->
    <div class="card-empty rb-state" x-show="rbPeriodState() === 'hidden'" x-cloak>
      <p class="card-empty-text" x-text="$app.t('rueckblick.hidden.title', { period: zeitraumLabel(rueckblickZeitraum), date: rueckblickEntryDate(rbLatestEntry()?.created_at) })"></p>
      <button type="button" class="primary card-empty-cta"
              @click="openRueckblickHistory(rbLatestEntry())">
        <span x-text="$app.t('rueckblick.show')"></span>
      </button>
    </div>

    <!-- Leerzustand: keine datierten Einträge im Zeitraum bzw. im Buch -->
    <p class="muted-msg rb-empty" x-show="rbPeriodState() === 'empty'" x-cloak
       x-text="$app.t('rueckblick.empty')"></p>
    <p class="muted-msg rb-empty" x-show="rbPeriodState() === 'noDated'" x-cloak
       x-text="$app.t('rueckblick.noDated')"></p>

    <!-- @include tagebuch-rueckblick-result -->
  </div>

  <!-- @include tagebuch-rueckblick-verlauf -->
</div>

<!-- @include tagebuch-rueckblick-overview -->
</div>
