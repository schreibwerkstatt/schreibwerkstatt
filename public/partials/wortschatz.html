<!-- Wortschatz-Analyse: quantitative Stilistik über das ganze Buch -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/wortschatz-card.js.
  `showWortschatzCard` + `toggleWortschatzCard` bleiben im Root (Hash-Router,
  Exklusivität). Rein rückwärtsgewandt: liest den abgeleiteten Index
  (book_lexicon / lexicon_terms / lexicon_ngrams), schreibt nie in den Buchtext.
  Kennzahlen-Tiles nutzen das geteilte Tile-Grid der Buch-Übersicht
  (.overview-grid/.overview-tile, siehe DESIGN.md „Book-Overview-Tiles").

  Die drei Ranglisten liegen als Fragmente daneben (wortschatz-terms/-phrases/
  -hapax.html) und kommen über den String-Include herein: der Einhängepunkt steckt
  in einem <template x-if>, wo der DOM-seitige Partial-Placeholder nicht greift.
-->
<div class="card card--wortschatz" x-data="wortschatzCard" x-show="$app.showWortschatzCard" x-cloak>
  <div class="card-header">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('wortschatz.title')"></span>
    </div>
    <div class="card-actions">
      <span class="tag" x-show="wortschatzHasResult && wortschatzData.stale"
            x-text="$app.t('wortschatz.stale')"></span>
      <span class="muted-msg muted-msg--sm" x-show="wortschatzHasResult && !wortschatzLoading"
            x-text="$app.t('wortschatz.scannedAt', { at: wsScannedAt() })"></span>
      <button type="button" class="primary" data-label-ok
              :disabled="wortschatzLoading || !$store.nav.selectedBookId"
              @click="runWortschatzScan()"
              x-text="$app.t(wortschatzHasResult ? 'wortschatz.rerun' : 'wortschatz.run')"></button>
    </div>
  </div>

  <p class="wortschatz-intro" x-text="$app.t('wortschatz.intro')"></p>
  <p class="wortschatz-list-hint" x-show="wortschatzHasResult && !wortschatzIsOwner"
     x-text="$app.t('wortschatz.viewerHint')"></p>

  <div x-show="wortschatzLoading && wortschatzProgress > 0" class="progress-bar-wrap">
    <div class="progress-bar" :style="{ '--progress': wortschatzProgress + '%' }"></div>
  </div>
  <div x-show="wortschatzStatus" class="card-status" x-text="wortschatzStatus"></div>
  <div x-show="wortschatzLoadError" class="muted-msg muted-msg--spaced" x-text="$app.t('wortschatz.loadError')"></div>

  <!-- Noch keine Analyse: CTA statt leerer Tabellen -->
  <div x-show="!wortschatzHasResult && !wortschatzLoading && !wortschatzLoadError"
       class="muted-msg muted-msg--spaced" x-text="$app.t('wortschatz.empty')"></div>

  <template x-if="wortschatzHasResult">
    <div class="wortschatz-result">
      <!-- Kennzahlen ------------------------------------------------------- -->
      <div class="overview-grid wortschatz-kpis">
        <div class="overview-tile overview-tile--hero">
          <div class="overview-tile-label" x-text="$app.t('wortschatz.kpi.types')"></div>
          <div class="overview-hero-row">
            <span class="overview-hero-value" x-text="wsNum(wortschatzData.stats.types)"></span>
            <span class="overview-hero-unit" x-text="$app.t('wortschatz.kpi.typesUnit')"></span>
          </div>
          <div class="overview-substats">
            <div class="overview-substat">
              <span class="overview-substat-value" x-text="wsNum(wortschatzData.stats.tokens)"></span>
              <span class="overview-substat-unit" x-text="$app.t('wortschatz.kpi.tokens')"></span>
            </div>
            <div class="overview-substat" :data-tip="$app.t('wortschatz.kpi.hapaxNote') + ' ' + $app.t('wortschatz.kpi.source.hapax')">
              <span class="overview-substat-value" x-text="wsPercent(wortschatzData.stats.hapax_ratio)"></span>
              <span class="overview-substat-unit" x-text="$app.t('wortschatz.kpi.hapax')"></span>
            </div>
          </div>
          <p class="wortschatz-kpi-note" x-text="$app.t('wortschatz.kpi.typesNote')"></p>
        </div>

        <div class="overview-tile">
          <div class="overview-tile-label" :data-tip="$app.t('wortschatz.kpi.source.mattr')" x-text="$app.t('wortschatz.kpi.mattr')"></div>
          <div class="overview-hero-row">
            <span class="overview-hero-value" x-text="wsNum(wortschatzData.stats.mattr, 3)"></span>
          </div>
          <p class="wortschatz-kpi-peer" x-show="wsPeer('mattr', 3)" x-text="wsPeer('mattr', 3)"></p>
          <p class="wortschatz-kpi-warn" x-show="!wsMattrIsRobust()"
             x-text="$app.t('wortschatz.kpi.mattrShort', { window: wortschatzData.stats.mattr_window })"></p>
          <p class="wortschatz-kpi-note" x-text="$app.t('wortschatz.kpi.mattrNote')"></p>
        </div>

        <div class="overview-tile">
          <div class="overview-tile-label" :data-tip="$app.t('wortschatz.kpi.source.mtld')" x-text="$app.t('wortschatz.kpi.mtld')"></div>
          <div class="overview-hero-row">
            <span class="overview-hero-value" x-text="wsNum(wortschatzData.stats.mtld, 1)"></span>
          </div>
          <p class="wortschatz-kpi-peer" x-show="wsPeer('mtld', 1)" x-text="wsPeer('mtld', 1)"></p>
          <p class="wortschatz-kpi-warn" x-show="wsMtldNote()" x-text="wsMtldNote()"></p>
          <p class="wortschatz-kpi-note" x-text="$app.t('wortschatz.kpi.mtldNote')"></p>
        </div>

        <div class="overview-tile">
          <div class="overview-tile-label" :data-tip="$app.t('wortschatz.kpi.source.density')" x-text="$app.t('wortschatz.kpi.density')"></div>
          <div class="overview-hero-row">
            <span class="overview-hero-value" x-text="wsPercent(wortschatzData.stats.lex_density)"></span>
          </div>
          <p class="wortschatz-kpi-peer" x-show="wsPeer('lex_density', 1, true)" x-text="wsPeer('lex_density', 1, true)"></p>
          <p class="wortschatz-kpi-note" x-text="$app.t('wortschatz.kpi.densityNote')"></p>
        </div>

        <div class="overview-tile">
          <div class="overview-tile-label" :data-tip="$app.t('wortschatz.kpi.source.yule')" x-text="$app.t('wortschatz.kpi.yule')"></div>
          <div class="overview-hero-row">
            <span class="overview-hero-value" x-text="wsNum(wortschatzData.stats.yule_k, 1)"></span>
          </div>
          <p class="wortschatz-kpi-peer" x-show="wsPeer('yule_k', 1)" x-text="wsPeer('yule_k', 1)"></p>
          <p class="wortschatz-kpi-note" x-text="$app.t('wortschatz.kpi.yuleNote')"></p>
        </div>

        <div class="overview-tile">
          <div class="overview-tile-label" :data-tip="$app.t('wortschatz.kpi.source.heaps')" x-text="$app.t('wortschatz.kpi.heaps')"></div>
          <div class="overview-hero-row">
            <span class="overview-hero-value" x-text="wsNum(wortschatzData.stats.heaps_beta, 3)"></span>
          </div>
          <p class="wortschatz-kpi-peer" x-show="wsPeer('heaps_beta', 3)" x-text="wsPeer('heaps_beta', 3)"></p>
          <p class="wortschatz-kpi-warn" x-show="wortschatzData.stats.heaps_beta == null"
             x-text="$app.t('wortschatz.kpi.heapsShort', { min: wortschatzData.thresholds.heapsMinTokens })"></p>
          <p class="wortschatz-kpi-note" x-show="wortschatzData.stats.heaps_beta != null"
             x-text="$app.t('wortschatz.kpi.heapsNote')"></p>
        </div>
      </div>

      <!-- Ranglisten ------------------------------------------------------- -->
      <div class="tabs wortschatz-tabs">
        <button type="button" class="tabs-btn"
                :class="{ 'tabs-btn--active': wortschatzTab === 'terms' }"
                @click="wortschatzTab = 'terms'"
                x-text="$app.t('wortschatz.tab.terms', { n: wortschatzTerms.length })"></button>
        <button type="button" class="tabs-btn"
                :class="{ 'tabs-btn--active': wortschatzTab === 'phrases' }"
                @click="wortschatzTab = 'phrases'"
                x-text="$app.t('wortschatz.tab.phrases', { n: wortschatzNgrams.length })"></button>
        <button type="button" class="tabs-btn"
                :class="{ 'tabs-btn--active': wortschatzTab === 'hapax' }"
                @click="wortschatzTab = 'hapax'"
                x-text="$app.t('wortschatz.tab.hapax', { n: wortschatzHapax.length })"></button>
        <button type="button" class="tabs-btn"
                :class="{ 'tabs-btn--active': wortschatzTab === 'cloud' }"
                @click="wortschatzTab = 'cloud'"
                x-text="$app.t('wortschatz.tab.cloud')"></button>
        <button type="button" class="tabs-btn"
                :class="{ 'tabs-btn--active': wortschatzTab === 'chapters' }"
                @click="wortschatzTab = 'chapters'"
                x-text="$app.t('wortschatz.tab.chapters', { n: wortschatzChapters.length })"></button>
        <button type="button" class="tabs-btn"
                :class="{ 'tabs-btn--active': wortschatzTab === 'figures' }"
                @click="wortschatzTab = 'figures'"
                x-text="$app.t('wortschatz.tab.figures', { n: wortschatzIdiolect.length })"></button>
      </div>

      <!-- @include wortschatz-terms -->
      <!-- @include wortschatz-phrases -->
      <!-- @include wortschatz-hapax -->
      <!-- @include wortschatz-cloud -->
      <!-- @include wortschatz-chapters -->
      <!-- @include wortschatz-figures -->
    </div>
  </template>
</div>
