<!-- Figuren-Werkstatt: Vorwärts-Entwicklung von Figuren als Mindmap.
     jsMind-Editor + KI-Brainstorm + Konsistenz-Check. -->
<div class="card card--werkstatt" x-data="figurWerkstattCard" x-show="$app.showFigurWerkstattCard" x-cloak>
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('werkstatt.title')"></span>
      <div class="card-subline">
        <span x-text="$app.t('werkstatt.subline')"></span>
      </div>
    </div>
  </div>

  <div x-show="errorMessage" class="card-status card-status--error" x-text="errorMessage"></div>

  <!-- Skeleton während Loading vor erstem Datensatz -->
  <div x-show="loading && drafts.length === 0" x-skeleton="4" x-cloak></div>

  <!-- Empty-State mit CTA — kein Draft vorhanden -->
  <div x-show="!loading && drafts.length === 0 && !creating && !importing" class="card-empty">
    <p class="card-empty-text" x-text="$app.t('werkstatt.empty.title')"></p>
    <p class="card-empty-hint" x-text="$app.t('werkstatt.empty.hint')"></p>
    <div class="row">
      <button type="button" class="primary" :disabled="busy" @click="startCreate()" x-text="$app.t('werkstatt.empty.cta')"></button>
      <button type="button" :disabled="busy" @click="startImport()" x-text="$app.t('werkstatt.action.import')"></button>
    </div>
  </div>

  <!-- Create-Inline (auch bei leerem Empty-State sichtbar nach Klick auf CTA) -->
  <div x-show="creating && drafts.length === 0" class="card-empty" x-cloak>
    <p class="card-empty-text" x-text="$app.t('werkstatt.action.new')"></p>
    <!-- @include werkstatt-create-fields -->
  </div>

  <!-- Import-Inline bei leerem Empty-State: Combobox mit Buch-Figuren ohne aktiven Draft -->
  <div x-show="importing && drafts.length === 0" class="card-empty" x-cloak>
    <!-- @include werkstatt-import-fields -->
  </div>

  <!-- 2-Spalten-Layout: Drafts-Liste links, Detail rechts -->
  <div x-show="drafts.length > 0" class="werkstatt-grid">
    <div class="werkstatt-sidebar">
      <div class="list-header">
        <button type="button" class="primary" :disabled="busy || creating || importing" @click="startCreate()" x-text="$app.t('werkstatt.action.new')"></button>
        <button type="button" :disabled="busy || creating || importing" @click="startImport()" x-text="$app.t('werkstatt.action.import')"></button>
      </div>

      <div class="werkstatt-list" role="list">
        <template x-for="d in drafts" :key="d.id">
          <div class="werkstatt-list-entry hover-reveal-host" role="listitem"
               @contextmenu="openDraftMenu($event, d)" x-long-press>
            <button :aria-pressed="d.id === selectedDraftId" type="button"
                    class="werkstatt-list-item"
                    :class="{ 'werkstatt-list-item--selected': d.id === selectedDraftId }"
                    @click="selectDraft(d.id)">
              <span class="werkstatt-list-name" x-text="d.name"></span>
              <span class="werkstatt-list-archetype" x-show="d.archetype" x-text="archetypeLabel(d.archetype)"></span>
            </button>
            <button type="button" class="icon-btn icon-btn--ghost hover-reveal"
                    @click="openDraftMenu($event, d)"
                    aria-haspopup="menu" :aria-expanded="isActionMenuOpen('draft:' + d.id)"
                    :data-tip="$app.t('editor.btn.moreActions')" :aria-label="$app.t('editor.btn.moreActions')">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#more-horizontal"/></svg>
            </button>
          </div>
        </template>
      </div>

      <div x-show="creating" class="werkstatt-create-inline" x-cloak>
        <!-- @include werkstatt-create-fields -->
      </div>

      <div x-show="importing" class="werkstatt-create-inline" x-cloak>
        <!-- @include werkstatt-import-fields -->
      </div>
    </div>

    <div class="werkstatt-detail" x-show="selectedDraft()" x-cloak>
      <div class="werkstatt-detail-header">
        <div class="werkstatt-detail-titlebar">
          <h2 class="werkstatt-detail-name" x-text="editName || $app.t('werkstatt.field.name')"></h2>
          <span x-show="importedFromName()"
                class="badge badge-source"
                :data-tip="$app.t('werkstatt.importedFrom.tip')"
                x-text="$app.t('werkstatt.importedFrom', { name: importedFromName() })"></span>
          <!-- Cross-Feature: Plot-Beteiligung → Klick öffnet das gefilterte Beat-Board -->
          <span x-show="plotUsageVisible()" x-cloak
                class="badge badge--plot internal-link"
                @click="$app.openPlotForDraftFigure(selectedDraftId)"
                :data-tip="plotUsageTip()"
                x-text="plotUsageLabel()"></span>
          <!-- Cross-Feature: Motiv-Beteiligung → Klick öffnet die Konstellation
               beim ersten Motiv dieser Figur. Die Gegenrichtung zum Figuren-Layer
               der Motiv-Werkstatt; ohne sie kennt nur eine Seite die Kante. -->
          <span x-show="motifUsageVisible()" x-cloak
                class="badge badge--motiv internal-link"
                @click="openMotifForFigure()"
                :data-tip="motifUsageTip()"
                x-text="motifUsageLabel()"></span>
          <!-- Cross-Feature: eigene Pendenzen (Ideen) an dieser Werkstatt-Figur, read-only.
               x-effect statt Init-Wert: die Auswahl wechselt, der Wrapper bleibt. -->
          <div x-data="{ ideaOwnerId: null }" x-effect="ideaOwnerId = selectedDraftId"><!-- @include ideen-backlinks --></div>
        </div>
        <div class="card-actions">
          <span class="save-indicator" x-show="isDirty()" x-cloak x-text="$app.t('werkstatt.unsaved')"></span>
          <button type="button" class="icon-btn icon-btn--ghost icon-btn--success"
                  :disabled="busy || !editName.trim()" @click="saveDraft()"
                  :data-tip="$app.t('werkstatt.action.save')" :aria-label="$app.t('werkstatt.action.save')">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#check"/></svg>
          </button>
          <span class="action-overflow" x-data="menu()">
            <button type="button" class="icon-btn icon-btn--ghost" x-bind="trigger"
                    :class="{ 'is-active': open }"
                    aria-haspopup="menu"
                    :data-tip="$app.t('editor.btn.moreActions')" :aria-label="$app.t('editor.btn.moreActions')">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#more-horizontal"/></svg>
            </button>
            <div class="context-menu context-menu--dropdown" x-bind="panel" x-cloak>
              <button type="button" class="context-menu-item context-menu-item--icon" role="menuitem"
                      :disabled="busy || brainstormLoading || !selectedKnotenId"
                      @click="runBrainstorm()">
                <svg class="icon" aria-hidden="true"><use href="/icons.svg#lightbulb"/></svg>
                <span x-text="$app.t('werkstatt.action.brainstorm')"></span>
              </button>
              <button type="button" class="context-menu-item context-menu-item--icon" role="menuitem"
                      :disabled="busy || consistencyLoading"
                      @click="runConsistency()">
                <svg class="icon" aria-hidden="true"><use href="/icons.svg#spell-check"/></svg>
                <span x-text="$app.t('werkstatt.action.consistency')"></span>
              </button>
              <div class="context-menu-sep" role="separator"></div>
              <!-- Nachtraegliche Verknuepfung mit der Katalog-Figur: wer erst
                   plant und dann schreibt, hat die Figur danach zweimal (Werkstatt
                   + Komplettanalyse). Der Zeiger loest das auf, ohne eine der
                   beiden Zeilen zu toeten. -->
              <button type="button" class="context-menu-item context-menu-item--icon" role="menuitem"
                      x-show="!selectedDraft()?.source_figure_id"
                      :disabled="busy" @click.stop="startLinkFigure($el.closest('.action-overflow').querySelector('button')); close()">
                <svg class="icon" aria-hidden="true"><use href="/icons.svg#users"/></svg>
                <span x-text="$app.t('werkstatt.action.linkFigure')"></span>
              </button>
              <button type="button" class="context-menu-item context-menu-item--icon" role="menuitem"
                      x-show="selectedDraft()?.source_figure_id"
                      :disabled="busy" @click="runLinkFigure(null)">
                <svg class="icon" aria-hidden="true"><use href="/icons.svg#unlink"/></svg>
                <span x-text="$app.t('werkstatt.action.unlinkFigure')"></span>
              </button>
              <div class="context-menu-sep" role="separator"></div>
              <button type="button" class="context-menu-item context-menu-item--icon context-menu-item--danger" role="menuitem"
                      :disabled="busy" @click="requestDelete()">
                <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
                <span x-text="$app.t('werkstatt.action.delete')"></span>
              </button>
            </div>
          </span>
        </div>
      </div>

      <!-- @include werkstatt-link-picker -->

      <!-- Form: Name + Archetyp + Notizen. Cmd+S speichert, Esc verwirft
           (nach Rückfrage, wenn ungespeichert) — die Mindmap hat eigene Tasten
           und liegt darum ausserhalb; Cmd+S dort fängt der Karten-Listener. -->
      <div class="card-form-grid"
           @keydown="$editKeys($event, { save: () => !busy && editName.trim() && saveDraft(), cancel: () => discardDraftEdits() })">
        <div class="card-form-row">
          <label class="card-form-label" :for="'werkstatt-name-' + selectedDraftId" x-text="$app.t('werkstatt.field.name')"></label>
          <div class="form-stack">
            <input type="text"
                   :id="'werkstatt-name-' + selectedDraftId"
                   x-model="editName"
                   :aria-invalid="!editName.trim()"
                   :placeholder="$app.t('werkstatt.field.name')"
                   data-spellcheck="spelling">
          </div>
        </div>

        <div x-id="['fld']" class="card-form-row">
          <label :id="$id('fld')" class="card-form-label" x-text="$app.t('werkstatt.field.archetype')"></label>
          <div class="form-stack">
            <div :aria-labelledby="$id('fld')" x-data="combobox($app.t('werkstatt.archetype.placeholder'), $app.t('werkstatt.archetype.frei'))"
                 x-modelable="value"
                 x-model="editArchetype"
                 x-effect="options = [
                   { value: 'protagonist', label: $app.t('werkstatt.archetype.protagonist') },
                   { value: 'antagonist', label: $app.t('werkstatt.archetype.antagonist') },
                   { value: 'nebenfigur', label: $app.t('werkstatt.archetype.nebenfigur') },
                   { value: 'mentor',     label: $app.t('werkstatt.archetype.mentor') },
                   { value: 'nemesis',    label: $app.t('werkstatt.archetype.nemesis') },
                 ]"></div>
          </div>
        </div>

        <div class="card-form-row card-form-row--top">
          <label class="card-form-label" :for="'werkstatt-notes-' + selectedDraftId" x-text="$app.t('werkstatt.field.notes')"></label>
          <div class="form-stack">
            <textarea :id="'werkstatt-notes-' + selectedDraftId"
                      class="card-form-textarea"
                      x-model="editNotes"
                      rows="4"
                      :placeholder="$app.t('werkstatt.field.notes')"
                      data-spellcheck="spelling"></textarea>
          </div>
        </div>
      </div>

      <!-- Mindmap-Canvas (jsMind, lazy-loaded). Editierbar: F2/Doppelklick zum Umbenennen,
           Tab fügt Sub-Knoten, Enter fügt Geschwister, Delete entfernt, Pfeiltasten navigieren,
           Knoten ziehen hängt um, Strg+Mausrad zoomt, Rechtsklick öffnet Kontext-Menü. -->
      <section class="werkstatt-mindmap-section fullscreen-shell">
        <div class="card-section-head card-section-head--baseline">
          <h3 class="section-heading" x-text="$app.t('werkstatt.mindmap.title')"></h3>
          <span class="save-indicator"
                x-show="selectedDraft()?.updated_at"
                x-text="selectedDraft()?.updated_at ? $app.t('werkstatt.savedAt', { when: $app._formatSaveTs(new Date(selectedDraft().updated_at).getTime()) }) : ''"></span>
          <!-- Werkzeugleiste in der Kopfzeile, nicht als Overlay: eingepasst reicht
               die Map bis an den Rand, ein Overlay verdeckte dort Knoten. -->
          <div class="werkstatt-mindmap-controls" role="toolbar" :aria-label="$app.t('werkstatt.mindmap.title')">
            <button type="button" class="icon-btn" :disabled="!canUndoMindmap()" @click="undoMindmap()"
                    :data-tip="$app.t('werkstatt.mindmap.undo')" :aria-label="$app.t('werkstatt.mindmap.undo')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#undo"/></svg></button>
            <button type="button" class="icon-btn" :disabled="!canRedoMindmap()" @click="redoMindmap()"
                    :data-tip="$app.t('werkstatt.mindmap.redo')" :aria-label="$app.t('werkstatt.mindmap.redo')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#redo"/></svg></button>
            <span class="werkstatt-mindmap-controls-sep" aria-hidden="true"></span>
            <button type="button" class="icon-btn" @click="zoomMindmap(1)"
                    :data-tip="$app.t('graph.zoomIn')" :aria-label="$app.t('graph.zoomIn')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg></button>
            <button type="button" class="icon-btn" @click="zoomMindmap(-1)"
                    :data-tip="$app.t('graph.zoomOut')" :aria-label="$app.t('graph.zoomOut')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#minus"/></svg></button>
            <button type="button" class="icon-btn" @click="fitMindmap()"
                    :data-tip="$app.t('werkstatt.mindmap.fit')" :aria-label="$app.t('werkstatt.mindmap.fit')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#scan"/></svg></button>
            <span class="werkstatt-mindmap-controls-sep" aria-hidden="true"></span>
            <button type="button" class="icon-btn" @click="expandAllMindmap()"
                    :data-tip="$app.t('werkstatt.mindmap.expandAll')" :aria-label="$app.t('werkstatt.mindmap.expandAll')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#chevrons-up-down"/></svg></button>
            <button type="button" class="icon-btn" @click="collapseAllMindmap()"
                    :data-tip="$app.t('werkstatt.mindmap.collapseAll')" :aria-label="$app.t('werkstatt.mindmap.collapseAll')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#chevrons-down-up"/></svg></button>
            <span class="werkstatt-mindmap-controls-sep" aria-hidden="true"></span>
            <button type="button"
                    class="icon-btn"
                    :aria-pressed="mindmapFullscreen"
                    :aria-label="mindmapFullscreen ? $app.t('werkstatt.mindmap.fullscreenExit.tip') : $app.t('werkstatt.mindmap.fullscreen.tip')"
                    @click="toggleMindmapFullscreen()"
                    :data-tip="mindmapFullscreen ? $app.t('werkstatt.mindmap.fullscreenExit.tip') : $app.t('werkstatt.mindmap.fullscreen.tip')"><svg class="icon" aria-hidden="true"><use :href="mindmapFullscreen ? '/icons.svg#minimize-2' : '/icons.svg#maximize-2'"/></svg></button>
          </div>
        </div>
        <div class="werkstatt-mindmap-canvas">
          <!-- Key aus selectedDraftId + _mindmapMountKey zwingt komplettes Remount des
               Mindmap-Divs bei Figur-Wechsel und beim Refresh mit Verwerfen. jsMind hängt sich an frische DOM, kein State-Lecken
               zwischen Drafts. _mountMindmap kriegt $el direkt — keine $el-Magic-Race. -->
          <template x-for="dId in selectedDraftId ? [selectedDraftId + ':' + _mindmapMountKey] : []" :key="dId">
            <div class="werkstatt-mindmap" x-init="_mountMindmap($el)" x-long-press></div>
          </template>
        </div>

        <!-- Knoten-Menü (Rechtsklick / Long-Press), Mechanik aus action-menu.js -->
        <!-- Eine Instanz für Mindmap-Knoten (mindmap:<id>) und Figurenliste (draft:<id>). -->
        <div class="context-menu werkstatt-context-menu" x-ref="actionMenu" x-bind="actionMenuPanel()" x-cloak>
          <template x-if="menuDraft()"><div>
            <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon" @click="draftMenuConsistency()" :disabled="busy || consistencyLoading">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#spell-check"/></svg>
              <span x-text="$app.t('werkstatt.action.consistency')"></span>
            </button>
            <div class="context-menu-sep" role="separator"></div>
            <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon context-menu-item--danger" @click="draftMenuDelete()" :disabled="busy">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
              <span x-text="$app.t('werkstatt.action.delete')"></span>
            </button>
          </div></template>
          <template x-if="actionMenuKey && actionMenuKey.startsWith('mindmap:')"><div>
          <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon" @click="ctxBrainstorm()" :disabled="busy || brainstormLoading">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#lightbulb"/></svg>
            <span x-text="$app.t('werkstatt.action.brainstorm')"></span>
          </button>
          <div class="context-menu-sep" role="separator"></div>
          <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon" @click="ctxRename()">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#pencil"/></svg>
            <span x-text="$app.t('werkstatt.context.rename')"></span>
          </button>
          <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon" @click="ctxAddChild()">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#git-fork"/></svg>
            <span x-text="$app.t('werkstatt.context.addChild')"></span>
          </button>
          <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon" @click="ctxAddSibling()">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
            <span x-text="$app.t('werkstatt.context.addSibling')"></span>
          </button>
          <div class="context-menu-sep" role="separator"></div>
          <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon context-menu-item--danger" @click="ctxDelete()" :disabled="!canDeleteNode(actionMenuTarget)">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
            <span x-text="$app.t('werkstatt.context.delete')"></span>
          </button>
          </div></template>
        </div>
      </section>

      <!-- Bogen im Buch: Kern x Kapitel als Heatmap der Ist-Dichte + die
           Messbefunde dieser Figur. Nested Partial (HTML-Partial-LOC-Limit); die
           Sichtbarkeits-Weiche sitzt HIER am Platzhalter. Sichtbar, sobald die
           Figur einen ausgearbeiteten Kern hat — auch ohne Lauf, dann traegt das
           Band seinen „noch nie verankert"-Hinweis. -->
      <div id="partial-werkstatt-bogen" x-show="arcVisible()" x-cloak></div>

      <!-- Brainstorm-Status während KI-Job -->
      <section x-show="brainstormLoading" x-cloak class="job-progress">
        <div x-show="brainstormProgress > 0" class="progress-bar-wrap">
          <div class="progress-bar" :style="{ '--progress': brainstormProgress + '%' }"></div>
        </div>
        <div class="job-progress-row">
          <div class="card-status" x-html="brainstormStatus"></div>
          <button type="button" @click="cancelBrainstorm()" x-text="$app.t('common.cancel')"></button>
        </div>
      </section>

      <!-- Consistency-Status während KI-Job -->
      <section x-show="consistencyLoading" x-cloak class="job-progress">
        <div x-show="consistencyProgress > 0" class="progress-bar-wrap">
          <div class="progress-bar" :style="{ '--progress': consistencyProgress + '%' }"></div>
        </div>
        <div class="job-progress-row">
          <div class="card-status" x-html="consistencyStatus"></div>
          <button type="button" @click="cancelConsistency()" x-text="$app.t('common.cancel')"></button>
        </div>
      </section>

      <!-- KI-Lauf-Historie pro Draft. Klick expandiert Result inline unter dem
           Eintrag (history-item--open + history-detail), wie Buch-Review-Verlauf. -->
      <div class="history-bar" x-show="runsLoadedDraftId === selectedDraftId && runs.brainstorm.length > 0" x-cloak>
        <div class="history-heading" x-text="$app.t('werkstatt.runs.brainstorm', { count: runs.brainstorm.length })"></div>
        <template x-for="r in runs.brainstorm" :key="r.id">
          <div>
            <!-- @include werkstatt-run-row -->
            <!-- @include werkstatt-brainstorm-detail -->
          </div>
        </template>
      </div>

      <div class="history-bar" x-show="runsLoadedDraftId === selectedDraftId && runs.consistency.length > 0" x-cloak>
        <div class="history-heading" x-text="$app.t('werkstatt.runs.consistency', { count: runs.consistency.length })"></div>
        <template x-for="r in runs.consistency" :key="r.id">
          <div>
            <!-- @include werkstatt-run-row -->
            <!-- @include werkstatt-consistency-detail -->
          </div>
        </template>
      </div>
    </div>
  </div>
</div>
