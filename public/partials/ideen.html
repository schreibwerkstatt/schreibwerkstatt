<!-- Seiten-Ideen — Notizen für Fortsetzungen, Szenen, Anker; in der Praxis
     genauso oft Pendenzen an dieser Stelle. Sub-Komponente, lebt parallel zum
     Editor (kein _closeOtherMainCards). Offene Ideen werden im Seiten-Chat als
     Kontext mitgegeben.

     Dieselben Zeilen zeigt das Ideen-Board (partials/ideen-board.html) für das
     ganze Buch; die Stufen-Achse und die Verknüpfungs-Chips sind darum geteilt
     (public/js/book/ideen-shared.js, ideen-links.js). „Offen" heisst hier wie
     dort `offen` ODER `in_arbeit`. -->
<div class="card card--ideen" id="ideen-card" x-data="ideenCard" x-show="$app.showIdeenCard" x-cloak>
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-title"
            x-text="$app.ideenScope === 'chapter' ? $app.t('ideen.titleChapter') : $app.t('ideen.title')"></span>
      <div class="card-subline"
           x-text="$app.ideenScope === 'chapter' ? $app.t('ideen.chatNoteChapter') : $app.t('ideen.chatNote')"></div>
    </div>
    <button type="button" class="btn-card-close" @click="$app.showIdeenCard = false" :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
  </div>

  <div x-show="errorMessage" class="card-status card-status--error" x-text="errorMessage"></div>

  <div class="ideen-input-row">
    <textarea
      class="ideen-input"
      x-model="newContent"
      :placeholder="$app.ideenScope === 'chapter' ? $app.t('ideen.placeholderChapter') : $app.t('ideen.placeholder')"
      :aria-label="$app.ideenScope === 'chapter' ? $app.t('ideen.placeholderChapter') : $app.t('ideen.placeholder')"
      rows="2"
      :disabled="busy"
      data-spellcheck="spelling"
      @keydown.enter="if(!$event.isComposing && $event.keyCode !== 229 && !$event.shiftKey && !$event.ctrlKey && !$event.metaKey) { $event.preventDefault(); addIdee(); }"
    ></textarea>
    <button type="button"
      class="ideen-add-btn"
      @click="addIdee()"
      :disabled="busy || !(newContent || '').trim()"
      x-text="$app.t('ideen.add')"></button>
  </div>

  <!-- Verschieben: am Menue-Eintrag verankertes Popover, dasselbe Muster wie
       das Verknuepfen (public/js/picker-popover.js). -->
  <template x-teleport="body">
    <div class="picker-popover idee-move-popover"
         x-ref="ideenMovePopover"
         x-show="movingId !== null && !!movingIdee()" x-cloak
         :style="{ top: pickerPopoverPos.top + 'px', left: pickerPopoverPos.left + 'px' }"
         @keydown.escape.window="cancelMoveIdee()"
         role="dialog" :aria-label="$app.t('ideen.move')">
      <div class="picker-popover__head">
        <span class="picker-popover__title" x-text="$app.t('ideen.moveTo')"></span>
        <span class="picker-popover__subject" x-text="movingIdee()?.content || ''"></span>
      </div>

      <div x-data="combobox(() => $app.t('ideen.moveSelectPlaceholder'), null)"
           x-modelable="value" x-model="moveTargetId"
           x-effect="options = $app.ideenMovePickerOptions()"></div>

      <div class="picker-popover__actions">
        <button type="button" class="btn-compact" @click="confirmMoveCurrentIdee()" :disabled="busy || !moveTargetId" x-text="$app.t('ideen.moveConfirm')"></button>
        <button type="button" class="btn-compact" @click="cancelMoveIdee()" :disabled="busy" x-text="$app.t('ideen.cancel')"></button>
      </div>
    </div>
  </template>

  <!-- @include ideen-link-picker -->

  <div class="ideen-list">
    <div x-show="loading" class="ideen-loading" x-text="$app.t('common.loading')"></div>

    <div x-show="!loading && ideen.length === 0" class="muted-msg muted-msg--sm muted-msg--block"
         x-text="$app.ideenScope === 'chapter' ? $app.t('ideen.emptyChapter') : $app.t('ideen.empty')"></div>

    <!-- Offene Ideen -->
    <template x-if="!loading && offeneIdeen().length > 0">
      <div class="ideen-section">
        <div class="card-section-title" x-text="$app.t('ideen.sectionOpen')"></div>
        <template x-for="idee in offeneIdeen()" :key="idee.id">
          <div class="idee-item" :class="{'idee-item--moving': movingId === idee.id}" :data-idee-id="idee.id"
               @contextmenu="if (!busy && editingId !== idee.id && movingId !== idee.id) openMenu($event, idee)" x-long-press>
            <div class="idee-status-badge" :class="'idee-status-badge--' + ideeStatus(idee)"
                 x-text="statusLabel(ideeStatus(idee))"></div>
            <div class="idee-menu" x-show="editingId !== idee.id && movingId !== idee.id">
              <button type="button"
                class="icon-btn icon-btn--ghost"
                @click="openMenu($event, idee)"
                :disabled="busy"
                :data-tip="$app.t('ideen.actions')"
                :aria-label="$app.t('ideen.actions')"
                :aria-expanded="isActionMenuOpen('idee:' + idee.id)"
                aria-haspopup="menu"><svg class="icon" aria-hidden="true"><use href="/icons.svg#more-horizontal"/></svg></button>
            </div>
            <template x-if="editingId !== idee.id">
              <div class="idee-content" :class="movingId === idee.id ? 'idee-content--moving' : ''" x-text="idee.content"></div>
            </template>
            <!-- @include ideen-link-chips -->
            <template x-if="editingId === idee.id">
              <div class="idee-edit"
                   @keydown="$editKeys($event, { save: () => commitEditIdee(idee), cancel: () => cancelEditIdee() })"
                   @click.outside="commitEditIdee(idee)">
                <textarea class="ideen-input idee-edit-input" x-model="editingDraft" rows="2" :disabled="busy"
                  data-spellcheck="spelling" :aria-label="$app.t('ideen.edit')"
                  x-init="$nextTick(() => mountIdeeEditInput($el))" @input="autosizeIdeeEditInput($el)"
                  @keydown.enter="if(!$event.isComposing && $event.keyCode !== 229 && !$event.shiftKey && !$event.ctrlKey && !$event.metaKey) { $event.preventDefault(); commitEditIdee(idee); }"></textarea>
                <div class="idee-edit-foot">
                  <div class="idee-edit-actions">
                    <button type="button" class="btn-compact btn-compact--ghost" @click="cancelEditIdee()" :disabled="busy" x-text="$app.t('ideen.cancel')"></button>
                    <button type="button" class="btn-compact primary" @click="saveEditIdee(idee)" :disabled="busy" x-text="$app.t('ideen.save')"></button>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>

    <!-- Aktionsmenü einer Idee (⋯-Knopf, Rechtsklick/Long-Press auf die Zeile),
         Mechanik aus action-menu.js. Via x-teleport zu <body>, weil .ideen-list im
         Split-View einen Scroll-Container darstellt (max-height + overflow-y) und
         ein lokales position:absolute-Popover dort abgeschnitten würde. -->
    <template x-teleport="body">
      <div class="context-menu" x-ref="actionMenu" x-bind="actionMenuPanel()" x-cloak>
        <template x-if="menuOpenIdee()">
          <div>
            <!-- Stufen-Leiter: jede Stufe ausser der aktuellen als Ziel. Der
                 einzige Schreibpfad der Achse (setIdeeStatus) — dieselbe
                 Methode, die im Board der Drag aufruft. -->
            <template x-for="target in statuses()" :key="target">
              <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon"
                      x-show="ideeStatus(menuOpenIdee()) !== target"
                      @click="setIdeeStatus(menuOpenIdee(), target)"
                      :disabled="busy">
                <svg class="icon" aria-hidden="true"><use :href="'/icons.svg#' + (target === 'offen' ? 'undo' : target === 'erledigt' ? 'check' : target === 'verworfen' ? 'minus' : 'play')"/></svg>
                <span x-text="$app.t('ideen.setStatus', { status: statusLabel(target) })"></span>
              </button>
            </template>
            <div class="context-menu-sep" role="separator"></div>
            <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon"
                    @click="openLinkPicker(actionMenuAnchor(), menuOpenIdee())"
                    :disabled="busy">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#external-link"/></svg>
              <span x-text="$app.t('ideen.link.add')"></span>
            </button>
            <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon"
                    @click="startEditIdee(menuOpenIdee())"
                    :disabled="busy">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#pencil"/></svg>
              <span x-text="$app.t('ideen.edit')"></span>
            </button>
            <!-- Verschieben nur, solange die Idee offen ist: eine abgeschlossene
                 Idee ist die Spur einer Entscheidung an DIESER Stelle (der
                 Server lehnt den Move ab, IDEE_CLOSED). -->
            <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon"
                    x-show="isOpenIdee(menuOpenIdee())"
                    @click="startMoveIdee(actionMenuAnchor(), menuOpenIdee())"
                    :disabled="busy">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#move-horizontal"/></svg>
              <span x-text="$app.t('ideen.move')"></span>
            </button>
            <div class="context-menu-sep" role="separator"></div>
            <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon context-menu-item--danger"
                    @click="deleteIdee(menuOpenIdee())"
                    :disabled="busy">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
              <span x-text="$app.t('ideen.delete')"></span>
            </button>
          </div>
        </template>
      </div>
    </template>

    <!-- Abgeschlossene Ideen: erledigt UND verworfen. Beide gehören unter
         denselben Strich (offen ist keins von beiden); welches davon, sagt die
         Plakette an der Zeile. Verworfen wird NICHT gelöscht — die Spur der
         Entscheidung ist der Grund, sie festzuhalten. -->
    <template x-if="!loading && abgeschlosseneIdeen().length > 0">
      <div class="ideen-section">
        <div class="card-section-title" x-text="$app.t('ideen.sectionDone')"></div>
        <template x-for="idee in abgeschlosseneIdeen()" :key="idee.id">
          <div class="idee-item idee-item--erledigt" :data-idee-id="idee.id"
               @contextmenu="if (!busy) openMenu($event, idee)" x-long-press>
            <div class="idee-status-badge" :class="'idee-status-badge--' + ideeStatus(idee)"
                 x-text="statusLabel(ideeStatus(idee))"></div>
            <div class="idee-menu">
              <button type="button"
                class="icon-btn icon-btn--ghost"
                @click="openMenu($event, idee)"
                :disabled="busy"
                :data-tip="$app.t('ideen.actions')"
                :aria-label="$app.t('ideen.actions')"
                :aria-expanded="isActionMenuOpen('idee:' + idee.id)"
                aria-haspopup="menu"><svg class="icon" aria-hidden="true"><use href="/icons.svg#more-horizontal"/></svg></button>
            </div>
            <div class="idee-content" x-text="idee.content"></div>
            <!-- @include ideen-link-chips -->
          </div>
        </template>
      </div>
    </template>
  </div>
</div>
