      <!-- Kopf & Seitenzahlen: alles zur laufenden Kopf-/Fusszeile und zur
           Seitennummerierung an einem Ort (Slots + Zählweise + Zähler-Skip).
           Geometrie steht im Format-Tab, Kapitel-Nummerierung im Kapitel-Tab. -->
      <div class="export-tab-panel" x-bind="panel('pagination')">
        <p class="card-form-field-note" x-text="$app.t('pdfExport.pagination.hint')"></p>
        <div class="card-form-grid">

          <p class="card-form-section-divider" x-text="$app.t('pdfExport.pagination.group.headerFooter')"></p>
          <p class="card-form-field-note" x-text="$app.t('pdfExport.layout.tokensHint')"></p>
          <p class="card-form-field-note" x-text="$app.t('pdfExport.layout.hfSidesHint')"></p>

          <!-- Kopf-/Fusszeile als Seiten-Raster: 3 Positionen × 2 Buchseiten.
               Recto = rechte/ungerade Seite (gilt auch für alle Seiten, wenn
               die Verso-Felder leer bleiben), Verso = linke/gerade Seite.
               Slot-Key: <zone>[Verso]<Pos> (lib/pdf-export-defaults.js). Die
               Verso-Zeile + Auszeichnung zeigt nur der Experten-Modus. -->
          <template x-for="zone in ['header', 'footer']" :key="zone">
            <div class="pdfx-hf-zone">
              <span class="pdfx-hf-zone-title" x-text="$app.t(zone === 'header' ? 'pdfExport.layout.zoneHeader' : 'pdfExport.layout.zoneFooter')"></span>
              <div class="pdfx-hf-grid">
                <span class="pdfx-hf-corner" aria-hidden="true"></span>
                <template x-for="pos in ['Left', 'Center', 'Right']" :key="pos">
                  <span class="pdfx-hf-colhead" x-text="$app.t({ Left: 'pdfExport.layout.posLeft', Center: 'pdfExport.layout.posCenter', Right: 'pdfExport.layout.posRight' }[pos])"></span>
                </template>
                <template x-for="side in ['recto', 'verso']" :key="side">
                  <div class="pdfx-hf-row" x-show="side === 'recto' || uiMode === 'expert'">
                    <span class="pdfx-hf-rowhead"><span x-text="$app.t(side === 'recto' ? 'pdfExport.layout.sideRecto' : 'pdfExport.layout.sideVerso')"></span><small x-text="$app.t(side === 'recto' ? 'pdfExport.layout.sideRectoHint' : 'pdfExport.layout.sideVersoHint')"></small></span>
                    <template x-for="pos in ['Left', 'Center', 'Right']" :key="pos">
                      <div class="pdfx-hf-cell">
                        <input class="pdfx-text-input"
                               x-model="activeProfile.config.layout[zone + (side === 'verso' ? 'Verso' : '') + pos]"
                               :placeholder="side === 'verso' ? (activeProfile.config.layout[zone + pos] || $app.t('pdfExport.layout.sameAsRecto')) : ''"
                               :aria-label="$app.t('pdfExport.layout.slotAria', { zone: $app.t(zone === 'header' ? 'pdfExport.layout.zoneHeader' : 'pdfExport.layout.zoneFooter'), side: $app.t(side === 'recto' ? 'pdfExport.layout.sideRecto' : 'pdfExport.layout.sideVerso'), pos: $app.t({ Left: 'pdfExport.layout.posLeft', Center: 'pdfExport.layout.posCenter', Right: 'pdfExport.layout.posRight' }[pos]) })">
                        <div class="pdfx-hf-sbtns" x-show="uiMode === 'expert'">
                          <template x-for="attr in ['bold', 'italic', 'upper']" :key="attr">
                            <button type="button" :class="'pdfx-hf-sbtn pdfx-hf-sbtn--' + attr + (hfStyleActive(zone, side, pos.toLowerCase(), attr) ? ' is-on' : '')"
                                    :aria-pressed="hfStyleActive(zone, side, pos.toLowerCase(), attr)"
                                    :aria-label="$app.t('pdfExport.style.' + attr)"
                                    :data-tip="$app.t('pdfExport.style.' + attr)"
                                    @click="toggleHfStyle(zone, side, pos.toLowerCase(), attr)"
                                    x-text="$app.t('pdfExport.style.' + attr + 'Glyph')"></button>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <div class="card-form-row" x-show="uiMode === 'expert'">
            <span class="card-form-label" aria-hidden="true">&nbsp;</span>
            <div class="card-form-field">
              <label class="pdfx-check">
                <input type="checkbox" x-model="activeProfile.config.layout.headerRule">
                <span x-text="$app.t('pdfExport.layout.headerRule')"></span>
              </label>
              <label class="pdfx-check">
                <input type="checkbox" x-model="activeProfile.config.layout.footerRule">
                <span x-text="$app.t('pdfExport.layout.footerRule')"></span>
              </label>
              <label class="pdfx-check">
                <input type="checkbox" x-model="activeProfile.config.layout.showHeaderOnChapterStart">
                <span x-text="$app.t('pdfExport.layout.showHeaderOnChapterStart')"></span>
              </label>
              <label class="pdfx-check">
                <input type="checkbox" x-model="activeProfile.config.layout.showFooterOnChapterStart">
                <span x-text="$app.t('pdfExport.layout.showFooterOnChapterStart')"></span>
              </label>
              <label class="pdfx-check">
                <input type="checkbox" x-model="activeProfile.config.layout.showHeaderOnChapterEnd">
                <span x-text="$app.t('pdfExport.layout.showHeaderOnChapterEnd')"></span>
              </label>
              <label class="pdfx-check">
                <input type="checkbox" x-model="activeProfile.config.layout.showFooterOnChapterEnd">
                <span x-text="$app.t('pdfExport.layout.showFooterOnChapterEnd')"></span>
              </label>
            </div>
          </div>

          <p class="card-form-section-divider" x-text="$app.t('pdfExport.pagination.group.numbering')"></p>
          <div x-id="['fld']" class="card-form-row">
            <label :for="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.layout.pageNumberStart')"></label>
            <div class="card-form-field">
              <input :id="$id('fld')" type="text" x-data="numInput({ integer: true, min: 1, max: 9999 })" x-modelable="value" x-model="activeProfile.config.layout.pageNumberStart" class="pdfx-num-input">
              <p class="card-form-field-note" x-text="$app.t('pdfExport.layout.pageNumberStartHint')"></p>
            </div>
          </div>
          <div x-id="['fld']" class="card-form-row" x-show="uiMode === 'expert'">
            <label :id="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.layout.pageCountMode')"></label>
            <div class="card-form-field">
              <div :aria-labelledby="$id('fld')" x-data="combobox($app.t('pdfExport.layout.pageCountMode'))"
                   x-modelable="value" x-model="activeProfile.config.layout.pageCountMode"
                   x-effect="options = [{ value: 'body', label: $app.t('pdfExport.layout.pageCountMode.body') }, { value: 'physical', label: $app.t('pdfExport.layout.pageCountMode.physical') }]"
></div>
              <p class="card-form-field-note" x-text="$app.t(activeProfile.config.layout.pageCountMode === 'physical' ? 'pdfExport.layout.pageCountModeHintPhysical' : 'pdfExport.layout.pageCountModeHintBody')"></p>
            </div>
          </div>
          <div x-id="['fld']" class="card-form-row" x-show="uiMode === 'expert'">
            <label :for="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.layout.pageNumberFirstVisible')"></label>
            <div class="card-form-field">
              <input :id="$id('fld')" type="text" x-data="numInput({ integer: true, min: 1, max: 9999 })" x-modelable="value" x-model="activeProfile.config.layout.pageNumberFirstVisible" class="pdfx-num-input">
              <p class="card-form-field-note" x-text="$app.t(activeProfile.config.layout.pageCountMode === 'physical' ? 'pdfExport.layout.pageNumberFirstVisibleHintCounted' : 'pdfExport.layout.pageNumberFirstVisibleHint')"></p>
            </div>
          </div>
          <div x-id="['fld']" class="card-form-row" x-show="uiMode === 'expert'">
            <label :id="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.layout.frontMatterNumbering')"></label>
            <div class="card-form-field">
              <div :aria-labelledby="$id('fld')" x-data="combobox($app.t('pdfExport.layout.frontMatterNumbering'))"
                   x-modelable="value" x-model="activeProfile.config.layout.frontMatterNumbering"
                   x-effect="options = [{ value: 'none', label: $app.t('pdfExport.layout.frontMatterNum.none') }, { value: 'roman', label: 'i, ii, iii' }, { value: 'arabic', label: '1, 2, 3' }]"
></div>
              <p class="card-form-field-note" x-text="$app.t('pdfExport.layout.frontMatterNumberingHint')"></p>
            </div>
          </div>
          <div x-id="['fld']" class="card-form-row" x-show="uiMode === 'expert' && activeProfile.config.layout.frontMatterNumbering !== 'none'" x-cloak>
            <label :for="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.layout.frontMatterNumberFirstVisible')"></label>
            <div class="card-form-field">
              <input :id="$id('fld')" type="text" x-data="numInput({ integer: true, min: 1, max: 9999 })" x-modelable="value" x-model="activeProfile.config.layout.frontMatterNumberFirstVisible" class="pdfx-num-input">
              <p class="card-form-field-note" x-text="$app.t('pdfExport.layout.frontMatterNumberFirstVisibleHint')"></p>
            </div>
          </div>

          <p class="card-form-section-divider" x-show="uiMode === 'expert'" x-text="$app.t('pdfExport.pagination.group.skip')"></p>
          <div x-id="['fld']" class="card-form-row card-form-row--top" x-show="uiMode === 'expert'">
            <label :id="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.chapter.skipPageCounterChapters')"></label>
            <div class="card-form-field">
              <div :aria-labelledby="$id('fld')" x-data="combobox({ placeholder: $app.t('pdfExport.chapter.skipPageCounterPick'), multiple: true })"
                   x-modelable="value" x-model="activeProfile.config.chapter.skipPageCounterChapterIds"
                   x-effect="options = skipPageCounterChapterPickOptions()"></div>
              <div class="export-chip-row" x-show="skipPageCounterChapterChips().length">
                <template x-for="chip in skipPageCounterChapterChips()" :key="chip.id">
                  <span class="export-chip">
                    <span x-text="chip.label"></span>
                    <button type="button" class="export-chip-remove"
                            :aria-label="$app.t('common.remove')"
                            @click="removeSkipPageCounterChapter(chip.id)"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
                  </span>
                </template>
              </div>
              <p class="card-form-field-note" x-text="$app.t('pdfExport.chapter.skipPageCounterChaptersHint')"></p>
            </div>
          </div>
          <div x-id="['fld']" class="card-form-row card-form-row--top" x-show="uiMode === 'expert'">
            <label :id="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.chapter.skipPageCounterPages')"></label>
            <div class="card-form-field">
              <div :aria-labelledby="$id('fld')" x-data="combobox({ placeholder: $app.t('pdfExport.chapter.skipPageCounterPagePick'), multiple: true })"
                   x-modelable="value" x-model="activeProfile.config.chapter.skipPageCounterPageIds"
                   x-effect="options = skipPageCounterPagePickOptions()"></div>
              <div class="export-chip-row" x-show="skipPageCounterPageChips().length">
                <template x-for="chip in skipPageCounterPageChips()" :key="chip.id">
                  <span class="export-chip">
                    <span x-text="chip.label"></span>
                    <button type="button" class="export-chip-remove"
                            :aria-label="$app.t('common.remove')"
                            @click="removeSkipPageCounterPage(chip.id)"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
                  </span>
                </template>
              </div>
              <p class="card-form-field-note" x-text="$app.t('pdfExport.chapter.skipPageCounterPagesHint')"></p>
            </div>
          </div>
        </div>
      </div>
