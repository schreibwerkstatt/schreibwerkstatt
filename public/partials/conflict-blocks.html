<!-- Konflikt-Auflösung beim Block-Level-Merge: der Dialog-Inhalt, geteilt von
     Notebook/Focus (partials/conflict-resolution.html, Root-Scope) und Bucheditor
     (partials/book-editor-conflict.html, Karten-Scope). Beide Hosts liefern
     `conflictResolution` und die Schnittstelle `conflictUi*` (Notebook:
     editor/notebook/trampoline.js, Bucheditor: cards/book-editor/conflict.js) —
     hier steht nur Markup, keine host-eigenen Namen. Previews via x-text
     (escaped), Wort-Markierung aus diff/diff-parts.js (`part.c`), kein x-html-Sink. -->
<div class="conflict-modal">
  <header class="conflict-modal__head">
    <svg class="icon" aria-hidden="true"><use href="/icons.svg#alert-triangle"/></svg>
    <h2 class="conflict-modal__title" x-text="conflictUiText('resolveTitle')"></h2>
  </header>
  <p class="conflict-modal__hint" x-text="$app.t('edit.conflict.resolve.hint')"></p>

  <div class="conflict-modal__bulk">
    <button type="button" @click="conflictUiPickAll('local')"
            x-text="$app.t('edit.conflict.bulk.takeAllLocal')"></button>
    <button type="button" @click="conflictUiPickAll('remote')"
            x-text="conflictUiText('resolveAllRemote')"></button>
  </div>

  <!-- Je Stelle zwei Karten nebeneinander; die Karte IST die Wahl (aria-pressed).
       Nur der Klartext-Span trägt `pre-wrap` — am Container rendert sonst der
       Template-Whitespace als Einzug mit. -->
  <ul class="conflict-block-list">
    <template x-for="c in (conflictResolution?.conflicts || [])" :key="c.bid">
      <li class="conflict-block">
        <p class="conflict-block__note" x-show="c.view.formatOnly"
           x-text="$app.t('edit.conflict.block.formatOnly')"></p>
        <div class="conflict-block__previews">
          <template x-for="side in ['local', 'remote']" :key="side">
            <button type="button" class="conflict-block__preview"
                    :class="{ 'is-active': ['both', side].includes(conflictUiChoice(c.bid)) }"
                    :aria-pressed="['both', side].includes(conflictUiChoice(c.bid)) ? 'true' : 'false'"
                    @click="conflictUiPick(c.bid, side)">
              <span class="conflict-block__label"
                    x-text="side === 'local' ? $app.t('edit.conflict.block.takeLocal') : conflictUiText('resolveRemote')"></span>
              <span class="conflict-block__text">
                <template x-if="c.view[side]">
                  <span class="conflict-block__body"><template x-for="(part, pi) in c.view[side]" :key="pi"><span :class="part.c" x-text="part.v"></span></template></span>
                </template>
                <template x-if="!c.view[side]">
                  <em class="conflict-block__deleted" x-text="side === 'local' ? $app.t('edit.conflict.block.deletedLocal') : conflictUiText('resolveDeletedRemote')"></em>
                </template>
              </span>
            </button>
          </template>
        </div>
        <div class="conflict-block__extra">
          <button type="button" class="conflict-block__both"
                  :class="{ 'is-active': conflictUiChoice(c.bid) === 'both' }"
                  :aria-pressed="conflictUiChoice(c.bid) === 'both' ? 'true' : 'false'"
                  @click="conflictUiPick(c.bid, conflictUiChoice(c.bid) === 'both' ? 'local' : 'both')"
                  x-text="$app.t('edit.conflict.block.takeBoth')"></button>
        </div>
      </li>
    </template>
  </ul>

  <footer class="conflict-modal__actions">
    <button type="button" @click="conflictUiCancel()"
            x-text="$app.t('edit.conflict.cancel')"></button>
    <button type="button" class="primary" @click="conflictUiSubmit()" :disabled="conflictUiBusy()"
            x-text="$app.t('edit.conflict.apply')"></button>
  </footer>
</div>
