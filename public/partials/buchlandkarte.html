<!-- Buchlandkarte: Semantik-Index als Landkarte und als Doppelungs-Radar -->
<!--
  Tab-Hülle ohne eigenen State. `showBuchlandkarteCard`, `toggleBuchlandkarteCard`
  und `buchlandkarteTab` ('map' | 'redundanz') liegen im Root: Exklusivität,
  Hash-Router (#landkarte / #redundanz) und Job-Sprung setzen den Tab von aussen.
  Jedes Panel ist eine eigene Alpine.data-Sub-Komponente mit eigenem Lifecycle.
-->
<div class="card card--buchlandkarte" x-show="$app.showBuchlandkarteCard" x-cloak>
  <div class="card-header">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('buchlandkarte.title')"></span>
    </div>
    <div class="card-actions">
      <div class="tabs" role="tablist">
        <button type="button" class="tabs-btn" role="tab" id="buchlandkarte-tab-map"
                aria-controls="buchlandkarte-panel-map"
                :class="{ 'tabs-btn--active': $app.buchlandkarteTab === 'map' }"
                :aria-selected="$app.buchlandkarteTab === 'map' ? 'true' : 'false'"
                @click="$app.buchlandkarteTab = 'map'"
                x-text="$app.t('buchlandkarte.tab.map')"></button>
        <button type="button" class="tabs-btn" role="tab" id="buchlandkarte-tab-redundanz"
                aria-controls="buchlandkarte-panel-redundanz"
                :class="{ 'tabs-btn--active': $app.buchlandkarteTab === 'redundanz' }"
                :aria-selected="$app.buchlandkarteTab === 'redundanz' ? 'true' : 'false'"
                @click="$app.buchlandkarteTab = 'redundanz'"
                x-text="$app.t('buchlandkarte.tab.redundanz')"></button>
      </div>
    </div>
  </div>

  <!-- @include buchlandkarte-map -->
  <!-- @include buchlandkarte-redundanz -->
</div>
