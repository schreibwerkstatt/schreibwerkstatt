    <div class="card-form-grid" x-bind="panel('danger')" x-cloak>

    <div class="danger-zone">
      <div class="danger-zone-title">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#alert-triangle"/></svg>
        <span x-text="$app.t('book.settings.dangerZone')"></span>
      </div>

      <div class="danger-zone-section">
        <div class="danger-zone-row">
          <div class="danger-zone-text" x-text="$app.t('book.settings.dangerText')"></div>
          <div class="danger-zone-actions">
            <button type="button"
              class="danger-zone-btn"
              @click="resetBookHistory()"
              :disabled="bookHistoryResetLoading || !$store.nav.selectedBookId">
              <span x-show="bookHistoryResetLoading" class="spinner"></span>
              <span x-text="bookHistoryResetLoading ? $app.t('common.deleting') : $app.t('book.settings.dangerButton')"></span>
            </button>
          </div>
        </div>
        <p class="card-form-saved" x-show="bookHistoryResetMessage" x-cloak x-transition.opacity.duration.250ms x-text="bookHistoryResetMessage"></p>
        <p class="card-form-error" x-show="bookHistoryResetError" x-text="bookHistoryResetError"></p>
      </div>

      <div class="danger-zone-section">
        <div class="danger-zone-row">
          <div class="danger-zone-text" x-text="$app.t('book.settings.staleCleanupText')"></div>
          <div class="danger-zone-actions">
            <button type="button"
              class="danger-zone-btn"
              @click="deleteStaleEntities()"
              :disabled="staleCleanupLoading || !$store.nav.selectedBookId">
              <span x-show="staleCleanupLoading" class="spinner"></span>
              <span x-text="staleCleanupLoading ? $app.t('common.deleting') : $app.t('book.settings.staleCleanupButton')"></span>
            </button>
          </div>
        </div>
        <p class="card-form-saved" x-show="staleCleanupMessage" x-cloak x-transition.opacity.duration.250ms x-text="staleCleanupMessage"></p>
        <p class="card-form-error" x-show="staleCleanupError" x-text="staleCleanupError"></p>
      </div>

      <!-- Gegenstück zum Aufräumen: verwaisten Eintrag in einen bestehenden
           überführen, statt seine Verknüpfungen mit ihm zu verlieren. -->
      <!-- @include book-settings-merge -->

      <div class="danger-zone-section">
        <div class="danger-zone-row">
          <div class="danger-zone-text" x-text="$app.t('book.settings.deleteBookText')"></div>
          <div class="danger-zone-actions">
            <button type="button"
              class="danger-zone-btn"
              @click="deleteBook()"
              :disabled="bookDeleteLoading || !$store.nav.selectedBookId">
              <span x-show="bookDeleteLoading" class="spinner"></span>
              <span x-text="bookDeleteLoading ? $app.t('common.deleting') : $app.t('book.settings.deleteBookButton')"></span>
            </button>
          </div>
        </div>
        <p class="card-form-error" x-show="bookDeleteError" x-text="bookDeleteError"></p>
      </div>
    </div>

    </div><!-- /tab: danger -->
