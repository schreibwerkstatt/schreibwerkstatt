<!-- Plot-Werkstatt: KI-Konsistenz-Fortschritt + -Ergebnis + persistierte Lauf-
     Historien (Konsistenz + Brainstorm). Nested-Partial von plot.html (File-Limit),
     via _loadPartials in den plotCard-Scope injiziert. Run-Buttons sitzen im
     Card-Header; Beat-Verankerung ebenfalls (eigenes Badge pro Beat). -->
<!-- Consistency unterhalb des Boards: Fortschritt + KI-Ergebnis, gefolgt von der
     Prüfungs-Historie ganz unten. -->
<div x-show="consistencyLoading" class="plot-job-bar">
  <div class="progress-bar-wrap" x-show="consistencyProgress > 0">
    <div class="progress-bar" :style="{ '--progress': consistencyProgress + '%' }"></div>
  </div>
  <div class="plot-job-bar-row">
    <span class="card-status" x-show="consistencyStatus" x-html="consistencyStatus"></span>
    <button type="button" class="btn-compact btn-compact--ghost" @click="cancelConsistency()" x-text="$app.t('plot.consistency.cancel')"></button>
  </div>
</div>

<!-- Zeit-Messung: deterministische Befunde (GET /plot/time-check), getrennt vom
     KI-Urteil darunter. Nur sichtbar, wenn es etwas zu melden gibt — ein Beat
     ohne Zeitangabe ist ungeprüft, kein Mangel. -->
<div x-show="timeChecks.length > 0" class="plot-consistency-panel" x-cloak>
  <div class="plot-consistency-head">
    <span class="bewertung-section-title" x-text="$app.t('plot.timeCheck.title')"></span>
  </div>
  <p class="card-hint" x-text="$app.t('plot.timeCheck.hint')"></p>
  <div class="plot-konflikt-list">
    <template x-for="(f, idx) in timeChecks" :key="f.code + ':' + f.beat_id + ':' + idx">
      <div class="plot-konflikt internal-link" @click="gotoKonfliktBeat(f)"
           :data-tip="$app.t('plot.consistency.gotoBeat')">
        <div class="plot-konflikt-head">
          <span class="severity-tag" :class="timeCheckSeverityClass(f)" x-text="$app.t('plot.severity.' + f.schwere)"></span>
          <span class="plot-konflikt-beat" x-text="f.beat"></span>
          <span class="plot-konflikt-problem" x-text="timeCheckText(f)"></span>
        </div>
      </div>
    </template>
  </div>
</div>

<div x-show="consistencyResult" class="plot-consistency-panel" x-cloak>
  <div class="plot-consistency-head">
    <span class="bewertung-section-title" x-text="$app.t('plot.consistency.title')"></span>
    <button type="button" class="icon-btn icon-btn--ghost plot-icon-btn" @click="dismissConsistency()" :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg>
    </button>
  </div>
  <p class="plot-consistency-fazit" x-show="consistencyResult && consistencyResult.fazit" x-text="consistencyResult && consistencyResult.fazit"></p>
  <div x-show="consistencyResult && !consistencyResult.konflikte.length" class="card-status" x-text="$app.t('plot.consistency.noFindings')"></div>
  <!-- Typ-Filter (Befund-Typ aus dem Job, book/plot/konflikt-actions.js). Erst ab
       zwei verschiedenen Typen sinnvoll; Alt-Läufe ohne `typ` blenden ihn aus. -->
  <div class="plot-konflikt-filter" x-show="konfliktTypOptions().length > 1">
    <div x-data="combobox({ placeholder: $app.t('plot.konflikt.typFilter'), emptyLabel: $app.t('plot.konflikt.typAll') })"
         x-modelable="value" x-model="konfliktTypFilter"
         x-effect="consistencyResult; options = konfliktTypOptions()"></div>
  </div>
  <div class="plot-konflikt-list">
    <template x-for="(k, idx) in (consistencyResult ? consistencyResult.konflikte : [])" :key="idx">
      <div class="plot-konflikt internal-link" x-show="konfliktVisible(k)"
           :class="{ 'plot-konflikt--open': selectedKonfliktIdx === idx }"
           :aria-expanded="selectedKonfliktIdx === idx"
           @click="selectedKonfliktIdx = selectedKonfliktIdx === idx ? null : idx">
        <div class="plot-konflikt-head">
          <span class="severity-tag" :class="befundSeverityClass(k.schwere)" x-text="$app.t('plot.severity.' + k.schwere)"></span>
          <span class="tag plot-konflikt-typ" x-show="konfliktHasTyp(k)" x-text="konfliktHasTyp(k) ? konfliktTypLabel(k.typ) : ''"></span>
          <span class="badge badge-warn" x-show="k.seit_letztem_lauf === 'neu'"
                :data-tip="$app.t('plot.konflikt.neuTip')" x-text="$app.t('plot.konflikt.neu')"></span>
          <!-- Betroffener Beat: Klick scrollt ihn im Board ins Bild (beat_id, sonst
               Titel-Match — gotoKonfliktBeat). Übergreifende Befunde („—") haben kein Ziel. -->
          <template x-if="k.beat && k.beat !== '—'">
            <button type="button" class="entity-ref"
                    x-entity-ref="{ type: 'beat', id: k.beat_id, label: k.beat, onOpen: () => gotoKonfliktBeat(k) }"></button>
          </template>
          <span class="plot-konflikt-beat" x-show="!k.beat || k.beat === '—'" x-text="k.beat"></span>
          <span class="plot-konflikt-problem" x-text="k.problem"></span>
          <!-- Textbeleg-Fundstelle (aus dem Verankerungs-Index, server-seitig am
               Befund gematcht) → springt an die belegende Manuskript-Seite. -->
          <template x-if="k.fundstelle && k.fundstelle.page_id">
            <button type="button" class="entity-ref"
                    x-entity-ref="{ type: 'seite', id: k.fundstelle.page_id, name: k.fundstelle.page_name }"></button>
          </template>
          <!-- Ein-Klick-Aktion des Befunds (Status / verwerfen / Beziehung) über die
               bestehenden Mutationspfade inkl. Undo. Verschwindet, sobald sie
               erfüllt ist oder der Beat fehlt; danach „angewendet". -->
          <button type="button" class="btn-compact plot-konflikt-action"
                  x-show="konfliktActionPending(k, idx)" :disabled="busy"
                  @click.stop="applyKonfliktAction(k, idx)"
                  x-text="konfliktActionLabel(k)"></button>
          <span class="badge badge-ok" x-show="konfliktApplied(idx)" x-text="$app.t('plot.konflikt.applied')"></span>
          <span class="history-chevron" :class="{ open: selectedKonfliktIdx === idx }" aria-hidden="true"></span>
        </div>
        <div x-show="selectedKonfliktIdx === idx && k.vorschlag" class="plot-konflikt-vorschlag" x-cloak>
          <span class="entity-meta-label" x-text="$app.t('plot.consistency.suggestion')"></span>
          <span x-text="k.vorschlag"></span>
        </div>
      </div>
    </template>
  </div>
  <!-- Seit dem letzten Lauf erledigte Befunde (result.erledigt, optional). -->
  <div class="plot-konflikt-erledigt" x-show="konfliktErledigt().length" x-data="collapsible(false)">
    <button type="button" class="collapsible-toggle" x-bind="trigger">
      <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
      <span x-text="$app.t('plot.konflikt.erledigt', { n: konfliktErledigt().length })"></span>
    </button>
    <ul class="plot-konflikt-erledigt-list" x-bind="panel" x-cloak>
      <template x-for="(e, i) in konfliktErledigt()" :key="i">
        <li x-text="e"></li>
      </template>
    </ul>
  </div>
</div>

<!-- Konsistenz-Prüfungs-Historie: persistierte Läufe pro Buch. Klick lädt das
     Result oberhalb ins Consistency-Panel (selectedRunId). Wie Werkstatt-Run-Verlauf. -->
<div class="history-bar" x-show="consistencyRuns.length > 0" x-cloak>
  <div class="history-heading" x-text="$app.t('plot.consistency.runs', { count: consistencyRuns.length })"></div>
  <template x-for="r in consistencyRuns" :key="r.id">
    <div class="history-item hover-reveal-host" :class="{ 'history-item--open': selectedRunId === r.id }"
         @click="openConsistencyRun(r.id)">
      <span class="history-date" x-text="formatRunDate(r.created_at)"></span>
      <span class="tag" x-text="$app.t('plot.consistency.konfliktCount', { n: r.konflikt_count })"></span>
      <span x-show="r.model" class="tag" x-text="r.model"></span>
      <span class="history-chevron" :class="{ open: selectedRunId === r.id }" aria-hidden="true"></span>
      <button type="button" class="history-item-delete hover-reveal"
              @click.stop="deleteConsistencyRun(r.id)"
              :data-tip="$app.t('common.deleteEntry')"
              :aria-label="$app.t('common.deleteEntry')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg></button>
    </div>
  </template>
</div>

<!-- Brainstorm-Lauf-Historie: persistierte Läufe pro Buch (zusätzlich pro Akt/
     Strang). Klick lädt die Vorschläge zurück ins Inline-Panel des Akts/der Zelle
     (selectedBrainstormRunId). Läufe mit gelöschtem Akt sind nicht reaktivierbar. -->
<div class="history-bar" x-show="brainstormRuns.length > 0" x-cloak>
  <div class="history-heading" x-text="$app.t('plot.brainstorm.runs', { count: brainstormRuns.length })"></div>
  <template x-for="r in brainstormRuns" :key="r.id">
    <!-- Lauf eines archivierten Akts: kein Panel im Archiv → Hinweis statt
         stillem Nichts (openBrainstormRunChecked, board-ui.js). -->
    <div class="history-item hover-reveal-host" :class="{ 'history-item--open': selectedBrainstormRunId === r.id, 'history-item--disabled': r.act_id === null || brainstormRunActArchived(r) }"
         :data-tip="brainstormRunActArchived(r) ? $app.t('plot.brainstorm.actArchived') : null"
         @click="r.act_id !== null && openBrainstormRunChecked(r)">
      <span class="history-date" x-text="formatRunDate(r.created_at)"></span>
      <span class="tag" x-text="r.act_name || $app.t('plot.brainstorm.actDeleted')"></span>
      <template x-if="r.thread_id && r.thread_name">
        <span class="entity-ref" x-entity-ref="{ type: 'strang', id: r.thread_id, label: r.thread_name, static: true }"></span>
      </template>
      <span class="tag" x-text="$app.t('plot.brainstorm.vorschlagCount', { n: r.vorschlag_count })"></span>
      <span x-show="r.model" class="tag" x-text="r.model"></span>
      <span class="history-chevron" :class="{ open: selectedBrainstormRunId === r.id }" aria-hidden="true" x-show="r.act_id !== null"></span>
      <button type="button" class="history-item-delete hover-reveal"
              @click.stop="deleteBrainstormRun(r.id)"
              :data-tip="$app.t('common.deleteEntry')"
              :aria-label="$app.t('common.deleteEntry')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg></button>
    </div>
  </template>
</div>
