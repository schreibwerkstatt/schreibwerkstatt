<!-- Wendungen der Wortschatz-Analyse. Fragment von wortschatz.html (String-Include
     `<!-- @include wortschatz-phrases -->`) — Begründung siehe wortschatz-terms.html. -->
<template x-if="wortschatzTab === 'phrases'">
<div role="tabpanel">
  <p class="wortschatz-list-hint" x-text="$app.t('wortschatz.phrases.hint')"></p>
  <div x-show="!wortschatzNgrams.length" class="muted-msg muted-msg--spaced" x-text="$app.t('wortschatz.phrases.empty')"></div>
  <div class="table-scroll" x-show="wortschatzNgrams.length">
    <table class="wortschatz-table"
           x-data="sortableTable({
             rows: () => wortschatzNgrams,
             defaultKey: 'count',
             defaultDir: 'desc',
             persistKey: 'wortschatz.phrases',
             types: { count: 'number', n: 'number', chapter_spread: 'number', log_dice: 'number', phrase: 'string' },
           })">
      <thead><tr>
        <th x-bind="sortTh('phrase')" x-text="$app.t('wortschatz.col.phrase')"></th>
        <th x-bind="sortTh('n')" x-text="$app.t('wortschatz.col.n')"></th>
        <th x-bind="sortTh('count')" x-text="$app.t('wortschatz.col.count')"></th>
        <th x-bind="sortTh('chapter_spread')" x-text="$app.t('wortschatz.col.spread')"></th>
        <th x-bind="sortTh('log_dice')" x-text="$app.t('wortschatz.col.logDice')"></th>
        <th x-text="$app.t('wortschatz.col.firstPage')"></th>
      </tr></thead>
      <tbody>
        <template x-for="p in sorted" :key="p.phrase">
          <tr>
            <td class="wortschatz-phrase" x-text="p.phrase"></td>
            <td class="wortschatz-num" x-text="wsNum(p.n)"></td>
            <td class="wortschatz-num" x-text="wsNum(p.count)"></td>
            <td class="wortschatz-num" x-text="wsNum(p.chapter_spread)"></td>
            <td class="wortschatz-num" x-text="wsNum(p.log_dice, 2)"></td>
            <td>
              <button type="button" class="entity-ref" x-show="p.first_page_id"
                      x-entity-ref="{ type: 'seite', id: p.first_page_id, label: p.first_page_name || undefined }"></button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
</template>
