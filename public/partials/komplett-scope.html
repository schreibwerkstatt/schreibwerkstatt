<!-- Lauf-Umfang der Komplettanalyse: fragt vor jedem Lauf, welche Schritte neu
     berechnet werden. Ersetzt die frühere Ja/Nein-Bestätigung — es ist dieselbe
     Frage, nur genauer beantwortbar. Der Kern steht als ausgegraute Zeile mit drin,
     damit die Liste ein Inventar dessen ist, was der Job überhaupt tut, statt nur
     einer Liste von Schaltern. Katalog-SSoT: public/js/komplett-scope.js. -->
<dialog class="komplett-scope-dialog"
        x-data="modal()" x-modelable="open" x-model="komplettScopeOpen">
  <div class="komplett-scope-head">
    <span class="komplett-scope-title" x-text="t('komplett.scope.title')"></span>
    <button type="button" class="komplett-scope-close" @click="close()"
            :data-tip="t('common.close')" :aria-label="t('common.close')">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg>
    </button>
  </div>
  <p class="card-hint komplett-scope-hint" x-text="t('komplett.scope.hint')"></p>

  <!-- Indikation «Lohnt sich ein Lauf?»: Änderungen seit dem letzten erfolgreichen
       Lauf, ohne KI-Call berechnet (routes/jobs/komplett/delta.js). Nur Hinweis —
       der Start bleibt immer möglich. -->
  <section class="komplett-delta" :class="komplettDeltaLevel() && 'komplett-delta--' + komplettDeltaLevel()"
           x-show="komplettDeltaState !== 'idle'" aria-live="polite">
    <p class="card-hint komplett-delta-muted" x-show="komplettDeltaState === 'loading'" x-text="t('komplett.delta.loading')"></p>
    <p class="card-hint komplett-delta-muted" x-show="komplettDeltaState === 'error'" x-text="t('komplett.delta.error')"></p>
    <template x-if="komplettDeltaState === 'ready' && komplettDelta">
      <div class="komplett-delta-body">
        <div class="komplett-delta-head">
          <span class="komplett-delta-dot" aria-hidden="true"></span>
          <span class="komplett-delta-verdict" x-text="t('komplett.delta.level.' + komplettDeltaLevel())"></span>
        </div>
        <p class="card-hint" x-show="komplettDeltaLevel() === 'never'" x-text="t('komplett.delta.neverHint')"></p>
        <p class="komplett-delta-line" x-show="komplettDelta.lastRun" x-text="komplettDeltaLastRunText()"></p>
        <p class="komplett-delta-line" x-show="komplettDelta.changedChars > 0" x-text="komplettDeltaChangedText()"></p>
        <p class="komplett-delta-line" x-show="komplettDelta.newPages > 0 || komplettDelta.deletedPages > 0"
           x-text="t('komplett.delta.pagesNewDeleted', { neu: komplettDelta.newPages, del: komplettDelta.deletedPages })"></p>
        <div class="komplett-delta-list" x-show="komplettDelta.topChapters?.some(c => c.id)">
          <span class="komplett-delta-label" x-text="t('komplett.delta.chapters')"></span>
          <template x-for="c in (komplettDelta.topChapters || []).filter(c => c.id)" :key="c.id">
            <button type="button" class="entity-ref" x-entity-ref="{ type: 'kapitel', id: c.id, static: true }"></button>
          </template>
        </div>
        <div class="komplett-delta-list" x-show="komplettDelta.novelNames?.length">
          <span class="komplett-delta-label" x-text="t('komplett.delta.names')"></span>
          <template x-for="n in (komplettDelta.novelNames || [])" :key="n.name">
            <span class="komplett-delta-term" x-text="n.name + ' ×' + n.count"></span>
          </template>
        </div>
        <div class="komplett-delta-list" x-show="komplettDelta.affectedFigures?.count">
          <span class="komplett-delta-label" x-text="t('komplett.delta.figures')"></span>
          <template x-for="f in (komplettDelta.affectedFigures?.list || [])" :key="f.id">
            <button type="button" class="entity-ref" x-entity-ref="{ type: 'figur', id: f.id, name: f.name, static: true }"></button>
          </template>
          <span class="komplett-delta-muted" x-show="komplettDelta.affectedFigures.count > komplettDelta.affectedFigures.list.length"
                x-text="'+' + (komplettDelta.affectedFigures.count - komplettDelta.affectedFigures.list.length)"></span>
        </div>
        <p class="card-hint" x-show="komplettDelta.approx" x-text="t('komplett.delta.approx')"></p>
        <p class="card-hint" x-show="komplettDeltaLevel() === 'optional' || komplettDeltaLevel() === 'low'"
           x-text="t('komplett.delta.tipKatalog')"></p>
      </div>
    </template>
  </section>

  <div class="komplett-scope-body">
    <!-- Kern: keine Schalter. Ein Schritt, den man nicht abwählen kann, braucht
         keinen Schalter, der so tut, als ginge es. -->
    <div class="komplett-scope-group">
      <div class="card-section-title" x-text="t('komplett.scope.groupCore')"></div>
      <ul class="komplett-scope-core">
        <template x-for="key in komplettCoreSteps()" :key="key">
          <li class="komplett-scope-core-item">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#check"/></svg>
            <span x-text="t('komplett.step.' + key)"></span>
          </li>
        </template>
      </ul>
      <p class="card-hint" x-text="t('komplett.scope.coreHint')"></p>
    </div>

    <div class="komplett-scope-group">
      <div class="card-section-title" x-text="t('komplett.scope.groupKatalog')"></div>
      <template x-for="step in komplettScopeSteps('katalog')" :key="step.key">
        <div class="komplett-scope-step">
          <div x-data="toggleSwitch({ label: () => $app.t('komplett.step.' + step.key) })"
               x-modelable="value" x-model="komplettScope[step.key]"></div>
          <p class="card-hint" x-text="t('komplett.stepHint.' + step.key)"></p>
        </div>
      </template>
    </div>

    <div class="komplett-scope-group" x-show="komplettScopeSteps('pruefung').length">
      <div class="card-section-title" x-text="t('komplett.scope.groupPruefung')"></div>
      <template x-for="step in komplettScopeSteps('pruefung')" :key="step.key">
        <div class="komplett-scope-step">
          <div x-data="toggleSwitch({ label: () => $app.t('komplett.step.' + step.key) })"
               x-modelable="value" x-model="komplettScope[step.key]"></div>
          <p class="card-hint" x-text="t('komplett.stepHint.' + step.key)"></p>
        </div>
      </template>
    </div>

    <div class="komplett-scope-group komplett-scope-group--force">
      <div class="card-section-title" x-text="t('komplett.scope.groupSource')"></div>
      <div class="komplett-scope-step">
        <div x-data="toggleSwitch({ label: () => $app.t('komplett.scope.force') })"
             x-modelable="value" x-model="komplettScopeForce"></div>
        <p class="card-hint" x-text="t('komplett.scope.forceHint')"></p>
      </div>
    </div>
  </div>

  <div class="komplett-scope-actions">
    <div class="komplett-scope-presets">
      <button type="button" class="confirm-dialog-btn" @click="setKomplettScopePreset('all')"
              x-text="t('komplett.scope.presetAll')"></button>
      <button type="button" class="confirm-dialog-btn" @click="setKomplettScopePreset('katalog')"
              x-text="t('komplett.scope.presetKatalog')"></button>
    </div>
    <div class="komplett-scope-confirm">
      <button type="button" class="confirm-dialog-btn" @click="close()" x-text="t('common.cancel')"></button>
      <button type="button" class="confirm-dialog-btn confirm-dialog-btn--primary"
              @click="startKomplettRun()"
              :disabled="komplettScopeLoading || komplettScopeCount().on === 0"
              x-text="komplettScopeIsFull()
                ? t('komplett.scope.startAll')
                : t('komplett.scope.startPartial', { on: komplettScopeCount().on, total: komplettScopeCount().total })"></button>
    </div>
  </div>
</dialog>
