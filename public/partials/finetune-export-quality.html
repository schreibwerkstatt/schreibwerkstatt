<!-- @expects ex -->
<!-- Fine-Tuning-Export: Qualität eines gespeicherten Sets (stats.quality aus
     finalize.js) — Anteil Schreibaufgaben, eigene Antworten, Überlappung
     Val ↔ Train, Aufgabentypen und häufigste Antworten. Fragment (@include)
     im Verlauf von finetune-export-result.html; erwartet `ex` aus dem
     umschliessenden x-for. -->
<template x-if="ex.stats.quality">
  <div class="form-section">
    <div class="card-section-title" x-text="$app.t('finetune.quality.title')"></div>
    <div class="form-stats">
      <span class="tok-badge tok-neutral" x-text="$app.t('finetune.quality.writingShare', { pct: finetunePct(ex.stats.quality.writingShare) })"></span>
      <span class="tok-badge tok-neutral" x-text="$app.t('finetune.quality.uniqueShare', { pct: finetunePct(ex.stats.quality.uniqueAnswerShare) })"></span>
      <span class="tok-badge tok-neutral" x-show="ex.stats.quality.answerTokens > 0" x-text="$app.t('finetune.quality.tokenShares', finetuneTokenShares(ex.stats))"></span>
      <span class="tok-badge tok-neutral" x-show="ex.stats.quality.answerTokens > 0" x-text="$app.t('finetune.quality.verbatimShare', { pct: finetunePct(ex.stats.quality.verbatimTokenShare) })"></span>
      <span class="tok-badge tok-neutral" x-show="ex.stats.coreFactCoverage != null" x-text="$app.t('finetune.quality.coverage', { pct: finetunePct(ex.stats.coreFactCoverage) })"></span>
      <span class="tok-badge tok-neutral" x-show="ex.stats.paragraphTargetMax > 0" x-text="$app.t('finetune.quality.paragraphMax', { n: ex.stats.paragraphTargetMax })"></span>
      <span class="tok-badge tok-neutral" x-show="ex.stats.quality.refusalShare > 0" x-text="$app.t('finetune.quality.refusals', { pct: finetunePct(ex.stats.quality.refusalShare) })"></span>
      <span class="tok-badge tok-neutral" x-show="ex.stats.quality.factCount > 0" x-text="$app.t('finetune.quality.paraphrases', { facts: ex.stats.quality.factCount, n: ex.stats.quality.factParaphraseCount })"></span>
      <span class="tok-badge" :class="finetuneOverlapTotal(ex.stats) ? 'tok-high' : 'tok-neutral'"
            x-text="$app.t('finetune.quality.overlap', ex.stats.quality.overlap)"></span>
      <span class="tok-badge tok-neutral" x-show="ex.stats.answerCapped > 0" x-text="$app.tn('finetune.stats.answerCapped', ex.stats.answerCapped)"></span>
      <span class="tok-badge tok-med" x-show="ex.stats.critiqueDropped > 0" x-text="$app.tn('finetune.stats.critiqueDropped', ex.stats.critiqueDropped)"></span>
      <span class="tok-badge tok-neutral" x-show="ex.stats.paragraphCapped > 0" x-text="$app.tn('finetune.stats.paragraphCapped', ex.stats.paragraphCapped)"></span>
      <span class="tok-badge tok-neutral" x-show="ex.stats.lengthClipped > 0" x-text="$app.tn('finetune.stats.lengthClipped', ex.stats.lengthClipped)"></span>
      <span class="tok-badge" :class="ex.stats.relationConflictsMain > 0 ? 'tok-high' : 'tok-neutral'" x-show="finetuneConflictCount(ex.stats) > 0" x-text="$app.tn('finetune.stats.relationConflicts', finetuneConflictCount(ex.stats))"></span>
      <span class="tok-badge tok-neutral" x-show="ex.stats.conflictDropped > 0" x-text="$app.tn('finetune.stats.conflictDropped', ex.stats.conflictDropped)"></span>
      <span class="tok-badge" :class="ex.stats.coreFactVariants?.min < 6 ? 'tok-med' : 'tok-neutral'" x-show="ex.stats.coreFactVariants?.min != null" x-text="$app.t('finetune.quality.coreFactVariants', ex.stats.coreFactVariants)"></span>
      <span class="tok-badge" :class="ex.stats.quality.refusalPortraitRatio < 0.3 ? 'tok-med' : 'tok-neutral'" x-show="ex.stats.quality.refusalPortraitRatio != null" x-text="$app.t('finetune.quality.portraitContrast', { n: (ex.stats.quality.refusalPortraitRatio ?? 0).toFixed(2) })"></span>
      <span class="tok-badge tok-med" x-show="ex.stats.chapterMismatches?.length > 0" x-text="$app.tn('finetune.stats.chapterMismatches', ex.stats.chapterMismatches?.length || 0)"></span>
      <span class="tok-badge tok-neutral" x-show="ex.stats.overRecommendedSeq > 0" x-text="$app.tn('finetune.stats.overRecommendedSeq', ex.stats.overRecommendedSeq)"></span>
      <span class="tok-badge tok-med" x-show="ex.stats.cardDropped > 0" x-text="$app.tn('finetune.stats.cardDropped', ex.stats.cardDropped)"></span>
      <span class="tok-badge tok-neutral" x-show="ex.stats.splitMixed > 0" x-text="$app.tn('finetune.stats.splitMixed', ex.stats.splitMixed)"></span>
      <span class="tok-badge tok-neutral" x-show="ex.stats.valPurged > 0" x-text="$app.tn('finetune.stats.valPurged', ex.stats.valPurged)"></span>
      <span class="tok-badge" :class="ex.stats.maxBlockReuse?.max > 5 ? 'tok-med' : 'tok-neutral'" x-show="ex.stats.maxBlockReuse?.max > 0" :data-tip="ex.stats.maxBlockReuse?.text" x-text="$app.t('finetune.quality.blockReuse', { n: ex.stats.maxBlockReuse?.max })"></span>
      <span class="tok-badge" :class="ex.stats.eventWhyUnique < 0.8 ? 'tok-med' : 'tok-neutral'" x-show="ex.stats.eventWhyUnique != null" x-text="$app.t('finetune.quality.whyUnique', { pct: finetunePct(ex.stats.eventWhyUnique) })"></span>
      <span class="tok-badge tok-neutral" x-show="ex.stats.blockReuseTrimmed > 0" x-text="$app.tn('finetune.stats.blockReuseTrimmed', ex.stats.blockReuseTrimmed)"></span>
      <span class="tok-badge tok-high" x-show="ex.stats.precedingAfterTarget > 0" x-text="$app.tn('finetune.stats.precedingAfterTarget', ex.stats.precedingAfterTarget)"></span>
      <span class="tok-badge tok-med" x-show="ex.stats.tierMismatch > 0" x-text="$app.tn('finetune.stats.tierMismatch', ex.stats.tierMismatch)"></span>
      <span class="tok-badge tok-med" x-show="ex.stats.placeSuspect?.length > 0" x-text="$app.tn('finetune.stats.placeSuspect', ex.stats.placeSuspect?.length || 0)"></span>
    </div>

    <div class="table-scroll">
      <table class="data-table"
             x-data="sortableTable({
               rows: () => finetuneQualityRows(ex.stats),
               defaultKey: 'count',
               defaultDir: 'desc',
               persistKey: 'finetune.qualityTasks',
               types: { count: 'number', share: 'number', answerTokens: 'number', tokenShare: 'number', uniqueAnswers: 'number', avgAnswerChars: 'number' },
             })">
        <thead>
          <tr>
            <th x-bind="sortTh('label')" x-text="$app.t('finetune.quality.colTask')"></th>
            <th x-bind="sortTh('familyLabel')" x-text="$app.t('finetune.quality.colFamily')"></th>
            <th x-bind="sortTh('count')" x-text="$app.t('finetune.quality.colCount')"></th>
            <th x-bind="sortTh('share')" x-text="$app.t('finetune.quality.colShare')"></th>
            <th x-bind="sortTh('answerTokens')" x-text="$app.t('finetune.quality.colTokens')"></th>
            <th x-bind="sortTh('tokenShare')" x-text="$app.t('finetune.quality.colTokenShare')"></th>
            <th x-bind="sortTh('uniqueAnswers')" x-text="$app.t('finetune.quality.colUnique')"></th>
            <th x-bind="sortTh('avgAnswerChars')" x-text="$app.t('finetune.quality.colAvg')"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="row in sorted" :key="row.task">
            <tr>
              <td x-text="row.label"></td>
              <td x-text="row.familyLabel"></td>
              <td x-text="row.count"></td>
              <td x-text="finetunePct(row.share)"></td>
              <td x-text="row.answerTokens ?? ''"></td>
              <td x-text="row.tokenShare != null ? finetunePct(row.tokenShare) : ''"></td>
              <td x-text="row.uniqueAnswers"></td>
              <td x-text="row.avgAnswerChars"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <template x-if="ex.stats.quality.topAnswers?.length">
      <div class="finetune-top-answers-block">
        <div class="card-section-title" x-text="$app.t('finetune.quality.topAnswers')"></div>
        <ol class="finetune-top-answers">
          <template x-for="(a, i) in ex.stats.quality.topAnswers" :key="i">
            <li>
              <div class="finetune-top-answer">
                <span class="tok-badge tok-neutral" x-text="a.count + '×'"></span>
                <span class="finetune-top-answer-text" x-text="a.text"></span>
              </div>
            </li>
          </template>
        </ol>
      </div>
    </template>
  </div>
</template>
