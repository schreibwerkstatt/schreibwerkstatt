    <!-- Auth-Tab -->
    <section x-bind="panel('auth')" class="admin-settings-section">
      <div x-data="settingField({ k: 'app.public_url', type: 'url', label: 'admin.settings.label.appPublicUrl', ph: 'https://app.example.com' })"></div>

      <h4 class="admin-settings-subheading"><span x-text="$app.t('admin.settings.auth.methodTitle')"></span></h4>
      <p class="muted-msg muted-msg--sm" x-text="$app.t('admin.settings.auth.methodHint')"></p>
      <div x-data="settingField({ k: 'auth.method', type: 'select', label: 'admin.settings.label.authMethod', opts: [
             { value: 'google', label: 'Google' },
             { value: 'local',  labelKey: 'admin.settings.auth.methodLocal' },
           ] })"></div>

      <!-- Nur das gewaehlte Verfahren zeigt seine Felder: ein Google-Secret auf
           einer lokal anmeldenden Instanz ist kein Zustand, den das UI anbieten
           soll. Die Keys bleiben gesetzt, ein Zurueckschalten verliert nichts. -->
      <template x-if="adminSettingsForm['auth.method'] !== 'local'">
        <div>
          <div x-data="settingField({ k: 'auth.google.client_id', label: 'admin.settings.label.authGoogleClientId', secret: true })"></div>
          <div x-data="settingField({ k: 'auth.google.client_secret', type: 'password', label: 'admin.settings.label.authGoogleClientSecret' })"></div>
        </div>
      </template>
      <template x-if="adminSettingsForm['auth.method'] === 'local'">
        <div>
          <p class="muted-msg muted-msg--sm" x-text="$app.t('admin.settings.auth.localHint')"></p>
          <!-- Wechsel auf lokal ohne eigenes Passwort: nach dem Abmelden kaeme
               der Admin nicht mehr hinein (Server blockt das Speichern). Hier
               laesst sich das eigene Passwort vorab setzen. -->
          <div class="admin-settings-own-password" x-show="adminSettingsNeedsOwnPassword()"
               @keydown="$editKeys($event, { save: () => !adminSettingsOwnPasswordBusy && adminSettingsSetOwnPassword() })">
            <p class="card-hint" x-text="$app.t('admin.settings.auth.ownPasswordHint')"></p>
            <div class="admin-settings-own-password-row">
              <input type="password" autocomplete="new-password" x-model="adminSettingsOwnPassword"
                     :aria-label="$app.t('admin.settings.auth.ownPasswordLabel')"
                     :placeholder="$app.t('admin.settings.auth.ownPasswordLabel')"
                     :disabled="adminSettingsOwnPasswordBusy"
                     @keydown.enter="$enter($event, () => !adminSettingsOwnPasswordBusy && adminSettingsSetOwnPassword())">
              <button type="button" @click="adminSettingsSetOwnPassword()"
                      :disabled="adminSettingsOwnPasswordBusy || !adminSettingsOwnPassword"
                      x-text="$app.t('admin.settings.auth.ownPasswordSubmit')"></button>
            </div>
          </div>
          <div x-data="settingField({ k: 'auth.local.min_password_length', type: 'num', label: 'admin.settings.label.authLocalMinPasswordLength', num: { integer: true, min: 8, max: 128 }, help: 'admin.settings.help.authLocalMinPasswordLength' })"></div>
          <div x-data="settingField({ k: 'auth.local.token_ttl_hours', type: 'num', label: 'admin.settings.label.authLocalTokenTtl', num: { integer: true, min: 1, max: 720 }, help: 'admin.settings.help.authLocalTokenTtl' })"></div>
          <div x-data="settingField({ k: 'auth.local.allow_self_reset', type: 'toggle', label: 'admin.settings.label.authLocalAllowSelfReset', help: 'admin.settings.help.authLocalAllowSelfReset' })"></div>
        </div>
      </template>

      <div x-data="settingField({ k: 'auth.allow_open_signup', type: 'toggle', label: 'admin.settings.label.authAllowOpenSignup' })"></div>
      <div x-data="settingField({ k: 'auth.registration.expire_days', type: 'num', label: 'admin.settings.label.authRegistrationExpireDays', num: { integer: true, min: 1, max: 365 }, help: 'admin.settings.help.registrationExpireDays' })"></div>

      <h4 class="admin-settings-subheading"><span x-text="$app.t('admin.settings.auth.rateLimitTitle')"></span></h4>
      <p class="muted-msg muted-msg--sm" x-text="$app.t('admin.settings.auth.rateLimitHint')"></p>
      <div x-data="settingField({ k: 'auth.register.rate_limit_max', type: 'num', label: 'admin.settings.label.authRegisterRateLimitMax', num: { integer: true, min: 1, max: 1000 } })"></div>
      <div x-data="settingField({ k: 'auth.register.rate_limit_window_min', type: 'num', label: 'admin.settings.label.authRegisterRateLimitWindow', num: { integer: true, min: 1, max: 1440 } })"></div>
      <div x-data="settingField({ k: 'auth.admin_login.max_fails', type: 'num', label: 'admin.settings.label.authAdminLoginMaxFails', num: { integer: true, min: 1, max: 1000 } })"></div>
      <div x-data="settingField({ k: 'auth.admin_login.window_min', type: 'num', label: 'admin.settings.label.authAdminLoginWindow', num: { integer: true, min: 1, max: 1440 } })"></div>

      <h4 class="admin-settings-subheading"><span x-text="$app.t('admin.settings.auth.captchaTitle')"></span></h4>
      <p class="muted-msg muted-msg--sm" x-text="$app.t('admin.settings.auth.captchaHint')"></p>
      <div x-data="settingField({ k: 'auth.altcha.enabled', type: 'toggle', label: 'admin.settings.label.authAltchaEnabled' })"></div>
      <div x-data="settingField({ k: 'auth.altcha.complexity', type: 'num', label: 'admin.settings.label.authAltchaComplexity', num: { integer: true, min: 1000, max: 5000000 }, help: 'admin.settings.help.altchaComplexity' })"></div>
      <div x-data="settingField({ k: 'auth.altcha.challenge_ttl_min', type: 'num', label: 'admin.settings.label.authAltchaChallengeTtl', num: { integer: true, min: 1, max: 120 }, help: 'admin.settings.help.altchaChallengeTtl' })"></div>

      <div class="admin-settings-actions" x-show="adminSettingsForm['auth.method'] !== 'local'">
        <button type="button" @click="adminSettingsTest('oauth')" x-text="$app.t('admin.settings.test.oauth')"></button>
      </div>
    </section>
