<!-- Edit-Toolbar: Bubble (Inline auf Selektion) + Slash (Block-Transforms).
     Beides nach <body> teleportiert, damit position:fixed nicht von einem
     transformierten Eltern-Container (Card) eingefangen wird.
     Nur in Edit-Mode aktiv, im Fokus-Modus strukturell ausgeblendet.
     Alpine.data-Sub — siehe public/js/cards/editor-toolbar-card.js. -->

<div x-data="editorToolbarCard" class="display-contents">
  <!-- Bubble-Toolbar (Inline-Formate) -->
  <template x-teleport="body">
    <div x-show="bubbleShow && $app.editMode && !$app.focusActive" x-cloak
         class="edit-bubble-toolbar"
         role="toolbar"
         :aria-label="$app.t('editor.toolbar.ariaLabel')"
         :style="{ left: bubbleX + 'px', top: bubbleY + 'px' }"
         @mousedown.prevent>
      <button type="button" class="edit-bubble-btn edit-bubble-btn--bold"   @click="toolbarBold()"   :data-tip="$app.withHotkey($app.t('editor.toolbar.boldTitle'), 'bold')"     :aria-label="$app.t('editor.toolbar.boldTitle')">B</button>
      <button type="button" class="edit-bubble-btn edit-bubble-btn--italic" @click="toolbarItalic()" :data-tip="$app.withHotkey($app.t('editor.toolbar.italicTitle'), 'italic')" :aria-label="$app.t('editor.toolbar.italicTitle')">I</button>
      <button type="button"
              x-show="bubbleSingleWord"
              class="edit-bubble-btn edit-bubble-btn--syn"
              @click="$app.openSynonymForCurrentSelection()"
              :data-tip="$app.withHotkey($app.t('editor.toolbar.synonymTitle'), 'synonym')"
              :aria-label="$app.t('editor.toolbar.synonymTitle')"
              x-text="$app.t('editor.toolbar.synonymLabel')"></button>
      <button type="button"
              class="edit-bubble-btn edit-bubble-btn--link"
              @click="openLinkInput()"
              :data-tip="$app.withHotkey($app.t('editor.toolbar.linkTitle'), 'link')"
              :aria-label="$app.t('editor.toolbar.linkTitle')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#external-link"/></svg>
      </button>
      <button type="button"
              class="edit-bubble-btn edit-bubble-btn--cite"
              @click="openCiteInput()"
              :data-tip="$app.t('editor.toolbar.citeTitle')"
              :aria-label="$app.t('editor.toolbar.citeTitle')">
        <!-- Dasselbe Icon wie die Quellen-Karte und der Toolbar-Einstieg; `#quote`
             steht in der Seiten-Toolbar für die Anführungszeichen-Normalisierung
             und wäre hier eine falsche Fährte. -->
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#book-open"/></svg>
      </button>
      <button type="button"
              class="edit-bubble-btn edit-bubble-btn--xref"
              @click="openXrefInput()"
              :data-tip="$app.t('editor.toolbar.xrefTitle')"
              :aria-label="$app.t('editor.toolbar.xrefTitle')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#list-tree"/></svg>
      </button>
      <button type="button" x-show="bubbleMsgOk" class="edit-bubble-btn edit-bubble-btn--msg" @click="toolbarToMsgThread('in')" :data-tip="$app.t('editor.toolbar.msgConvertInTitle')" :aria-label="$app.t('editor.toolbar.msgConvertInTitle')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#message-square"/></svg><svg class="icon" aria-hidden="true"><use href="/icons.svg#arrow-left"/></svg></button>
      <button type="button" x-show="bubbleMsgOk" class="edit-bubble-btn edit-bubble-btn--msg" @click="toolbarToMsgThread('out')" :data-tip="$app.t('editor.toolbar.msgConvertOutTitle')" :aria-label="$app.t('editor.toolbar.msgConvertOutTitle')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#message-square"/></svg><svg class="icon" aria-hidden="true"><use href="/icons.svg#arrow-right"/></svg></button>
      <button type="button" x-show="bubbleMsgUnwrapOk" class="edit-bubble-btn edit-bubble-btn--msg edit-bubble-btn--msg-unwrap" @click="toolbarFromMsgThread()" :data-tip="$app.t('editor.toolbar.msgUnwrapTitle')" :aria-label="$app.t('editor.toolbar.msgUnwrapTitle')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#message-square"/></svg><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
    </div>
  </template>

  <!-- Querverweis- und Beleg-Picker: eigenes Partial (Zeilen-Cap), teleportiert
       sich selbst, gleicher Scope. -->
  <div id="partial-editor-caret-panels"></div>

  <!-- Link-Input -->
  <template x-teleport="body">
    <div x-show="linkShow && $app.editMode && !$app.focusActive" x-cloak
         class="edit-link-bar"
         x-ref="linkPanel"
         role="dialog"
         :aria-label="$app.t('editor.toolbar.linkTitle')"
         :style="{ left: linkX + 'px', top: linkY + 'px', maxHeight: linkMaxH + 'px' }"
         @click.outside="_closeLink()"
         @mousedown.stop>
      <input type="text" x-ref="linkInput"
             x-model="linkUrl"
             @keydown="_onLinkKeydown($event)"
             :placeholder="$app.t('editor.toolbar.linkPlaceholder')"
             :aria-label="$app.t('editor.toolbar.linkTitle')"
             class="edit-link-input">
      <button type="button" class="edit-link-btn" @click="_commitLink()"
              :data-tip="$app.t('editor.toolbar.linkApply')"
              :aria-label="$app.t('editor.toolbar.linkApply')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#check"/></svg>
      </button>
      <button type="button" class="edit-link-btn" x-show="linkCanRemove" @click="_removeLink()"
              :data-tip="$app.t('editor.toolbar.linkRemove')"
              :aria-label="$app.t('editor.toolbar.linkRemove')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#unlink"/></svg>
      </button>
    </div>
  </template>

  <!-- Slash-Menü (Block-Transforms). Der Fokus bleibt im contenteditable —
       darum trägt die Listbox kein aria-activedescendant (es erreichte den
       Screenreader vom teleportierten Menü aus nicht); den aktiven Eintrag sagt
       die Live-Region unten an. Gruppen sind role="group" mit Namen, die
       sichtbare Überschrift ist nur Optik. -->
  <template x-teleport="body">
    <div x-show="slashShow && $app.editMode && !$app.focusActive" x-cloak
         class="edit-slash-menu"
         x-ref="slashMenu"
         :style="{ left: slashX + 'px', top: slashY + 'px', maxHeight: slashMaxH + 'px' }"
         @click.outside="_closeSlash()">
      <div class="edit-slash-hint" :class="{ 'edit-slash-hint--query': slashQuery }">
        <span x-show="!slashQuery" x-text="$app.t('editor.slash.hint')"></span>
        <span x-show="slashQuery" class="edit-slash-query"><span class="edit-slash-query-slash">/</span><span x-text="slashQuery"></span></span>
      </div>
      <div role="listbox" :aria-label="$app.t('editor.slash.ariaLabel')">
        <template x-for="g in slashGroups()" :key="g.key">
          <div class="edit-slash-row" role="group" :aria-label="g.label">
            <div class="edit-slash-group" aria-hidden="true" x-text="g.label"></div>
            <template x-for="it in g.items" :key="it.key">
              <button type="button"
                      class="edit-slash-item"
                      role="option"
                      :id="'edit-slash-opt-' + it.idx"
                      :aria-selected="slashIdx === it.idx"
                      :class="it.modClass + (slashIdx === it.idx ? ' edit-slash-item--active' : '')"
                      @mousedown.prevent
                      @click="_applySlashByKey(it.key)"
                      @mouseenter="slashIdx = it.idx">
                <span class="edit-slash-label" x-text="it.label"></span>
                <span x-show="it.preview" class="edit-slash-prev" x-text="it.preview"></span>
              </button>
            </template>
          </div>
        </template>
      </div>
      <div x-show="slashItems().length === 0" class="muted-msg muted-msg--sm edit-slash-empty"
           x-text="$app.t('editor.slash.noMatch')"></div>
    </div>
  </template>
  <div class="edit-slash-live" aria-live="polite" aria-atomic="true" x-text="slashActiveLabel()"></div>

  <!-- Eigene Partials, weil diese Datei sonst über das 250-Zeilen-Limit läuft:
       Diagramm-Dialog (Quelltext + Vorschau), Tabellen-Dialog (Gitter +
       Beschriftung), Bild-Dialog (Ersatztext + Bildnachweis) — ohne Teleport,
       ein offenes <dialog> rendert im Top-Layer, egal wo es im DOM hängt — und
       die Zeilenleiste des Nachrichtenverlaufs (teleportiert sich selbst). -->
  <div id="partial-editor-diagram-dialog"></div>
  <div id="partial-editor-table-dialog"></div>
  <div id="partial-editor-image-dialog"></div>
  <div id="partial-editor-msg-bar"></div>
</div>
