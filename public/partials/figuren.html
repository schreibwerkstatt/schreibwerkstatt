<!-- Figurenübersicht -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/figuren-card.js.
  Fachdaten (figuren) leben in Alpine.store('catalog') und sind via $root
  auflösbar. Graph-Modus + vis-network-Internals wohnen in der Sub.
  figurenFilters + selectedFigurId + Loading/Progress/Status bleiben am Root.
-->
<div class="card card--figuren" x-data="figurenCard" x-show="$app.showFiguresCard" x-cloak>
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('figuren.title')"></span>
      <div class="card-subline" x-show="$store.jobs.alleAktualisierenLastRun && !$store.catalogUi.figurenLoading">
        <span class="card-timestamp" x-text="$app.t('common.asOf', { date: $store.jobs.alleAktualisierenLastRun })"></span>
      </div>
    </div>
  </div>

  <!-- Fortschritt -->
  <div x-show="$store.catalogUi.figurenProgress > 0" class="progress-bar-wrap">
    <div class="progress-bar" :style="{ '--progress': $store.catalogUi.figurenProgress + '%' }"></div>
  </div>
  <!-- Status = Lade-/Löschfehler (book/figuren.js). Bei leerem Katalog ersetzt er
       den „Noch keine Analyse"-Leerzustand: ein gescheiterter Fetch ist kein
       fehlendes Analyseergebnis, und dessen CTA wäre eine teure Komplettanalyse. -->
  <div x-show="$store.catalogUi.figurenStatus" class="card-status" role="status" x-text="$store.catalogUi.figurenStatus"></div>
  <div x-show="$store.catalogUi.figurenStatus && $store.catalog.figuren.length === 0 && !$store.catalogUi.figurenLoading && !cardLoading" class="card-empty">
    <button type="button" class="card-empty-cta"
            @click="$app.loadFiguren($store.nav.selectedBookId)"
            :disabled="!$store.nav.selectedBookId">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg>
      <span x-text="$app.t('figuren.loadRetry')"></span>
    </button>
  </div>

  <!-- Skelett, solange der Katalog beim Öffnen/Buchwechsel noch lädt; der
       Leer-Hinweis darunter wartet darauf (sonst blitzt dessen teure CTA auf). -->
  <div x-show="cardLoading && $store.catalog.figuren.length === 0" x-skeleton="6" class="entity-list--accented" x-cloak></div>

  <!-- Leer-Hinweis mit CTA -->
  <div x-show="$store.catalog.figuren.length === 0 && !$store.catalogUi.figurenLoading && !$store.catalogUi.figurenStatus && !cardLoading" class="card-empty">
    <p class="card-empty-text" x-text="$app.t('common.noAnalysisYet')"></p>
    <p class="card-empty-hint" x-text="$app.t('empty.figuren.hint')"></p>
    <button type="button" class="primary card-empty-cta"
            @click="$app.alleAktualisieren()"
            :disabled="$store.jobs.alleAktualisierenLoading || !$store.nav.selectedBookId">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg>
      <span x-text="$app.t('header.updateAll')"></span>
    </button>
  </div>

  <!-- Graph -->
  <div x-show="$store.catalog.figuren.length > 0" class="figur-graph-section">

    <!-- Reiter: Liste (Einstieg) · drei Graphen · drei Tabellen -->
    <div class="tabs tabs--fullwidth">
      <button :aria-pressed="figurenGraphModus === 'liste'" type="button" class="tabs-btn" :class="{ 'tabs-btn--active': figurenGraphModus === 'liste' }" @click="setFigurenGraphModus('liste')" x-text="$app.t('figuren.modeListe')"></button>
      <button :aria-pressed="figurenGraphModus === 'figur'" type="button" class="tabs-btn" :class="{ 'tabs-btn--active': figurenGraphModus === 'figur' }" @click="setFigurenGraphModus('figur')" x-text="$app.t('figuren.modeGraph')"></button>
      <button :aria-pressed="figurenGraphModus === 'familie'" type="button" class="tabs-btn" :class="{ 'tabs-btn--active': figurenGraphModus === 'familie' }" :disabled="!figurenHasFamilyEdges()" @click="setFigurenGraphModus('familie')" x-text="$app.t('figuren.modeFamilie')"></button>
      <button :aria-pressed="figurenGraphModus === 'soziogramm'" type="button" class="tabs-btn" :class="{ 'tabs-btn--active': figurenGraphModus === 'soziogramm' }" @click="setFigurenGraphModus('soziogramm')" x-text="$app.t('figuren.modeSoziogramm')"></button>
      <button :aria-pressed="figurenGraphModus === 'praesenz'" type="button" class="tabs-btn" :class="{ 'tabs-btn--active': figurenGraphModus === 'praesenz' }" @click="setFigurenGraphModus('praesenz')" x-text="$app.t('figuren.modePraesenz')"></button>
      <button :aria-pressed="figurenGraphModus === 'alter'" type="button" class="tabs-btn" :class="{ 'tabs-btn--active': figurenGraphModus === 'alter' }" @click="setFigurenGraphModus('alter')" x-text="$app.t('figuren.modeAlter')"></button>
      <button :aria-pressed="figurenGraphModus === 'lebenslauf'" type="button" class="tabs-btn" :class="{ 'tabs-btn--active': figurenGraphModus === 'lebenslauf' }" @click="setFigurenGraphModus('lebenslauf')" x-text="$app.t('figuren.modeLebenslauf')"></button>
    </div>

    <!-- Graph-Legende (klappbar) — nested Partial im figurenCard-Scope -->
    <div id="partial-figuren-graph-legend" x-show="figurenIsGraphModus()"></div>

    <div class="figuren-graph-wrap" x-show="figurenIsGraphModus()" :class="{ 'is-fullscreen': figurenGraphFullscreen }" @keydown.escape.window="figurenGraphFullscreen && toggleFigurenGraphFullscreen()">
      <div class="figuren-graph-toolbar">
        <!-- Kapitel-Filter (alle Graph-Modi) -->
        <div x-show="figurenKapitelOptionen().length > 0" class="figuren-graph-filter">
          <div x-data="catalogFilter('chapter')"
               x-modelable="value" x-model="figurenGraphKapitelId"
               x-effect="options = figurenKapitelOptionen()"
               @combobox-change="_figurenGraphSetKapitel($event.detail || null)"
></div>
        </div>
        <!-- Soziogramm: Kapitel-Inseln, Begegnungen aus Szenen, Nähe-Einschätzung
             (graph/soziogramm-controls.js, docs/graph.md «Soziogramm»). -->
        <div x-show="figurenGraphModus === 'soziogramm'" class="figuren-graph-sozio">
          <div x-data="toggleSwitch({ label: () => $app.t('graph.sozio.inseln') })"
               x-modelable="value" x-model="soziogrammInseln"
               @toggle-change="setSoziogrammInseln($event.detail)" :data-tip="$app.t('graph.sozio.inselnHint')"></div>
          <div x-data="toggleSwitch({ label: () => $app.t('graph.sozio.begegnungen') })"
               x-modelable="value" x-model="soziogrammBegegnungen"
               @toggle-change="setSoziogrammBegegnungen($event.detail)" :data-tip="$app.t('graph.sozio.begegnungenHint')"></div>
          <button type="button" class="btn-compact" x-show="soziogrammNaeheStand().total > 0"
                  :disabled="soziogrammNaeheLoading" @click="runFigurenNaehe()"
                  :data-tip="$app.t('graph.sozio.naeheHint')"
                  x-text="soziogrammNaeheLoading ? $app.t('graph.sozio.naeheRunning')
                    : soziogrammNaeheStand().offen ? $app.tn('graph.sozio.naeheRun', soziogrammNaeheStand().offen)
                    : $app.t('graph.sozio.naeheRerun')"></button>
        </div>
        <div class="figuren-graph-toolbar-zoom">
          <button type="button" class="icon-btn" :data-tip="$app.t('graph.zoomIn')" :aria-label="$app.t('graph.zoomIn')" @click="_figurenNetwork && _figurenNetwork.moveTo({ scale: _figurenNetwork.getScale() * 1.3, animation: { duration: 200, easingFunction: 'easeInOutQuad' } })"><svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg></button>
          <button type="button" class="icon-btn" :data-tip="$app.t('graph.zoomOut')" :aria-label="$app.t('graph.zoomOut')" @click="_figurenNetwork && _figurenNetwork.moveTo({ scale: _figurenNetwork.getScale() * 0.77, animation: { duration: 200, easingFunction: 'easeInOutQuad' } })"><svg class="icon" aria-hidden="true"><use href="/icons.svg#minus"/></svg></button>
          <button type="button" class="icon-btn" :data-tip="$app.t('graph.reset')" :aria-label="$app.t('graph.reset')" @click="_figurenNetwork && _figurenNetwork.fit({ animation: { duration: 300, easingFunction: 'easeInOutQuad' } })"><svg class="icon" aria-hidden="true"><use href="/icons.svg#scan"/></svg></button>
          <button type="button" class="icon-btn" :aria-pressed="figurenGraphFullscreen" :data-tip="figurenGraphFullscreen ? $app.t('graph.fullscreenClose') : $app.t('graph.fullscreen')" :aria-label="figurenGraphFullscreen ? $app.t('graph.fullscreenClose') : $app.t('graph.fullscreen')" @click="toggleFigurenGraphFullscreen()"><svg class="icon" aria-hidden="true"><use :href="figurenGraphFullscreen ? '/icons.svg#minimize-2' : '/icons.svg#maximize-2'"/></svg></button>
        </div>
      </div>
      <p class="card-status" x-show="figurenGraphModus === 'soziogramm' && soziogrammNaeheStatus" x-cloak x-text="soziogrammNaeheStatus"></p>
      <div id="figuren-graph" class="figuren-graph-container" role="img" :aria-label="$app.t('graph.ariaLabel')"></div>
      <div id="figur-tooltip" class="graph-tooltip"></div>
    </div>

    <!-- Die drei Tabellen-Reiter hängen per x-if (in ihrem Partial), nicht x-show: jeder
         läuft per x-for über alle Figuren und baute versteckt seinen ganzen DOM mit. -->
    <!-- Präsenz-Tab (Figuren × Kapitel-Heatmap) — nested Partial im figurenCard-Scope -->
    <div id="partial-figuren-presence"></div>

    <!-- Alterstabelle-Tab (Figuren × Alter, filterbar) — nested Partial im figurenCard-Scope -->
    <div id="partial-figuren-alter"></div>

    <!-- Lebenslauf-Tab (Lebensphasen × Figuren als Matrix) — nested Partial im figurenCard-Scope -->
    <div id="partial-figuren-lebenslauf"></div>
  </div>



  <!-- Figurenliste (Reiter «Liste») -->
  <div x-show="$store.catalog.figuren.length > 0 && figurenGraphModus === 'liste'" class="figur-list-section">
    <p class="card-form-saved" x-show="figurPflegeMessage" x-cloak x-text="figurPflegeMessage"></p>
    <p class="card-form-saved" x-show="mergePickMessage" x-cloak x-text="mergePickMessage"></p>
    <!-- @include figuren-relcheck -->

    <!-- Filter: Suche (Name, Kurzname, Beschreibung, Rolle, Beruf, Eigenschaften,
         Typ) · Typ · Kapitel · Abschnitt · Sortierung -->
    <div class="filter-bar">
      <span class="filter-search-wrap">
        <input type="text" x-model="$store.catalogUi.figurenFilters.suche" :placeholder="$app.t('figuren.searchPlaceholder')" :aria-label="$app.t('common.search')" class="filter-search-input filter-search-input--wide">
        <button type="button" class="search-clear--icon" x-show="$store.catalogUi.figurenFilters.suche" @click="$store.catalogUi.figurenFilters.suche=''" :aria-label="$app.t('search.clear')" :data-tip="$app.t('search.clear')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
      </span>
      <div x-data="catalogFilter('figurTyp')"
          x-modelable="value" x-model="$store.catalogUi.figurenFilters.typ"
          x-effect="options = figurenAlterTypListe().map(k => ({ value: k, label: $app.t('figuren.type.' + k) }))"
          @combobox-change="$store.catalogUi.selectedFigurId = null"></div>
      <div x-show="figurenKapitelOptionen().length > 0" x-data="catalogFilter('chapter')"
          x-modelable="value" x-model="$store.catalogUi.figurenFilters.kapitelId"
          x-effect="options = figurenKapitelOptionen()"
          @combobox-change="$store.catalogUi.figurenFilters.seiteId = ''; $store.catalogUi.selectedFigurId = null"
          >
      </div>
      <div x-show="figurenKapitelOptionen().length > 0" x-data="catalogFilter('page')"
          x-modelable="value" x-model="$store.catalogUi.figurenFilters.seiteId"
          x-effect="_disabled = figurenSeitenOptionen().length === 0; options = figurenSeitenOptionen()"
          @combobox-change="$store.catalogUi.selectedFigurId = null"
          :class="{'combobox-wrap--disabled': _disabled}"
          >
      </div>
      <div x-data="combobox($app.t('figuren.sort.label'), $app.t('figuren.sort.buch'))"
          x-modelable="value" x-model="$store.catalogUi.figurenFilters.sort"
          x-effect="options = ['name', 'typ', 'haeufigkeit'].map(k => ({ value: k, label: $app.t('figuren.sort.' + k) }))"></div>
      <span class="filter-count" x-text="filteredFiguren().length + ' / ' + $store.catalog.figuren.length"></span>
    </div>
    <!-- Verwaiste Figuren: Hinweis + Sammel-Löschen (Einzel-Löschen an der Zeile) -->
    <div x-show="figurStaleCount() > 0" class="stale-cleanup-row">
      <span class="card-hint" :data-tip="$app.t('figuren.staleHint')" x-text="$app.tn('figuren.staleSummary', figurStaleCount())"></span>
      <button type="button" class="btn-compact danger" :disabled="figurStaleDeleting" @click="deleteAllStaleFiguren()"
              x-text="$app.t('figuren.deleteAllStale')"></button>
    </div>
    <p class="muted-msg muted-msg--sm" x-show="filteredFiguren().length === 0" x-text="$app.t('common.noMatch')"></p>

    <div class="entity-list entity-list--accented">
    <template x-for="f in listWindowed(filteredFiguren())" :key="f.id">
      <div>
        <!-- Zeile (DESIGN.md «Listen-Anriss»): Titel-Knopf öffnet das Bearbeiten,
             Chevron-Knopf und übriger Zeilenkörper klappen auf/zu (Maus-Komfort,
             kein .internal-link — die Zeile trägt eigene Knöpfe). ⋯, Rechtsklick
             und Long-Press öffnen das Aktionsmenü (figuren-menu.html). -->
        <div class="entity-row hover-reveal-host" :class="{ 'entity-row--stale': f.stale, 'entity-row--selected': $store.catalogUi.selectedFigurId === f.id }" :data-figid="f.id"
             @click="figurRowBodyClick(f, $event)"
             @contextmenu="figurOpenMenu($event, f)" x-long-press>
          <span class="figur-typ-dot" :class="'figur-typ-dot--' + (f.typ || 'unknown')"></span>
          <span class="entity-row-title"><button type="button" class="entity-row-title-btn text-link" @click.stop="openFigurEdit(f)"
                  :data-tip="$app.t('figuren.edit.open')" x-text="f.name"></button></span>
          <span x-show="f.stale" class="tag tag--stale" :data-tip="$app.t('figuren.staleHint')" x-text="$app.t('figuren.staleBadge')"></span>
          <span x-show="f.manually_edited" class="tag tag--curated" :data-tip="$app.t('figuren.curatedHint')" x-text="$app.t('figuren.curatedBadge')"></span>
          <template x-if="f.stale">
          <button type="button" class="btn-compact entity-row-action"
                  aria-haspopup="dialog" :aria-expanded="mergePick.kind === 'figur' && mergePick.sourceId === String(f.id)"
                  @click.stop="openMergePick($event, 'figur', f)"
                  :data-tip="$app.t('merge.rowTip')" x-text="$app.t('merge.rowAction')"></button>
          </template>
          <template x-if="f.stale">
          <button type="button" class="icon-btn danger entity-row-action"
                  @click.stop="$app.deleteStaleFigur(f)"
                  :aria-label="$app.t('common.delete')" :data-tip="$app.t('entity.deleteStale')">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
          </button>
          </template>
          <span class="tag" x-text="$app.t('figuren.type.' + f.typ)"></span>
          <span x-show="$app.figurJahrLabel(f)" class="tag" :data-tip="$app.figurJahrTip(f)" x-text="$app.figurJahrLabel(f)"></span>
          <span x-show="f.geburtstag" class="tag" :data-tip="$app.t('figuren.birthYearTip')" x-text="$app.t('figuren.birthYear', { jahr: f.geburtstag })"></span>
          <!-- Häufigstes Kapitel + Anzahl weiterer -->
          <template x-if="f.kapitel?.length">
            <span class="entity-refs entity-refs--collapse-mobile">
              <button type="button" class="entity-ref" x-entity-ref="{ type: 'kapitel', id: f.kapitel[0].chapter_id, name: f.kapitel[0].name }"></button>
              <template x-if="f.kapitel.length > 1">
                <span class="entity-ref-more" x-text="'+' + (f.kapitel.length - 1)"></span>
              </template>
            </span>
          </template>
          <span class="row-end">
            <button type="button" class="icon-btn icon-btn--ghost hover-reveal"
                    aria-haspopup="menu" :aria-expanded="isActionMenuOpen('figur:' + f.id)"
                    @click="figurOpenMenu($event, f)"
                    :data-tip="$app.t('common.moreActions')" :aria-label="$app.t('common.moreActions')">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#more-horizontal"/></svg>
            </button>
            <button type="button" class="row-expand"
                    :aria-expanded="$store.catalogUi.selectedFigurId === f.id"
                    @click="figurToggleOpen(f)" :aria-label="$app.t('common.details')">
              <span class="history-chevron" :class="{ open: $store.catalogUi.selectedFigurId === f.id }" aria-hidden="true"></span>
            </button>
          </span>
        </div>
        <!-- @include figuren-detail -->
      </div>
    </template>
    <button type="button" class="btn-compact list-window-more"
            x-show="listWindowRest(filteredFiguren()) > 0" x-cloak
            x-list-more="listWindowMore()" @click="listWindowMore()"
            x-text="$app.t('common.showMore', { n: listWindowRest(filteredFiguren()) })"></button>
    </div>
    <!-- @include entity-merge-picker -->
    <!-- @include figuren-menu -->
  </div>

</div>
