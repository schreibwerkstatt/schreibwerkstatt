<!-- Figurenübersicht -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/figuren-card.js.
  Fachdaten (figuren) leben in Alpine.store('catalog') und sind via $root
  auflösbar. Graph-Modus + vis-network-Internals wohnen in der Sub.
  figurenFilters + selectedFigurId + Loading/Progress/Status bleiben am Root.
-->
<div class="card card--figuren" x-data="figurenCard" x-show="$app.showFiguresCard" x-cloak>
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('figuren.title')"></span>
      <div class="card-subline" x-show="$store.jobs.alleAktualisierenLastRun && !$store.catalogUi.figurenLoading">
        <span class="card-timestamp" x-text="$app.t('common.asOf', { date: $store.jobs.alleAktualisierenLastRun })"></span>
      </div>
    </div>
  </div>

  <!-- Fortschritt -->
  <div x-show="$store.catalogUi.figurenProgress > 0" class="progress-bar-wrap">
    <div class="progress-bar" :style="{ '--progress': $store.catalogUi.figurenProgress + '%' }"></div>
  </div>
  <!-- Status = Lade-/Löschfehler (book/figuren.js). Bei leerem Katalog ersetzt er
       den „Noch keine Analyse"-Leerzustand: ein gescheiterter Fetch ist kein
       fehlendes Analyseergebnis, und dessen CTA wäre eine teure Komplettanalyse. -->
  <div x-show="$store.catalogUi.figurenStatus" class="card-status" role="status" x-text="$store.catalogUi.figurenStatus"></div>
  <div x-show="$store.catalogUi.figurenStatus && $store.catalog.figuren.length === 0 && !$store.catalogUi.figurenLoading" class="card-empty">
    <button type="button" class="card-empty-cta"
            @click="$app.loadFiguren($store.nav.selectedBookId)"
            :disabled="!$store.nav.selectedBookId">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg>
      <span x-text="$app.t('figuren.loadRetry')"></span>
    </button>
  </div>

  <!-- Leer-Hinweis mit CTA -->
  <div x-show="$store.catalog.figuren.length === 0 && !$store.catalogUi.figurenLoading && !$store.catalogUi.figurenStatus" class="card-empty">
    <p class="card-empty-text" x-text="$app.t('common.noAnalysisYet')"></p>
    <p class="card-empty-hint" x-text="$app.t('empty.figuren.hint')"></p>
    <button type="button" class="primary card-empty-cta"
            @click="$app.alleAktualisieren()"
            :disabled="$store.jobs.alleAktualisierenLoading || !$store.nav.selectedBookId">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg>
      <span x-text="$app.t('header.updateAll')"></span>
    </button>
  </div>

  <!-- Graph -->
  <div x-show="$store.catalog.figuren.length > 0" class="figur-graph-section">

    <!-- Modus-Toggle -->
    <div class="tabs tabs--fullwidth">
      <button type="button" class="tabs-btn" :class="{ 'tabs-btn--active': figurenGraphModus === 'figur' }" @click="setFigurenGraphModus('figur')" x-text="$app.t('figuren.modeGraph')"></button>
      <button type="button" class="tabs-btn" :class="{ 'tabs-btn--active': figurenGraphModus === 'familie' }" :disabled="!figurenHasFamilyEdges()" @click="setFigurenGraphModus('familie')" x-text="$app.t('figuren.modeFamilie')"></button>
      <button type="button" class="tabs-btn" :class="{ 'tabs-btn--active': figurenGraphModus === 'soziogramm' }" @click="setFigurenGraphModus('soziogramm')" x-text="$app.t('figuren.modeSoziogramm')"></button>
      <button type="button" class="tabs-btn" :class="{ 'tabs-btn--active': figurenGraphModus === 'praesenz' }" @click="setFigurenGraphModus('praesenz')" x-text="$app.t('figuren.modePraesenz')"></button>
      <button type="button" class="tabs-btn" :class="{ 'tabs-btn--active': figurenGraphModus === 'alter' }" @click="setFigurenGraphModus('alter')" x-text="$app.t('figuren.modeAlter')"></button>
      <button type="button" class="tabs-btn" :class="{ 'tabs-btn--active': figurenGraphModus === 'lebenslauf' }" @click="setFigurenGraphModus('lebenslauf')" x-text="$app.t('figuren.modeLebenslauf')"></button>
    </div>

    <!-- Graph-Legende (klappbar) — nested Partial im figurenCard-Scope -->
    <div id="partial-figuren-graph-legend"></div>

    <div class="figuren-graph-wrap" x-show="figurenIsGraphModus()" :class="{ 'is-fullscreen': figurenGraphFullscreen }" @keydown.escape.window="figurenGraphFullscreen && toggleFigurenGraphFullscreen()">
      <div class="figuren-graph-toolbar">
        <!-- Kapitel-Filter (alle Graph-Modi) -->
        <div x-show="figurenKapitelListe().length > 0" class="figuren-graph-filter">
          <div x-data="catalogFilter('chapter')"
               x-modelable="value" x-model="figurenGraphKapitel"
               x-effect="options = figurenKapitelListe().map(k => ({value: k, label: k}))"
               @combobox-change="_figurenGraphSetKapitel($event.detail || null)"
></div>
        </div>
        <div class="figuren-graph-toolbar-zoom">
          <button type="button" class="icon-btn" :data-tip="$app.t('graph.zoomIn')" :aria-label="$app.t('graph.zoomIn')" @click="_figurenNetwork && _figurenNetwork.moveTo({ scale: _figurenNetwork.getScale() * 1.3, animation: { duration: 200, easingFunction: 'easeInOutQuad' } })"><svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg></button>
          <button type="button" class="icon-btn" :data-tip="$app.t('graph.zoomOut')" :aria-label="$app.t('graph.zoomOut')" @click="_figurenNetwork && _figurenNetwork.moveTo({ scale: _figurenNetwork.getScale() * 0.77, animation: { duration: 200, easingFunction: 'easeInOutQuad' } })"><svg class="icon" aria-hidden="true"><use href="/icons.svg#minus"/></svg></button>
          <button type="button" class="icon-btn" :data-tip="$app.t('graph.reset')" :aria-label="$app.t('graph.reset')" @click="_figurenNetwork && _figurenNetwork.fit({ animation: { duration: 300, easingFunction: 'easeInOutQuad' } })"><svg class="icon" aria-hidden="true"><use href="/icons.svg#scan"/></svg></button>
          <button type="button" class="icon-btn" :aria-pressed="figurenGraphFullscreen" :data-tip="figurenGraphFullscreen ? $app.t('graph.fullscreenClose') : $app.t('graph.fullscreen')" :aria-label="figurenGraphFullscreen ? $app.t('graph.fullscreenClose') : $app.t('graph.fullscreen')" @click="toggleFigurenGraphFullscreen()"><svg class="icon" aria-hidden="true"><use :href="figurenGraphFullscreen ? '/icons.svg#minimize-2' : '/icons.svg#maximize-2'"/></svg></button>
        </div>
      </div>
      <div id="figuren-graph" class="figuren-graph-container" role="img" :aria-label="$app.t('graph.ariaLabel')"></div>
      <div id="figur-tooltip" class="graph-tooltip"></div>
    </div>

    <!-- Präsenz-Tab (Figuren × Kapitel-Heatmap) — nested Partial im figurenCard-Scope -->
    <div id="partial-figuren-presence"></div>

    <!-- Alterstabelle-Tab (Figuren × Alter, filterbar) — nested Partial im figurenCard-Scope -->
    <div id="partial-figuren-alter"></div>

    <!-- Lebenslauf-Tab (Lebensphasen × Figuren als Matrix) — nested Partial im figurenCard-Scope -->
    <div id="partial-figuren-lebenslauf"></div>
  </div>



  <!-- Figurenliste -->
  <div x-show="$store.catalog.figuren.length > 0" class="figur-list-section">
    <div class="figur-list-header">
      <div class="history-heading" x-text="$app.t('figuren.heading')"></div>
    </div>
    <p class="card-form-saved" x-show="figurPflegeMessage" x-cloak x-text="figurPflegeMessage"></p>

     <!-- Filter -->
    <div x-show="$store.catalog.figuren.length > 0 && figurenKapitelListe().length > 0" class="filter-bar">
      <span class="filter-search-wrap">
        <input type="text" x-model="$store.catalogUi.figurenFilters.suche" :placeholder="$app.t('common.search')" :aria-label="$app.t('common.search')" class="filter-search-input">
        <button type="button" class="search-clear--icon" x-show="$store.catalogUi.figurenFilters.suche" @click="$store.catalogUi.figurenFilters.suche=''" :aria-label="$app.t('search.clear')" :data-tip="$app.t('search.clear')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
      </span>
      <div x-data="catalogFilter('chapter')"
          x-modelable="value" x-model="$store.catalogUi.figurenFilters.kapitel"
          x-effect="options = figurenKapitelListe().map(k => ({value: k, label: k}))"
          @combobox-change="$store.catalogUi.figurenFilters.seite = ''; $store.catalogUi.selectedFigurId = null"
          >
      </div>
      <div x-data="catalogFilter('page')"
          x-modelable="value" x-model="$store.catalogUi.figurenFilters.seite"
          x-effect="_disabled = !$store.catalogUi.figurenFilters.kapitel || figurenSeitenListe().length === 0; options = figurenSeitenListe().map(s => ({value: s, label: s}))"
          @combobox-change="$store.catalogUi.selectedFigurId = null"
          :class="{'combobox-wrap--disabled': _disabled}"
          >
      </div>
      <span class="filter-count" x-text="filteredFiguren().length + ' / ' + $store.catalog.figuren.length"></span>
    </div>

    <template x-for="f in filteredFiguren()" :key="f.id">
      <div>
        <!-- Zeile = Aufklapp-Schalter. Kein <button>, weil sie selbst Buttons
             (Löschen, Kapitel-Referenz) enthält; darum role/tabindex/aria-expanded
             und Enter/Space nur auf der Zeile selbst (.self), nicht aus den Kindern. -->
        <div class="figur-item" :class="{ 'figur-item--stale': f.stale }" :data-figid="f.id"
             role="button" tabindex="0"
             :aria-expanded="$store.catalogUi.selectedFigurId === f.id"
             @click="$store.catalogUi.selectedFigurId = $store.catalogUi.selectedFigurId === f.id ? null : f.id;"
             @keydown.enter.self.prevent="$store.catalogUi.selectedFigurId = $store.catalogUi.selectedFigurId === f.id ? null : f.id;"
             @keydown.space.self.prevent="$store.catalogUi.selectedFigurId = $store.catalogUi.selectedFigurId === f.id ? null : f.id;">
          <span class="figur-typ-dot" :class="'figur-typ-dot--' + (f.typ || 'unknown')"></span>
          <span class="figur-name" x-text="f.name"></span>
          <span x-show="f.stale" class="tag tag--stale" :data-tip="$app.t('figuren.staleHint')" x-text="$app.t('figuren.staleBadge')"></span>
          <span x-show="f.manually_edited" class="tag tag--curated" :data-tip="$app.t('figuren.curatedHint')" x-text="$app.t('figuren.curatedBadge')"></span>
          <button type="button" x-show="f.stale" class="btn-compact entity-row-delete"
                  :aria-expanded="figurMergeSourceId === f.id"
                  @click.stop="toggleFigurMerge(f)"
                  :data-tip="$app.t('figuren.mergeStaleTip')" x-text="$app.t('figuren.mergeStale')"></button>
          <button type="button" x-show="f.stale" class="icon-btn danger entity-row-delete"
                  @click.stop="$app.deleteStaleFigur(f)"
                  :aria-label="$app.t('common.delete')" :data-tip="$app.t('entity.deleteStale')">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
          </button>
          <span class="tag" x-text="$app.t('figuren.type.' + f.typ)"></span>
          <span x-show="$app.figurJahrLabel(f)" class="tag" :data-tip="$app.t('figuren.jahrAlterTip')" x-text="$app.figurJahrLabel(f)"></span>
          <span x-show="f.geburtstag" class="tag" :data-tip="$app.t('figuren.birthYearTip')" x-text="$app.t('figuren.birthYear', { jahr: f.geburtstag })"></span>
          <!-- Häufigstes Kapitel + Anzahl weiterer -->
          <template x-if="f.kapitel?.length">
            <span class="entity-refs entity-refs--collapse-mobile">
              <button type="button" class="entity-ref" x-entity-ref="{ type: 'kapitel', id: f.kapitel[0].chapter_id, name: f.kapitel[0].name }"></button>
              <template x-if="f.kapitel.length > 1">
                <span class="entity-ref-more" x-text="'+' + (f.kapitel.length - 1)"></span>
              </template>
            </span>
          </template>
          <span class="history-chevron" :class="{ open: $store.catalogUi.selectedFigurId === f.id }" aria-hidden="true"></span>
        </div>
        <!-- Ausgemusterte Figur in eine aktive zusammenführen (book/figuren-pflege.js):
             Ziel wählen, Bestätigung im Dialog. Die ausgemusterte wird gelöscht, ihr Name
             wird dauerhafter Alias des Ziels. -->
        <template x-if="f.stale && figurMergeSourceId === f.id">
          <div class="figur-merge-panel">
            <span class="card-hint" x-text="$app.t('figuren.mergeStaleQuestion', { name: f.name })"></span>
            <div x-data="combobox($app.t('merge.targetPlaceholder'))"
                 x-modelable="value" x-model="figurMergeTargetId"
                 x-effect="options = $store.catalog.figuren.filter(x => !x.stale && x.id !== f.id).map(x => ({ value: x.id, label: x.name }))"></div>
            <button type="button" class="btn-compact danger" :disabled="!figurMergeTargetId || figurMergeBusy"
                    @click="confirmFigurMerge(f)" x-text="$app.t('merge.button')"></button>
            <button type="button" class="btn-compact" @click="toggleFigurMerge(f)" x-text="$app.t('common.cancel')"></button>
            <p class="card-form-error" x-show="figurMergeError" x-text="figurMergeError"></p>
          </div>
        </template>
        <!-- @include figuren-detail -->
      </div>
    </template>
  </div>

</div>
