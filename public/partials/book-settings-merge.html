<!-- Verwaiste Einträge zusammenführen (Sektion in der Danger-Zone der
     Bucheinstellungen). Methods: public/js/book/book-settings/merge.js,
     Server: db/entity-merge.js + POST /figures|/figures/scenes|/locations …/merge.
     Quelle wird gelöscht, ihre Verknüpfungen wandern aufs Ziel.

     Flach wie die Nachbar-Sektionen der Danger-Zone (jede Aktion dort ist eine
     sichtbare `.danger-zone-section`, keine klappt). Die Kandidatenlisten lädt
     `x-effect` beim ersten Öffnen des Gefahrenzone-Tabs.

     Gattungs-Titel: literale Keys je Gattung statt `'merge.kind.' + k`, damit
     der Trenner-Gate (section-divider-single-place) den Text prüfen kann. -->
<div class="danger-zone-section"
     x-effect="onMergeSectionVisible(bookSettingsTab)">
  <div class="danger-zone-text">
    <strong x-text="$app.t('merge.title')"></strong>
    <span x-text="' — ' + $app.t('merge.text')"></span>
  </div>

  <div x-show="mergeLoading" x-cloak class="muted-msg" x-text="$app.t('common.loading')"></div>

  <template x-for="k in mergeKinds" :key="k">
    <div class="book-settings-merge-kind">
      <p class="card-form-section-divider"
         x-text="({ figur: $app.t('merge.kind.figur'), szene: $app.t('merge.kind.szene'), ort: $app.t('merge.kind.ort') })[k]"></p>

      <div class="card-form-row">
        <label class="card-form-label" :id="'merge-source-label-' + k" x-text="$app.t('merge.source')"></label>
        <div x-data="combobox($app.t('merge.sourcePlaceholder'))"
             :aria-labelledby="'merge-source-label-' + k"
             x-modelable="value" x-model="mergeSel[k].source"
             x-effect="options = mergeLists[k].filter(e => e.id !== mergeSel[k].target).map(e => ({ value: e.id, label: e.stale ? e.name + ' · ' + $app.t('merge.staleSuffix') : e.name }))"
  ></div>
      </div>

      <div class="card-form-row">
        <label class="card-form-label" :id="'merge-target-label-' + k" x-text="$app.t('merge.target')"></label>
        <div x-data="combobox($app.t('merge.targetPlaceholder'))"
             :aria-labelledby="'merge-target-label-' + k"
             x-modelable="value" x-model="mergeSel[k].target"
             x-effect="options = mergeLists[k].filter(e => e.id !== mergeSel[k].source).map(e => ({ value: e.id, label: e.stale ? e.name + ' · ' + $app.t('merge.staleSuffix') : e.name }))"
  ></div>
      </div>

      <div class="danger-zone-actions">
        <button type="button" class="danger-zone-btn"
                @click="mergeEntity(k)" :disabled="!mergeReady(k)">
          <span x-show="mergeBusy === k" class="spinner"></span>
          <span x-text="$app.t('merge.button')"></span>
        </button>
      </div>
    </div>
  </template>

  <p class="card-form-hint" x-text="$app.t('merge.hint')"></p>
  <p class="card-form-saved" x-show="mergeMessage" x-cloak x-transition.opacity.duration.250ms x-text="mergeMessage"></p>
  <p class="card-form-error" x-show="mergeError" x-text="mergeError"></p>
</div>
