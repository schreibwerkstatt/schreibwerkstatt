<!-- App-eigene Revisionsliste pro Seite.
     Container in editor.html hat display:contents, damit dieser Wrapper
     direkt Geschwister im Editor-Layout bleibt. Collapsible via
     `collapsible` (DESIGN.md), Zustand an `listOpen` der Karte gekoppelt.
     Angeheftete Revisionen oben, darunter die Geschichte nach Tag, je Tag in Sitzungen.
     Zeile: page-revisions-row.html, Viewer: page-revisions-viewer.html. -->
<div x-data="pageRevisionsCard"
     x-show="$app.currentPage && (revisions.length > 0 || pinnedRevs.length > 0)"
     class="history-bar page-revisions-bar">
  <div x-data="collapsible()" x-modelable="open" x-model="listOpen">
    <button type="button" class="collapsible-toggle" x-bind="trigger">
      <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
      <span x-text="$app.t('editor.revisions.count', { n: total || revisions.length })"></span>
    </button>
    <!-- Filter: nur, wenn es etwas zu waehlen gibt. Wirkt auf die geladenen
         Versionen; Vorgaengerin und Delta rechnen trotzdem gegen alle.
         Ausserhalb des Panels, weil `x-collapse` dort `overflow: hidden` haelt
         und das Combobox-Dropdown abschnitte. -->
    <div class="page-revisions-filters" x-show="listOpen && (hasSourceChoice() || hasUserChoice())" x-cloak>
      <label class="page-revisions-filter" x-show="hasSourceChoice()">
        <span x-text="$app.t('editor.revisions.filter.source')"></span>
        <div x-data="combobox($app.t('editor.revisions.filter.allSources'), $app.t('editor.revisions.filter.allSources'))"
             x-modelable="value" x-model="filterSource"
             x-effect="options = [...new Set(revisions.map(r => r.source))].map(s => ({ value: s, label: sourceLabel(s) }))"></div>
      </label>
      <label class="page-revisions-filter" x-show="hasUserChoice()">
        <span x-text="$app.t('editor.revisions.filter.user')"></span>
        <div x-data="combobox($app.t('editor.revisions.filter.allUsers'), $app.t('editor.revisions.filter.allUsers'))"
             x-modelable="value" x-model="filterUser"
             x-effect="options = [...new Set(revisions.map(r => r.user_email || ''))].filter(Boolean).map(e => ({ value: e, label: userLabel(e) }))"></div>
      </label>
      <span class="tag" x-show="isFiltered()"
            x-text="$app.t('editor.revisions.filter.hint', { shown: _visibleRevisions().length, loaded: revisions.length })"></span>
    </div>

    <div x-bind="panel" x-cloak>
      <div class="page-revisions-list">
  
        <!-- Angeheftet: unabhaengig vom geladenen Fenster, ohne Filter. -->
        <template x-if="pinnedRevs.length > 0">
          <div class="page-revisions-section">
            <div class="page-revisions-section__head" x-text="$app.t('editor.revisions.pinnedHead')"></div>
            <template x-for="row in pinnedRows()" :key="row.k">
              <!-- @include page-revisions-row -->
            </template>
          </div>
        </template>
  
        <!-- Geschichte nach Kalendertag (App-Zeitzone); Tageskopf mit dem
             Zeichen-Delta des Tages (gefiltert: der angezeigten Sitzungen),
             Zeilen zeigen nur die Uhrzeit. -->
        <template x-for="day in listDays()" :key="day.key">
          <section class="page-revisions-day">
            <div class="page-revisions-day__head">
              <span class="page-revisions-day__label" x-text="dayLabel(day)"></span>
              <span class="page-revisions-day__date" x-show="dayHasRelative(day)" x-text="dayDate(day)"></span>
              <template x-if="day.delta !== null">
                <span class="tag revision-delta"
                      :class="deltaClass(day.delta)"
                      :data-tip="dayDeltaTip()"
                      x-text="formatDelta(day.delta)"></span>
              </template>
            </div>
            <template x-for="row in day.rows" :key="row.k">
              <!-- @include page-revisions-row -->
            </template>
          </section>
        </template>
  
        <!-- Nachladen. Die Liste ist ein Fenster (Default 100 juengste), nicht die
             ganze Historie: das `raw`-Bucket der Retention haelt jeden Autosave der
             letzten 24 h, ein Schreibtag fuellt das Fenster also allein. Ohne diesen
             Knopf bleibt die getierte Historie (Tage/Wochen/Monate/Jahre) dahinter
             unerreichbar. Reihenfolge Hinweis-vor-Knopf ist Absicht: .btn-toggle-saved
             traegt in dieser Liste `margin-left: auto`. -->
        <div class="history-item" x-show="hasMore" x-cloak>
          <span class="tag"
                x-text="$app.t('editor.revisions.windowHint', { shown: revisions.length, total: total })"></span>
          <button type="button"
                  class="btn-toggle-saved btn-toggle-saved--off"
                  @click="loadMore()"
                  :disabled="loadingMore"
                  :data-tip="$app.t('editor.revisions.loadMoreTitle')"
                  x-text="loadingMore ? $app.t('editor.revisions.loadingMore') : $app.t('editor.revisions.loadMore')"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- @include page-revisions-viewer -->
</div>
