<!-- Admin-Usage-Dashboard -->
<!--
  Sub-Komponente — siehe public/js/cards/admin-usage-card.js.
  `showAdminUsageCard` + `toggleAdminUsageCard` im Root. Sichtbar nur bei
  $store.session.currentUser.isAdmin (Frontend-Guard zusaetzlich zum Server-side
  requireAdmin). Privacy-Boundary: keine Buchtitel, kein Inhalt — Admin
  sieht USD/Tokens + anonyme book_id.
-->
<div class="card card--admin-usage" x-data="adminUsageCard" x-show="$app.showAdminUsageCard" x-cloak>
  <div class="card-header">
    <span class="card-title" x-text="$app.t('admin.usage.title')"></span>
    <div class="card-actions">
      <button type="button" class="icon-btn icon-btn--ghost" @click="adminUsageLoadTab(true)" :disabled="adminUsageLoading" :class="adminUsageLoading ? 'admin-usage-refresh--busy' : ''" :data-tip="$app.t('common.refresh')" :aria-label="$app.t('common.refresh')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg></button>
    </div>
  </div>

  <!-- Tab-Bar: tabs() liefert Rolle, Roving-Tabindex und Pfeil-Navigation;
       die Panes (role=tabpanel) bleiben x-show auf adminUsageTab. -->
  <div class="admin-usage-tabs" x-data="tabs(['users','jobs','chat','summary','features','time','behavior','billing'])"
       x-modelable="value" x-model="adminUsageTab">
    <div class="tabs tabs--scrollable" x-bind="tablist" :aria-label="$app.t('admin.usage.title')">
      <template x-for="tab in tabs" :key="tab">
        <button class="tabs-btn" x-bind="tabBtn(tab)"
                :id="'admin-usage-tab-' + tab" :aria-controls="'admin-usage-pane-' + tab"
                x-text="$app.t('admin.usage.tab.' + tab)"></button>
      </template>
    </div>
  </div>

  <!-- Datumsbereich -->
  <div class="admin-usage-range">
    <label>
      <span x-text="$app.t('admin.usage.from')"></span>
      <input type="date" x-model.debounce.400ms="adminUsageFrom">
    </label>
    <label>
      <span x-text="$app.t('admin.usage.to')"></span>
      <input type="date" x-model.debounce.400ms="adminUsageTo">
    </label>
    <div x-data="toggleSwitch({ label: () => $app.t('admin.usage.includeAdmins') })"
         x-modelable="value" x-model="adminUsageIncludeAdmins" @toggle-change="adminUsageIncludeAdmins = $event.detail; adminUsageLoadTab()"></div>
  </div>

  <div x-show="adminUsageError" class="error-msg" x-text="adminUsageError"></div>

  <!-- ── Users-Tab ─────────────────────────────────────────────────────── -->
  <div x-show="adminUsageTab === 'users'" class="admin-usage-pane" :aria-busy="adminUsageLoading"
       id="admin-usage-pane-users" role="tabpanel" aria-labelledby="admin-usage-tab-users">
    <div class="table-scroll" x-show="adminUsageUsersList.length">
    <table class="data-table"
           x-data="sortableTable({
             rows: () => adminUsageUsersList,
             defaultKey: 'usd',
             defaultDir: 'desc',
             persistKey: 'admin.usage.users',
             types: { usd: 'number', tokensIn: 'number', tokensOut: 'number' },
           })">
      <thead>
        <tr>
          <th x-bind="sortTh('email')" x-text="$app.t('admin.users.email')"></th>
          <th x-bind="sortTh('usd')" x-text="$app.t('admin.usage.column.cost')"></th>
          <th x-bind="sortTh('tokensIn')" x-text="$app.t('admin.usage.column.tokensIn')"></th>
          <th x-bind="sortTh('tokensOut')" x-text="$app.t('admin.usage.column.tokensOut')"></th>
          <th x-text="$app.t('admin.usage.user.budget')"></th>
          <th x-text="$app.t('admin.usage.user.mode')"></th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="u in sorted" :key="u.email">
          <tr :class="u.overrun ? 'admin-usage-row--overrun' : ''">
            <td class="admin-usage-cell-email">
              <div x-text="u.displayName || u.email"></div>
              <div class="muted-msg muted-msg--sm" x-text="u.email"></div>
            </td>
            <td class="admin-usage-cell-num" x-text="adminUsageMoney(u.usd)"></td>
            <td class="admin-usage-cell-num" x-text="adminUsageInt(u.tokensIn)"></td>
            <td class="admin-usage-cell-num" x-text="adminUsageInt(u.tokensOut)"></td>
            <td class="admin-usage-cell-shrink">
              <input type="text"
                     x-data="numInput({ step: 0.01, min: 0 })"
                     x-modelable="value" x-model="u._draftBudget"
                     :placeholder="$app.t('admin.usage.user.noBudget')"
                     class="admin-usage-budget-input">
            </td>
            <td class="admin-usage-cell-shrink">
              <div x-data="combobox($app.t('admin.usage.user.mode.none'))"
                   x-modelable="value" x-model="u._draftMode"
                   x-effect="options = [{ value: 'none', label: $app.t('admin.usage.user.mode.none') }, { value: 'soft', label: $app.t('admin.usage.user.mode.soft') }, { value: 'hard', label: $app.t('admin.usage.user.mode.hard') }]"></div>
            </td>
            <td class="admin-usage-cell-shrink">
              <div class="admin-usage-actions">
                <button type="button" @click="adminUsageSaveBudget(u)" :disabled="u._saving"
                        x-text="u._saving ? $app.t('common.saving') : (u._saved ? $app.t('common.saved') : $app.t('common.save'))"></button>
                <button type="button" @click="adminUsageDrillDownToJobs(u.email)"
                        x-text="$app.t('admin.usage.user.drillDown')"></button>
                <button type="button" @click="adminUsageShowBreakdown(u.email)" :aria-pressed="adminUsageBreakdownUser === u.email"
                        x-text="$app.t('admin.usage.breakdown.show')"></button>
              </div>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
    </div>
    <div x-show="!adminUsageUsersList.length && !adminUsageLoading" class="muted-msg" x-text="$app.t('admin.usage.empty')"></div>
    <div id="partial-admin-usage-breakdown"></div>
  </div>

  <div id="partial-admin-usage-jobs"></div>
  <!-- ── Chat-Tab ──────────────────────────────────────────────────────── -->
  <div x-show="adminUsageTab === 'chat'" class="admin-usage-pane" :aria-busy="adminUsageLoading"
       id="admin-usage-pane-chat" role="tabpanel" aria-labelledby="admin-usage-tab-chat">
    <div id="partial-admin-usage-chat-quality"></div>
    <div id="partial-admin-usage-chat-list"></div>
  </div>

  <!-- ── Summary-Tab ───────────────────────────────────────────────────── -->
  <div x-show="adminUsageTab === 'summary'" class="admin-usage-pane" :aria-busy="adminUsageLoading"
       id="admin-usage-pane-summary" role="tabpanel" aria-labelledby="admin-usage-tab-summary">
    <div x-show="!adminUsageSummary && !adminUsageLoading" class="muted-msg" x-text="$app.t('admin.usage.empty')"></div>
    <div class="admin-usage-totals" x-show="adminUsageSummary">
      <div class="admin-usage-kpi">
        <div class="admin-usage-kpi-label" x-text="$app.t('admin.usage.summary.total')"></div>
        <div class="admin-usage-kpi-value" x-text="adminUsageMoney(adminUsageSummary?.totals?.usd)"></div>
      </div>
      <div class="admin-usage-kpi">
        <div class="admin-usage-kpi-label" x-text="$app.t('admin.usage.column.tokensIn')"></div>
        <div class="admin-usage-kpi-value" x-text="adminUsageInt(adminUsageSummary?.totals?.tokensIn)"></div>
      </div>
      <div class="admin-usage-kpi">
        <div class="admin-usage-kpi-label" x-text="$app.t('admin.usage.column.tokensOut')"></div>
        <div class="admin-usage-kpi-value" x-text="adminUsageInt(adminUsageSummary?.totals?.tokensOut)"></div>
      </div>
      <div class="admin-usage-kpi">
        <div class="admin-usage-kpi-label" x-text="$app.t('admin.usage.column.cacheRead')"></div>
        <div class="admin-usage-kpi-value" x-text="adminUsageInt(adminUsageSummary?.totals?.cacheReadIn)"></div>
      </div>
      <div class="admin-usage-kpi">
        <div class="admin-usage-kpi-label" x-text="$app.t('admin.usage.column.cacheWrite')"></div>
        <div class="admin-usage-kpi-value" x-text="adminUsageInt(adminUsageSummary?.totals?.cacheCreationIn)"></div>
      </div>
    </div>

    <div class="admin-usage-charts" x-show="adminUsageSummary">
      <figure>
        <figcaption x-text="$app.t('admin.usage.summary.topUsers')"></figcaption>
        <div class="admin-usage-chart-canvas" x-show="adminUsageSummary?.topUsers?.length">
          <canvas x-ref="chartUsers" role="img" :aria-label="$app.t('admin.usage.summary.topUsers')"></canvas>
        </div>
        <p class="muted-msg muted-msg--sm" x-show="!adminUsageSummary?.topUsers?.length" x-text="$app.t('admin.usage.empty')"></p>
      </figure>
      <figure>
        <figcaption x-text="$app.t('admin.usage.summary.byModel')"></figcaption>
        <div class="admin-usage-chart-canvas" x-show="adminUsageSummary?.byModel?.length">
          <canvas x-ref="chartModel" role="img" :aria-label="$app.t('admin.usage.summary.byModel')"></canvas>
        </div>
        <p class="muted-msg muted-msg--sm" x-show="!adminUsageSummary?.byModel?.length" x-text="$app.t('admin.usage.empty')"></p>
      </figure>
      <figure>
        <figcaption x-text="$app.t('admin.usage.summary.byType')"></figcaption>
        <div class="admin-usage-chart-canvas" x-show="adminUsageSummary?.byType?.length">
          <canvas x-ref="chartType" role="img" :aria-label="$app.t('admin.usage.summary.byType')"></canvas>
        </div>
        <p class="muted-msg muted-msg--sm" x-show="!adminUsageSummary?.byType?.length" x-text="$app.t('admin.usage.empty')"></p>
      </figure>
    </div>
  </div>

  <div id="partial-admin-usage-features"></div>
  <div id="partial-admin-usage-time"></div>
  <div id="partial-admin-usage-behavior"></div>
  <div id="partial-admin-usage-billing"></div>
</div>
