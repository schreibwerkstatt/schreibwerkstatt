<!-- Admin-Usage → Chat-Tab: Chat-Qualitaet je Chat-Art -->
<!--
  Sub-Partial von admin-usage.html (Scope: adminUsageCard), oben im Chat-Tab.
  Quelle: GET /admin/usage/chat-quality (db/chat-quality.js) — Zaehler je
  Chat-Art (page/book/research), keine Chat-Texte. Zeitraum + „Admins
  einbeziehen" wirken, der User-Filter der Nachrichtenliste darunter nicht.
-->
<section class="card-section" x-show="adminUsageChatQuality.length">
  <h4 class="card-section-title" x-text="$app.t('admin.usage.chatQuality.title')"></h4>
  <p class="card-hint card-hint--sm" x-text="$app.t('admin.usage.chatQuality.hint')"></p>
  <div class="table-scroll">
  <table class="data-table"
         x-data="sortableTable({
           rows: () => adminUsageChatQuality,
           defaultKey: 'answers',
           defaultDir: 'desc',
           persistKey: 'admin.usage.chatQuality',
           types: { answers: 'number', errors: 'number', errorRate: 'number', cancelled: 'number',
                    feedbackUp: 'number', feedbackDown: 'number', upShare: 'number',
                    repeats: 'number', usd: 'number', usdPerAnswer: 'number' },
         })">
    <thead>
      <tr>
        <th x-bind="sortTh('label')" x-text="$app.t('admin.usage.chat.kind')"></th>
        <th x-bind="sortTh('answers')" x-text="$app.t('admin.usage.chatQuality.answers')"></th>
        <th x-bind="sortTh('errors')" x-text="$app.t('admin.usage.chatQuality.errors')"></th>
        <th x-bind="sortTh('errorRate')" x-text="$app.t('admin.usage.chatQuality.errorRate')"></th>
        <th x-bind="sortTh('cancelled')" x-text="$app.t('admin.usage.chatQuality.cancelled')"></th>
        <th x-bind="sortTh('feedbackUp')" x-text="$app.t('admin.usage.chatQuality.up')"></th>
        <th x-bind="sortTh('feedbackDown')" x-text="$app.t('admin.usage.chatQuality.down')"></th>
        <th x-bind="sortTh('upShare')" x-text="$app.t('admin.usage.chatQuality.upShare')"></th>
        <th x-bind="sortTh('repeats')" x-text="$app.t('admin.usage.chatQuality.repeats')"></th>
        <th x-bind="sortTh('usd')" x-text="$app.t('admin.usage.column.cost')"></th>
        <th x-bind="sortTh('usdPerAnswer')" x-text="$app.t('admin.usage.chatQuality.costPerAnswer')"></th>
      </tr>
    </thead>
    <tbody>
      <template x-for="r in sorted" :key="r.kind">
        <tr>
          <td x-text="r.label"></td>
          <td class="admin-usage-cell-num" x-text="adminUsageInt(r.answers)"></td>
          <td class="admin-usage-cell-num" x-text="adminUsageInt(r.errors)"></td>
          <td class="admin-usage-cell-num" x-text="adminUsagePct(r.errorRate)"></td>
          <td class="admin-usage-cell-num" x-text="adminUsageInt(r.cancelled)"></td>
          <td class="admin-usage-cell-num" x-text="adminUsageInt(r.feedbackUp)"></td>
          <td class="admin-usage-cell-num" x-text="adminUsageInt(r.feedbackDown)"></td>
          <td class="admin-usage-cell-num" x-text="adminUsagePct(r.upShare)"></td>
          <td class="admin-usage-cell-num" x-text="adminUsageInt(r.repeats) + (r.repeatShare != null ? ' (' + adminUsagePct(r.repeatShare) + ')' : '')"></td>
          <td class="admin-usage-cell-num" x-text="adminUsageMoney(r.usd)"></td>
          <td class="admin-usage-cell-num" x-text="adminUsageMoney(r.usdPerAnswer)"></td>
        </tr>
      </template>
    </tbody>
  </table>
  </div>
</section>
