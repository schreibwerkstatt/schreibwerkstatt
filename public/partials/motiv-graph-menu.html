<!-- Graph-Kontextmenü (Fragment-Include aus motiv.html) — ein einzelnes, aus dem
     Graph heraus teleportiertes .context-menu (Mechanik aus action-menu.js). Der
     Graph sitzt in einem eigenen Canvas-Container; cursor-verankert an die
     Rechtsklick-Position. Läuft im Scope der motivCard (Include vor Alpine-Init).
     Ziel ist die Karten-Wurzel, NICHT <body>: im Native-Vollbild (toggleMotivFullscreen
     auf .card--motiv) rendert nur der Teilbaum des Fullscreen-Elements über dem
     ::backdrop — ein body-Kind läge dahinter und wäre unsichtbar. `position: fixed`
     bleibt viewport-verankert (die Karte etabliert keinen Containing-Block: die
     cardFadeIn-Animation läuft mit `backwards`, lässt also keinen Transform stehen). -->
<template x-teleport=".card--motiv">
  <div class="context-menu" x-ref="actionMenu" x-bind="actionMenuPanel()" x-cloak>
    <!-- Thema-Knoten -->
    <template x-if="graphMenuKind() === 'theme' && graphMenuTheme()">
      <div>
        <div class="context-menu-header" x-text="graphMenuTheme().name"></div>
        <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon"
                @click="selectTheme(graphMenuTheme().id)">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#pencil"/></svg>
          <span x-text="$app.t('motiv.graph.menu.editTheme')"></span>
        </button>
        <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon"
                @click="createMotifAt(graphMenuTheme().id)">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
          <span x-text="$app.t('motiv.graph.menu.addMotif')"></span>
        </button>
        <div class="context-menu-sep" role="separator"></div>
        <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon context-menu-item--danger"
                @click="deleteTheme(graphMenuTheme())">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
          <span x-text="$app.t('motiv.graph.menu.deleteTheme')"></span>
        </button>
      </div>
    </template>

    <!-- Motiv-Knoten -->
    <template x-if="graphMenuKind() === 'motif' && graphMenuMotif()">
      <div>
        <div class="context-menu-header" x-text="graphMenuMotif().name"></div>
        <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon"
                @click="selectMotif(graphMenuMotif().id)">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#pencil"/></svg>
          <span x-text="$app.t('motiv.graph.menu.editMotif')"></span>
        </button>
        <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon"
                @click="createMotifAt(graphMenuMotif().theme_id || null)">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
          <span x-text="$app.t('motiv.graph.menu.addMotif')"></span>
        </button>
        <div class="context-menu-sep" role="separator"></div>
        <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon context-menu-item--danger"
                @click="deleteMotif(graphMenuMotif())">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
          <span x-text="$app.t('motiv.graph.menu.deleteMotif')"></span>
        </button>
      </div>
    </template>

    <!-- Leere Fläche -->
    <template x-if="graphMenuKind() === 'canvas'">
      <div>
        <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon"
                @click="createMotifAt(null)">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
          <span x-text="$app.t('motiv.graph.menu.addMotif')"></span>
        </button>
        <button type="button" role="menuitem" class="context-menu-item context-menu-item--icon"
                @click="createThemeQuick()">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
          <span x-text="$app.t('motiv.graph.menu.addTheme')"></span>
        </button>
      </div>
    </template>
  </div>
</template>
