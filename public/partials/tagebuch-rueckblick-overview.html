  <!-- Navigation (Leiste der Rückblick-Karte): Kalender aus der Coverage —
       Monate und Jahr als Zellen, Rückblick = Akzentfläche mit Häkchen — und
       die Liste der Läufe (je Zeitraum gruppiert). Ein Klick wählt den
       Zeitraum; was er zeigt, entscheidet der Hauptbereich. -->
  <div class="card card--tagebuchRueckblick rb-nav aside-split-aside" x-show="rbHasCalendar()" x-cloak>
    <div class="card-section-head">
      <div class="tabs rb-history-tabs">
        <button :aria-pressed="rbHistoryView === 'cal'" type="button" class="tabs-btn" :class="{ 'tabs-btn--active': rbHistoryView === 'cal' }"
                @click="rbHistoryView = 'cal'" x-text="$app.t('rueckblick.viewCalendar')"></button>
        <button :aria-pressed="rbHistoryView === 'list'" type="button" class="tabs-btn" :class="{ 'tabs-btn--active': rbHistoryView === 'list' }"
                :disabled="!rueckblickHistory.length"
                @click="rbHistoryView = 'list'" x-text="$app.t('rueckblick.viewList')"></button>
      </div>
    </div>

    <!-- Kalender (Jahr×Monat + Jahres-Spalte, components/year-month-heatmap.css) -->
    <div class="ymheat rb-ymheat aside-split-scroll" x-show="rbHistoryView === 'cal' || !rueckblickHistory.length">
      <p class="ymheat-summary" x-text="rbCalSummary()"></p>
      <div class="ymheat-scroll">
        <div class="ymheat-grid">
          <div class="ymheat-row ymheat-row--head">
            <span class="ymheat-corner"></span>
            <template x-for="(mLabel, mi) in rbMonthLabels()" :key="mi">
              <span class="ymheat-month-label truncate" x-text="mLabel"></span>
            </template>
            <span class="ymheat-month-label ymheat-month-label--year" x-text="$app.t('rueckblick.grain.year')"></span>
          </div>
          <template x-for="row in rueckblickCalendar().years" :key="row.year">
            <div class="ymheat-row">
              <span class="ymheat-year" :class="{ 'ymheat-year--active': String(rueckblickZeitraum).startsWith(row.yearKey) }"
                    x-text="row.year"></span>
              <template x-for="cell in [...row.months, row.yearCell]" :key="cell.key">
                <button type="button" class="ymheat-cell" :aria-current="cell.key === rueckblickZeitraum ? 'true' : null"
                        :class="rbCalCellClass(cell)"
                        :disabled="rueckblickLoading || (!cell.hasRueckblick && !cell.hasEntries)"
                        @click="openCalendarCell(cell)" :data-tip="rbCalCellTip(cell)" :aria-label="rbCalCellTip(cell)"></button>
              </template>
            </div>
          </template>
        </div>
      </div>
      <div class="ymheat-legend">
        <span class="ymheat-cell ymheat-cell--has"></span>
        <span class="ymheat-legend-label" x-text="$app.t('rueckblick.cal.legendHas')"></span>
        <span class="ymheat-cell ymheat-cell--has ymheat-cell--stale"></span>
        <span class="ymheat-legend-label" x-text="$app.t('rueckblick.cal.legendStale')"></span>
        <span class="ymheat-cell ymheat-cell--current ymheat-cell--lvl0"></span>
        <span class="ymheat-legend-label" x-text="$app.t('rueckblick.cal.legendCurrent')"></span>
      </div>
      <div class="ymheat-legend">
        <span class="ymheat-cell ymheat-cell--lvl0"></span>
        <span class="ymheat-legend-label" x-text="$app.t('rueckblick.cal.legendNone')"></span>
        <span class="ymheat-cell ymheat-cell--lvl1"></span>
        <span class="ymheat-cell ymheat-cell--lvl2"></span>
        <span class="ymheat-cell ymheat-cell--lvl3"></span>
        <span class="ymheat-cell ymheat-cell--lvl4"></span>
        <span class="ymheat-legend-label" x-text="$app.t('rueckblick.cal.legendDensity')"></span>
      </div>
    </div>

    <!-- Liste: eine Zeile je Zeitraum (jüngster Lauf), ältere Läufe einklappbar;
         Suche über Zeitraum + Inhalt -->
    <div class="aside-split-scroll rb-history-list" x-show="rbHistoryView === 'list' && rueckblickHistory.length" x-cloak>
      <div class="filter-bar" x-show="rueckblickHistory.length > 2">
        <span class="filter-search-wrap rb-history-search-wrap">
          <input type="text" class="filter-search-input" x-model="rbHistorySearch"
                 :placeholder="$app.t('rueckblick.historySearch')" :aria-label="$app.t('rueckblick.historySearch')">
          <button type="button" class="search-clear--icon" x-show="rbHistorySearch" @click="rbHistorySearch=''"
                  :aria-label="$app.t('search.clear')" :data-tip="$app.t('search.clear')">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg>
          </button>
        </span>
      </div>
      <template x-for="group in groupedRueckblickHistory()" :key="group.zeitraum">
        <div class="rb-history-group" x-data="collapsible()">
          <template x-for="entry in [group.latest]" :key="entry.id">
            <!-- @include tagebuch-rueckblick-history-row -->
          </template>
          <button type="button" class="collapsible-toggle rb-history-older-toggle" x-show="group.older.length" x-bind="trigger">
            <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
            <span x-text="rbOlderRunsLabel(group.older.length)"></span>
          </button>
          <div x-bind="panel" x-cloak>
            <div class="rb-history-older">
              <template x-for="entry in group.older" :key="entry.id">
                <!-- @include tagebuch-rueckblick-history-row -->
              </template>
            </div>
          </div>
        </div>
      </template>
      <p class="muted-msg muted-msg--sm" x-show="rbHistorySearch && !filteredRueckblickHistory().length" x-cloak
         x-text="$app.t('rueckblick.historyNoMatch')"></p>
    </div>
  </div>
