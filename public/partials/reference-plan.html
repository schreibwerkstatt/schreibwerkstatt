<!--
  Plan-Reiter im Referenz-Panel neben dem Notebook-Editor: die Beats des
  Beat-Boards für das offene Kapitel (bzw. das ganze Buch im Buch-Scope).
  Fragment-Include (Marker @include reference-plan in reference.html), Methoden
  aus cards/reference-plan.js. Read-only — gepflegt wird im Board, jede Zeile
  springt dorthin.
-->
<template x-if="referenceTab === 'plan'">
<div class="reference-panel" x-data="{ rowKind: 'beat' }">
  <div x-show="referencePlanLoading" x-skeleton="4" x-cloak></div>
  <div class="search-status search-status--error" x-show="referencePlanError && !referencePlanLoading"
       x-text="referencePlanError"></div>
  <template x-if="!referencePlanLoading && !referencePlanError && referencePlanBeats().length === 0">
    <div class="muted-msg muted-msg--sm muted-msg--block" x-text="$app.t('reference.empty.plan')"></div>
  </template>
  <template x-for="row in referencePlanBeats()" :key="'rp-' + row.id">
    <div class="reference-row reference-row--clickable internal-link" @click="openReferenceBeat(row)" data-ref-jump
         :data-tip="$app.t('reference.plan.openTip')">
      <div class="reference-row-head">
        <span class="reference-row-title" x-text="row.titel"></span>
        <span x-show="row.status" class="tag" x-text="referencePlanStatus(row)"></span>
        <span x-show="row.refCtx === 'chapter'" class="tag" :data-tip="$app.t('reference.plan.chapterTip')" x-text="$app.t('reference.ctx.chapter')"></span>
      </div>
      <div class="reference-row-sub" x-show="referencePlanMeta(row)" x-text="referencePlanMeta(row)"></div>
      <div class="reference-row-desc" x-show="row.beschreibung" x-text="row.beschreibung"></div>
      <!-- @include reference-row-tail -->
    </div>
  </template>
</div>
</template>
