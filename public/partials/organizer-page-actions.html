<!--
  Geteilte Aktions-Spalte einer Organizer-Seitenzeile: Sync-Provider-Badges,
  „Verschieben nach Kapitel", „In anderes Buch" und Löschen. Identisch in der
  Solo-Liste und allen drei Kapitel-Tiefen → SSoT als string-seitiger Fragment-
  Include (Marker @include organizer-page-actions, app-ui.js#_resolveIncludes),
  pro x-for-Iteration geklont. `page` + `$syncProviders` stammen aus dem
  umschliessenden x-for-Scope; das aktuelle Kapitel kommt aus `page.chapter_id`
  (0 = Top-Level), damit das Markup tiefenunabhängig ist.
-->
<template x-for="prov in $syncProviders" :key="prov.key">
  <span class="sync-provider display-contents" :class="'sync-provider--' + prov.key">
    <template x-if="prov.card.statusFor(page)">
      <span class="badge" :class="'badge--sync-' + prov.card.statusFor(page)"
            :data-tip="prov.card.statusLabel(prov.card.statusFor(page))"
            x-text="prov.card.statusLabel(prov.card.statusFor(page))"></span>
    </template>
    <template x-if="prov.card.canPush(page) || prov.card.pushBusy[page.id]">
      <button type="button" class="btn-compact organizer-sync-push"
              @click="prov.card.push(page.id)"
              :disabled="!!prov.card.pushBusy[page.id]"
              :data-tip="$app.t(prov.key + '.action.push')"
              :aria-label="$app.t(prov.key + '.action.push')">
        <template x-if="!prov.card.pushBusy[page.id]">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#arrow-up"/></svg>
        </template>
        <template x-if="prov.card.pushBusy[page.id]">
          <span class="display-contents">
            <span class="spinner" aria-hidden="true"></span>
            <span class="organizer-sync-push-pct" x-text="(prov.card.pushProgress[page.id] || 0) + '%'"></span>
          </span>
        </template>
      </button>
    </template>
    <template x-if="prov.card.hasConflict && prov.card.statusFor(page) === 'conflict'">
      <button type="button" class="btn-compact organizer-sync-conflict"
              @click="prov.card.openConflict(page.id)"
              :data-tip="$app.t(prov.key + '.action.resolveConflict')"
              x-text="$app.t(prov.key + '.action.resolveConflict')"></button>
    </template>
  </span>
</template>
<!--
  Redaktions-Status (nur journalistische Buecher, Gate kommt vom Server als
  `redaktionEnabled`). Zwei Elemente mit klarer Rollenteilung: die Plakette ZEIGT
  die Stufe, die transiente Combobox SETZT sie. Ein einzelnes gebundenes
  Auswahlfeld waere schmaler, koennte aber den Stale-Zustand nicht ausdruecken —
  und genau der ist der Grund fuer die Spalte.

  Alle drei Zeilen-Comboboxen sind „lazy": sichtbar ist ein gleich aussehender
  Platzhalter-Trigger, die echte Combobox montiert erst beim Klick (autoOpen)
  und baut sich beim Schliessen wieder ab (view.js#isRowCombo/openRowCombo/
  closeRowCombo). Grund: drei echte Instanzen pro Seitenzeile skalieren nicht.
-->
<template x-if="redaktionEnabled">
  <span class="organizer-redaktion display-contents">
    <template x-if="redaktionOf(page.id)">
      <span class="badge organizer-redaktion-badge"
            :class="'badge--redaktion-' + redaktionOf(page.id).status
                    + (redaktionOf(page.id).stale ? ' organizer-redaktion-badge--stale' : '')"
            :data-tip="redaktionTip(page.id)"
            x-text="redaktionLabel(redaktionOf(page.id).status)"></span>
    </template>
    <template x-if="!isRowCombo(page.id, 'redaktion')">
      <div class="combobox-wrap combobox-wrap--compact organizer-redaktion-combo">
        <button type="button" class="combobox-trigger" aria-haspopup="listbox" aria-expanded="false"
                :data-row-combo="page.id + ':redaktion'"
                @click="openRowCombo(page.id, 'redaktion')"
                :aria-label="$app.t('redaktion.setStatus')">
          <span class="combobox-value" x-text="$app.t('redaktion.setStatus')"></span>
          <svg class="combobox-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M1.5 3.5L5 7L8.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </template>
    <template x-if="isRowCombo(page.id, 'redaktion')">
      <div class="organizer-redaktion-combo"
           x-data="combobox({ placeholder: $app.t('redaktion.setStatus'), transient: true, autoOpen: true })"
           x-effect="options = redaktionOptions()"
           @combobox-change="setRedaktion(page.id, $event.detail)"
           @combobox-close="closeRowCombo(page.id, 'redaktion', $event)"></div>
    </template>
  </span>
</template>
<template x-if="!isRowCombo(page.id, 'chapter')">
  <div class="combobox-wrap combobox-wrap--compact organizer-move-combo">
    <button type="button" class="combobox-trigger" aria-haspopup="listbox" aria-expanded="false"
            :data-row-combo="page.id + ':chapter'"
            @click="openRowCombo(page.id, 'chapter')"
            :aria-label="$app.t('bookOrganizer.moveTo')">
      <span class="combobox-value" x-text="$app.t('bookOrganizer.moveTo')"></span>
      <svg class="combobox-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M1.5 3.5L5 7L8.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</template>
<template x-if="isRowCombo(page.id, 'chapter')">
  <div class="organizer-move-combo"
       x-data="combobox({ placeholder: $app.t('bookOrganizer.moveTo'), transient: true, autoOpen: true })"
       x-effect="options = chapterMoveOptions(page.chapter_id || 0)"
       @combobox-change="movePageToChapter(page.id, $event.detail)"
       @combobox-close="closeRowCombo(page.id, 'chapter', $event)"></div>
</template>
<template x-if="bookMoveOptions().length">
  <span class="display-contents">
    <template x-if="!isRowCombo(page.id, 'book')">
      <div class="combobox-wrap combobox-wrap--compact organizer-move-combo">
        <button type="button" class="combobox-trigger" aria-haspopup="listbox" aria-expanded="false"
                :data-row-combo="page.id + ':book'"
                @click="openRowCombo(page.id, 'book')"
                :aria-label="$app.t('bookOrganizer.moveToBook')">
          <span class="combobox-value" x-text="$app.t('bookOrganizer.moveToBook')"></span>
          <svg class="combobox-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M1.5 3.5L5 7L8.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </template>
    <template x-if="isRowCombo(page.id, 'book')">
      <div class="organizer-move-combo"
           x-data="combobox({ placeholder: $app.t('bookOrganizer.moveToBook'), transient: true, autoOpen: true })"
           x-effect="options = bookMoveOptions()"
           @combobox-change="movePageToBook(page.id, $event.detail)"
           @combobox-close="closeRowCombo(page.id, 'book', $event)"></div>
    </template>
  </span>
</template>
<button type="button" class="organizer-delete-btn" @click="deletePage(page.id)" :disabled="organizerSaving"
        :data-tip="$app.t('bookOrganizer.deletePage')" :aria-label="$app.t('bookOrganizer.deletePage')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg></button>
