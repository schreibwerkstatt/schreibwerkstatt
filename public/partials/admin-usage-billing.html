<!-- Admin-Usage → Abrechnung -->
<!--
  Sub-Partial von admin-usage.html (Scope: adminUsageCard). Stellt die von
  Anthropic abgerechneten Kosten (Cost-Report-API, lib/anthropic-billing.js)
  dem App-Ledger gegenueber. Tage sind UTC-Tage, wie die API sie schneidet.
-->
<div x-show="adminUsageTab === 'billing'" class="admin-usage-pane">
  <template x-if="adminUsageBilling && !adminUsageBilling.configured">
    <p class="muted-msg" x-text="$app.t('admin.usage.billing.notConfigured')"></p>
  </template>

  <template x-if="adminUsageBilling?.configured">
    <div>
      <div class="admin-usage-billing-head">
        <span class="muted-msg muted-msg--sm"
              x-text="adminUsageBilling.lastFetchedAt
                ? $app.t('admin.usage.billing.lastFetched', { at: adminUsageDateTime(adminUsageBilling.lastFetchedAt) })
                : $app.t('admin.usage.billing.neverFetched')"></span>
        <button type="button" @click="adminUsageBillingSync()" :disabled="adminUsageBillingSyncing"
                x-text="adminUsageBillingSyncing ? $app.t('admin.usage.billing.syncing') : $app.t('admin.usage.billing.sync')"></button>
      </div>
      <p class="error-msg" x-show="adminUsageBilling.lastError"
         x-text="adminUsageBillingErrorText(adminUsageBilling.lastError)"></p>
      <p class="muted-msg muted-msg--sm"
         x-text="adminUsageBilling.workspace
           ? $app.t('admin.usage.billing.workspaceFiltered', { ws: adminUsageBilling.workspace })
           : $app.t('admin.usage.billing.workspaceAll')"></p>

      <div class="admin-usage-totals">
        <div class="admin-usage-kpi">
          <div class="admin-usage-kpi-label" x-text="$app.t('admin.usage.billing.billed')"></div>
          <div class="admin-usage-kpi-value" x-text="adminUsageMoney(adminUsageBilling.totals.billedUsd)"></div>
        </div>
        <div class="admin-usage-kpi">
          <div class="admin-usage-kpi-label" x-text="$app.t('admin.usage.billing.ledger')"></div>
          <div class="admin-usage-kpi-value" x-text="adminUsageMoney(adminUsageBilling.totals.ledgerUsd)"></div>
        </div>
        <div class="admin-usage-kpi">
          <div class="admin-usage-kpi-label" x-text="$app.t('admin.usage.billing.diff')"></div>
          <div class="admin-usage-kpi-value" :class="adminUsageBillingDiffClass(adminUsageBilling.totals.diffPct)"
               x-text="adminUsageBillingDiff(adminUsageBilling.totals.diffUsd, adminUsageBilling.totals.diffPct)"></div>
        </div>
        <div class="admin-usage-kpi">
          <div class="admin-usage-kpi-label" x-text="$app.t('admin.usage.billing.coveredDays')"></div>
          <div class="admin-usage-kpi-value" x-text="adminUsageInt(adminUsageBilling.totals.coveredDays)"></div>
        </div>
      </div>
      <p class="muted-msg muted-msg--sm" x-text="$app.t('admin.usage.billing.hint')"></p>

      <h4 class="admin-usage-billing-subheading" x-text="$app.t('admin.usage.billing.byModel')"></h4>
      <div class="table-scroll" x-show="adminUsageBilling.models.length">
      <table class="data-table"
             x-data="sortableTable({
               rows: () => adminUsageBilling?.models || [],
               defaultKey: 'billedUsd',
               defaultDir: 'desc',
               persistKey: 'admin.usage.billing.models',
               types: { billedUsd: 'number', ledgerUsd: 'number', diffUsd: 'number' },
             })">
        <thead>
          <tr>
            <th x-bind="sortTh('key')" x-text="$app.t('admin.usage.job.model')"></th>
            <th x-bind="sortTh('billedUsd')" x-text="$app.t('admin.usage.billing.billed')"></th>
            <th x-bind="sortTh('ledgerUsd')" x-text="$app.t('admin.usage.billing.ledger')"></th>
            <th x-bind="sortTh('diffUsd')" x-text="$app.t('admin.usage.billing.diff')"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="m in sorted" :key="m.key">
            <tr>
              <td x-text="adminUsageBillingModelLabel(m.key)"></td>
              <td class="admin-usage-cell-num" x-text="adminUsageMoney(m.billedUsd)"></td>
              <td class="admin-usage-cell-num" x-text="adminUsageMoney(m.ledgerUsd)"></td>
              <td class="admin-usage-cell-num" :class="adminUsageBillingDiffClass(m.diffPct)"
                  x-text="adminUsageBillingDiff(m.diffUsd, m.diffPct)"></td>
            </tr>
          </template>
        </tbody>
      </table>
      </div>

      <h4 class="admin-usage-billing-subheading" x-text="$app.t('admin.usage.billing.byDay')"></h4>
      <div class="table-scroll" x-show="adminUsageBilling.days.length">
      <table class="data-table"
             x-data="sortableTable({
               rows: () => adminUsageBilling?.days || [],
               defaultKey: 'day',
               defaultDir: 'desc',
               persistKey: 'admin.usage.billing.days',
               types: { day: 'string', billedUsd: 'number', ledgerUsd: 'number', diffUsd: 'number' },
             })">
        <thead>
          <tr>
            <th x-bind="sortTh('day')" x-text="$app.t('admin.usage.billing.dayUtc')"></th>
            <th x-bind="sortTh('billedUsd')" x-text="$app.t('admin.usage.billing.billed')"></th>
            <th x-bind="sortTh('ledgerUsd')" x-text="$app.t('admin.usage.billing.ledger')"></th>
            <th x-bind="sortTh('diffUsd')" x-text="$app.t('admin.usage.billing.diff')"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="d in sorted" :key="d.day">
            <tr>
              <td x-text="d.day"></td>
              <td class="admin-usage-cell-num"
                  x-text="d.billedUsd === null ? $app.t('admin.usage.billing.notFetched') : adminUsageMoney(d.billedUsd)"></td>
              <td class="admin-usage-cell-num" x-text="adminUsageMoney(d.ledgerUsd)"></td>
              <td class="admin-usage-cell-num" :class="adminUsageBillingDiffClass(d.diffPct)"
                  x-text="d.billedUsd === null ? '—' : adminUsageBillingDiff(d.diffUsd, d.diffPct)"></td>
            </tr>
          </template>
        </tbody>
      </table>
      </div>

      <template x-if="adminUsageBilling.workspaces.length > 1">
        <div>
          <h4 class="admin-usage-billing-subheading" x-text="$app.t('admin.usage.billing.workspaces')"></h4>
          <p class="muted-msg muted-msg--sm" x-text="$app.t('admin.usage.billing.workspacesHint')"></p>
          <ul class="admin-usage-billing-ws">
            <template x-for="w in adminUsageBilling.workspaces" :key="w.workspace_id || 'default'">
              <li>
                <code x-text="w.workspace_id || 'default'"></code>
                <span class="muted-msg muted-msg--sm" x-text="adminUsageMoney(w.usd)"></span>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </div>
  </template>
</div>
