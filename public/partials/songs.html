<!-- Musik -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/songs-card.js.
  Fachdaten (songs, figuren) leben in Alpine.store('catalog');
  songsFilters, selectedSongId und songsUpdatedAt in Alpine.store('catalogUi').
-->
<div class="card card--songs" x-data="songsCard" x-show="$app.showSongsCard" x-cloak>
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('songs.title')"></span>
      <div class="card-subline" x-show="$store.catalogUi.songsUpdatedAt && !songsLoading">
        <span class="card-timestamp" x-text="$app.t('common.asOf', { date: songsUpdatedLabel() })"></span>
      </div>
    </div>
  </div>

  <div x-show="$store.catalog.songs.length === 0 && !songsLoading" class="card-empty">
    <p class="card-empty-text" x-text="$app.t('common.noAnalysisYet')"></p>
    <button type="button" class="primary card-empty-cta"
            @click="$app.alleAktualisieren()"
            :disabled="$store.jobs.alleAktualisierenLoading || !$store.nav.selectedBookId">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg>
      <span x-text="$app.t('header.updateAll')"></span>
    </button>
  </div>

  <!-- Skeleton -->
  <div x-show="songsLoading && $store.catalog.songs.length === 0" class="entity-skeleton entity-list--accented" x-cloak>
    <template x-for="i in 6" :key="i">
      <div class="entity-skeleton-row">
        <span class="entity-skeleton-cell entity-skeleton-cell--anchor"></span>
        <span class="entity-skeleton-cell entity-skeleton-cell--title"></span>
        <span class="entity-skeleton-cell entity-skeleton-cell--meta"></span>
      </div>
    </template>
  </div>

  <!-- Filter-Leiste -->
  <div x-show="$store.catalog.songs.length > 0" class="filter-bar">
    <span class="filter-search-wrap">
      <input type="text" x-model="$store.catalogUi.songsFilters.suche" :placeholder="$app.t('common.search')" :aria-label="$app.t('common.search')" class="filter-search-input">
      <button type="button" class="search-clear--icon" x-show="$store.catalogUi.songsFilters.suche" @click="$store.catalogUi.songsFilters.suche=''" :aria-label="$app.t('search.clear')" :data-tip="$app.t('search.clear')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
    </span>
    <div x-data="catalogFilter('figur')"
         x-modelable="value" x-model="$store.catalogUi.songsFilters.figurId"
         x-effect="options = $store.catalog.figuren.filter(f => $store.catalog.songs.some(s => (s.figuren || []).some(x => (x.fig_id || x) === f.id))).map(f => ({value: f.id, label: f.kurzname || f.name}))">
    </div>
    <div x-data="catalogFilter('chapter')"
         x-modelable="value" x-model="$store.catalogUi.songsFilters.kapitel"
         x-effect="options = $app.songsKapitelListe().map(k => ({value: k, label: k}))">
    </div>
    <div x-data="combobox($app.t('songs.filter.genre'), $app.t('songs.filter.allGenres'))"
         x-modelable="value" x-model="$store.catalogUi.songsFilters.genre"
         x-effect="options = $app.songsGenreListe().map(g => ({value: g, label: g}))">
    </div>
    <div x-data="combobox($app.t('songs.filter.kontextTyp'), $app.t('songs.filter.allKontextTypen'))"
         x-modelable="value" x-model="$store.catalogUi.songsFilters.kontextTyp"
         x-effect="options = $app.songsKontextTypListe().map(k => ({value: k, label: $app.t('songs.kontextTyp.' + k, { _default: k })}))">
    </div>
    <span class="filter-count" x-text="songsFiltered.length + ' / ' + $store.catalog.songs.length"></span>
  </div>

  <!-- Songliste -->
  <div x-show="$store.catalog.songs.length > 0" class="entity-list entity-list--accented song-list">
    <template x-for="s in songsFiltered" :key="s.id">
      <div>
        <div class="entity-row" :data-song-id="s.id" @click="$store.catalogUi.selectedSongId = $store.catalogUi.selectedSongId === s.id ? null : s.id">
          <span x-show="s.kontext_typ" class="tag entity-typ-tag" x-text="$app.t('songs.kontextTyp.' + s.kontext_typ, { _default: s.kontext_typ })"></span>
          <span class="entity-row-title">
            <span x-text="s.titel"></span>
            <span x-show="s.interpret" class="song-interpret"><span class="song-sep">:</span> <span x-text="s.interpret"></span></span>
          </span>
          <span x-show="s.genre" class="song-genre" x-text="s.genre"></span>
          <template x-if="s.kapitel?.length">
            <span class="entity-refs entity-refs--collapse-mobile">
              <button type="button" class="entity-ref" x-entity-ref="{ type: 'kapitel', id: s.kapitel[0].chapter_id, name: s.kapitel[0].name }"></button>
              <template x-if="s.kapitel.length > 1">
                <span class="entity-ref-more" x-text="'+' + (s.kapitel.length - 1)"></span>
              </template>
            </span>
          </template>
          <span class="history-chevron" :class="{ open: $store.catalogUi.selectedSongId === s.id }" aria-hidden="true"></span>
        </div>
        <div x-show="$store.catalogUi.selectedSongId === s.id" class="entity-detail">
          <p x-show="s.beschreibung" x-text="s.beschreibung" class="entity-detail-text"></p>
          <div x-show="s.stimmung" class="entity-meta-row">
            <span class="entity-meta-label" x-text="$app.t('songs.stimmung')"></span>
            <span x-text="s.stimmung"></span>
          </div>
          <div x-show="s.erste_erwaehnung" class="entity-meta-row">
            <span class="entity-meta-label" x-text="$app.t('songs.firstMention')"></span>
            <template x-if="s.erste_erwaehnung_page_id">
              <button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', id: s.erste_erwaehnung_page_id }"></button>
            </template>
            <template x-if="!s.erste_erwaehnung_page_id">
              <span x-text="s.erste_erwaehnung"></span>
            </template>
          </div>
          <div x-show="s.figuren?.length > 0" class="entity-meta-row">
            <span class="entity-meta-label" x-text="$app.t('songs.figuren')"></span>
            <span class="entity-refs">
              <template x-for="f in s.figuren" :key="(f.fig_id || f)">
                <button type="button" class="entity-ref" x-entity-ref="{ type: 'figur', id: f.fig_id || f }"></button>
              </template>
            </span>
          </div>
          <div x-show="s.kapitel?.length > 1" class="entity-meta-row">
            <span class="entity-meta-label" x-text="$app.t('songs.kapitel')"></span>
            <span class="entity-refs">
              <template x-for="k in s.kapitel" :key="k.name">
                <button type="button" class="entity-ref" x-entity-ref="{ type: 'kapitel', id: k.chapter_id, name: k.name, count: k.haeufigkeit }"></button>
              </template>
            </span>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>
