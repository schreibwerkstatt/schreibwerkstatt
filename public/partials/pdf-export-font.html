      <!-- Schrift-Tab -->
      <div class="export-tab-panel" x-bind="panel('font')">
        <!-- Kette h1 ≥ … ≥ h6 ≥ Fliesstext: der Server hebt beim Speichern an,
             die Warnung sagt es vorher (pdf-export-geometry.js). -->
        <template x-for="w in headingWarnings()" :key="w">
          <p class="card-form-warn" role="status" x-text="w"></p>
        </template>
        <!-- Verzeichnis-Schriften (toc/tocTitle) leben nur im Tab
             „Titelei & Verzeichnis" — ein Ort, kein Doppel-Regler. -->
        <template x-for="group in [
            { key: 'body',       roles: ['body','heading'] },
            { key: 'runningHead', roles: ['header','footer'] },
            { key: 'titlePages', roles: ['title','subtitle','byline','dedication','frontMatter','year'] },
            { key: 'backmatter', roles: ['authorBio','bibliography'] },
            { key: 'apparat',    roles: ['footnote'] },
            { key: 'imprint',    roles: ['imprint'] }
          ]" :key="group.key">
          <div class="pdfx-font-group" x-show="uiMode === 'expert' || group.key === 'body'">
            <h4 class="card-section-title" x-text="$app.t('pdfExport.font.group.' + group.key)"></h4>

            <template x-for="role in group.roles" :key="role">
              <div class="pdfx-font-role collapsible-wrap" x-data="collapsible(role === 'body')">
                <button type="button" class="collapsible-toggle pdfx-font-role-toggle" x-bind="trigger">
                  <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
                  <span x-text="$app.t('pdfExport.font.' + role)"></span>
                  <span class="pdfx-font-role-summary"
                        x-text="activeProfile.config.font[role].family + ' : ' + activeProfile.config.font[role].weight"></span>
                </button>

                <div x-bind="panel" x-cloak class="collapsible-section">
                  <div x-id="['fld']" class="card-form-row">
                    <label :id="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.font.family')"></label>
                    <div class="card-form-field">
                      <div :aria-labelledby="$id('fld')" x-data="combobox($app.t('pdfExport.font.family'))"
                           x-modelable="value" x-model="activeProfile.config.font[role].family"
                           x-effect="options = fontList.map(f => ({ value: f.family, label: f.family }))"
                           @combobox-change="onFontPick(role, $event.detail)"
></div>
                      <p class="card-form-warn" role="status" x-show="isHyphenBroken(activeProfile.config.font[role].family)" x-cloak
                         x-text="$app.t('pdfExport.font.hyphenBroken', { family: activeProfile.config.font[role].family })"></p>
                      <button type="button" class="btn-compact btn-compact--ghost pdfx-font-apply-all"
                              @click="applyFamilyToAll(role)"
                              x-text="$app.t('pdfExport.font.applyToAll')"></button>
                    </div>
                  </div>

                  <div x-id="['fld']" class="card-form-row">
                    <label :id="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.font.weight')"></label>
                    <div class="card-form-field">
                      <div :aria-labelledby="$id('fld')" x-data="combobox($app.t('pdfExport.font.weight'))"
                           x-modelable="value" x-model="activeProfile.config.font[role].weight"
                           x-effect="options = ((fontList.find(f => f.family === activeProfile?.config?.font?.[role]?.family)?.weights) || [400]).map(w => ({ value: w, label: String(w) }))"
></div>
                    </div>
                  </div>

                  <template x-if="role !== 'heading'">
                    <div x-id="['fld']" class="card-form-row">
                      <label :for="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.font.sizePt')"></label>
                      <div class="card-form-field">
                        <input :id="$id('fld')" type="text" x-data="numInput({ step: 0.5, min: 6, max: 72 })" x-modelable="value" x-model="activeProfile.config.font[role].sizePt" class="pdfx-num-input">
                      </div>
                    </div>
                  </template>

                  <template x-if="role === 'heading'">
                    <div class="pdfx-num-grid pdfx-num-grid--3" x-show="uiMode === 'expert'">
                      <template x-for="lv in [['h1', 10, 60], ['h2', 9, 48], ['h3', 8, 36], ['h4', 7, 30], ['h5', 7, 28], ['h6', 7, 26]]" :key="lv[0]">
                        <label class="pdfx-num-field"><span x-text="$app.t('pdfExport.font.headingSize.' + lv[0])"></span><input type="text" x-data="numInput({ step: 0.5, min: lv[1], max: lv[2] })" x-modelable="value" x-model="activeProfile.config.font.heading.sizes[lv[0]]" class="pdfx-num-input"></label>
                      </template>
                    </div>
                  </template>

                  <template x-if="role === 'body'">
                    <div>
                      <div x-id="['fld']" class="card-form-row">
                        <label :for="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.font.lineHeight')"></label>
                        <div class="card-form-field">
                          <input :id="$id('fld')" type="text" x-data="numInput({ step: 0.05, min: 0.8, max: 3 })" x-modelable="value" x-model="activeProfile.config.font.body.lineHeight" class="pdfx-num-input">
                        </div>
                      </div>
                      <div x-id="['fld']" class="card-form-row" x-show="uiMode === 'expert'">
                        <label :for="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.font.paragraphGap')"></label>
                        <div class="card-form-field">
                          <input :id="$id('fld')" type="text" x-data="numInput({ step: 0.05, min: 0, max: 3 })" x-modelable="value" x-model="activeProfile.config.font.body.paragraphGap" class="pdfx-num-input">
                        </div>
                      </div>
                      <div x-id="['fld']" class="card-form-row" x-show="uiMode === 'expert'">
                        <label :for="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.font.firstLineIndentMm')"></label>
                        <div class="card-form-field">
                          <input :id="$id('fld')" type="text" x-data="numInput({ step: 0.5, min: 0, max: 30 })" x-modelable="value" x-model="activeProfile.config.font.body.firstLineIndentMm" class="pdfx-num-input">
                        </div>
                      </div>
                      <div x-id="['fld']" class="card-form-row" x-show="uiMode === 'expert'">
                        <label :id="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.font.numerals')"></label>
                        <div class="card-form-field">
                          <div :aria-labelledby="$id('fld')" x-data="combobox($app.t('pdfExport.font.numerals'))"
                               x-modelable="value" x-model="activeProfile.config.font.body.numerals"
                               x-effect="options = [{ value: 'auto', label: $app.t('pdfExport.font.numerals.auto') }, { value: 'lining', label: $app.t('pdfExport.font.numerals.lining') }, { value: 'oldstyle', label: $app.t('pdfExport.font.numerals.oldstyle') }]"
></div>
                        </div>
                      </div>
                    </div>
                  </template>

                  <div x-id="['fld']" class="card-form-row" x-show="uiMode === 'expert'">
                    <label :for="$id('fld')" class="card-form-label">
                      <span x-text="$app.t('pdfExport.font.color')"></span>
                      <template x-if="role === 'heading'">
                        <span class="pdfx-color-hint" x-text="$app.t('pdfExport.font.colorHintRule')"></span>
                      </template>
                    </label>
                    <div class="card-form-field pdfx-color-field">
                      <input :id="$id('fld')" type="color" class="pdfx-color-picker" x-model="activeProfile.config.font[role].color">
                      <span class="pdfx-color-text" x-text="activeProfile.config.font[role].color"></span>
                    </div>
                  </div>

                  <template x-if="['dedication','frontMatter','authorBio','bibliography','imprint','year'].includes(role)">
                    <div class="card-form-row">
                      <span class="card-form-label" aria-hidden="true">&nbsp;</span>
                      <div class="card-form-field">
                        <label class="pdfx-check">
                          <input type="checkbox" x-model="activeProfile.config.font[role].italic">
                          <span x-text="$app.t('pdfExport.font.italic')"></span>
                        </label>
                      </div>
                    </div>
                  </template>

                  <div class="pdfx-font-preview" :style="fontPreviewStyle(role)">
                    <span x-text="$app.t('pdfExport.font.previewText')"></span>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </template>
        <!-- Nachrichtenverlauf (SMS/Chat im Manuskript, div.msg-thread): Satzart,
             lib/pdf-render/block-messages.js. Auch im Einfach-Modus sichtbar. -->
        <div class="pdfx-font-group">
          <h4 class="card-section-title" x-text="$app.t('export.messages.group')"></h4>
          <div x-id="['fld']" class="card-form-row">
            <label :id="$id('fld')" class="card-form-label" x-text="$app.t('export.messages.style')"></label>
            <div class="card-form-field">
              <div :aria-labelledby="$id('fld')" x-data="combobox($app.t('export.messages.style'))"
                   x-modelable="value" x-model="activeProfile.config.messages.style"
                   x-effect="options = [{ value: 'plain', label: $app.t('export.messages.style.plain') }, { value: 'bubbles', label: $app.t('export.messages.style.bubbles') }]"></div>
              <p class="card-form-field-note" x-text="$app.t('export.messages.hint')"></p>
            </div>
          </div>
        </div>
        <div class="pdfx-font-group" x-show="uiMode === 'expert'">
          <h4 class="card-section-title" x-text="$app.t('pdfExport.font.group.toc')"></h4>
          <p class="card-form-field-note">
            <span x-text="$app.t('pdfExport.font.tocMoved')"></span>
            <button type="button" class="btn-compact btn-compact--ghost" @click="activeTab = 'frontmatter'" x-text="$app.t('pdfExport.font.tocMovedLink')"></button>
          </p>
        </div>
      </div>
