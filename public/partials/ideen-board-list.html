<!-- Listenansicht des Ideen-Boards (Fragment, string-seitiger @include aus
     ideen-board.html; Scope = ideenBoardCard, Logik ideen-board/list.js).
     Derselbe Bestand nach demselben Filter wie das Raster, flach als Tabelle:
     Ort in Buch-Reihenfolge, Stufe, Alter. Sammelaktionen wirken nur auf die
     ausgewaehlten SICHTBAREN Zeilen. -->
<div class="ideen-list-wrap" x-show="!loading && isListView() && listRows().length > 0" x-cloak>
  <!-- Auswahl-Leiste (DESIGN.md „Auswahl-Leiste", selection-bar.js): die Haken
       stehen in der Tabelle immer, die Leiste erscheint ab der ersten Markierung. -->
  <div class="selection-bar" x-show="selectionCount()" x-cloak role="toolbar" :aria-label="$app.t('ideenBoard.bulk.label')">
    <span class="selection-bar__count" x-text="$app.tn('selection.count', selectionCount())"></span>
    <div class="selection-bar__actions">
      <template x-for="st in statuses()" :key="st">
        <button type="button" class="idee-board-step" :class="'idee-board-step--' + st"
                x-show="isStageActive(st)" @click="bulkSetStatus(st)" :disabled="busy"
                :data-tip="$app.t('ideenBoard.moveTo', { status: statusLabel(st) })"
                x-text="statusLabel(st)"></button>
      </template>
      <button type="button" class="btn-compact" x-show="selectionCount() >= 2" @click="bulkMerge()" :disabled="busy"
              :data-tip="$app.t('ideenBoard.bulk.mergeTip')" x-text="$app.t('ideenBoard.bulk.merge')"></button>
      <button type="button" class="btn-compact danger" @click="bulkDelete()" :disabled="busy" x-text="$app.t('common.delete')"></button>
    </div>
    <button type="button" class="icon-btn icon-btn--ghost selection-bar__close" @click="clearSelection()" :disabled="busy"
            :data-tip="$app.t('selection.clear')" :aria-label="$app.t('selection.clear')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
  </div>

  <table class="data-table ideen-list"
         x-data="sortableTable({
           rows: () => listRows(),
           defaultKey: 'laneIndex',
           persistKey: 'ideenBoard.list',
           types: { laneIndex: 'number', statusRank: 'number', created: 'date', statusAt: 'date', text: 'string' },
         })">
    <thead>
      <tr>
        <th class="ideen-list-check">
          <input type="checkbox" :checked="allVisibleSelected()" @change="toggleSelectAllVisible()"
                 :aria-label="$app.t('selection.selectAll')">
        </th>
        <th x-bind="sortTh('laneIndex')" x-text="$app.t('ideenBoard.list.place')"></th>
        <th x-bind="sortTh('text')" x-text="$app.t('ideenBoard.list.text')"></th>
        <th x-bind="sortTh('statusRank')" x-text="$app.t('ideenBoard.list.status')"></th>
        <th x-bind="sortTh('created')" x-text="$app.t('ideenBoard.list.created')"></th>
        <th x-bind="sortTh('statusAt')" x-text="$app.t('ideenBoard.list.statusAt')"></th>
      </tr>
    </thead>
    <tbody>
      <template x-for="r in sorted" :key="r.id">
        <tr :class="{ 'is-selected': isSelected(r.id) }" :data-idee-row-id="r.id">
          <td class="ideen-list-check">
            <input type="checkbox" :checked="isSelected(r.id)" @change="toggleSelect(r.id)"
                   :aria-label="$app.t('ideenBoard.bulk.select')">
          </td>
          <td class="ideen-list-place">
            <template x-if="r.idee.page_id != null">
              <button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', id: r.idee.page_id }"></button>
            </template>
            <template x-if="r.idee.page_id == null && r.idee.chapter_id != null">
              <button type="button" class="entity-ref" x-entity-ref="{ type: 'kapitel', id: r.idee.chapter_id }"></button>
            </template>
            <span class="ideen-list-book" x-show="r.idee.page_id == null && r.idee.chapter_id == null" x-text="r.place"></span>
          </td>
          <!-- Einelementiges x-for, damit das geteilte Chip-Fragment seine Idee
               wie in Karte und Raster als `idee` findet. -->
          <td class="ideen-list-text">
            <template x-for="idee in [r.idee]" :key="r.id">
              <div>
                <span class="ideen-list-text-body" x-text="idee.content"></span>
                <!-- @include ideen-link-chips -->
              </div>
            </template>
          </td>
          <td>
            <span class="ideen-list-status" :class="'ideen-list-status--' + r.status" x-text="statusLabel(r.status)"></span>
          </td>
          <td class="ideen-list-age" :class="{ 'idee-board-age--stale': isStaleIdee(r.idee) }"
              :data-tip="isStaleIdee(r.idee) ? staleTip() : null"
              x-text="ideeAgeLabel(r.idee)"></td>
          <td class="ideen-list-age" x-text="statusSinceLabel(r.idee)"></td>
        </tr>
      </template>
    </tbody>
  </table>
</div>
