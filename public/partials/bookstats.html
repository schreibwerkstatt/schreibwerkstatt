<!-- Buchentwicklung -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/book-stats-card.js. Der
  `showBookStatsCard`-Flag bleibt im Root (Hash-Router, Exklusivität),
  fachlicher State + Chart.js-Lifecycle leben in dieser Komponente.
-->
<div class="card card--bookstats" x-data="bookStatsCard" x-show="$app.showBookStatsCard" x-cloak>
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('bookstats.title')"></span>
      <div class="card-subline" x-show="bookStatsData.length > 0 && !bookStatsLoading">
        <span class="card-timestamp" x-text="bookStatsLastSnapshotLabel()"></span>
      </div>
    </div>
    <div class="card-header-aside">
      <div class="card-actions">
        <button type="button" class="icon-btn icon-btn--ghost" @click="syncBookStats()" :disabled="bookStatsLoading"
                :data-tip="$app.t('bookstats.sync')" :aria-label="$app.t('bookstats.sync')">
          <span x-show="bookStatsLoading" class="spinner"></span>
          <svg x-show="!bookStatsLoading" class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Sync-Status -->
  <div x-show="bookStatsSyncStatus" class="card-status" x-html="bookStatsSyncStatus"></div>

  <!-- Metrik- & Zeitraum-Umschalter -->
  <div x-show="bookStatsData.length > 0 || (writingTimeData?.daily?.length > 0) || (lektoratTimeData?.daily?.length > 0) || (sttTimeData?.daily?.length > 0) || (statusHistoryData?.daily?.length > 0)" class="book-stats-controls">
    <div x-data="combobox($app.t('bookstats.metric'))"
         x-modelable="value" x-model="bookStatsMetric"
         x-effect="options = [
           {value:'chars',               label: $app.t('bookstats.metric.chars')},
           {value:'normseiten',          label: $app.t('bookstats.metric.normseiten')},
           {value:'words',               label: $app.t('bookstats.metric.words')},
           {value:'page_count',          label: $app.t('bookstats.metric.pages')},
           {value:'tok',                 label: $app.t('bookstats.metric.tok')},
           {value:'unique_words',        label: $app.t('bookstats.metric.unique')},
           {value:'delta_chars',         label: $app.t('bookstats.metric.deltaChars')},
           {value:'delta_words',         label: $app.t('bookstats.metric.delta')},
           {value:'avg_sentence_len',    label: $app.t('bookstats.metric.avgSentence')},
           {value:'pages_per_chapter',   label: $app.t('bookstats.metric.pagesPerChapter')},
           {value:'avg_lix',             label: $app.t('bookstats.metric.lix')},
           {value:'avg_flesch_de',       label: $app.t('bookstats.metric.flesch')},
           {value:'mattr',               label: $app.t('bookstats.metric.mattr')},
           {value:'mtld',                label: $app.t('bookstats.metric.mtld')},
           {value:'lex_density',         label: $app.t('bookstats.metric.lexDensity')},
           {value:'hapax_ratio',         label: $app.t('bookstats.metric.hapaxRatio')},
           {value:'writing_minutes',     label: $app.t('bookstats.metric.writingMinutes')},
           {value:'writing_cumulative',  label: $app.t('bookstats.metric.writingCumulative')},
           {value:'chars_per_hour',      label: $app.t('bookstats.metric.charsPerHour')},
           {value:'lektorat_minutes',    label: $app.t('bookstats.metric.lektoratMinutes')},
           {value:'lektorat_cumulative', label: $app.t('bookstats.metric.lektoratCumulative')},
           {value:'stt_minutes',         label: $app.t('bookstats.metric.sttMinutes')},
           {value:'stt_cumulative',      label: $app.t('bookstats.metric.sttCumulative')},
           {value:'stt_chars',           label: $app.t('bookstats.metric.sttChars')},
           {value:'status_done',         label: $app.t('bookstats.metric.statusDone')},
           {value:'status_set',          label: $app.t('bookstats.metric.statusSet')}
         ]"
         @combobox-change="$nextTick(() => renderStatsChart())"
         >
    </div>
    <div class="btn-group">
      <template x-for="r in [{v:7,k:'7'},{v:30,k:'30'},{v:90,k:'90'},{v:365,k:'365'},{v:0,k:'all'}]" :key="r.v">
        <button type="button" class="btn-compact" :class="{ primary: bookStatsRange === r.v }"
          @click="bookStatsRange = r.v; renderStatsChart()" x-text="$app.t('bookstats.range.' + r.k)"></button>
      </template>
    </div>
    <div class="btn-group">
      <button type="button" class="btn-compact" :class="{ primary: bookStatsShowAvg }"
        @click="bookStatsShowAvg = !bookStatsShowAvg; renderStatsChart()"
        :aria-pressed="bookStatsShowAvg ? 'true' : 'false'"
        :data-tip="$app.t('bookstats.avgToggleTip')" x-text="$app.t('bookstats.avgToggle')"></button>
    </div>
  </div>

  <!-- Durchschnitt im gewählten Zeitraum -->
  <div x-show="bookStatsAvg" class="book-stats-avg">
    <span class="card-hint" x-text="bookStatsAvg?.label"></span>
    <template x-for="(b, i) in (bookStatsAvg?.badges || [])" :key="i">
      <span class="tok-badge tok-neutral" :data-tip="bookStatsAvg?.metricLabel" x-text="b"></span>
    </template>
  </div>

  <!-- Diagramm -->
  <div x-show="bookStatsData.length > 0 || (writingTimeData?.daily?.length > 0) || (lektoratTimeData?.daily?.length > 0) || (sttTimeData?.daily?.length > 0) || (statusHistoryData?.daily?.length > 0)" class="book-stats-chart-wrap">
    <canvas id="book-stats-chart" role="img" :aria-label="$app.t('bookstats.chartFallback')"><span x-text="$app.t('bookstats.chartFallback')"></span></canvas>
  </div>

  <!-- Kennzahlen in drei Gruppen: Umfang · Qualität · Aufwand -->
  <div x-show="bookStatsBadgeGroups().length" class="book-stats-current">
    <template x-for="g in bookStatsBadgeGroups()" :key="g.key">
      <div class="book-stats-group">
        <span class="card-section-title card-section-title--inline" x-text="g.title"></span>
        <div class="book-stats-group-badges">
          <template x-for="(b, i) in g.badges" :key="i">
            <span class="tok-badge tok-neutral" :data-tip="b.tip || null" x-text="b.text"></span>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- Leer-Zustand -->
  <div x-show="!bookStatsData.length && !(writingTimeData?.daily?.length > 0) && !(lektoratTimeData?.daily?.length > 0) && !(sttTimeData?.daily?.length > 0) && !(statusHistoryData?.daily?.length > 0) && !bookStatsLoading" class="muted-msg muted-msg--spaced" x-text="$app.t('bookstats.emptyState')"></div>
</div>
