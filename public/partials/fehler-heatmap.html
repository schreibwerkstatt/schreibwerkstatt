<!-- Fehler-Heatmap: Fehlertyp × Kapitel, aggregiert aus jüngstem page_check pro Seite -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/fehler-heatmap-card.js. Der
  `showFehlerHeatmapCard`-Flag bleibt im Root (Hash-Router, Exklusivität),
  fachlicher State lebt in dieser Komponente.
-->
<div class="card card--heatmap" x-data="fehlerHeatmapCard" x-show="$app.showFehlerHeatmapCard" x-cloak>
  <div class="card-header">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('fehlerHeatmap.title')"></span>
    </div>
    <div class="card-actions">
      <div class="tabs">
        <button :aria-pressed="fehlerHeatmapMode === 'open'" type="button"
                :class="{ 'tabs-btn--active': fehlerHeatmapMode === 'open' }"
                class="tabs-btn"
                @click="setFehlerHeatmapMode('open')"
                x-text="$app.t('fehlerHeatmap.mode.open')"></button>
        <button :aria-pressed="fehlerHeatmapMode === 'applied'" type="button"
                :class="{ 'tabs-btn--active': fehlerHeatmapMode === 'applied' }"
                class="tabs-btn"
                @click="setFehlerHeatmapMode('applied')"
                x-text="$app.t('fehlerHeatmap.mode.applied')"></button>
        <button :aria-pressed="fehlerHeatmapMode === 'all'" type="button"
                :class="{ 'tabs-btn--active': fehlerHeatmapMode === 'all' }"
                class="tabs-btn"
                @click="setFehlerHeatmapMode('all')"
                x-text="$app.t('fehlerHeatmap.mode.all')"></button>
      </div>
    </div>
  </div>

  <div x-show="fehlerHeatmapStatus" class="card-status" x-html="fehlerHeatmapStatus"></div>

  <!-- Fehlerdichte-Trend über die Fassungen: folgt dem oben gewählten Modus
       (offen/angenommen/alle), y = Fehler pro 1000 Wörter. -->
  <section class="fehler-trend">
    <div class="fehler-trend-head">
      <span class="fehler-trend-title" x-text="$app.t('fehlerHeatmap.trend.title')"></span>
      <span class="fehler-trend-sub" x-text="$app.t('fehlerHeatmap.trend.sub')"></span>
    </div>
    <template x-if="fehlerTrendHasData()">
      <div class="fehler-trend-chart-wrap">
        <canvas id="fehler-trend-chart"></canvas>
      </div>
    </template>
    <template x-if="!fehlerTrendHasData()">
      <div class="muted-msg" x-text="$app.t('fehlerHeatmap.trend.hint')"></div>
    </template>
    <div class="fehler-trend-note" x-show="fehlerTrendHasData() && fehlerTrendHasApprox()"
         x-text="$app.t('fehlerHeatmap.trend.approxNote')"></div>
  </section>

  <div x-show="!fehlerHeatmapLoading && (!fehlerHeatmapData?.chapters || fehlerHeatmapData.chapters.length === 0)"
       class="muted-msg muted-msg--spaced" x-text="$app.t('fehlerHeatmap.emptyState')"></div>

  <template x-if="fehlerHeatmapData?.chapters?.length > 0">
    <div class="heatmap-wrap">
      <div class="heatmap-legend" x-text="$app.t('fehlerHeatmap.legend', { n: fehlerHeatmapMinWords })"></div>

      <div class="heatmap-scroll">
        <table class="heatmap-table">
          <thead>
            <tr class="heatmap-cluster-row">
              <th class="heatmap-rowhead" colspan="2"></th>
              <template x-for="cluster in fehlerHeatmapClusters" :key="cluster.key">
                <th class="heatmap-cluster-head"
                    :colspan="cluster.typen.length"
                    x-text="$app.t('fehlerHeatmap.cluster.' + cluster.key)"></th>
              </template>
            </tr>
            <tr>
              <th class="heatmap-rowhead" x-text="$app.t('fehlerHeatmap.chapter')"></th>
              <th class="heatmap-numcol" x-text="$app.t('fehlerHeatmap.coverage')"></th>
              <template x-for="(typ, idx) in fehlerHeatmapTypen" :key="typ">
                <th :data-tip="$app.t('fehlerHeatmap.typ.' + typ)"
                    :class="{ 'heatmap-cluster-start': fehlerHeatmapIsClusterStart(idx) }">
                  <span x-text="$app.t('fehlerHeatmap.typ.' + typ)"></span>
                </th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template x-for="row in fehlerHeatmapRows()" :key="row.key">
              <tr>
                <th class="heatmap-rowhead fehler-heatmap-rowhead" scope="row" :style="row.indentVars">
                  <span class="heatmap-rowhead-main"
                        :class="{ 'internal-link text-link': row.chapter.chapter_id != null }"
                        @click="row.chapter.chapter_id != null && fehlerHeatmapJumpToChapter(row.chapter)"
                        x-text="fehlerHeatmapChapterName(row.chapter)"></span>
                  <span class="heatmap-rowhead-sub" x-text="$app.t('fehlerHeatmap.words', { n: row.wordsLabel })"></span>
                </th>
                <td class="heatmap-numcol">
                  <span x-text="$app.t('fehlerHeatmap.coverageLabel', { checked: row.chapter.pages_checked, total: row.chapter.pages_total })"></span>
                  <span class="heatmap-coverage">
                    <span class="heatmap-coverage-bar" :style="{ '--coverage': row.coveragePct + '%' }"></span>
                  </span>
                </td>
                <template x-for="(typ, idx) in fehlerHeatmapTypen" :key="typ">
                  <!-- Klasse, Farbe und Klickbarkeit kommen fertig aus buildFehlerRows
                       (public/js/book/fehler-heatmap.js). Klickbar ist nur eine Zelle mit
                       Befunden — sie trägt dafür einen Button (.heatmap-cell-btn), nie
                       role=button am <td>; ohne Befund kein Detail-Panel, kein Tab-Stopp. -->
                  <td class="heatmap-cell"
                      :class="[row.cells[typ].cls, {
                        'heatmap-cell--active': activeFehlerDetailKey === row.cells[typ].detailKey,
                        'heatmap-cluster-start': fehlerHeatmapIsClusterStart(idx) }]"
                      :style="row.cells[typ].vars"
                      :data-tip="fehlerHeatmapCellTooltip(row.cells[typ])">
                    <template x-if="row.cells[typ].clickable">
                      <button type="button" class="heatmap-cell-btn"
                              @click="toggleFehlerHeatmapDetail(row.cells[typ])"
                              :aria-expanded="activeFehlerDetailKey === row.cells[typ].detailKey ? 'true' : 'false'"
                              x-text="row.cells[typ].text"></button>
                    </template>
                    <template x-if="!row.cells[typ].clickable">
                      <span x-text="row.cells[typ].text"></span>
                    </template>
                  </td>
                </template>
              </tr>
            </template>
          </tbody>
          <!-- Summenzeile: ganzes Buch je Typ (Anzahl, Dichte im Tooltip). -->
          <tfoot>
            <tr class="heatmap-total-row">
              <th class="heatmap-rowhead" scope="row">
                <span class="heatmap-rowhead-main" x-text="$app.t('fehlerHeatmap.totalRow')"></span>
                <span class="heatmap-rowhead-sub"
                      x-text="$app.t('fehlerHeatmap.wordsChecked', { n: fehlerHeatmapTotals().wordsCheckedLabel })"></span>
              </th>
              <td class="heatmap-numcol"></td>
              <template x-for="(typ, idx) in fehlerHeatmapTypen" :key="typ">
                <td class="heatmap-cell heatmap-total-cell"
                    :class="{ 'heatmap-cluster-start': fehlerHeatmapIsClusterStart(idx) }"
                    :data-tip="fehlerHeatmapTotalTooltip(fehlerHeatmapTotals().cells[typ])"
                    x-text="fehlerHeatmapTotals().cells[typ].text"></td>
              </template>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Detail-Panel: aufklappbar bei Klick auf Zelle -->
      <template x-if="fehlerHeatmapActiveDetail()">
        <div class="heatmap-detail">
          <div class="card-section-head card-section-head--baseline">
            <span class="heatmap-detail-title"
                  x-text="$app.t('fehlerHeatmap.detail.title', {
                    typ: $app.t('fehlerHeatmap.typ.' + fehlerHeatmapActiveDetail().typ),
                    chapter: fehlerHeatmapActiveDetail().chapterName,
                  })"></span>
            <button type="button" class="btn-close heatmap-detail-close"
                    @click="activeFehlerDetailKey = null"
                    :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
          </div>
          <div class="heatmap-detail-list">
            <template x-for="page in fehlerHeatmapActiveDetail().pages" :key="page.page_id">
              <div class="heatmap-detail-page">
                <div class="heatmap-detail-page-header">
                  <button type="button" class="entity-ref"
                          x-entity-ref="{ type: 'seite', id: page.page_id, label: page.page_name, onOpen: () => fehlerHeatmapJumpToPage(page.page_id) }"></button>
                  <span class="heatmap-detail-page-count" x-text="$app.t('fehlerHeatmap.detail.countLabel', { n: page.count })"></span>
                </div>
                <template x-for="(s, i) in page.samples" :key="i">
                  <div class="heatmap-detail-sample">
                    <!-- Rohtyp nur in der Spalte «Sonstige»: dort bündeln sich Typen ohne eigene Spalte. -->
                    <template x-if="fehlerHeatmapActiveDetail().typ === fehlerHeatmapOther && s.typ">
                      <span class="heatmap-detail-typ" x-text="s.typ"></span>
                    </template>
                    <!-- Klick springt an genau diese Stelle im Abschnitt. -->
                    <template x-if="s.original">
                      <button type="button" class="heatmap-detail-original heatmap-detail-original--link"
                              :data-tip="$app.t('fehlerHeatmap.detail.jumpToPassage')"
                              @click="fehlerHeatmapJumpToPage(page.page_id, s.original)"
                              x-text="s.original"></button>
                    </template>
                    <template x-if="s.korrektur">
                      <span class="heatmap-detail-korrektur" x-text="s.korrektur"></span>
                    </template>
                    <template x-if="s.erklaerung || s.erklaerung_key">
                      <div class="heatmap-detail-erklaerung" x-text="$app.findingErklaerung(s)"></div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </template>
</div>
