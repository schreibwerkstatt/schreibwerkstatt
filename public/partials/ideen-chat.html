<!-- Ideen-Chat — eigene Karte als Leiste neben der Ideen-Board-Karte
     (Muster des Recherche-Chats, layout/aside-split.css; jeder Provider,
     agentisch oder klassisch). Prüft Pendenzen gegen den Text, sucht
     Buch-Ideen einen Ort, räumt Dubletten auf; Änderungen kommen als
     Vorschläge, die der User EINZELN übernimmt oder verwirft (Vorschlagskarten
     wie im Plot-Chat). Fragment (string-seitiger @include) im Split von
     ideen-board.html; Scope + Methoden aus ideenBoardCard (chat/ideen-chat.js,
     chat/ideen-chat-proposals.js), Sichtbarkeit aus `ideenChatOpen`.
     Deep-Doc: docs/ideen-chat.md -->
<div class="card card--chat ideen-chat-card aside-split-aside" id="ideen-chat-card" x-show="ideenChatOpen" x-cloak>
  <div class="card-header">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName || '–'"></span>
      <span class="card-title" x-text="$app.t('ideenBoard.chat.heading')"></span>
    </div>
    <div class="card-actions">
      <button type="button" class="icon-btn icon-btn--ghost" x-show="isIdeenChatSessionRunning(ideenChatSessionId)" @click="cancelIdeenChatRun()" :data-tip="$app.t('chat.cancelRunTip')" :aria-label="$app.t('chat.cancelRun')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#square"/></svg></button>
      <button type="button" class="icon-btn icon-btn--ghost" @click="startNewIdeenChatSession()" :disabled="ideenChatLoading" :data-tip="$app.t('chat.newSessionTitle')" :aria-label="$app.t('chat.newSession')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg></button>
    </div>
    <button type="button" class="btn-card-close" @click="ideenChatOpen = false" :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
  </div>

  <div x-show="ideenChatProgress > 0 && isIdeenChatSessionRunning(ideenChatSessionId)" class="progress-bar-wrap">
    <div class="progress-bar" :style="{ '--progress': ideenChatProgress + '%' }"></div>
  </div>
  <div x-show="ideenChatStatus" class="card-status" x-html="ideenChatStatus"></div>

  <div id="ideen-chat-messages" class="chat-messages ideen-chat-messages aside-split-scroll">
    <!-- Leeres Gespräch: Erklärung + drei Schnellstart-Aufträge (die Kernaufgaben). -->
    <div x-show="ideenChatMessages.length === 0 && !ideenChatLoading" class="card-empty card-empty--compact">
      <p class="card-empty-hint" x-text="$app.t('ideenBoard.chat.empty')"></p>
      <div class="card-empty-actions">
        <button type="button" class="btn-compact" @click="askIdeenChat('ideenBoard.chat.starter.erledigt')" x-text="$app.t('ideenBoard.chat.starter.erledigtLabel')"></button>
        <button type="button" class="btn-compact" @click="askIdeenChat('ideenBoard.chat.starter.orte')" x-text="$app.t('ideenBoard.chat.starter.orteLabel')"></button>
        <button type="button" class="btn-compact" @click="askIdeenChat('ideenBoard.chat.starter.dubletten')" x-text="$app.t('ideenBoard.chat.starter.dublettenLabel')"></button>
        <button type="button" class="btn-compact" @click="askIdeenChat('ideenBoard.chat.starter.alt')" x-text="$app.t('ideenBoard.chat.starter.altLabel')"></button>
      </div>
    </div>

    <template x-for="(msg, msgIdx) in ideenChatMessages" :key="msgIdx">
      <div :class="'chat-msg chat-msg--' + msg.role">
        <div class="chat-msg-bubble">
          <div x-show="msg.role === 'user'" class="chat-msg-text" x-text="msg.content"></div>
          <div x-show="msg.role === 'assistant'" class="chat-msg-text" x-html="_renderChatMarkdown(msg.content)"></div>

          <!-- @include chat-tool-log -->

          <!-- Vorschläge an die Ideen: jeder einzeln übernehmen/verwerfen -->
          <template x-if="msg.role === 'assistant' && ideenProposals(msg).length">
            <div class="chat-vorschlaege chat-vorschlaege--wide ideen-chat-proposals">
              <template x-for="(p, pi) in ideenProposals(msg)" :key="pi">
                <div class="chat-vorschlag"
                     :class="{ 'chat-vorschlag--applied': ideenProposalStatus(msg, pi).state === 'applied', 'chat-vorschlag--discarded': ideenProposalStatus(msg, pi).state === 'discarded', 'chat-vorschlag--stale': ideenProposalStatus(msg, pi).state === 'open' && (ideenProposalStatus(msg, pi).stale || ideenProposalStatus(msg, pi).blocked) }">
                  <div class="chat-vorschlag-header">
                    <span class="chat-vorschlag-label"
                          x-text="ideenProposalStatus(msg, pi).state === 'applied' ? $app.t('ideenBoard.chat.applied') : ideenProposalStatus(msg, pi).state === 'discarded' ? $app.t('chat.discarded') : ideenProposalTypeLabel(p)"></span>
                    <span class="chat-vorschlag-actions">
                      <button type="button" class="chat-vorschlag-btn" x-show="ideenProposalStatus(msg, pi).state === 'open'"
                              @click="applyIdeenProposal(msg, pi)" :disabled="!!p._applying || !!ideenProposalStatus(msg, pi).blocked || busy"
                              :data-tip="ideenProposalBlockedText(msg, pi) || null">
                        <span x-show="p._applying" class="spinner"></span>
                        <span x-text="p._applying ? $app.t('common.saving') : (ideenProposalStatus(msg, pi).removed ? $app.t('ideenBoard.chat.reapply') : $app.t('chat.apply'))"></span>
                      </button>
                      <button type="button" class="chat-vorschlag-btn chat-vorschlag-btn--ghost" x-show="ideenProposalStatus(msg, pi).state !== 'applied'"
                              @click="discardIdeenProposal(msg, pi, ideenProposalStatus(msg, pi).state !== 'discarded')" :disabled="!!p._applying"
                              x-text="ideenProposalStatus(msg, pi).state === 'discarded' ? $app.t('chat.restore') : $app.t('chat.discard')"></button>
                    </span>
                  </div>

                  <!-- Neue Idee -->
                  <template x-if="p.type === 'idee_create'">
                    <div class="chat-vorschlag-diff">
                      <div class="chat-vorschlag-text" x-text="p.fields?.content"></div>
                      <div class="chat-vorschlag-meta">
                        <span x-text="p.labels?.anchor ? $app.t('ideenBoard.chat.meta.anchor', { name: p.labels.anchor }) : $app.t('ideenBoard.chat.meta.bookAnchor')"></span>
                      </div>
                    </div>
                  </template>

                  <!-- Idee ändern: Feld für Feld vorher → nachher, dazu der geprüfte Textbeleg -->
                  <template x-if="p.type === 'idee_update'">
                    <div class="chat-vorschlag-diff">
                      <div class="chat-vorschlag-title" x-text="p.labels?.idee"></div>
                      <template x-for="row in ideenProposalRows(p)" :key="row.key">
                        <div class="chat-vorschlag-row">
                          <span class="chat-vorschlag-field" x-text="$app.t('ideenBoard.chat.field.' + row.key)"></span>
                          <template x-if="row.diff">
                            <span class="chat-word-diff"><template x-for="(part, di) in row.diff" :key="di"><span :class="part.c" x-text="part.v"></span></template></span>
                          </template>
                          <template x-if="!row.diff">
                            <span class="chat-vorschlag-change"><span class="chat-vorschlag-before" x-text="row.status ? statusLabel(row.before) : (row.before || $app.t('ideenBoard.chat.meta.bookAnchorShort'))"></span><svg class="icon chat-vorschlag-arrow" aria-hidden="true"><use href="/icons.svg#arrow-right"/></svg><span class="chat-vorschlag-after" x-text="row.status ? statusLabel(row.after) : (row.after || $app.t('ideenBoard.chat.meta.bookAnchorShort'))"></span></span>
                          </template>
                        </div>
                      </template>
                      <!-- Beleg: beim Vorschlagen geprüft; fehlt er beim Übernehmen im aktuellen Text, steht das statt «geprüft» da -->
                      <div x-show="p.beleg?.text" class="chat-vorschlag-row ideen-chat-beleg">
                        <span class="chat-vorschlag-field" x-text="$app.t('ideenBoard.chat.field.beleg')" :data-tip="$app.t('ideenBoard.chat.belegChecked')"></span>
                        <span>
                          <q class="chat-vorschlag-quote" x-text="p.beleg?.text"></q>
                          <button type="button" class="entity-ref" x-show="p.beleg?.page_id"
                                  x-entity-ref="{ type: 'seite', id: p.beleg?.page_id, label: p.labels?.beleg_page }"></button>
                        </span>
                      </div>
                      <div x-show="p.beleg?.text && p._belegMissing" class="chat-vorschlag-note" x-text="$app.t('ideenBoard.chat.belegMissing')"></div>
                    </div>
                  </template>

                  <!-- Dubletten zusammenführen: die bleibende Idee, die aufgehenden, ggf. Text-Diff -->
                  <template x-if="p.type === 'idee_merge'">
                    <div class="chat-vorschlag-diff">
                      <div class="chat-vorschlag-title" x-text="p.labels?.idee"></div>
                      <div class="chat-vorschlag-row">
                        <span class="chat-vorschlag-field" x-text="$app.t('ideenBoard.chat.field.mergeIn')"></span>
                        <ul class="ideen-chat-merge-list">
                          <template x-for="m in (p.labels?.merged || [])" :key="m.id">
                            <li><span x-text="m.text"></span> <span class="ideen-chat-merge-anchor" x-show="m.anchor" x-text="'· ' + m.anchor"></span></li>
                          </template>
                        </ul>
                      </div>
                      <template x-for="row in ideenProposalRows(p)" :key="row.key">
                        <div class="chat-vorschlag-row">
                          <span class="chat-vorschlag-field" x-text="$app.t('ideenBoard.chat.field.' + row.key)"></span>
                          <span class="chat-word-diff"><template x-for="(part, di) in row.diff" :key="di"><span :class="part.c" x-text="part.v"></span></template></span>
                        </div>
                      </template>
                    </div>
                  </template>

                  <!-- Verknüpfung -->
                  <template x-if="p.type === 'link_create'">
                    <div class="chat-vorschlag-diff">
                      <div class="chat-vorschlag-title" x-text="p.labels?.idee"></div>
                      <div class="chat-vorschlag-meta">
                        <span x-text="$app.t('ideenBoard.chat.meta.link', { kind: ideenProposalLinkKind(p), name: p.labels?.target || '' })"></span>
                      </div>
                    </div>
                  </template>

                  <div x-show="p.begruendung" class="chat-vorschlag-begruendung" x-text="p.begruendung"></div>
                  <div x-show="ideenProposalStatus(msg, pi).state === 'open' && ideenProposalStatus(msg, pi).blocked" class="chat-vorschlag-note" x-text="ideenProposalBlockedText(msg, pi)"></div>
                  <div x-show="ideenProposalStatus(msg, pi).state === 'open' && !ideenProposalStatus(msg, pi).blocked && ideenProposalStatus(msg, pi).stale" class="chat-vorschlag-note" x-text="$app.t('ideenBoard.chat.stale')"></div>
                  <div x-show="ideenProposalStatus(msg, pi).removed" class="chat-vorschlag-note" x-text="$app.t('ideenBoard.chat.removed')"></div>
                  <div x-show="p._error" class="chat-vorschlag-error" x-text="p._error"></div>
                </div>
              </template>
            </div>
          </template>

          <div x-show="msg.role === 'assistant' && _chatTokenInfo(msg)" class="chat-token-info" :title="_chatTokenTitle(msg)" x-text="_chatTokenInfo(msg)"></div>
          <!-- @include chat-feedback -->
        </div>
      </div>
    </template>

    <div x-show="isIdeenChatSessionRunning(ideenChatSessionId)" class="chat-skeleton-wrapper">
      <div class="chat-skeleton"></div>
      <!-- Werkzeug-Verlauf des laufenden Turns (wächst mit, offen) -->
      <template x-for="msg in (_liveToolMsg() ? [_liveToolMsg()] : [])" :key="'live'">
        <div class="chat-tool-log-live">
          <!-- @include chat-tool-log -->
        </div>
      </template>
    </div>
  </div>

  <div class="chat-input-row">
    <textarea class="chat-input ideen-chat-input" x-model="ideenChatInput" rows="2"
              :placeholder="$app.t('ideenBoard.chat.placeholder')" :aria-label="$app.t('ideenBoard.chat.placeholder')"
              :disabled="ideenChatLoading" data-spellcheck="spelling"
              @keydown.enter="$enter($event, () => sendIdeenChatMessage(), { multiline: true })"></textarea>
    <button type="button" class="chat-send-btn" @click="sendIdeenChatMessage()" :disabled="ideenChatLoading || !ideenChatInput.trim()" :aria-label="$app.t('chat.send')">
      <span x-show="ideenChatLoading" class="spinner"></span>
      <svg x-show="!ideenChatLoading" class="icon" aria-hidden="true"><use href="/icons.svg#arrow-up"/></svg>
    </button>
  </div>
  <div class="chat-input-hint" x-text="$app.t('ideenBoard.chat.hint')"></div>

  <!-- Session-Historie -->
  <div x-show="ideenChatSessions.length > 0" class="card-history-section"
       x-data="{ sessionList: { sessions: () => ideenChatSessions, activeId: () => ideenChatSessionId, running: id => isIdeenChatSessionRunning(id), deleteDisabled: id => isIdeenChatSessionRunning(id), load: id => loadIdeenChatSession(id), remove: id => deleteIdeenChatSession(id), untitledKey: 'ideenBoard.chat.untitled' } }">
    <div class="chat-history-title" x-text="$app.t('chat.history')"></div>
    <!-- @include chat-session-list -->
  </div>
</div>
