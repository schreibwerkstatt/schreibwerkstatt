<!-- Kapitel-Übersicht: Kennzahlen, Bewertung und Abschnitte eines Kapitels -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/kapitel-review-card.js.
  `showKapitelReviewCard` bleibt am Root. Fachlicher State + Job-Flow in der
  Sub. `newPageTitle/newPageCreating/newPageError` bleiben am Root (von
  createKapitelPage() in der Sub via $root gelesen/geschrieben).
-->
<div class="card card--kapitel" x-data="kapitelReviewCard" x-show="$app.showKapitelReviewCard" x-cloak>
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="kapitelReviewSelectedChapter()?.name || $app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('kapitelReview.title')"></span>
      <div class="card-subline" x-show="kapitelReviewLastEditAt()">
        <span x-show="kapitelReviewLastEditAt()" x-text="$app.t('kapitelReview.lastEdit', { when: $app.formatDate(kapitelReviewLastEditAt()) })"></span>
      </div>
    </div>
    <div class="card-header-aside">
      <span x-show="kapitelReviewChapterStats()" class="tok-stats">
        <template x-if="kapitelReviewChapterStats()?.words > 0">
          <span class="display-contents">
            <span class="tok-badge tok-neutral"
              x-text="$app.charBadge(kapitelReviewChapterStats().chars)"></span>
            <span class="tok-badge tok-neutral"
              :data-tip="$app.t('bookstats.metric.normseiten')"
              x-text="(Math.round((kapitelReviewChapterStats().chars || 0) / 1500 * 10) / 10).toLocaleString($store.shell.uiLocale === 'en' ? 'en-US' : 'de-CH', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' ' + $app.t('bookstats.unit.ns')"></span>
            <span class="tok-badge tok-neutral"
              x-text="kapitelReviewChapterStats().words >= 1000 ? '~' + Math.round(kapitelReviewChapterStats().words/1000) + 'k W' : kapitelReviewChapterStats().words + ' W'"></span>
            <span class="tok-badge"
              :class="kapitelReviewChapterStats().tok > 16000 ? 'tok-high' : kapitelReviewChapterStats().tok > 4000 ? 'tok-med' : 'tok-ok'"
              x-text="kapitelReviewChapterStats().tok >= 1000 ? '~' + Math.round(kapitelReviewChapterStats().tok/1000) + 'k T' : '~' + kapitelReviewChapterStats().tok + ' T'"></span>
          </span>
        </template>
        <template x-if="kapitelReviewChapterStats() && kapitelReviewChapterStats().words === 0">
          <span class="tok-badge tok-empty" x-text="$app.t('sidebar.empty')"></span>
        </template>
      </span>
      <div class="card-actions">
        <button type="button"
                class="icon-btn icon-btn--ghost"
                x-show="kapitelReviewHasSubchapters($app.kapitelReviewChapterId)"
                @click="setKapitelReviewIncludeSubchapters($app.kapitelReviewChapterId, !kapitelReviewIncludeSubchapters($app.kapitelReviewChapterId))"
                :class="{ 'is-active': kapitelReviewIncludeSubchapters($app.kapitelReviewChapterId) }"
                :aria-pressed="kapitelReviewIncludeSubchapters($app.kapitelReviewChapterId)"
                :data-tip="$app.t('kapitelReview.includeSubchaptersTip')"
                :aria-label="$app.t('kapitelReview.includeSubchapters')">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#list-tree"/></svg>
        </button>
        <button type="button"
                class="icon-btn icon-btn--ghost"
                @click="runKapitelReview()"
                :disabled="kapitelReviewLoading || !$app.kapitelReviewChapterId || kapitelReviewEffectivePageCount() === 0"
                :data-tip="kapitelReviewEffectivePageCount() === 0 ? $app.t('kapitelReview.noPagesInScope') : ((kapitelReviewOut || kapitelReviewLatest()) ? $app.t('kapitelReview.rerun') : $app.t('kapitelReview.start'))"
                :aria-label="(kapitelReviewOut || kapitelReviewLatest()) ? $app.t('kapitelReview.rerun') : $app.t('kapitelReview.start')">
          <span x-show="kapitelReviewLoading" class="spinner"></span>
          <svg x-show="!kapitelReviewLoading" class="icon" aria-hidden="true"><use href="/icons.svg#scale"/></svg>
        </button>
        <span class="action-overflow" x-data="menu()">
          <span class="icon-btn-badge-wrap">
            <button type="button" class="icon-btn icon-btn--ghost" x-bind="trigger"
                    :class="{ 'is-active': open }"
                    aria-haspopup="menu"
                    :data-tip="$app.t('editor.btn.moreActions')" :aria-label="$app.t('editor.btn.moreActions')">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#more-horizontal"/></svg>
            </button>
            <span class="icon-btn-badge" x-show="($store.badges.chapterIdeenCounts[$app.kapitelReviewChapterId] || 0) > 0" x-text="$store.badges.chapterIdeenCounts[$app.kapitelReviewChapterId]"></span>
          </span>
          <div class="context-menu context-menu--dropdown" x-bind="panel" x-cloak>
            <button type="button" class="context-menu-item context-menu-item--icon"
                    :class="{ 'context-menu-item--on': $app.showIdeenCard && $app.ideenScope === 'chapter' }"
                    role="menuitem"
                    :disabled="!$app.kapitelReviewChapterId"
                    @click="$app.toggleChapterIdeenCard($app.kapitelReviewChapterId)">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#lightbulb"/></svg>
              <span x-text="$app.t('ideen.chapter.toggle')"></span>
              <span class="btn-count" x-show="($store.badges.chapterIdeenCounts[$app.kapitelReviewChapterId] || 0) > 0" x-text="$store.badges.chapterIdeenCounts[$app.kapitelReviewChapterId]"></span>
            </button>
            <button type="button" class="context-menu-item context-menu-item--icon" role="menuitem"
                    x-show="($store.badges.chapterRechercheCounts[$app.kapitelReviewChapterId] || 0) > 0"
                    @click="$app.openRechercheForChapter($app.kapitelReviewChapterId)">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#book-open"/></svg>
              <span x-text="$app.t('recherche.title')"></span>
              <span class="btn-count" x-text="$store.badges.chapterRechercheCounts[$app.kapitelReviewChapterId]" :data-tip="$app.t('recherche.openCountTitle', { n: $store.badges.chapterRechercheCounts[$app.kapitelReviewChapterId] })"></span>
            </button>
            <button type="button" class="context-menu-item context-menu-item--icon" role="menuitem"
                    x-show="($store.badges.chapterPlotBeatCounts[$app.kapitelReviewChapterId] || 0) > 0"
                    @click="$app.openPlotBoard()">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#list-tree"/></svg>
              <span x-text="$app.t('plot.title')"></span>
              <span class="btn-count" x-text="$store.badges.chapterPlotBeatCounts[$app.kapitelReviewChapterId]" :data-tip="$app.t('plot.chapterBeatsCountTitle', { n: $store.badges.chapterPlotBeatCounts[$app.kapitelReviewChapterId] })"></span>
            </button>
            <div class="context-menu-sep" role="separator" x-show="$app.kapitelReviewChapterId"></div>
            <button type="button" class="context-menu-item context-menu-item--icon" role="menuitem"
                    x-show="$app.kapitelReviewChapterId"
                    @click="$app.openShareLinksForChapter($app.kapitelReviewChapterId)">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#share-2"/></svg>
              <span x-text="$app.t('share.btn.shareChapter')"></span>
            </button>
            <button type="button" class="context-menu-item context-menu-item--icon" role="menuitem"
                    x-show="$app.kapitelReviewChapterId"
                    @click="$app.openExportFor('chapter', $app.kapitelReviewChapterId)">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#download"/></svg>
              <span x-text="$app.t('pagetreeCtx.export')"></span>
            </button>
            <button type="button" class="context-menu-item context-menu-item--icon" role="menuitem"
                    x-show="$app.canEdit() && $app.kapitelReviewChapterId"
                    :class="{ 'context-menu-item--on': kapitelReviewSelectedChapter()?.excluded }"
                    @click="$app.setChapterExcluded($app.kapitelReviewChapterId, !kapitelReviewSelectedChapter()?.excluded)">
              <svg class="icon" aria-hidden="true"><use :href="'/icons.svg#' + (kapitelReviewSelectedChapter()?.excluded ? 'rotate-cw' : 'archive')"/></svg>
              <span x-text="kapitelReviewSelectedChapter()?.excluded ? $app.t('pagetreeCtx.includeChapter') : $app.t('pagetreeCtx.excludeChapter')"></span>
            </button>
          </div>
        </span>
      </div>
    </div>
  </div>

  <!-- Kapitel-Dashboard: Kennzahlen-Kopf aus vorhandenen Quellen, kein KI-Call
       (partials/kapitelreview-dashboard.html). Steht VOR dem Bewertungstext:
       die Kacheln sind die Lage des Kapitels, der Text darunter das Urteil
       darueber. Die letzte Note sitzt als eigene Kachel im Raster, damit sie
       trotzdem oben sichtbar bleibt. -->
  <div id="partial-kapitelreview-dashboard"></div>

  <!-- Bewertung: eigener Abschnitt mit Trennlinie und Titel, damit das KI-
       Urteil nicht als weitere Statistik-Zeile unter den Kacheln liest.
       Fortschritt, aktuelles Urteil und Verlauf gehoeren zusammen. Nur
       sichtbar, wenn es etwas zu zeigen gibt — ohne Lauf fuehrt die
       Bewertungs-Kachel im Dashboard zum Start. -->
  <section class="card-section kapitel-review-verdict"
           x-show="kapitelReviewProgress > 0 || kapitelReviewStatus || kapitelReviewOut || kapitelReviewLatest()">
    <div class="card-section-head">
      <h3 class="card-section-title" x-text="$app.t('kapitelReview.verdictHeading')"></h3>
    </div>
    <div class="progress-bar-wrap" x-show="kapitelReviewProgress > 0">
      <div class="progress-bar" :style="{ '--progress': kapitelReviewProgress + '%' }"></div>
    </div>
    <div class="card-status" x-show="kapitelReviewStatus" x-html="kapitelReviewStatus"></div>

    <!-- Aktuelle Bewertung = jüngster Verlaufseintrag (bleibt nach Reload
         stehen). `kapitelReviewOut` ist nur der Rückfall, wenn der Verlauf
         nach einem Lauf nicht lud. -->
    <div x-show="kapitelReviewOut" x-html="kapitelReviewOut"></div>
    <template x-if="!kapitelReviewOut && kapitelReviewLatest()">
      <div>
        <div class="kapitel-review-latest-meta">
          <span class="history-date" x-text="$app.formatDate(kapitelReviewLatest().reviewed_at)"></span>
          <span x-show="kapitelReviewScopeLabel(kapitelReviewLatest())" class="tag" x-text="kapitelReviewScopeLabel(kapitelReviewLatest())"></span>
          <span class="tag" x-text="kapitelReviewLatest().model"></span>
          <button type="button" class="icon-btn icon-btn--ghost"
                  @click="deleteKapitelReview(kapitelReviewLatest().id)"
                  :data-tip="$app.t('common.deleteEntry')" :aria-label="$app.t('common.deleteEntry')">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
          </button>
        </div>
        <div x-html="_renderKapitelReviewHtml(kapitelReviewLatest().review_json)"></div>
      </div>
    </template>

    <!-- Verlauf für das aktuell gewählte Kapitel: ohne den jüngsten Eintrag,
         der steht oben als aktuelle Bewertung. `index` bleibt der Index in der
         vollen Liste, damit die Notenänderung den richtigen Vorgänger findet. -->
    <div x-show="kapitelReviewCurrentHistory().length > 1" class="card-history-section">
      <div class="history-heading" x-text="$app.t('kapitelReview.history')"></div>
      <template x-for="(entry, index) in kapitelReviewCurrentHistory()" :key="entry.id">
        <template x-if="index > 0">
          <div>
            <div class="history-item" :class="{ 'history-item--open': selectedKapitelReviewId === entry.id }"
                 @click="selectedKapitelReviewId = selectedKapitelReviewId === entry.id ? null : entry.id">
              <span class="history-date" x-text="$app.formatDate(entry.reviewed_at)"></span>
              <span x-show="entry.review_json?.gesamtnote" class="badge badge-ok review-stars"
                :data-tip="noteTip(entry.review_json?.gesamtnote)"
                x-html="renderStars(entry.review_json?.gesamtnote)"></span>
              <span x-show="kapitelReviewNoteDelta(index) !== null"
                class="badge review-trend"
                :class="kapitelReviewNoteDelta(index) > 0 ? 'badge-ok' : 'badge-err'"
                :data-tip="$app.t('kapitelReview.trendTip')"
                x-text="(kapitelReviewNoteDelta(index) > 0 ? '+' : '−') + Math.abs(kapitelReviewNoteDelta(index)).toLocaleString($store.shell.uiLocale === 'en' ? 'en-US' : 'de-CH', { minimumFractionDigits: 1, maximumFractionDigits: 2 })"></span>
              <span x-show="kapitelReviewScopeLabel(entry)" class="tag" x-text="kapitelReviewScopeLabel(entry)"></span>
              <span class="tag" x-text="entry.model"></span>
              <span class="history-chevron" :class="{ open: selectedKapitelReviewId === entry.id }" aria-hidden="true"></span>
            </div>
            <div x-show="selectedKapitelReviewId === entry.id" class="history-detail">
              <div x-html="entry.review_json ? _renderKapitelReviewHtml(entry.review_json) : ''"></div>
              <button type="button" class="btn-delete-history" @click.stop="deleteKapitelReview(entry.id)" :data-tip="$app.t('common.deleteEntry')" x-text="$app.t('common.deleteEntry')"></button>
            </div>
          </div>
        </template>
      </template>
    </div>
  </section>

  <!-- Seitenliste + Sub-Kapitel + Quick-Add (partials/kapitelreview-pages.html) -->
  <div id="partial-kapitelreview-pages"></div>
</div>
