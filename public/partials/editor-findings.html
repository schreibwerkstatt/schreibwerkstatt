<!-- Lektorat-Findings-Panel (Befunde, Stilanalyse, Fazit).
     Der Partial-Container in editor.html hat `display: contents`, damit
     DIESER Wrapper direkter Grid-Nachbar von .lektorat-split-preview bleibt. -->
<div x-data="lektoratFindingsCard"
     x-show="$app.checkDone"
     class="lektorat-split-findings">
  <!-- Fortschritt seit dem vorherigen Lektorat dieses Abschnitts
       (lib/lektorat-progress.js): Vergleich ohne KI, nur direkt nach einem Lauf. -->
  <template x-if="$app.lektoratProgress">
    <div class="lektorat-progress" x-data="collapsible()">
      <div class="lektorat-progress-head">
        <span class="lektorat-progress-title" x-text="$app.t('editor.progress.title', { when: $app.formatRelativeShort($app.lektoratProgress.prevCheckedAt) })"></span>
        <span class="lektorat-progress-total" x-text="$app.t('editor.progress.total', { before: $app.lektoratProgress.prevCount, now: $app.lektoratProgress.count })"></span>
      </div>
      <div class="lektorat-progress-counts" x-show="$app.lektoratProgress.prevCount + $app.lektoratProgress.count > 0">
        <span class="lektorat-progress-fixed" x-show="$app.lektoratProgress.fixed > 0"
              x-text="$app.t('editor.progress.fixed', { n: $app.lektoratProgress.fixed })
                      + ($app.lektoratProgress.viaApply > 0 ? ' (' + $app.t('editor.progress.viaApply', { n: $app.lektoratProgress.viaApply }) + ')' : '')"></span>
        <span x-show="$app.lektoratProgress.remaining > 0" x-text="$app.t('editor.progress.remaining', { n: $app.lektoratProgress.remaining })"></span>
        <span class="lektorat-progress-added" x-show="$app.lektoratProgress.added > 0" x-text="$app.t('editor.progress.added', { n: $app.lektoratProgress.added })"></span>
      </div>
      <div class="lektorat-progress-counts" x-show="$app.lektoratProgress.prevCount + $app.lektoratProgress.count === 0"
           x-text="$app.t('editor.progress.none')"></div>
      <div class="lektorat-progress-types" x-show="$app.lektoratProgress.byType.length > 0">
        <template x-for="d in $app.lektoratProgress.byType" :key="d.typ">
          <span class="tag" :class="d.delta < 0 ? 'lektorat-progress-better' : 'lektorat-progress-worse'"
                :data-tip="$app.t('editor.progress.typeTip')"
                x-text="$app.t('finding.' + d.typ) + ' ' + _progressDelta(d.delta)"></span>
        </template>
      </div>
      <p class="lektorat-progress-note" x-show="$app.lektoratProgress.notReported > 0"
         x-text="$app.t('editor.progress.notReported', { n: $app.lektoratProgress.notReported })"></p>
      <template x-if="$app.lektoratProgress.fixedItems.length > 0">
        <div>
          <button type="button" class="collapsible-toggle" x-bind="trigger">
            <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
            <span x-text="$app.t('editor.progress.showFixed', { n: $app.lektoratProgress.fixedItems.length })"></span>
          </button>
          <div x-bind="panel" x-cloak>
            <template x-for="(f, i) in $app.lektoratProgress.fixedItems" :key="i">
              <div class="applied-history-item">
                <span class="badge" :class="_findingBadgeClass(f.typ)" x-text="$app.t('finding.' + f.typ)"></span>
                <span class="applied-history-text">
                  <span class="finding-original" x-text="f.original"></span>
                </span>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- Fehlerfrei -->
  <div x-show="$app.lektoratFindings.length === 0" class="finding ok">
    <span class="badge badge-ok" x-text="$app.t('editor.findings.okBadge')"></span> &nbsp;<span x-text="$app.t('editor.findings.ok')"></span>
  </div>

  <!-- Findings-Sektion (Fehler + Stilanmerkungen, in Lesereihenfolge) -->
  <template x-if="$app.lektoratFindings.length > 0">
    <div>
      <div class="section-heading finding-header">
        <span x-text="$app.t('editor.findings.count', { n: $app.lektoratFindings.length })"></span>
        <div class="finding-toggle-group">
          <button type="button" class="icon-btn icon-btn--ghost" @click="$app.selectAllFindings(true)" :data-tip="$app.t('editor.findings.selectAll')" :aria-label="$app.t('editor.findings.selectAll')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#check"/></svg></button>
          <button type="button" class="icon-btn icon-btn--ghost" @click="$app.selectAllFindings(false)" :data-tip="$app.t('editor.findings.selectNone')" :aria-label="$app.t('editor.findings.selectNone')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
        </div>
      </div>
      <template x-for="(f, i) in $app.lektoratFindings" :key="i">
        <label class="finding"
               :class="{ 'error': _findingKind(f.typ) === 'hard', 'style': _findingKind(f.typ) === 'soft', 'editorial': _findingKind(f.typ) === 'editorial', 'finding--deselected': !$app.selectedFindings[i], 'finding--applied': $app.appliedOriginals.includes(f.original) }"
               :data-finding-idx="i"
               @pointerenter="handleFindingPointer(i)">
          <input type="checkbox" class="finding-checkbox" :checked="$app.selectedFindings[i]" :disabled="$app.appliedOriginals.includes(f.original)" @change="$app.toggleFinding(i)">
          <span class="badge" :class="_findingBadgeClass(f.typ)" x-text="$app.t('finding.' + f.typ)"
                :data-tip="_findingKind(f.typ) === 'editorial' ? $app.t('editor.findings.editorialTip') : null"></span>
          <span x-show="$app.appliedOriginals.includes(f.original)" class="tag" x-text="$app.t('editor.findings.applied')"></span>
          <span class="finding-content">
            <span class="finding-original" x-text="f.original"></span>

            <!-- Korrektur (KI- oder eigener Vorschlag) – inline editierbar -->
            <template x-if="editingIdx !== i">
              <span class="finding-korrektur-row">
                <template x-if="f.korrektur">
                  <span class="finding-korrektur" :class="{ 'finding-korrektur--user': f.userEdited }" x-text="f.korrektur"></span>
                </template>
                <span class="finding-korrektur-actions" @click.stop @pointerdown.stop
                      x-show="!$app.appliedOriginals.includes(f.original)">
                  <button type="button" class="finding-edit-btn" @click.stop="startEditKorrektur(i)"
                          x-text="f.korrektur ? $app.t('editor.findings.editKorrektur') : $app.t('editor.findings.addKorrektur')"></button>
                  <span x-show="f.userEdited" class="tag" x-text="$app.t('editor.findings.yourSuggestion')"></span>
                  <button type="button" class="finding-edit-btn" x-show="f.userEdited" @click.stop="resetKorrektur(i)"
                          x-text="$app.t('editor.findings.resetToAi')"></button>
                </span>
              </span>
            </template>

            <!-- Edit-Modus -->
            <template x-if="editingIdx === i">
              <span class="finding-korrektur-edit" @click.stop @pointerdown.stop>
                <input type="text" class="finding-korrektur-input" data-spellcheck="spelling"
                       x-model="editDraft"
                       x-init="$nextTick(() => $el.focus())"
                       @keydown.enter.prevent.stop="commitEditKorrektur(i)"
                       @keydown.escape.prevent.stop="cancelEditKorrektur()"
                       :placeholder="$app.t('editor.findings.korrekturPlaceholder')">
                <span class="finding-korrektur-edit-actions">
                  <button type="button" class="btn-compact" @click.stop="commitEditKorrektur(i)" x-text="$app.t('editor.findings.korrekturConfirm')"></button>
                  <button type="button" class="btn-compact" @click.stop="cancelEditKorrektur()" x-text="$app.t('common.cancel')"></button>
                </span>
              </span>
            </template>

            <span class="finding-explanation" x-text="f.erklaerung"></span>

            <!-- Belegvorschlag: nur bei `unbelegt` (siehe editor/lektorat-evidence.js).
                 Sucht den Satz semantisch in den PDFs der eigenen Quellen-Bibliothek
                 und setzt auf Klick den Kurzbeleg dahinter. Nie generativ: der Satz
                 selbst bleibt unangetastet. -->
            <template x-if="evidenceEligible(f.typ) && evidenceReady()">
              <span class="finding-evidence" @click.stop @pointerdown.stop>
                <span class="finding-evidence-head">
                  <button type="button" class="finding-edit-btn"
                          x-show="!evidenceDone(f.original)"
                          :disabled="evidenceLoading && evidenceOpenIdx === i"
                          @click.stop="toggleEvidence(i)"
                          x-text="$app.t(evidenceOpenIdx === i ? 'evidence.close' : 'evidence.search')"></button>
                  <span class="tag" x-show="evidenceDone(f.original)" x-text="$app.t('evidence.doneTag')"></span>
                  <span class="finding-evidence-spinner" x-show="evidenceLoading && evidenceOpenIdx === i"
                        x-text="$app.t('evidence.searching')"></span>
                </span>

                <template x-if="evidenceOpenIdx === i">
                  <span class="finding-evidence-panel">
                    <span class="finding-evidence-error" x-show="evidenceError" x-text="evidenceError"></span>
                    <template x-for="hit in evidenceHits" :key="hit.source_id">
                      <span class="finding-evidence-hit">
                        <span class="finding-evidence-hit-head">
                          <span class="finding-evidence-score" x-text="Math.round(hit.score * 100) + '%'"></span>
                          <span class="finding-evidence-src" x-text="evidenceSourceLine(hit.source)"></span>
                          <span class="tag" x-show="!hit.linked" x-text="$app.t('evidence.willLink')"></span>
                        </span>
                        <span class="finding-evidence-snippet" x-text="hit.snippet"></span>
                        <button type="button" class="btn-compact"
                                :disabled="evidenceBusyId !== null"
                                @click.stop="applyEvidence(i, hit)"
                                x-text="$app.t(evidenceBusyId === hit.source_id ? 'evidence.inserting' : 'evidence.insert')"></button>
                      </span>
                    </template>
                  </span>
                </template>
              </span>
            </template>
          </span>
        </label>
      </template>
    </div>
  </template>

  <!-- Eingearbeitete Korrekturen (nur in History-Ansicht, wenn Original nicht mehr im Text steht) -->
  <template x-if="$app.appliedHistoricCorrections.length > 0">
    <div class="applied-history">
      <div class="section-heading">
        <span x-text="$app.t('editor.findings.appliedHistoryTitle', { n: $app.appliedHistoricCorrections.length })"></span>
      </div>
      <template x-for="(f, i) in $app.appliedHistoricCorrections" :key="i">
        <div class="applied-history-item">
          <span class="badge" :class="_findingBadgeClass(f.typ)" x-text="$app.t('finding.' + f.typ)"></span>
          <span class="applied-history-text">
            <span class="finding-original" x-text="f.original"></span>
            <template x-if="f.korrektur">
              <span class="finding-korrektur" x-text="f.korrektur"></span>
            </template>
          </span>
        </div>
      </template>
    </div>
  </template>

  <!-- Stilanalyse & Fazit -->
  <div x-html="$app.analysisOut"></div>
</div>
