<!-- Recherche-Chat-Panel der Recherche-Karte (Claude-only, mit Web-Suche).
     Recherchiert + sammelt; Fundstuecke werden als Vorschlaege angeboten und
     erst per Klick gespeichert (POST /research). Fragment (string-seitiger
     @include) statt DOM-Placeholder, damit kein zusaetzlicher Wrapper-Div in
     den Karten-Flow kommt; Scope + Methoden kommen aus rechercheCard.
     Deep-Doc: docs/recherche-chat.md -->
<div x-show="researchChatOpen" x-cloak class="research-chat">
  <div class="card-section-head">
    <span class="research-chat-title" x-text="$app.t('recherche.chat.heading')"></span>
    <div class="research-chat-head-actions">
      <button type="button" class="icon-btn icon-btn--ghost" @click="startNewResearchChatSession()" :disabled="researchChatLoading" :data-tip="$app.t('chat.newSessionTitle')" :aria-label="$app.t('chat.newSession')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg></button>
      <button type="button" class="icon-btn icon-btn--ghost" @click="researchChatOpen = false" :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
    </div>
  </div>

  <div x-show="researchChatProgress > 0 && isResearchChatSessionRunning(researchChatSessionId)" class="progress-bar-wrap">
    <div class="progress-bar" :style="{ '--progress': researchChatProgress + '%' }"></div>
  </div>
  <div x-show="researchChatStatus" class="card-status" x-html="researchChatStatus"></div>

  <div id="research-chat-messages" class="chat-messages research-chat-messages">
    <div x-show="researchChatMessages.length === 0 && !researchChatLoading" class="chat-empty" x-text="$app.t('recherche.chat.empty')"></div>

    <template x-for="(msg, msgIdx) in researchChatMessages" :key="msgIdx">
      <div :class="'chat-msg chat-msg--' + msg.role">
        <div class="chat-msg-bubble">
          <div x-show="msg.role === 'user'" class="chat-msg-text" x-text="msg.content"></div>
          <div x-show="msg.role === 'assistant'" class="chat-msg-text" x-html="_renderResearchAnswer(msg)"></div>

          <!-- Web-Such-/Tool-Hinweis: Suchen (mit Begriffen), Werkzeuge (i18n), Kosten -->
          <template x-if="msg.role === 'assistant' && msg.context_info">
            <div class="chat-context-info">
              <template x-if="msg.context_info.web_searches > 0">
                <span class="chat-context-tool" x-text="$app.t('recherche.chat.webSearches', { n: msg.context_info.web_searches })"></span>
              </template>
              <template x-for="(entry, ei) in _toolSummary(msg.context_info.tool_calls, { skip: ['final_answer'] })" :key="ei">
                <span class="chat-context-tool" x-text="researchToolLabel(entry.name) + (entry.count > 1 ? ' ×' + entry.count : '')"></span>
              </template>
              <span class="chat-context-tool" x-show="researchCostLabel(msg)" x-text="researchCostLabel(msg)"></span>
            </div>
          </template>
          <template x-if="msg.role === 'assistant' && researchWebQueries(msg).length">
            <div class="research-chat-queries">
              <span class="research-chat-queries-head" x-text="$app.t('recherche.chat.queriesHead')"></span>
              <template x-for="(q, qi) in researchWebQueries(msg)" :key="qi">
                <span class="research-chat-query" x-text="q"></span>
              </template>
            </div>
          </template>

          <!-- Quellen: geprüfte Belege (final_answer.quellen) bzw. zitierte Web-Treffer -->
          <template x-if="msg.role === 'assistant' && researchCitedSources(msg).length">
            <div class="research-chat-sources">
              <div class="research-chat-sources-head" x-text="$app.t('recherche.chat.sourcesHead')"></div>
              <template x-for="src in researchCitedSources(msg)" :key="src.n">
                <a class="research-chat-source" :href="src.url" target="_blank" rel="noopener noreferrer" :data-tip="src.url">
                  <span class="research-chat-source-num" x-text="'[' + src.n + ']'"></span>
                  <span class="research-chat-source-title" x-text="src.title"></span>
                </a>
              </template>
            </div>
          </template>

          <!-- Speicher-Vorschläge: erst der Klick speichert (POST /research/chat-proposal);
               Gespeichert-Status ist serverseitig persistiert. -->
          <template x-if="msg.role === 'assistant' && researchProposals(msg).length">
            <div class="research-chat-proposals">
              <div class="research-chat-proposals-headrow">
                <span class="research-chat-proposals-head" x-text="$app.t('recherche.chat.proposalsHead')"></span>
                <button type="button" class="btn-compact" x-show="researchSavableProposals(msg).length > 1"
                        @click="saveAllResearchProposals(msg)"
                        x-text="$app.t('recherche.chat.proposalSaveAll', { n: researchSavableProposals(msg).length })"></button>
              </div>
              <template x-for="(prop, pi) in researchProposals(msg)" :key="pi">
                <div class="research-chat-proposal" :class="{ 'research-chat-proposal--saved': isProposalSaved(msg, pi) }">
                  <div class="research-chat-proposal-main">
                    <span class="research-kind-badge palette-badge" :class="'research-kind-badge--' + prop.kind" x-text="kindLabel(prop.kind)"></span>
                    <div class="research-chat-proposal-body" x-show="!proposalEdit(msg, pi)">
                      <span class="research-chat-proposal-title" x-show="prop.title" x-text="prop.title"></span>
                      <span class="research-chat-proposal-snippet" x-show="prop.body" x-text="prop.body"></span>
                      <template x-for="(u, ui) in (prop.urls || [])" :key="ui">
                        <a class="research-chat-proposal-url" :href="u.url" target="_blank" rel="noopener noreferrer" x-text="u.label || u.url"></a>
                      </template>
                      <span class="research-chat-proposal-tags" x-show="(prop.tags || []).length" x-text="(prop.tags || []).join(' · ')"></span>
                      <span class="research-chat-proposal-exists" x-show="proposalExistsId(msg, pi)"
                            x-text="$app.t(prop.exists_match === 'title' ? 'recherche.chat.proposalExistsTitle' : 'recherche.chat.proposalExists')"></span>
                    </div>
                    <!-- Bearbeiten vor dem Speichern (Felder, die das Board ohnehin kennt) -->
                    <template x-if="proposalEdit(msg, pi)">
                      <div class="research-chat-proposal-edit">
                        <div x-data="combobox($app.t('recherche.kindLabel'))"
                             x-modelable="value" x-model="proposalEdit(msg, pi).kind"
                             x-effect="options = proposalKindOptions()" class="recherche-kind-combo"></div>
                        <input type="text" class="recherche-input" x-model="proposalEdit(msg, pi).title"
                               :placeholder="$app.t('recherche.field.title')" :aria-label="$app.t('recherche.field.title')" data-spellcheck="spelling">
                        <textarea class="recherche-input" rows="3" x-model="proposalEdit(msg, pi).body"
                                  :placeholder="$app.t('recherche.field.body')" :aria-label="$app.t('recherche.field.body')" data-spellcheck="spelling"></textarea>
                        <input type="text" class="recherche-input" x-model="proposalEdit(msg, pi).tagsText"
                               :placeholder="$app.t('recherche.chat.proposalTagsPlaceholder')" :aria-label="$app.t('recherche.chat.proposalTagsPlaceholder')">
                      </div>
                    </template>
                  </div>
                  <div class="research-chat-proposal-actions">
                    <template x-if="!isProposalSaved(msg, pi) && !proposalExistsId(msg, pi)">
                      <button type="button" class="btn-compact" @click="saveResearchProposal(msg, pi)" :disabled="isProposalSaving(msg, pi)"
                              x-text="$app.t('recherche.chat.proposalSave')"></button>
                    </template>
                    <template x-if="!isProposalSaved(msg, pi) && proposalExistsId(msg, pi)">
                      <span class="research-chat-proposal-exists-actions">
                        <button type="button" class="btn-compact" @click="openResearchProposalItem(proposalExistsId(msg, pi))"
                                x-text="$app.t('recherche.chat.proposalOpenExisting')"></button>
                        <button type="button" class="btn-compact" @click="saveResearchProposal(msg, pi, { allowDuplicate: true })"
                                :disabled="isProposalSaving(msg, pi)" x-text="$app.t('recherche.chat.proposalSaveAnyway')"></button>
                      </span>
                    </template>
                    <template x-if="isProposalSaved(msg, pi)">
                      <button type="button" class="btn-compact research-chat-proposal-saved"
                              @click="openResearchProposalItem(prop.saved_item_id)"
                              :data-tip="$app.t('recherche.chat.proposalOpenSaved')"
                              x-text="$app.t('recherche.chat.proposalSaved')"></button>
                    </template>
                    <button type="button" class="icon-btn icon-btn--ghost" x-show="!isProposalSaved(msg, pi)"
                            @click="toggleProposalEdit(msg, pi)"
                            :data-tip="$app.t(proposalEdit(msg, pi) ? 'recherche.chat.proposalEditDone' : 'recherche.chat.proposalEdit')"
                            :aria-label="$app.t(proposalEdit(msg, pi) ? 'recherche.chat.proposalEditDone' : 'recherche.chat.proposalEdit')"><svg class="icon" aria-hidden="true"><use :href="proposalEdit(msg, pi) ? '/icons.svg#x' : '/icons.svg#pencil'"/></svg></button>
                    <button type="button" class="icon-btn icon-btn--ghost" x-show="(prop.urls || []).length"
                            @click="proposalToSource(msg, pi)" :disabled="isProposalToSourceBusy(msg, pi) || isProposalSaving(msg, pi)"
                            :data-tip="$app.t('recherche.chat.proposalToSource')" :aria-label="$app.t('recherche.chat.proposalToSource')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#book-open"/></svg></button>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <div x-show="msg.role === 'assistant' && _chatTokenInfo(msg)" class="chat-token-info" :title="_chatTokenTitle(msg)" x-text="_chatTokenInfo(msg)"></div>
          <!-- @include chat-feedback -->
        </div>
      </div>
    </template>

    <div x-show="isResearchChatSessionRunning(researchChatSessionId)" class="chat-skeleton-wrapper">
      <div class="chat-skeleton"></div>
    </div>
  </div>

  <!-- Kontext-Chip: gespeicherte Vorschläge mit der Seite/dem Kapitel verknüpfen -->
  <template x-if="researchChatContextTarget()">
    <button type="button" class="research-chat-context-chip" :class="{ 'research-chat-context-chip--on': researchChatUseContext }"
            :aria-pressed="researchChatUseContext ? 'true' : 'false'"
            @click="researchChatUseContext = !researchChatUseContext"
            :data-tip="$app.t('recherche.chat.contextChipTip')"
            x-text="$app.t(researchChatContextTarget().kind === 'chapter' ? 'recherche.chat.contextChipChapter' : 'recherche.chat.contextChipPage', { name: researchChatContextTarget().label || ('#' + researchChatContextTarget().id) })"></button>
  </template>

  <div class="chat-input-row">
    <textarea class="chat-input research-chat-input" x-model="researchChatInput" rows="1"
              :placeholder="$app.t('recherche.chat.placeholder')" :aria-label="$app.t('recherche.chat.placeholder')"
              :disabled="researchChatLoading"
              @keydown.enter="if(!$event.isComposing && $event.keyCode !== 229 && !$event.shiftKey && !$event.ctrlKey && !$event.metaKey) { $event.preventDefault(); sendResearchChatMessage(); }"></textarea>
    <button type="button" class="chat-send-btn" @click="sendResearchChatMessage()" :disabled="researchChatLoading || !researchChatInput.trim()" :aria-label="$app.t('chat.send')">
      <span x-show="researchChatLoading" class="spinner"></span>
      <svg x-show="!researchChatLoading" class="icon" aria-hidden="true"><use href="/icons.svg#arrow-up"/></svg>
    </button>
  </div>
  <div class="chat-input-hint" x-text="$app.t('recherche.chat.hint')"></div>

  <!-- Session-Historie -->
  <div x-show="researchChatSessions.length > 0" class="card-history-section">
    <div class="chat-history-title" x-text="$app.t('chat.history')"></div>
    <template x-for="s in researchChatSessions" :key="s.id">
      <div
        class="chat-session-item hover-reveal-host"
        :class="s.id === researchChatSessionId ? 'chat-session-item--active' : ''"
        @click="loadResearchChatSession(s.id)"
      >
        <div class="chat-session-preview" x-text="(s.title || s.preview || $app.t('recherche.chat.untitled')).slice(0, 80)"></div>
        <div class="chat-session-meta"><span x-show="isResearchChatSessionRunning(s.id)" class="spinner chat-session-running" role="status" :aria-label="$app.t('chat.sessionRunning')" :data-tip="$app.t('chat.sessionRunning')"></span><span x-text="$app.formatDate(s.last_message_at)"></span></div>
        <button type="button" class="chat-session-delete btn-card-close hover-reveal" :disabled="isResearchChatSessionRunning(s.id)" @click.stop="deleteResearchChatSession(s.id)" :data-tip="$app.t('common.delete')" :aria-label="$app.t('common.delete')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg></button>
      </div>
    </template>
  </div>
</div>
