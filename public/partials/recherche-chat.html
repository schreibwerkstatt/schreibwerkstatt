<!-- Recherche-Chat — eigene Karte als Leiste neben der Recherche-Karte
     (Muster des Abschnitts-Chats neben dem Editor, layout/aside-split.css).
     Recherchiert + sammelt; Fundstuecke werden als Vorschlaege angeboten und
     erst per Klick gespeichert (POST /research). Fragment (string-seitiger
     @include) im Split von recherche.html; Scope + Methoden kommen aus
     rechercheCard, Sichtbarkeit aus `researchChatOpen`.
     Deep-Doc: docs/recherche-chat.md -->
<div class="card card--chat research-chat-card aside-split-aside" id="research-chat-card" x-show="researchChatOpen" x-cloak>
  <div class="card-header">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName || '–'"></span>
      <span class="card-title" x-text="$app.t('recherche.chat.heading')"></span>
    </div>
    <div class="card-actions">
      <button type="button" class="icon-btn icon-btn--ghost" x-show="isResearchChatSessionRunning(researchChatSessionId)" @click="cancelResearchChatRun()" :data-tip="$app.t('chat.cancelRunTip')" :aria-label="$app.t('chat.cancelRun')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#square"/></svg>
      </button>
      <button type="button" class="icon-btn icon-btn--ghost" @click="startNewResearchChatSession()" :disabled="researchChatLoading" :data-tip="$app.t('chat.newSessionTitle')" :aria-label="$app.t('chat.newSession')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
      </button>
    </div>
    <button type="button" class="btn-card-close" @click="researchChatOpen = false" :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
  </div>

  <div x-show="researchChatProgress > 0 && isResearchChatSessionRunning(researchChatSessionId)" class="progress-bar-wrap">
    <div class="progress-bar" :style="{ '--progress': researchChatProgress + '%' }"></div>
  </div>
  <div x-show="researchChatStatus" class="card-status" x-html="researchChatStatus"></div>

  <div id="research-chat-messages" class="chat-messages aside-split-scroll">
    <div x-show="researchChatMessages.length === 0 && !researchChatLoading" class="muted-msg muted-msg--sm muted-msg--block" x-text="$app.t('recherche.chat.empty')"></div>

    <template x-for="(msg, msgIdx) in researchChatMessages" :key="msgIdx">
      <div :class="'chat-msg chat-msg--' + msg.role">
        <div class="chat-msg-bubble">
          <div x-show="msg.role === 'user'" class="chat-msg-text" x-text="msg.content"></div>
          <div x-show="msg.role === 'assistant'" class="chat-msg-text" x-html="_renderResearchAnswer(msg)"></div>

          <!-- Web-Suchen; die einzelnen Aufrufe stehen im Werkzeug-Verlauf -->
          <template x-if="msg.role === 'assistant' && msg.context_info?.web_searches > 0">
            <div class="chat-context-info">
              <template x-if="msg.context_info.web_searches > 0">
                <span class="chat-context-tool" x-text="$app.tn('recherche.chat.webSearches', msg.context_info.web_searches)"></span>
              </template>
            </div>
          </template>
          <!-- @include chat-tool-log -->
          <!-- Suchbegriffe älterer Antworten, deren Anthropic-Suchen noch nicht im Verlauf stehen -->
          <template x-if="msg.role === 'assistant' && researchWebQueries(msg).length">
            <div class="research-chat-queries">
              <span class="research-chat-queries-head" x-text="$app.t('recherche.chat.queriesHead')"></span>
              <template x-for="(q, qi) in researchWebQueries(msg)" :key="qi">
                <span class="research-chat-query" x-text="q"></span>
              </template>
            </div>
          </template>

          <!-- Quellen: geprüfte Belege (final_answer.quellen) bzw. zitierte Web-Treffer -->
          <template x-if="msg.role === 'assistant' && researchCitedSources(msg).length">
            <div class="research-chat-sources">
              <div class="research-chat-sources-head" x-text="$app.t('recherche.chat.sourcesHead')"></div>
              <template x-for="src in researchCitedSources(msg)" :key="src.n">
                <a class="research-chat-source" :href="src.url" target="_blank" rel="noopener noreferrer" :data-tip="src.url">
                  <span class="research-chat-source-num" x-text="'[' + src.n + ']'"></span>
                  <span class="research-chat-source-title" x-text="src.title"></span>
                </a>
              </template>
            </div>
          </template>

          <!-- Speicher-Vorschläge: erst der Klick speichert (POST /research/chat-proposal);
               Gespeichert-Status ist serverseitig persistiert. -->
          <template x-if="msg.role === 'assistant' && researchProposals(msg).length">
            <div class="chat-vorschlaege chat-vorschlaege--wide research-chat-proposals">
              <div class="chat-vorschlaege-actions" x-show="researchSavableProposals(msg).length > 1">
                <button type="button" class="chat-vorschlag-btn" @click="saveAllResearchProposals(msg)"
                        x-text="$app.t('recherche.chat.proposalSaveAll', { n: researchSavableProposals(msg).length })"></button>
              </div>
              <template x-for="(prop, pi) in researchProposals(msg)" :key="pi">
                <div class="chat-vorschlag research-chat-proposal" :class="{ 'chat-vorschlag--applied': isProposalSaved(msg, pi) }">
                  <div class="chat-vorschlag-header">
                    <span class="chat-vorschlag-heading">
                      <span class="chat-vorschlag-label" x-text="isProposalSaved(msg, pi) ? $app.t('recherche.chat.proposalSaved') : $app.t('recherche.chat.proposalNew')"></span>
                      <span class="research-kind-badge palette-badge" :class="'research-kind-badge--' + prop.kind" x-text="kindLabel(prop.kind)"></span>
                    </span>
                    <span class="chat-vorschlag-actions">
                      <template x-if="!isProposalSaved(msg, pi) && !proposalExistsId(msg, pi)">
                        <button type="button" class="chat-vorschlag-btn" @click="saveResearchProposal(msg, pi)" :disabled="isProposalSaving(msg, pi)">
                          <span x-show="isProposalSaving(msg, pi)" class="spinner"></span>
                          <span x-text="$app.t('recherche.chat.proposalSave')"></span>
                        </button>
                      </template>
                      <template x-if="!isProposalSaved(msg, pi) && proposalExistsId(msg, pi)">
                        <button type="button" class="chat-vorschlag-btn" @click="openResearchProposalItem(proposalExistsId(msg, pi))"
                                x-text="$app.t('recherche.chat.proposalOpenExisting')"></button>
                      </template>
                      <template x-if="!isProposalSaved(msg, pi) && proposalExistsId(msg, pi)">
                        <button type="button" class="chat-vorschlag-btn chat-vorschlag-btn--ghost" @click="saveResearchProposal(msg, pi, { allowDuplicate: true })"
                                :disabled="isProposalSaving(msg, pi)" x-text="$app.t('recherche.chat.proposalSaveAnyway')"></button>
                      </template>
                      <template x-if="isProposalSaved(msg, pi)">
                        <button type="button" class="chat-vorschlag-btn" @click="openResearchProposalItem(prop.saved_item_id)"
                                :data-tip="$app.t('recherche.chat.proposalOpenSaved')" x-text="$app.t('recherche.chat.proposalOpenExisting')"></button>
                      </template>
                      <button type="button" class="chat-vorschlag-btn chat-vorschlag-btn--ghost" x-show="!isProposalSaved(msg, pi)"
                              @click="toggleProposalEdit(msg, pi)"
                              x-text="$app.t(proposalEdit(msg, pi) ? 'recherche.chat.proposalEditDone' : 'recherche.chat.proposalEdit')"></button>
                      <button type="button" class="chat-vorschlag-btn chat-vorschlag-btn--ghost" x-show="(prop.urls || []).length"
                              @click="proposalToSource(msg, pi)" :disabled="isProposalToSourceBusy(msg, pi) || isProposalSaving(msg, pi)"
                              x-text="$app.t('recherche.chat.proposalToSource')"></button>
                    </span>
                  </div>

                  <!-- Bearbeiten vor dem Speichern (Felder, die das Board ohnehin kennt) -->
                  <template x-if="proposalEdit(msg, pi)">
                    <div class="research-chat-proposal-edit">
                      <div x-data="combobox($app.t('recherche.kindLabel'))"
                           x-modelable="value" x-model="proposalEdit(msg, pi).kind"
                           x-effect="options = proposalKindOptions()" class="recherche-kind-combo"></div>
                      <input type="text" class="recherche-input" x-model="proposalEdit(msg, pi).title"
                             :placeholder="$app.t('recherche.field.title')" :aria-label="$app.t('recherche.field.title')" data-spellcheck="spelling">
                      <textarea class="recherche-input" rows="3" x-model="proposalEdit(msg, pi).body"
                                :placeholder="$app.t('recherche.field.body')" :aria-label="$app.t('recherche.field.body')" data-spellcheck="spelling"></textarea>
                      <input type="text" class="recherche-input" x-model="proposalEdit(msg, pi).tagsText"
                             :placeholder="$app.t('recherche.chat.proposalTagsPlaceholder')" :aria-label="$app.t('recherche.chat.proposalTagsPlaceholder')">
                    </div>
                  </template>

                  <div class="chat-vorschlag-diff" x-show="!proposalEdit(msg, pi)">
                    <div class="chat-vorschlag-title" x-show="prop.title" x-text="prop.title"></div>
                    <div class="chat-vorschlag-text research-chat-proposal-snippet" x-show="prop.body" x-text="prop.body"></div>
                    <!-- Je Link: echter Host neben dem Label, Warn-Zeile bei ungeprüfter URL
                         (vorab abgewählt, research-chat-proposals.js), Weglassen vor dem
                         Speichern (edits.urls). -->
                    <div class="chat-vorschlag-row" x-show="(prop.urls || []).length">
                      <span class="chat-vorschlag-field" x-text="$app.t('recherche.chat.proposalField.urls')"></span>
                      <span class="research-chat-change-urls">
                        <template x-for="(u, ui) in (prop.urls || [])" :key="ui">
                          <span class="research-chat-proposal-url-row"
                                :class="{ 'research-chat-proposal-url-row--removed': isProposalUrlRemoved(msg, pi, u), 'research-chat-proposal-url-row--unverified': isProposalUrlUnverified(u) }">
                            <a class="research-chat-proposal-url url-short truncate" :href="u.url" target="_blank" rel="noopener noreferrer" :data-tip="u.url" x-text="urlText(u)"></a>
                            <span class="research-chat-proposal-url-host truncate" x-show="proposalUrlHost(u)" x-text="proposalUrlHost(u)"></span>
                            <span class="research-chat-proposal-url-unverified" x-show="isProposalUrlUnverified(u)"
                                  :data-tip="$app.t('recherche.chat.proposalUrlUnverifiedTip')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#alert-triangle"/></svg><span x-text="$app.t('recherche.chat.proposalUrlUnverified')"></span></span>
                            <button type="button" class="icon-btn icon-btn--ghost" x-show="!isProposalSaved(msg, pi)"
                                    @click="toggleProposalUrl(msg, pi, u)"
                                    :data-tip="$app.t(isProposalUrlRemoved(msg, pi, u) ? 'recherche.chat.proposalUrlRestore' : 'recherche.chat.proposalUrlRemove')"
                                    :aria-label="$app.t(isProposalUrlRemoved(msg, pi, u) ? 'recherche.chat.proposalUrlRestore' : 'recherche.chat.proposalUrlRemove')"><svg class="icon" aria-hidden="true"><use :href="isProposalUrlRemoved(msg, pi, u) ? '/icons.svg#undo' : '/icons.svg#x'"/></svg></button>
                          </span>
                        </template>
                      </span>
                    </div>
                    <div class="chat-vorschlag-row" x-show="(prop.tags || []).length">
                      <span class="chat-vorschlag-field" x-text="$app.t('recherche.chat.proposalField.tags')"></span>
                      <span x-text="(prop.tags || []).join(' · ')"></span>
                    </div>
                  </div>
                  <div class="chat-vorschlag-note" x-show="!isProposalSaved(msg, pi) && proposalExistsId(msg, pi)"
                       x-text="$app.t(prop.exists_match === 'title' ? 'recherche.chat.proposalExistsTitle' : 'recherche.chat.proposalExists')"></div>
                </div>
              </template>
            </div>
          </template>

          <!-- Änderungen an bestehenden Einträgen (POST /research/chat-proposal/apply) -->
          <!-- @include recherche-chat-changes -->
          <!-- Ideen-Vorschläge an der Stelle des Schreibkontexts (PATCH /ideen/chat-proposal) -->
          <!-- @include chat-idee-vorschlaege -->
          <div x-show="msg.role === 'assistant' && _chatTokenInfo(msg)" class="chat-token-info" :title="_chatTokenTitle(msg)" x-text="_chatTokenInfo(msg)"></div>
          <!-- @include chat-feedback -->
        </div>
      </div>
    </template>

    <div x-show="isResearchChatSessionRunning(researchChatSessionId)" class="chat-skeleton-wrapper">
      <div class="chat-skeleton"></div>
      <!-- Werkzeug-Verlauf des laufenden Turns (wächst mit, offen) -->
      <template x-for="msg in (_liveToolMsg() ? [_liveToolMsg()] : [])" :key="'live'">
        <div class="chat-tool-log-live">
          <!-- @include chat-tool-log -->
        </div>
      </template>
    </div>
  </div>

  <!-- Kontext-Chip: gespeicherte Vorschläge mit der Seite/dem Kapitel verknüpfen -->
  <template x-if="researchChatContextTarget()">
    <button type="button" class="research-chat-context-chip" :class="{ 'research-chat-context-chip--on': researchChatUseContext }"
            :aria-pressed="researchChatUseContext ? 'true' : 'false'"
            @click="researchChatUseContext = !researchChatUseContext"
            :data-tip="$app.t('recherche.chat.contextChipTip')"
            x-text="$app.t(researchChatContextTarget().kind === 'chapter' ? 'recherche.chat.contextChipChapter' : 'recherche.chat.contextChipPage', { name: researchChatContextTarget().label || ('#' + researchChatContextTarget().id) })"></button>
  </template>

  <div class="chat-input-row">
    <textarea class="chat-input research-chat-input" x-model="researchChatInput" rows="2"
              :placeholder="$app.t('recherche.chat.placeholder')" :aria-label="$app.t('recherche.chat.placeholder')"
              :disabled="researchChatLoading"
              @keydown.enter="$enter($event, () => sendResearchChatMessage(), { multiline: true })"></textarea>
    <button type="button" class="chat-send-btn" @click="sendResearchChatMessage()" :disabled="researchChatLoading || !researchChatInput.trim()" :aria-label="$app.t('chat.send')">
      <span x-show="researchChatLoading" class="spinner"></span>
      <svg x-show="!researchChatLoading" class="icon" aria-hidden="true"><use href="/icons.svg#arrow-up"/></svg>
    </button>
  </div>
  <div class="chat-input-hint" x-text="$app.t('recherche.chat.hint')"></div>

  <!-- Session-Historie -->
  <div x-show="researchChatSessions.length > 0" class="card-history-section"
       x-data="{ sessionList: { sessions: () => researchChatSessions, activeId: () => researchChatSessionId, running: id => isResearchChatSessionRunning(id), deleteDisabled: id => isResearchChatSessionRunning(id), load: id => loadResearchChatSession(id), remove: id => deleteResearchChatSession(id), untitledKey: 'recherche.chat.untitled' } }">
    <div class="chat-history-title" x-text="$app.t('chat.history')"></div>
    <!-- @include chat-session-list -->
  </div>
</div>
