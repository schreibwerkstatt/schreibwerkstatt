<!-- Avatar-Menu: Identität, Theme, Shortcuts, Profil, Provider, Logout -->
<div class="avatar-menu-wrap" @click.outside="showAvatarMenu = false" @keydown.escape.window="showAvatarMenu = false">
  <button type="button"
          class="avatar-btn"
          :class="{ 'avatar-btn--active': showAvatarMenu }"
          @click="showAvatarMenu = !showAvatarMenu"
          :data-tip="$store.session.currentUser?.name || $store.session.currentUser?.email || ''"
          :aria-label="$store.session.currentUser?.name || $store.session.currentUser?.email || ''"
          aria-haspopup="menu"
          :aria-expanded="showAvatarMenu">
    <template x-if="$store.session.currentUser?.picture">
      <img class="avatar-btn-img" :src="$store.session.currentUser.picture" :alt="$store.session.currentUser?.name || $store.session.currentUser?.email || ''" referrerpolicy="no-referrer" @error="$store.session.currentUser.picture = null">
    </template>
    <template x-if="!$store.session.currentUser?.picture">
      <span class="avatar-btn-initials" x-text="_avatarInitials()"></span>
    </template>
  </button>

  <div class="avatar-menu-panel" x-show="showAvatarMenu" x-cloak role="menu">
    <div class="avatar-menu-header">
      <template x-if="$store.session.currentUser?.picture">
        <img class="avatar-menu-header-img" :src="$store.session.currentUser.picture" :alt="$store.session.currentUser?.name || $store.session.currentUser?.email || ''" referrerpolicy="no-referrer" @error="$store.session.currentUser.picture = null">
      </template>
      <template x-if="!$store.session.currentUser?.picture">
        <span class="avatar-menu-header-avatar" x-text="_avatarInitials()"></span>
      </template>
      <div class="avatar-menu-header-text">
        <div class="avatar-menu-name truncate" x-text="$store.session.currentUser?.name || $store.session.currentUser?.email"></div>
        <div class="avatar-menu-email truncate" x-show="$store.session.currentUser?.name && $store.session.currentUser?.email && $store.session.currentUser.name !== $store.session.currentUser.email" x-text="$store.session.currentUser?.email"></div>
      </div>
    </div>

    <div class="avatar-menu-section">
      <div class="avatar-menu-label" x-text="t('header.theme')"></div>
      <div class="theme-segmented" role="group" :aria-label="t('header.theme')">
        <template x-for="opt in ['auto','light','dark']" :key="opt">
          <button type="button"
                  class="theme-segmented-btn"
                  :class="{ 'is-active': $store.shell.themePref === opt }"
                  @click="setTheme(opt)"
                  :aria-pressed="$store.shell.themePref === opt"
                  x-text="t({ auto: 'theme.auto', light: 'theme.light', dark: 'theme.dark' }[opt])"></button>
        </template>
      </div>
    </div>

    <div class="avatar-menu-divider"></div>

    <button type="button" class="avatar-menu-item" role="menuitem" @click="showAvatarMenu = false; toggleShortcutsOverlay()">
      <span class="avatar-menu-item-label" x-text="t('shortcuts.title')"></span>
      <span class="avatar-menu-item-key">?</span>
    </button>

    <button type="button" class="avatar-menu-item" role="menuitem" @click="showAvatarMenu = false; toggleUserSettingsCard()">
      <span class="avatar-menu-item-label" x-text="t('header.profile')"></span>
    </button>

    <button type="button" class="avatar-menu-item" role="menuitem" @click="showAvatarMenu = false; toggleMyStatsCard()">
      <span class="avatar-menu-item-label" x-text="t('header.myStats')"></span>
    </button>

    <button type="button" class="avatar-menu-item" role="menuitem" @click="showAvatarMenu = false; toggleMyBooksCard()">
      <span class="avatar-menu-item-label" x-text="t('header.myBooks')"></span>
    </button>

    <button type="button" class="avatar-menu-item" role="menuitem" @click="showAvatarMenu = false; toggleAutorenprofilCard()">
      <span class="avatar-menu-item-label" x-text="t('autorenprofil.title')"></span>
    </button>

    <button type="button" class="avatar-menu-item" role="menuitem"
            x-show="$store.session.currentUser?.role === 'admin'"
            @click="showAvatarMenu = false; toggleAdminUsersCard()">
      <span class="avatar-menu-item-label" x-text="t('admin.users.title')"></span>
    </button>

    <button type="button" class="avatar-menu-item" role="menuitem"
            x-show="$store.session.currentUser?.role === 'admin'"
            @click="showAvatarMenu = false; toggleAdminSettingsCard()">
      <span class="avatar-menu-item-label" x-text="t('admin.settings.title')"></span>
    </button>

    <button type="button" class="avatar-menu-item" role="menuitem"
            x-show="$store.session.currentUser?.role === 'admin'"
            @click="showAvatarMenu = false; toggleAdminUsageCard()">
      <span class="avatar-menu-item-label" x-text="t('admin.usage.title')"></span>
    </button>

    <button type="button" class="avatar-menu-item" role="menuitem"
            x-show="$store.session.currentUser?.role === 'admin'"
            @click="showAvatarMenu = false; toggleAdminCategoriesCard()">
      <span class="avatar-menu-item-label" x-text="t('admin.categories.title')"></span>
    </button>

    <button type="button" class="avatar-menu-item" role="menuitem"
            x-show="$store.session.currentUser?.role === 'admin'"
            @click="showAvatarMenu = false; toggleAdminBooksCard()">
      <span class="avatar-menu-item-label" x-text="t('admin.books.title')"></span>
    </button>

    <button type="button" class="avatar-menu-item" role="menuitem"
            x-show="$store.session.currentUser?.role === 'admin'"
            @click="showAvatarMenu = false; toggleAdminLogsCard()">
      <span class="avatar-menu-item-label" x-text="t('admin.logs.title')"></span>
    </button>

    <div class="avatar-menu-divider"></div>

    <div class="avatar-menu-provider" :data-tip="t('header.providerTitle')">
      <span class="avatar-menu-provider-dot"></span>
      <span x-text="$store.config.apiProvider === 'ollama' ? 'Ollama · ' + $store.config.ollamaModel : $store.config.apiProvider === 'openai-compat' ? 'OpenAI · ' + $store.config.openaiCompatModel : 'Claude · ' + $store.config.claudeModel"></span>
    </div>

    <a href="/auth/logout" class="avatar-menu-item avatar-menu-item--logout" role="menuitem" x-text="t('header.logout')" @click="logout($event)" x-show="!$store.session.devMode"></a>

    <!-- App-Version (SSoT: VERSION-Datei via /config); Klick öffnet die Hilfe im Changelog-Reiter. -->
    <button type="button" class="avatar-menu-version" role="menuitem"
            x-show="$store.shell.appVersion" x-cloak
            :data-tip="t('changelog.current', { version: $store.shell.appVersion })"
            @click="showAvatarMenu = false; $store.shell.helpTabRequest = 'changelog'; if (!showHelpCard) toggleHelpCard()"
            x-text="'v' + $store.shell.appVersion"></button>
  </div>
</div>
