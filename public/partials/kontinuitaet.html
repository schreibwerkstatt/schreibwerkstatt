<!-- Kontinuitätsprüfung -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/kontinuitaet-card.js.
  `showKontinuitaetCard` + `toggleKontinuitaetCard` bleiben im Root. Das
  kontinuitaet-spezifische „bei erneutem Klick refreshen" läuft über
  window-Event `card:refresh { name: 'kontinuitaet' }`.
-->
<div class="card card--kontinuitaet" x-data="kontinuitaetCard" x-show="$app.showKontinuitaetCard" x-cloak>
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('kontinuitaet.title')"></span>
      <div class="card-subline" x-show="kontinuitaetResult?.checked_at && !kontinuitaetLoading">
        <span class="card-timestamp"
              x-text="$app.t('common.asOf', { date: $app.formatDate(kontinuitaetResult?.checked_at) }) + (kontinuitaetResult?.model ? ' · ' + kontinuitaetResult.model : '')"></span>
      </div>
    </div>
  </div>

  <div x-show="kontinuitaetProgress > 0" class="progress-bar-wrap">
    <div class="progress-bar" :style="{ '--progress': kontinuitaetProgress + '%' }"></div>
  </div>
  <div x-show="kontinuitaetStatus" class="card-status" x-html="kontinuitaetStatus"></div>

  <!-- Laden der Befunde fehlgeschlagen: eigener Zustand mit Retry, nicht „noch keine Analyse". -->
  <div x-show="kontinuitaetLoadError && !kontinuitaetResult && !kontinuitaetLoading" class="card-empty" x-cloak>
    <p class="card-empty-text" x-text="$app.t('kontinuitaet.error.loadFailed')"></p>
    <button type="button" class="secondary card-empty-cta" @click="_loadKontinuitaetHistory()">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg>
      <span x-text="$app.t('kontinuitaet.error.retry')"></span>
    </button>
  </div>

  <div x-show="!kontinuitaetResult && !kontinuitaetLoading && !kontinuitaetLoadError" class="card-empty">
    <p class="card-empty-text" x-text="$app.t('common.noAnalysisYet')"></p>
    <button type="button" class="primary card-empty-cta"
            @click="$app.alleAktualisieren()"
            :disabled="$store.jobs.alleAktualisierenLoading || !$store.nav.selectedBookId">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg>
      <span x-text="$app.t('header.updateAll')"></span>
    </button>
  </div>

  <!-- Nur die Kontinuität neu prüfen (P8 auf dem vorhandenen Katalog, ohne volle Analyse) -->
  <!-- Auch ohne bisheriges Ergebnis und nach einem Startfehler sichtbar (Retry). -->
  <div class="card-toolbar" x-show="!kontinuitaetLoading && !kontinuitaetLoadError" x-cloak>
    <button type="button" class="btn-compact" @click="kontinuitaetRun()" :disabled="!$store.nav.selectedBookId">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg>
      <span x-text="$app.t(kontinuitaetResult ? 'kontinuitaet.run.start' : 'kontinuitaet.run.startFirst')"></span>
    </button>
    <span class="card-hint" x-show="kontinuitaetResult" x-text="$app.t('kontinuitaet.openCount', { n: kontinuitaetOpenCount() })"></span>
  </div>

  <!-- Teil-Degradierungen des letzten Laufs (job.warn.*), Darstellung wie im Komplett-Status. -->
  <ul class="komplett-warnings" x-show="!kontinuitaetLoading && kontinuitaetWarnings.length" x-cloak>
    <template x-for="(w, wi) in kontinuitaetWarnings" :key="w.key + '-' + wi">
      <li class="komplett-warning-item" x-text="$app.t(w.key, w.params || {})"></li>
    </template>
  </ul>

  <!-- Skeleton während Loading vor erstem Ergebnis -->
  <div x-show="kontinuitaetLoading && !kontinuitaetResult" class="entity-skeleton entity-list--accented" x-cloak>
    <template x-for="i in 5" :key="i">
      <div class="entity-skeleton-row">
        <span class="entity-skeleton-cell entity-skeleton-cell--anchor"></span>
        <span class="entity-skeleton-cell entity-skeleton-cell--title"></span>
        <span class="entity-skeleton-cell entity-skeleton-cell--meta"></span>
      </div>
    </template>
  </div>

  <!-- Zusammenfassung (klappbar) — ausserhalb x-if, sonst werden Filter und
       Zusammenfassung beim Result-Wechsel komplett neu gemountet. -->
  <div x-show="kontinuitaetSummaryText()" class="collapsible-wrap" x-cloak x-data="collapsible()">
    <button type="button" class="collapsible-toggle" x-bind="trigger">
      <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
      <span x-text="$app.t('kontinuitaet.summary')"></span>
    </button>
    <div x-bind="panel" class="collapsible-section kontinuitaet-summary" x-cloak x-text="kontinuitaetSummaryText()"></div>
  </div>

  <!-- Filter-Leiste — MUSS ausserhalb x-if bleiben, sonst trackt Alpine x-effect
       der Comboboxen die Parent-Reaktivität nicht und options bleibt leer. -->
  <div x-show="kontinuitaetAllIssues().length > 0" class="filter-bar" x-cloak>
    <div class="tabs">
      <button type="button" class="tabs-btn"
              :class="{ 'tabs-btn--active': $store.catalogUi.kontinuitaetFilters.schwere === '' }"
              :aria-pressed="$store.catalogUi.kontinuitaetFilters.schwere === '' ? 'true' : 'false'"
              @click="$store.catalogUi.kontinuitaetFilters.schwere = ''">
        <span x-text="$app.t('common.all')"></span>
        <span class="tabs-btn-count" x-text="kontinuitaetSeverityCounts().all"></span>
      </button>
      <!-- Aktiver Tab bleibt klickbar (abwählen), auch wenn er gerade 0 zählt. -->
      <template x-for="sev in ['kritisch','mittel','niedrig']" :key="sev">
        <button type="button" class="tabs-btn"
                :class="{ 'tabs-btn--active': $store.catalogUi.kontinuitaetFilters.schwere === sev }"
                :aria-pressed="$store.catalogUi.kontinuitaetFilters.schwere === sev ? 'true' : 'false'"
                :disabled="kontinuitaetSeverityCounts()[sev] === 0 && $store.catalogUi.kontinuitaetFilters.schwere !== sev"
                @click="$store.catalogUi.kontinuitaetFilters.schwere = $store.catalogUi.kontinuitaetFilters.schwere === sev ? '' : sev">
          <span x-text="$app.t('kontinuitaet.severity.' + sev)"></span>
          <span class="tabs-btn-count" x-text="kontinuitaetSeverityCounts()[sev]"></span>
        </button>
      </template>
    </div>
    <div class="tabs">
      <template x-for="st in ['', 'open', 'resolved', 'dismissed']" :key="'st-' + st">
        <button type="button" class="tabs-btn"
                :class="{ 'tabs-btn--active': ($store.catalogUi.kontinuitaetFilters.status || '') === st }"
                :aria-pressed="($store.catalogUi.kontinuitaetFilters.status || '') === st ? 'true' : 'false'"
                @click="$store.catalogUi.kontinuitaetFilters.status = st"
                x-text="$app.t('kontinuitaet.status.' + (st || 'active'))"></button>
      </template>
      <!-- Von der Prüfung selbst verworfene Befunde (Entwarnung, erfundenes Zitat, Verify). -->
      <button type="button" class="tabs-btn" x-show="kontinuitaetDiscardedCount() > 0"
              :class="{ 'tabs-btn--active': $store.catalogUi.kontinuitaetFilters.status === 'discarded' }"
              :aria-pressed="$store.catalogUi.kontinuitaetFilters.status === 'discarded' ? 'true' : 'false'"
              @click="$store.catalogUi.kontinuitaetFilters.status = 'discarded'">
        <span x-text="$app.t('kontinuitaet.status.discarded')"></span>
        <span class="tabs-btn-count" x-text="kontinuitaetDiscardedCount()"></span>
      </button>
    </div>
    <div x-data="catalogFilter('figur')"
         x-modelable="value" x-model="$store.catalogUi.kontinuitaetFilters.figurId"
         x-effect="options = $store.catalog.figuren.filter(f => kontinuitaetAllIssues().some(i => i.fig_ids?.length ? i.fig_ids.includes(f.id) : (i.figuren||[]).includes(f.name))).map(f => ({value: f.id, label: f.kurzname || f.name}))"
         >
    </div>
    <div x-data="catalogFilter('chapter')"
         x-modelable="value" x-model="$store.catalogUi.kontinuitaetFilters.kapitel"
         x-effect="options = kontinuitaetKapitelListe().map(k => ({value: k, label: k}))"
         >
    </div>
    <span class="filter-count" x-text="kontinuitaetResult ? kontinuitaetIssuesSorted().length + ' / ' + kontinuitaetSeverityCounts().all : ''"></span>
  </div>

  <template x-if="kontinuitaetResult">
    <div class="kontinuitaet-result">

      <!-- Keine Probleme -->
      <div x-show="kontinuitaetResult.issues?.length === 0 && $store.catalogUi.kontinuitaetFilters.status !== 'discarded'" class="kontinuitaet-ok" x-text="$app.t('kontinuitaet.noIssues')"></div>
      <p x-show="$store.catalogUi.kontinuitaetFilters.status === 'discarded'" class="card-hint" x-text="$app.t('kontinuitaet.discard.hint')"></p>
      <!-- Alle weggefiltert -->
      <div x-show="kontinuitaetIssuesInStatus().length > 0 && kontinuitaetIssuesSorted().length === 0" class="kontinuitaet-nomatch">
        <span x-text="$app.t('kontinuitaet.noMatch')"></span>
        <button type="button" class="btn-compact" @click="kontinuitaetResetFilters()" x-text="$app.t('kontinuitaet.resetFilters')"></button>
      </div>

      <!-- Flache Liste, sortiert nach Schwere -->
      <div x-show="kontinuitaetIssuesSorted().length > 0" class="entity-list entity-list--accented">
        <template x-for="(issue, i) in kontinuitaetIssuesSorted()" :key="kontinuitaetIssueKey(issue, i)">
          <!-- @include kontinuitaet-issue -->
        </template>
      </div>

    </div>
  </template>

  <!-- Weltfakten-Faktencheck: prüft extrahierte Welt-Fakten per Web-Suche gegen die
       reale Faktenlage. Nur sichtbar, wenn instanzweit freigeschaltet (Claude + Kill-
       Switch); das Buch-Opt-in wird serverseitig geprüft (400 → Hinweis). -->
  <div class="collapsible-wrap faktencheck" x-show="$store.config.factcheckEnabled" x-cloak x-data="collapsible()">
    <button type="button" class="collapsible-toggle" x-bind="trigger">
      <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
      <span x-text="$app.t('kontinuitaet.faktencheck.start')"></span>
    </button>
    <div x-bind="panel" class="collapsible-section" x-cloak>
      <p class="card-hint card-section" x-text="$app.t('kontinuitaet.faktencheck.hint')"></p>
      <div class="nameguard-actions card-section">
        <button type="button" class="secondary"
                @click="faktencheckRun()"
                :disabled="kontinuitaetLoading || !$store.nav.selectedBookId">
          <span x-text="$app.t(kontinuitaetRunKind === 'faktencheck' ? 'kontinuitaet.faktencheck.starting' : 'kontinuitaet.faktencheck.start')"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- @include kontinuitaet-nameguard -->
</div>
