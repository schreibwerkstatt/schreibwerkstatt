<!-- Verknuepfungen + Tags eines Recherche-Fundstuecks und die
     KI-Verknuepfungsvorschlaege (der Verknuepfen-Picker ist ein Picker-Popover
     auf Kartenebene: recherche-link-picker.html). Fragment (string-seitiger @include),
     weil der Block sowohl im x-for der Liste als auch im Detail-Dialog steht —
     beide nennen das Fundstueck `item`, das Markup ist darum wortgleich teilbar.
     Die Vorschlaege haengen an `suggestions[item.id]` — pro Fundstueck, nicht
     pro Oberflaeche. -->
<div class="research-links" x-show="item.links && item.links.length">
  <template x-for="link in item.links" :key="link.link_id">
    <span class="entity-ref-group">
      <button type="button" class="entity-ref"
              x-entity-ref="{ type: link.target_kind, id: link.ref_id ?? link.target_id, label: link.label }"></button>
      <button type="button" class="entity-ref-remove" @click="removeLink(item, link)" :aria-label="$app.t('recherche.link.remove')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
    </span>
  </template>
</div>

<!-- Ideen-Plaketten: eigene Pendenzen, die an diesem Fundstueck haengen.
     Read-only — gesetzt wird die Kante auf der Ideen-Seite. -->
<div x-data="{ ideaOwnerId: item.id }"><!-- @include ideen-backlinks --></div>

<!-- Tags -->
<div class="research-tags" x-show="item.tags && item.tags.length">
  <template x-for="tag in item.tags" :key="tag">
    <span class="research-tag internal-link" @click="filterTag = tag; applyFilters()" x-text="tag"></span>
  </template>
</div>

<!-- KI-Verknuepfungsvorschlaege -->
<div class="research-suggestions" x-show="itemSuggestions(item)" x-cloak>
  <div class="research-suggestions-head" x-text="$app.t('recherche.suggest.heading')"></div>
  <template x-if="itemSuggestions(item) && itemSuggestions(item).length === 0">
    <div class="muted-msg muted-msg--sm" x-text="$app.t('recherche.suggest.none')"></div>
  </template>
  <template x-for="(sg, i) in (itemSuggestions(item) || [])" :key="sg.target_kind + ':' + sg.target_id">
    <div class="research-suggestion">
      <button type="button" class="entity-ref"
              x-entity-ref="{ type: sg.target_kind, id: sg.ref_id ?? sg.target_id, label: sg.label }"></button>
      <span class="research-suggestion-reason" x-show="sg.grund" x-text="sg.grund"></span>
      <button type="button" class="btn-compact" @click="acceptSuggestion(item, sg)" x-text="$app.t('recherche.suggest.accept')"></button>
    </div>
  </template>
  <button type="button" class="research-suggestions-dismiss" @click="dismissSuggestions(item)" x-text="$app.t('recherche.suggest.dismiss')"></button>
</div>
