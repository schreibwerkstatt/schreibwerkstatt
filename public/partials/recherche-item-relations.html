<!-- @expects item -->
<!-- Verknuepfungen + Tags eines Recherche-Fundstuecks und die
     KI-Verknuepfungsvorschlaege (der Verknuepfen-Picker ist ein Picker-Popover
     auf Kartenebene: recherche-link-picker.html). Fragment (string-seitiger @include),
     weil der Block sowohl im Anriss als auch in der aufgeklappten Zeile steht —
     beide nennen das Fundstueck `item`, das Markup ist darum wortgleich teilbar.
     Die Vorschlaege haengen an `suggestions[item.id]` — pro Fundstueck, nicht
     pro Oberflaeche. -->
<div class="research-links" x-show="item.links && item.links.length">
  <template x-for="link in item.links" :key="link.link_id">
    <span class="entity-ref-group">
      <button type="button" class="entity-ref"
              x-entity-ref="{ type: link.target_kind, id: link.ref_id ?? link.target_id, label: link.label }"></button>
      <button type="button" class="entity-ref-remove" @click="removeLink(item, link)" :aria-label="$app.t('recherche.link.remove')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
    </span>
  </template>
</div>

<!-- Ideen-Plaketten: eigene Pendenzen, die an diesem Fundstueck haengen.
     Read-only — gesetzt wird die Kante auf der Ideen-Seite. -->
<div x-data="{ ideaOwnerId: item.id }"><!-- @include ideen-backlinks --></div>

<!-- Tags. Im Bearbeiten-Modus stehen sie als Eingabe im Formular — beides
     zugleich waere doppelt (wie Links und Quelle in recherche-item-detail). -->
<div class="research-tags" x-show="item.tags && item.tags.length && !(detailEditing && detailItemId === item.id)">
  <template x-for="tag in item.tags" :key="tag">
    <span class="research-tag internal-link" @click="filterByTag(tag)" x-text="tag"></span>
  </template>
</div>

<!-- KI-Verknuepfungsvorschlaege -->
<div class="research-suggestions" x-show="itemSuggestions(item)" x-cloak>
  <div class="card-section-head">
    <div class="card-section-title" x-text="$app.t('recherche.suggest.heading')"></div>
    <button type="button" class="icon-btn icon-btn--ghost" @click="dismissSuggestions(item)"
            :data-tip="$app.t('recherche.suggest.dismiss')" :aria-label="$app.t('recherche.suggest.dismiss')">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg>
    </button>
  </div>
  <template x-if="itemSuggestions(item) && itemSuggestions(item).length === 0">
    <div class="muted-msg muted-msg--sm" x-text="$app.t('recherche.suggest.none')"></div>
  </template>
  <!-- Vorschlagskarte (DESIGN.md «Chat-Vorschlagskarte», «Werkstatt-Bedienvertrag»):
       Übernehmen verknüpft, Verwerfen blendet aus (wiederherstellbar). -->
  <div class="chat-vorschlaege">
    <template x-for="(sg, i) in (itemSuggestions(item) || [])" :key="sg.target_kind + ':' + sg.target_id">
      <div class="chat-vorschlag" :class="{ 'chat-vorschlag--applied': sg._state === 'applied', 'chat-vorschlag--discarded': sg._state === 'discarded' }">
        <div class="chat-vorschlag-header">
          <span class="chat-vorschlag-label" x-text="$app.t(sg._state === 'applied' ? 'recherche.suggest.applied' : 'recherche.suggest.label')"></span>
          <span class="chat-vorschlag-actions">
            <button type="button" class="chat-vorschlag-btn" x-show="!sg._state" :disabled="busy"
                    @click="acceptSuggestion(item, sg)" x-text="$app.t('recherche.suggest.accept')"></button>
            <button type="button" class="chat-vorschlag-btn chat-vorschlag-btn--ghost" x-show="sg._state !== 'applied'"
                    @click="discardSuggestion(item, sg)"
                    x-text="$app.t(sg._state === 'discarded' ? 'recherche.suggest.restore' : 'recherche.suggest.discard')"></button>
          </span>
        </div>
        <div class="chat-vorschlag-diff">
          <div class="chat-vorschlag-title"><button type="button" class="entity-ref"
               x-entity-ref="{ type: sg.target_kind, id: sg.ref_id ?? sg.target_id, label: sg.label }"></button></div>
        </div>
        <div class="chat-vorschlag-begruendung" x-show="sg.grund" x-text="sg.grund"></div>
      </div>
    </template>
  </div>
</div>
