<!-- Detail-Formular des Quellenverzeichnisses. Fragment-Include von
     sources.html (`<!-- @include sources-form -->`), kein eigenständiges
     Partial — es lebt im Scope von `sourcesCard`.
     Welche Felder erscheinen, entscheidet der Quellentyp:
     public/js/sources/fields.js#fieldsForType. -->
<div class="sources-form" x-show="srcEditingId !== null" x-cloak
     @keydown="$editKeys($event, { save: () => saveSource(), cancel: () => cancelSourceEdit() })">
  <div class="card-section-head">
    <span class="sources-form-title"
          x-text="srcEditingId === 'new' ? $app.t('sources.form.newTitle') : $app.t('sources.form.editTitle')"></span>
    <button type="button" class="icon-btn icon-btn--ghost" @click="cancelSourceEdit()"
            :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
  </div>

  <!-- Entwurf aus einem PDF (sources/pdf-draft.js): woher die Angaben kommen,
       und ob das Werk schon in der Bibliothek liegt. -->
  <div class="sources-pdf-origin" x-show="srcEditingId === 'new' && srcPdfInfo" x-cloak>
    <p :class="srcPdfInfo?.verified ? 'card-form-hint' : 'sources-doc-warn'" x-text="srcPdfInfoText()"></p>
    <p class="card-form-hint" x-show="srcPdfUrlText()" x-text="srcPdfUrlText()"></p>
    <p class="sources-doc-warn" x-show="srcPdfInfo?.existing_source_id">
      <span x-text="$app.t('sources.pdfDraft.existing')"></span>
      <button type="button" class="btn-compact" @click="useExistingSourceForPdf()" :disabled="sourcesBusy"
              x-text="$app.t('sources.pdfDraft.useExisting')"></button>
    </p>
  </div>

  <div class="card-form-grid">
    <div class="card-form-row">
      <label class="card-form-label" x-text="$app.t('sources.field.cslType')"></label>
      <div class="card-form-field">
        <div x-data="combobox({ placeholder: $app.t('sources.field.cslType'), compact: false })"
             x-modelable="value" x-model="srcDraft.csl_type"
             x-effect="options = sourceTypeOptions()"></div>
        <p class="card-form-field-note" x-text="$app.t('sources.field.cslType.hint')"></p>
      </div>
    </div>

    <!-- Urheber + Herausgeber. Eine Zeile trägt entweder Nachname/Vorname ODER
         eine Körperschaft; `literal` gefüllt gewinnt (siehe fields.js). -->
    <template x-for="kind in ['authors', 'editors']" :key="kind">
      <div class="card-form-row card-form-row--top">
        <label class="card-form-label"
               x-text="$app.t(kind === 'authors' ? 'sources.field.authors' : 'sources.field.editors')"></label>
        <div class="pub-repeater">
          <template x-for="(p, i) in srcDraft[kind]" :key="i">
            <div class="pub-repeater-row sources-person-row">
              <input type="text" x-model="p.family" :placeholder="$app.t('sources.person.family')"
                     :aria-label="$app.t('sources.person.family')" maxlength="200" :disabled="!!p.literal">
              <input type="text" x-model="p.given" :placeholder="$app.t('sources.person.given')"
                     :aria-label="$app.t('sources.person.given')" maxlength="200" :disabled="!!p.literal">
              <input type="text" x-model="p.literal" :placeholder="$app.t('sources.person.literal')"
                     :aria-label="$app.t('sources.person.literal')" maxlength="200">
              <button type="button" class="btn-compact danger" @click="removeSourcePerson(kind, i)"
                      :aria-label="$app.t('common.remove')" x-text="$app.t('common.remove')"></button>
            </div>
          </template>
          <button type="button" class="btn-compact" @click="addSourcePerson(kind)">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
            <span x-text="$app.t('sources.person.add')"></span>
          </button>
          <p class="card-form-hint" x-show="kind === 'authors'" x-text="$app.t('sources.person.hint')"></p>
        </div>
      </div>
    </template>

    <!-- Typabhängige Freitext-Felder -->
    <template x-for="f in srcVisibleFields()" :key="f.key">
      <div class="card-form-row">
        <label class="card-form-label" x-text="$app.t(f.labelKey)"></label>
        <div class="card-form-field">
          <!-- Zwei x-if-Varianten statt eines Inputs mit `:data-spellcheck`:
               der Spellcheck-Dispatcher greift Felder über einen statischen
               Attribut-Selektor (MutationObserver beim Einhängen + focusin) —
               ein reaktiv umgeschaltetes Attribut würde er beim Typwechsel nicht
               mitbekommen und einen Controller auf einem Nicht-Prosafeld
               stehenlassen. `f.spell` ist pro Feld-Key konstant, die beiden
               Zweige flippen also nie für denselben Knoten. -->
          <template x-if="f.options">
            <div x-data="combobox($app.t(f.labelKey), $app.t('sources.oton.unset'))"
                 x-modelable="value" x-model="srcDraft[f.key]"
                 x-effect="options = f.options.map(o => ({ value: o, label: $app.t(f.optionPrefix + o) }))"></div>
          </template>
          <template x-if="!f.options && f.spell">
            <input type="text" class="card-form-input" x-model="srcDraft[f.key]"
                   :aria-label="$app.t(f.labelKey)" maxlength="500" data-spellcheck="spelling">
          </template>
          <template x-if="!f.options && !f.spell">
            <input type="text" class="card-form-input" x-model="srcDraft[f.key]"
                   :aria-label="$app.t(f.labelKey)" maxlength="500"
                   :placeholder="f.key === 'accessed_at' ? $app.t('sources.field.accessedAt.ph')
                               : f.key === 'oton_date' ? $app.t('sources.field.otonDate.ph')
                               : f.key === 'issued_date' ? $app.t('sources.field.issuedDate.ph') : ''">
          </template>
        </div>
      </div>
    </template>

    <p class="card-form-section-divider card-form-section-divider--note" x-text="$app.t('sources.form.adminSection')"></p>

    <!-- Schlagworte: gehoeren dem Bibliothekseintrag (gelten in allen Arbeiten
         der Quelle). Enter/Komma uebernimmt, Vorschlaege aus der eigenen
         Bibliothek — sources/tags.js. -->
    <div class="card-form-row card-form-row--top">
      <label class="card-form-label" for="src-tag-input" x-text="$app.t('sources.field.tags')"></label>
      <div class="card-form-field">
        <div class="export-chip-row" x-show="srcDraft.tags.length">
          <template x-for="t in srcDraft.tags" :key="t">
            <span class="export-chip">
              <span x-text="t"></span>
              <button type="button" class="export-chip-remove" :aria-label="$app.t('common.remove')"
                      @click="removeSrcDraftTag(t)"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
            </span>
          </template>
        </div>
        <input type="text" id="src-tag-input" class="card-form-input" x-model="srcTagInput" maxlength="40"
               :placeholder="$app.t('sources.field.tags.ph')" @keydown="onSrcTagKeydown($event)">
        <div class="sources-tag-suggest" x-show="srcTagSuggestions().length" x-cloak>
          <template x-for="t in srcTagSuggestions()" :key="t">
            <button type="button" class="tag sources-tag sources-tag--suggest" @click="addSrcDraftTag(t)" x-text="'+ ' + t"></button>
          </template>
        </div>
        <p class="card-form-field-note" x-text="$app.t('sources.field.tags.hint')"></p>
      </div>
    </div>

    <div class="card-form-row">
      <label class="card-form-label" x-text="$app.t('sources.field.citekey')"></label>
      <div class="card-form-field">
        <input type="text" class="card-form-input" x-model="srcDraft.citekey"
               :aria-label="$app.t('sources.field.citekey')" maxlength="500">
        <p class="card-form-field-note" x-text="$app.t('sources.field.citekey.hint')"></p>
      </div>
    </div>

    <div class="card-form-row card-form-row--top">
      <label class="card-form-label" x-text="$app.t('sources.field.note')"></label>
      <div class="card-form-field">
        <textarea class="card-form-textarea" x-model="srcDraft.note" rows="3" maxlength="4000"
                  :aria-label="$app.t('sources.field.note')" data-spellcheck="spelling"></textarea>
        <p class="card-form-field-note" x-text="$app.t('sources.field.note.hint')"></p>
      </div>
    </div>

    <div class="card-form-row">
      <label class="card-form-label" x-text="$app.t('sources.field.status')"></label>
      <div class="form-stack">
        <label class="form-check">
          <input type="checkbox" x-model="srcDraft.archived">
          <span>
            <span class="form-check-title" x-text="$app.t('sources.archived')"></span>
            <span class="form-check-desc" x-text="$app.t('sources.archived.desc')"></span>
          </span>
        </label>
      </div>
    </div>

    <div class="card-form-row card-form-row--top">
      <label class="card-form-label" x-text="$app.t('sources.preview')"></label>
      <div class="card-form-field">
        <p class="sources-preview" x-text="srcPreview()"></p>
        <p class="card-form-field-note" x-text="$app.t('sources.preview.hint')"></p>
      </div>
    </div>

    <!-- PDF-Anhang an der Quelle (User-Pool). Das Form öffnet nur der
         Besitzer (Bearbeiten-Klick ist Owner-only, s. sources.html), also
         darf hier jeder Upload/Löschen — die Server-Route setzt die Grenze
         nochmals (403 NOT_SOURCE_OWNER). Der extrahierte Plain-Text wird
         semantisch indiziert; Upload triggert asynchron den Index-Job, dessen
         Fortschritt die Karte pollt (public/js/sources/doc.js). -->
    <template x-if="srcEditingId === 'new' && srcPdfPendingName">
      <div class="card-form-row card-form-row--top">
        <label class="card-form-label" x-text="$app.t('sources.doc.section')"></label>
        <div class="card-form-field">
          <div class="sources-doc-attached">
            <span x-text="srcPdfPendingName"></span>
            <button type="button" class="icon-btn icon-btn--ghost" @click="discardPendingPdf()"
                    :data-tip="$app.t('sources.doc.remove')" :aria-label="$app.t('sources.doc.remove')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg></button>
          </div>
          <p class="card-form-field-note" x-text="$app.t('sources.pdfDraft.pendingHint')"></p>
        </div>
      </div>
    </template>
    <template x-if="srcEditingId !== 'new'">
      <div class="card-form-row card-form-row--top">
        <label class="card-form-label" x-text="$app.t('sources.doc.section')"></label>
        <div class="card-form-field">
          <template x-if="!srcDraft.has_doc">
            <div class="sources-doc-upload">
              <input type="file" accept="application/pdf"
                     :aria-label="$app.t('sources.doc.pick')" x-ref="docInput"
                     @change="uploadSourceDoc($event)">
              <p class="card-form-field-note" x-text="$app.t('sources.doc.hint')"></p>
            </div>
          </template>
          <template x-if="srcDraft.has_doc">
            <div class="sources-doc-attached">
              <button type="button" class="internal-link sources-doc-link" @click="downloadSourceDoc(srcEditingId)">
                <svg class="icon" aria-hidden="true"><use href="/icons.svg#file-plus"/></svg>
                <span x-text="srcDraft.doc_name || $app.t('sources.doc.fallbackName')"></span>
              </button>
              <span class="sources-doc-pages" x-show="srcDraft.doc_pages"
                    x-text="$app.t('sources.doc.pages', { n: srcDraft.doc_pages })"></span>
              <button type="button" class="icon-btn icon-btn--ghost" @click="removeSourceDoc()" :disabled="srcDocBusy"
                      :data-tip="$app.t('sources.doc.remove')" :aria-label="$app.t('sources.doc.remove')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg></button>
            </div>
          </template>
          <div class="sources-doc-busy" x-show="srcDocBusy" x-cloak><span class="spinner"></span></div>
          <p class="card-form-error" x-show="srcDocError" x-cloak x-text="srcDocError"></p>
          <p class="sources-doc-index" x-show="srcDraft.has_doc" x-text="$app.t('sources.doc.indexState', { state: srcDocIndexLabel() })"></p>
          <!-- Der Extraktor deckelt lange Werke; ohne diesen Hinweis hielte der
               Autor eine halb indizierte Quelle für vollständig durchsuchbar. -->
          <p class="sources-doc-warn" x-show="srcDraft.doc_truncated" x-cloak
             x-text="$app.t('sources.doc.truncated', { n: srcDraft.doc_chars })"></p>
        </div>
      </div>
    </template>
  </div>

  <p class="card-form-error" x-show="srcFormError" x-cloak x-text="srcFormError"></p>
  <p class="card-form-hint" x-show="!srcCanSave() && !srcFormError" x-cloak x-text="$app.t('sources.form.identityHint')"></p>

  <div class="sources-form-actions">
    <button type="button" class="primary" @click="saveSource()" :disabled="!srcCanSave()">
      <span x-show="sourcesBusy" class="spinner"></span>
      <span x-text="sourcesBusy ? $app.t('common.saving') : $app.t('common.save')"></span>
    </button>
    <button type="button" @click="cancelSourceEdit()" x-text="$app.t('common.cancel')"></button>
  </div>
</div>
