<!--
  Fragment (via @include in chat.html, innerhalb des
  x-for über chatMessages): Änderungsvorschläge einer Seiten-Chat-Antwort.
  Erwartet `msg` + `msgIdx` aus dem umgebenden x-for. Methoden: chat/page-chat-apply.js
  (Übernehmen/Rückgängig/Verwerfen), chat/page-chat-marks.js (Zustand, Stelle zeigen).
  Übernehmen/Rückgängig nur mit Schreibrecht ($app.canEdit()) — der PUT verlangt editor;
  Lektoren sehen die Vorschläge und können sie verwerfen.
-->
<template x-if="msg.role === 'assistant' && msg.vorschlaege && msg.vorschlaege.length > 0">
  <div class="chat-vorschlaege">
    <div x-show="$app.canEdit() && chatOpenVorschlagCount(msg) > 1" class="chat-vorschlaege-actions">
      <button type="button" class="chat-vorschlag-btn"
        @click="applyAllChatVorschlaege(msgIdx)"
        :disabled="chatLoading || msg.vorschlaege.some(x => x._applying)"
        x-text="$app.t('chat.applyAll', { n: chatOpenVorschlagCount(msg) })"></button>
    </div>
    <template x-for="(v, vIdx) in msg.vorschlaege" :key="vIdx">
      <div class="chat-vorschlag"
        :class="{ 'chat-vorschlag--applied': v._applied, 'chat-vorschlag--discarded': v._discarded, 'chat-vorschlag--stale': v._stale || v._notFound }"
        @mouseenter="locateChatVorschlag(v)" @mouseleave="unlocateChatVorschlag()">
        <div class="chat-vorschlag-header">
          <span class="chat-vorschlag-label"
            x-text="v._applied ? $app.t('chat.applied') : v._discarded ? $app.t('chat.discarded') : v._notFound ? $app.t('chat.notFoundSuggestion') : v._stale ? $app.t('chat.staleSuggestion') : v._ambiguous ? $app.t('chat.ambiguousSuggestion') : $app.t('chat.suggestion')"></span>
          <span class="chat-vorschlag-actions">
            <button type="button" class="chat-vorschlag-btn" x-show="$app.canEdit() && !v._applied && !v._discarded"
              @click="applyChatVorschlag(v, msgIdx, vIdx)" :disabled="!!v._applying || chatLoading">
              <span x-show="v._applying" class="spinner"></span>
              <span x-text="v._applying ? $app.t('common.saving') : $app.t('chat.apply')"></span>
            </button>
            <button type="button" class="chat-vorschlag-btn" x-show="$app.canEdit() && v._applied"
              @click="undoChatVorschlag(msgIdx, vIdx)" :disabled="!v._undoable || !!v._applying || chatLoading"
              :data-tip="v._undoable ? null : $app.t('chat.undoChanged')" x-text="$app.t('chat.undo')"></button>
            <button type="button" class="chat-vorschlag-btn chat-vorschlag-btn--ghost" x-show="!v._applied"
              @click="toggleDiscardChatVorschlag(msgIdx, vIdx)" :disabled="!!v._applying"
              x-text="v._discarded ? $app.t('chat.restore') : $app.t('chat.discard')"></button>
          </span>
        </div>
        <div class="chat-vorschlag-diff internal-link" @click="locateChatVorschlag(v, { scroll: true })" :data-tip="$app.t('chat.showInText')">
          <template x-if="v._diff">
            <span class="chat-word-diff"><template x-for="(part, pi) in v._diff" :key="pi"><span :class="'chat-word-diff__' + part.t" x-text="part.v"></span></template></span>
          </template>
          <template x-if="!v._diff">
            <span>
              <span class="finding-original" x-text="v.original"></span>
              <span class="finding-korrektur" x-text="v.ersatz"></span>
            </span>
          </template>
        </div>
        <div x-show="v.begruendung" class="chat-vorschlag-begruendung" x-text="v.begruendung"></div>
        <div x-show="v._error" class="chat-vorschlag-error" x-text="v._error"></div>
      </div>
    </template>
  </div>
</template>
