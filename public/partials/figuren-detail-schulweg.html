<!-- Figur-Detail: Schullaufbahn (docs/figur-lebenslauf.md «Schullaufbahn»)
     Fragment der Figurenübersicht — eingebunden via `<!-- @include figuren-detail-schulweg -->`
     in figuren-detail.html (string-seitiger Include, weil der Block INNERHALB des
     `x-for` über die Figuren steht). Scope: `figurenCard` + Schleifenvariable `f`.
     Methods: public/js/book/figuren-schulweg.js. Erscheint nur, wenn das Buch ein
     Schulsystem hat (Bucheinstellungen › Schule). -->
<template x-if="figurSchulSystem()">
  <section class="figur-group figur-schule">
    <h4 class="figur-group-title" x-text="$app.t('figuren.schule.title')"></h4>

    <template x-if="figurSchulEditId !== f.id">
      <div>
        <dl class="figur-steckbrief-grid">
          <div class="figur-fact"><dt x-text="$app.t('figuren.schule.weg')"></dt><dd x-text="figurSchulWegLabel(f)"></dd></div>
          <div class="figur-fact"><dt x-text="$app.t('figuren.schule.einschulung')"></dt><dd x-text="figurSchulEinschulung(f)"></dd></div>
          <template x-if="figurSchulRepetitionen(f)">
            <div class="figur-fact"><dt x-text="$app.t('figuren.schule.repetitionen')"></dt><dd x-text="figurSchulRepetitionen(f)"></dd></div>
          </template>
          <template x-if="figurSchulImHandlungsjahr(f)">
            <div class="figur-fact">
              <dt x-text="$app.t('figuren.schule.imHandlungsjahr', { jahr: figurSchulHandlungsjahr() })"></dt>
              <dd x-text="figurSchulImHandlungsjahr(f)"></dd>
            </div>
          </template>
        </dl>
        <p class="card-hint card-hint--sm" x-show="figurSchulWegUngueltig(f)" x-text="$app.t('figuren.schule.wegUngueltigHint')"></p>
        <div class="figur-detail-actions">
          <button type="button" class="btn-compact" @click.stop="startFigurSchulEdit(f)">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#pencil"/></svg>
            <span x-text="$app.t('figuren.schule.edit')"></span>
          </button>
        </div>
      </div>
    </template>

    <template x-if="figurSchulEditId === f.id">
      <div class="figur-edit"
           @keydown="$editKeys($event, { save: () => saveFigurSchulEdit(f), cancel: () => cancelFigurSchulEdit() })">
        <div class="card-form-grid">
          <div x-id="['fld']" class="card-form-row">
            <label :id="$id('fld')" class="card-form-label" x-text="$app.t('figuren.schule.weg')"></label>
            <div class="card-form-field">
              <div :aria-labelledby="$id('fld')" x-data="combobox({ placeholder: $app.t('figuren.schule.weg'), emptyLabel: $app.t('figuren.schule.wegStandard'), compact: false })"
                   x-modelable="value" x-model="figurSchulDraft.weg"
                   x-effect="options = figurSchulWegOptionen()"></div>
            </div>
          </div>
          <div x-id="['fld']" class="card-form-row">
            <label :for="$id('fld')" class="card-form-label" x-text="$app.t('figuren.schule.einschulung')"></label>
            <div class="card-form-field">
              <input :id="$id('fld')" type="text" class="form-num"
                     x-data="numInput({ integer: true, min: 1000, max: 2999, grouping: false })"
                     x-modelable="value" x-model="figurSchulDraft.einschulung_jahr">
              <p class="card-form-field-note" x-text="$app.t('figuren.schule.einschulungHint')"></p>
            </div>
          </div>
          <div x-id="['fld']" class="card-form-row">
            <span :id="$id('fld')" class="card-form-label" x-text="$app.t('figuren.schule.repetition.label')"></span>
            <div class="card-form-field" role="group" :aria-labelledby="$id('fld')">
              <!-- Eingetragene Repetitionen als entfernbare Chips; hinzufügen nur Klassen,
                   die der gewählte Weg durchläuft. Eine, die nach einem Wegwechsel nicht
                   mehr passt, bleibt sichtbar markiert, bis sie entfernt ist. -->
              <div class="export-chip-row" x-show="(figurSchulDraft.repetitionen || []).length">
                <template x-for="r in (figurSchulDraft.repetitionen || [])" :key="r.stufe + ':' + r.klasse">
                  <span class="export-chip" :class="{ 'figur-schule-rep--ungueltig': figurSchulRepUngueltig(r) }">
                    <span x-text="figurSchulRepLabel(r)"></span>
                    <button type="button" class="export-chip-remove" :aria-label="$app.t('common.remove')"
                            @click="removeFigurSchulRepetition(r)"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
                  </span>
                </template>
              </div>
              <div x-show="!figurSchulRepVoll()"
                   x-data="combobox({ placeholder: $app.t('figuren.schule.repetition.add'), compact: false })"
                   x-modelable="value" x-model="figurSchulDraft.rep_neu"
                   x-effect="options = figurSchulRepOptionen()"
                   @combobox-change="addFigurSchulRepetition($event.detail)"></div>
              <p class="card-form-field-note" x-text="$app.t('figuren.schule.repetition.hint')"></p>
            </div>
          </div>
        </div>
        <div class="figur-edit-actions">
          <button type="button" class="primary" :disabled="figurSchulBusy" @click="saveFigurSchulEdit(f)">
            <span x-show="figurSchulBusy" class="spinner"></span>
            <span x-text="$app.t('common.save')"></span>
          </button>
          <button type="button" :disabled="figurSchulBusy" @click="cancelFigurSchulEdit()" x-text="$app.t('common.cancel')"></button>
        </div>
      </div>
    </template>

    <!-- Offener KI-Vorschlag: nur mit wörtlichem, geprüftem Beleg; übernimmt erst der Autor. -->
    <template x-if="figurSchulweg(f)?.vorschlag">
      <div class="figur-schule-vorschlag">
        <p class="card-form-section-divider" x-text="$app.t('figuren.schule.vorschlagTitel')"></p>
        <p class="figur-detail-row" x-text="figurSchulVorschlagWeg(f)"></p>
        <p class="card-hint card-hint--sm" x-show="figurSchulVorschlagDetails(f)" x-text="figurSchulVorschlagDetails(f)"></p>
        <blockquote class="figur-schule-beleg">
          <span x-text="'«' + figurSchulweg(f).vorschlag.zitat + '»'"></span>
          <template x-if="figurSchulweg(f).vorschlag.page_id">
            <button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', id: figurSchulweg(f).vorschlag.page_id }"></button>
          </template>
        </blockquote>
        <p class="card-hint card-hint--sm" x-show="figurSchulweg(f).vorschlag.begruendung" x-text="figurSchulweg(f).vorschlag.begruendung"></p>
        <div class="figur-edit-actions">
          <button type="button" class="primary" :disabled="figurSchulBusy" @click="acceptFigurSchulVorschlag(f)" x-text="$app.t('figuren.schule.uebernehmen')"></button>
          <button type="button" :disabled="figurSchulBusy" @click="rejectFigurSchulVorschlag(f)" x-text="$app.t('figuren.schule.verwerfen')"></button>
        </div>
      </div>
    </template>

    <!-- Klassenangaben aus dem Text (Job), geprüft gegen die Rechnung beim Lesen:
         ein Widerspruch ist ein Befund für den Text oder für den Schulweg. -->
    <template x-if="figurSchulKlassenangaben(f).length">
      <div class="figur-schule-angaben">
        <p class="card-form-section-divider" x-text="$app.t('figuren.schule.angabenTitel')"></p>
        <template x-for="(a, ai) in figurSchulKlassenangaben(f)" :key="ai">
          <div class="figur-schule-angabe" :class="'figur-schule-angabe--' + a.urteil">
            <p class="figur-detail-row">
              <span x-text="a.label"></span>
              <span class="figur-schule-urteil" x-text="$app.t('figuren.schule.urteil.' + a.urteil, { gerechnet: a.gerechnet })"></span>
            </p>
            <blockquote class="figur-schule-beleg">
              <span x-text="'«' + a.zitat + '»'"></span>
              <template x-if="a.page_id">
                <button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', id: a.page_id }"></button>
              </template>
            </blockquote>
          </div>
        </template>
      </div>
    </template>
    <p class="card-status" x-show="figurSchulMessage" x-text="figurSchulMessage"></p>
    <p class="card-form-error" x-show="figurSchulError" x-text="figurSchulError"></p>
  </section>
</template>
