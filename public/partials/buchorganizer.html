<!-- Buchorganizer -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/book-organizer-card.js.
  DnD via SortableJS (lazy aus lazy-libs.js). Reorder/Move als Single-Tree-PUT
  an /content/books/:id/order; Renames + CRUD über contentRepo (docs/buchorganizer.md).
-->
<div class="card card--organizer" x-data="bookOrganizerCard" x-show="$app.showBookOrganizerCard" x-cloak>
  <div class="card-header">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('bookOrganizer.title')"></span>
    </div>
    <div class="card-actions">
      <button type="button" class="icon-btn icon-btn--ghost" @click="createChapter()" :disabled="organizerSaving" :data-tip="$app.t('bookOrganizer.newChapter')" :aria-label="$app.t('bookOrganizer.newChapter')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#folder-plus"/></svg></button>
      <button type="button" class="icon-btn icon-btn--ghost" @click="createPage(0)" :disabled="organizerSaving" :data-tip="$app.t('bookOrganizer.newSoloPage')" :aria-label="$app.t('bookOrganizer.newSoloPage')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#file-plus"/></svg></button>
    </div>
  </div>

  <div class="organizer-toolbar">
    <span class="search-affix">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#search"/></svg>
      <input type="text" x-model="organizerSearch"
             :placeholder="$app.t('bookOrganizer.searchPlaceholder')"
             :aria-label="$app.t('bookOrganizer.searchPlaceholder')"
             class="page-search"
             autocomplete="off" data-bwignore data-1p-ignore data-lpignore="true" data-form-type="other">
      <button type="button" class="search-clear--icon" x-show="organizerSearch" @click="organizerSearch=''" :aria-label="$app.t('search.clear')" :data-tip="$app.t('search.clear')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
    </span>
    <div class="btn-group organizer-action-group">
      <button type="button" class="icon-btn"
              @click="historyUndo()"
              :disabled="_undoStack.length === 0 || organizerSaving"
              :data-tip="$app.withHotkey($app.t('bookOrganizer.undoTip'), 'undo')"
              :aria-label="$app.t('bookOrganizer.undo')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#undo"/></svg></button>
      <button type="button" class="icon-btn"
              @click="historyRedo()"
              :disabled="_redoStack.length === 0 || organizerSaving"
              :data-tip="$app.withHotkey($app.t('bookOrganizer.redoTip'), 'redo')"
              :aria-label="$app.t('bookOrganizer.redo')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#redo"/></svg></button>
      <button type="button" class="icon-btn"
              @click="expandAll()"
              :disabled="workTree.length === 0 || !!organizerSearch"
              :data-tip="$app.t('sidebar.expandAll')"
              :aria-label="$app.t('sidebar.expandAll')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#chevron-down"/></svg></button>
      <button type="button" class="icon-btn"
              @click="collapseAll()"
              :disabled="workTree.length === 0 || !!organizerSearch"
              :data-tip="$app.t('sidebar.collapseAll')"
              :aria-label="$app.t('sidebar.collapseAll')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#chevron-up"/></svg></button>
    </div>
    <div class="organizer-jump"
         x-show="workTree.length > 0 && !organizerSearch"
         x-data="combobox($app.t('bookOrganizer.jumpToPlaceholder'))"
         x-modelable="value" x-model="jumpToChapterId"
         x-effect="options = jumpChapterOptions()"
         @combobox-change="jumpToChapter($event.detail)"></div>
  </div>

  <div x-show="organizerStatus" class="card-status" x-text="organizerStatus"></div>

  <div x-show="workTree.length === 0 && soloPages.length === 0 && !organizerSaving" class="muted-msg muted-msg--spaced" x-text="$app.t('bookOrganizer.empty')"></div>

  <p class="organizer-hint muted-msg muted-msg--sm" x-text="$app.t('bookOrganizer.hint')"></p>

  <!-- Solo-Pages (kein Kapitel) zuerst -->
  <div class="organizer-chapter organizer-chapter--solo" x-show="filteredSoloPages().length > 0 || (workTree.length === 0 && !organizerSearch)">
    <div class="organizer-chapter-header">
      <span class="organizer-chapter-label" x-text="$app.t('bookOrganizer.soloHeader')"></span>
      <div class="organizer-chapter-actions">
        <button type="button" class="icon-btn icon-btn--ghost" @click="createPage(0)" :disabled="organizerSaving" :data-tip="$app.t('bookOrganizer.addPageHere')" :aria-label="$app.t('bookOrganizer.addPageHere')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#file-plus"/></svg></button>
      </div>
    </div>
    <ul class="organizer-pages" data-organizer="page-list" :data-chapter-id="0">
      <template x-for="page in filteredSoloPages()" :key="page.id">
        <!-- @include organizer-page-row -->
      </template>
      <li class="organizer-empty" x-show="filteredSoloPages().length === 0 && !organizerSearch" x-text="$app.t('bookOrganizer.noSoloPages')"></li>
    </ul>
  </div>

  <!--
    Kapitel-Liste — 3 Level ausgerollt (MAX_CHAPTER_DEPTH, book-organizer/constants.js).
    Der Zeileninhalt selbst ist SSoT im Fragment-Include `organizer-chapter-body`
    (Kopfzeile + Seitenliste) — pro Level bleibt hier nur der Wrapper mit
    `data-organizer-depth` + `data-parent-chapter-id` fuer die Sortable-Drop-
    Validierung. Alle Level nutzen bewusst denselben x-for-Alias `ch`: Alpine
    shadowed ihn im Kind-Scope, dadurch ist der Include tiefenunabhaengig.
    Indent via CSS-Custom-Prop --depth auf .organizer-chapter.
  -->
  <div class="organizer-list" data-organizer="chapter-list" data-organizer-depth="1">
    <template x-for="ch in filteredWorkTree()" :key="ch.id">
      <div class="organizer-chapter" :class="'organizer-chapter--depth-' + ch.depth"
           :data-chapter-id="ch.id" :style="{ '--depth': ch.depth }">
        <!-- @include organizer-chapter-body -->

        <!-- Level 2 -->
        <template x-if="(ch.subchapters?.length || 0) > 0 && (organizerSearch ? true : chapterOpen[ch.id])">
        <div class="organizer-subchapters" data-organizer="chapter-list"
             :data-parent-chapter-id="ch.id" data-organizer-depth="2">
          <template x-for="ch in (ch.subchapters || [])" :key="ch.id">
            <div class="organizer-chapter" :class="'organizer-chapter--depth-' + ch.depth"
                 :data-chapter-id="ch.id" :style="{ '--depth': ch.depth }">
              <!-- @include organizer-chapter-body -->

              <!-- Level 3 (terminale Tiefe) -->
              <template x-if="(ch.subchapters?.length || 0) > 0 && (organizerSearch ? true : chapterOpen[ch.id])">
              <div class="organizer-subchapters" data-organizer="chapter-list"
                   :data-parent-chapter-id="ch.id" data-organizer-depth="3">
                <template x-for="ch in (ch.subchapters || [])" :key="ch.id">
                  <div class="organizer-chapter" :class="'organizer-chapter--depth-' + ch.depth"
                       :data-chapter-id="ch.id" :style="{ '--depth': ch.depth }">
                    <!-- @include organizer-chapter-body -->
                  </div>
                </template>
              </div>
              </template>
            </div>
          </template>
        </div>
        </template>
      </div>
    </template>
    <div class="muted-msg muted-msg--sm" x-show="organizerSearch && filteredWorkTree().length === 0 && filteredSoloPages().length === 0" x-text="$app.t('sidebar.noPagesFound')"></div>
  </div>

  <!-- Kapitellängen-Verteilung (Zeichen): Collapse am Fuss, default zu. Diverging-
       Bar um Median — gleicher Pattern wie Buch-Übersicht (overview-chapter-*).
       Quelle: chapterLengthDist() aus root.tree-Stats. Klick auf Zeile springt
       zum Kapitel. Erst ab >1 Kapitel sinnvoll (Median/Verteilung). -->
  <div class="organizer-lengthdist" x-data="collapsible()"
       x-show="chapterLengthDist().length > 1" x-cloak>
    <button type="button" class="collapsible-toggle" x-bind="trigger">
      <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
      <span x-text="$app.t('bookOrganizer.lengthDist')"></span>
      <span class="overview-tile-median"
            x-show="open && chapterLengthDist()[0]?.median > 0"
            x-text="$app.t('overview.medianTick') + ': ' + _fmtNum(Math.round(chapterLengthDist()[0]?.median)) + ' ' + $app.t('bookstats.unit.z')"></span>
    </button>
    <ul class="overview-chapter-list" x-bind="panel" x-cloak>
      <template x-for="ch in chapterLengthDist()" :key="ch.id">
        <li class="overview-chapter-row internal-link"
            :class="{ 'overview-chapter-row--max': ch.isMax, 'overview-chapter-row--min': ch.isMin }"
            @click="jumpToChapter(ch.id)"
            :data-tip="ch.name">
          <span class="overview-chapter-name" :data-tip="ch.name" x-text="ch.name"></span>
          <div class="overview-chapter-bar-track overview-chapter-bar-track--diverge">
            <div class="overview-chapter-bar-fill"
                 :class="ch.isPositive ? 'overview-chapter-bar-fill--pos' : 'overview-chapter-bar-fill--neg'"
                 :style="{ left: ch.barLeftPct + '%', width: ch.barWidthPct + '%' }"></div>
            <div class="overview-chapter-median-tick"
                 :data-tip="$app.t('overview.medianTick') + ': ' + _fmtNum(ch.median) + ' ' + $app.t('bookstats.unit.z')"></div>
          </div>
          <span class="overview-chapter-meta">
            <span class="overview-chapter-delta"
                  x-text="(ch.deltaPct >= 0 ? '+' : '') + ch.deltaPct + '%'"></span>
            <span class="overview-chapter-chars" x-text="_fmtNum(ch.chars) + ' ' + $app.t('bookstats.unit.z')"></span>
            <span class="overview-chapter-ns"
                  :data-tip="$app.t('bookstats.metric.normseiten')"
                  x-text="_fmtDec1(ch.normseiten) + ' ' + $app.t('bookstats.unit.ns')"></span>
            <span class="overview-chapter-words" x-text="_fmtNum(ch.words) + ' ' + $app.t('bookstats.unit.w')"></span>
            <span class="overview-chapter-pages" x-text="ch.pages + ' ' + $app.t('bookstats.unit.s')"></span>
          </span>
        </li>
      </template>
    </ul>
  </div>

  <!-- Konflikt-Diff-Modal: zeigt App-Inhalt vs. WP-Inhalt, User wählt die Quelle. -->
  <div class="blog-conflict-overlay" x-show="!!$blog.conflictOpen" x-cloak
       @keydown.escape.window="$blog.closeConflict()">
    <div class="blog-conflict-modal">
      <div class="blog-conflict-header">
        <span class="card-title" x-text="$app.t('blog.conflict.title')"></span>
        <button type="button" class="organizer-delete-btn" @click="$blog.closeConflict()" :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
      </div>
      <template x-if="!$blog.conflictData">
        <div class="muted-msg" x-text="$app.t('common.loading')"></div>
      </template>
      <template x-if="$blog.conflictData">
        <div class="blog-conflict-body">
          <div class="blog-conflict-side">
            <div class="blog-conflict-side-header">
              <h4 x-text="$app.t('blog.conflict.local', { appName: $store.shell.appName })"></h4>
              <span class="muted" x-text="$blog.conflictData.local.name"></span>
            </div>
            <div class="blog-conflict-content" x-html="$blog.conflictData.local.html"></div>
          </div>
          <div class="blog-conflict-side">
            <div class="blog-conflict-side-header">
              <h4 x-text="$app.t('blog.conflict.remote')"></h4>
              <span class="muted" x-text="$blog.conflictData.remote.title"></span>
            </div>
            <div class="blog-conflict-content" x-html="$blog.conflictData.remote.html"></div>
          </div>
        </div>
      </template>
      <div class="blog-conflict-actions" x-show="$blog.conflictData">
        <button type="button" @click="$blog.resolveConflict('app')"
                x-text="$app.t('blog.conflict.keepApp')"></button>
        <button type="button" @click="$blog.resolveConflict('wp')"
                x-text="$app.t('blog.conflict.takeWp')"></button>
        <button type="button" class="btn-compact" @click="$blog.closeConflict()"
                x-text="$app.t('common.cancel')"></button>
      </div>
    </div>
  </div>
</div>
