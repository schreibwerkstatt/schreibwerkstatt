<!-- Fine-Tuning-Datenexport -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/finetune-export-card.js.
  `showFinetuneExportCard` bleibt im Root (Hash-Router + Exklusivitaet),
  fachlicher State in dieser Komponente.

  Markup-Konvention: Form-Geometrie (card-form-grid / -row / -label) und
  Form-Patterns (form-stack / form-check / form-inline / form-num) sind
  geteilt mit book-settings.html / user-settings.html. Siehe DESIGN.md.
-->
<div class="card card--finetune" x-data="finetuneExportCard" x-show="$app.showFinetuneExportCard" x-cloak>
  <div class="card-header">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('finetune.title')"></span>
    </div>
    <div class="card-actions">
      <button type="button" class="icon-btn icon-btn--ghost"
              @click="runFinetuneExport()"
              :disabled="finetuneLoading || !$store.nav.selectedBookId"
              :data-tip="finetuneLoading ? $app.t('finetune.generating') : $app.t('finetune.generate')"
              :aria-label="$app.t('finetune.generate')">
        <span x-show="finetuneLoading" class="spinner"></span>
        <svg x-show="!finetuneLoading" class="icon" aria-hidden="true"><use href="/icons.svg#play"/></svg>
      </button>
    </div>
  </div>

  <p class="form-lead" x-text="$app.t('finetune.lead')"></p>

  <div class="card-form-grid">

    <div x-id="['fld']" class="card-form-row">
      <label :id="$id('fld')" class="card-form-label" x-text="$app.t('finetune.profile')"></label>
      <div class="form-stack">
        <div :aria-labelledby="$id('fld')" x-data="combobox({ placeholder: $app.t('finetune.profile'), compact: false })"
             x-modelable="value" x-model="finetuneProfileId"
             x-effect="options = finetuneProfileOptions()"
             @combobox-change="finetuneApplyProfile($event.detail)"></div>
        <p class="form-check-desc" x-text="$app.t('finetune.profile.desc')"></p>
        <div class="row">
          <button type="button" @click="finetuneDownloadStudioConfig()">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#download"/></svg>
            <span x-text="$app.t('finetune.profile.download')"></span>
          </button>
        </div>
      </div>
    </div>

    <div class="card-form-row">
      <label for="ft-type-style" class="card-form-label" x-text="$app.t('finetune.types')"></label>
      <div class="form-stack">
        <label class="form-check">
          <input type="checkbox" id="ft-type-style" name="ft-type-style" x-model="finetuneTypeStyle">
          <span>
            <span class="form-check-title" x-text="$app.t('finetune.type.style')"></span>
            <span class="form-check-desc" x-text="$app.t('finetune.type.style.desc')"></span>
          </span>
        </label>
        <label class="form-check">
          <input type="checkbox" id="ft-type-scene" name="ft-type-scene" x-model="finetuneTypeScene">
          <span>
            <span class="form-check-title" x-text="$app.t('finetune.type.scene')"></span>
            <span class="form-check-desc" x-text="$app.t('finetune.type.scene.desc')"></span>
          </span>
        </label>
        <label class="form-check">
          <input type="checkbox" id="ft-type-verbatim" name="ft-type-verbatim" x-model="finetuneTypeVerbatim">
          <span>
            <span class="form-check-title" x-text="$app.t('finetune.type.verbatim')"></span>
            <span class="form-check-desc" x-text="$app.t('finetune.type.verbatim.desc')"></span>
          </span>
        </label>
        <label class="form-check">
          <input type="checkbox" id="ft-type-dialog" name="ft-type-dialog" x-model="finetuneTypeDialog">
          <span>
            <span class="form-check-title" x-text="$app.t('finetune.type.dialog')"></span>
            <span class="form-check-desc" x-text="$app.t('finetune.type.dialog.desc')"></span>
          </span>
        </label>
        <label class="form-check">
          <input type="checkbox" id="ft-type-authorchat" name="ft-type-authorchat" x-model="finetuneTypeAuthorChat">
          <span>
            <span class="form-check-title" x-text="$app.t('finetune.type.authorChat')"></span>
            <span class="form-check-desc" x-text="$app.t('finetune.type.authorChat.desc')"></span>
          </span>
        </label>
      </div>
    </div>

    <div class="card-form-row">
      <label for="ft-min-chars" class="card-form-label" x-text="$app.t('finetune.length')"></label>
      <div class="form-inline">
        <label class="form-inline-field">
          <span x-text="$app.t('finetune.length.min')"></span>
          <input type="text" id="ft-min-chars" name="ft-min-chars" x-data="numInput({ step: 20, min: 80, max: 5000 })" x-modelable="value" x-model="finetuneMinChars" class="form-num">
        </label>
        <label class="form-inline-field">
          <span x-text="$app.t('finetune.length.max')"></span>
          <input type="text" id="ft-max-chars" name="ft-max-chars" x-data="numInput({ step: 100, min: 200, max: 16000 })" x-modelable="value" x-model="finetuneMaxChars" class="form-num">
        </label>
      </div>
    </div>

    <div class="card-form-row">
      <label for="ft-bias-boost" class="card-form-label" x-text="$app.t('finetune.bias')"></label>
      <div class="form-stack">
        <div class="form-inline">
          <label class="form-inline-field">
            <span x-text="$app.t('finetune.bias.boost')"></span>
            <input type="text" id="ft-bias-boost" name="ft-bias-boost" x-data="numInput({ step: 1, min: 1, max: 5, integer: true })" x-modelable="value" x-model="finetuneBiasBoost" class="form-num">
          </label>
        </div>
        <p class="form-check-desc" x-text="$app.t('finetune.bias.desc')"></p>
      </div>
    </div>

    <div class="card-form-row">
      <label for="ft-max-per-answer" class="card-form-label" x-text="$app.t('finetune.quality')"></label>
      <div class="form-stack">
        <div class="form-inline">
          <label class="form-inline-field">
            <span x-text="$app.t('finetune.quality.maxPerAnswer')"></span>
            <input type="text" id="ft-max-per-answer" name="ft-max-per-answer" x-data="numInput({ step: 1, min: 0, max: 50, integer: true })" x-modelable="value" x-model="finetuneMaxPerAnswer" class="form-num">
          </label>
          <label class="form-inline-field">
            <span x-text="$app.t('finetune.quality.maxFactShare')"></span>
            <input type="text" id="ft-max-fact-share" name="ft-max-fact-share" x-data="numInput({ step: 0.05, min: 0, max: 0.95 })" x-modelable="value" x-model="finetuneMaxFactShare" class="form-num">
          </label>
        </div>
        <p class="form-check-desc" x-text="$app.t('finetune.quality.desc')"></p>
      </div>
    </div>

    <div class="card-form-row">
      <label for="ft-max-type-share" class="card-form-label" x-text="$app.t('finetune.balance')"></label>
      <div class="form-stack">
        <div class="form-inline">
          <label class="form-inline-field">
            <span x-text="$app.t('finetune.balance.maxShare')"></span>
            <input type="text" id="ft-max-type-share" name="ft-max-type-share" x-data="numInput({ step: 0.05, min: 0, max: 0.95 })" x-modelable="value" x-model="finetuneMaxTypeShare" class="form-num">
          </label>
        </div>
        <p class="form-check-desc" x-text="$app.t('finetune.balance.desc')"></p>
      </div>
    </div>

    <div class="card-form-row">
      <label for="ft-val-split" class="card-form-label" x-text="$app.t('finetune.valSplit')"></label>
      <div class="form-stack">
        <div class="form-inline">
          <label class="form-inline-field">
            <span x-text="$app.t('finetune.valSplit.ratio')"></span>
            <input type="text" id="ft-val-split" name="ft-val-split" x-data="numInput({ step: 0.05, min: 0, max: 0.5 })" x-modelable="value" x-model="finetuneValSplit" class="form-num">
          </label>
          <label class="form-inline-field">
            <span x-text="$app.t('finetune.valSplit.seed')"></span>
            <input type="text" id="ft-val-seed" name="ft-val-seed" x-data="numInput({ step: 1, min: 0, max: 999999 })" x-modelable="value" x-model="finetuneValSeed" class="form-num">
          </label>
        </div>
        <p class="form-check-desc" x-text="$app.t('finetune.valSplit.desc')"></p>
      </div>
    </div>

    <div id="partial-finetune-export-ai"></div>

    <div class="card-form-row">
      <label for="ft-max-seq-tokens" class="card-form-label" x-text="$app.t('finetune.unsloth')"></label>
      <div class="form-stack">
        <div class="form-inline">
          <label class="form-inline-field">
            <span x-text="$app.t('finetune.unsloth.maxSeqTokens')"></span>
            <input type="text" id="ft-max-seq-tokens" name="ft-max-seq-tokens" x-data="numInput({ step: 512, min: 0, max: 16384 })" x-modelable="value" x-model="finetuneMaxSeqTokens" class="form-num">
          </label>
        </div>
        <label class="form-check">
          <input type="checkbox" id="ft-emit-text" name="ft-emit-text" x-model="finetuneEmitText">
          <span>
            <span class="form-check-title" x-text="$app.t('finetune.unsloth.emitText')"></span>
            <span class="form-check-desc" x-text="$app.t('finetune.unsloth.emitText.desc')"></span>
          </span>
        </label>
        <label class="form-check">
          <input type="checkbox" id="ft-truncate-long" name="ft-truncate-long" x-model="finetuneTruncateLong">
          <span>
            <span class="form-check-title" x-text="$app.t('finetune.unsloth.truncateLong')"></span>
            <span class="form-check-desc" x-text="$app.t('finetune.unsloth.truncateLong.desc')"></span>
          </span>
        </label>
      </div>
    </div>
  </div>

  <div id="partial-finetune-export-result"></div>
</div>
