      <!-- Druck-Tab (Druckvorstufe / klassische Druckerei) -->
      <div class="export-tab-panel" x-bind="panel('print')">
        <p class="card-form-field-note" x-text="$app.t('pdfExport.print.hint')"></p>

        <!-- KDP-Vorgaben (Amazon Kindle Direct Publishing) -->
        <div class="pdfx-kdp-preset">
          <button type="button" @click="applyKdpPreset()" x-text="$app.t('pdfExport.print.kdpPreset')"></button>
          <p class="card-form-field-note" x-text="$app.t('pdfExport.print.kdpPresetHint')"></p>
          <ul class="pdfx-kdp-check">
            <template x-for="w in kdpMarginWarnings()" :key="w.text">
              <li :class="w.ok === false ? 'is-warn' : (w.ok === true ? 'is-ok' : 'is-info')" x-text="w.text"></li>
            </template>
          </ul>
        </div>

        <div class="card-form-grid">
          <div x-id="['fld']" class="card-form-row" x-show="uiMode === 'expert'">
            <label :for="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.print.bleedMm')"></label>
            <div class="card-form-field">
              <input :id="$id('fld')" type="text" x-data="numInput({ step: 0.5, min: 0, max: 10 })" x-modelable="value" x-model="activeProfile.config.print.bleedMm" class="pdfx-num-input">
            </div>
          </div>
          <div class="card-form-row card-form-row--top" x-show="uiMode === 'expert'">
            <span class="card-form-label" aria-hidden="true">&nbsp;</span>
            <div class="card-form-field">
              <label class="pdfx-check">
                <input type="checkbox" x-model="activeProfile.config.print.cropMarks" :disabled="!(activeProfile.config.print.bleedMm > 0)">
                <span x-text="$app.t('pdfExport.print.cropMarks')"></span>
              </label>
              <p class="card-form-field-note" x-show="!(activeProfile.config.print.bleedMm > 0)" x-text="$app.t('pdfExport.print.cropMarksNeedsBleed')"></p>
            </div>
          </div>
          <div x-id="['fld']" class="card-form-row" x-show="uiMode === 'expert'">
            <label :for="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.print.dpiWarnThreshold')"></label>
            <div class="card-form-field">
              <input :id="$id('fld')" type="text" x-data="numInput({ step: 10, min: 72, max: 1200, integer: true })" x-modelable="value" x-model="activeProfile.config.print.dpiWarnThreshold" class="pdfx-num-input">
            </div>
          </div>
          <div class="card-form-row card-form-row--top" x-show="uiMode === 'expert'">
            <span class="card-form-label" aria-hidden="true">&nbsp;</span>
            <div class="card-form-field">
              <label class="pdfx-check">
                <input type="checkbox" x-model="activeProfile.config.print.padToEvenPages">
                <span x-text="$app.t('pdfExport.print.padToEvenPages')"></span>
              </label>
              <p class="card-form-field-note" x-text="$app.t('pdfExport.print.padToEvenPagesHint')"></p>
            </div>
          </div>
          <div class="card-form-row card-form-row--top" x-show="uiMode === 'expert'">
            <span class="card-form-label" aria-hidden="true">&nbsp;</span>
            <div class="card-form-field">
              <label class="pdfx-check">
                <input type="checkbox" x-model="activeProfile.config.print.blackTextKOnly" :disabled="activeProfile.config.pdfa.standard === 'pdfa'">
                <span x-text="$app.t('pdfExport.print.blackTextKOnly')"></span>
              </label>
              <p class="card-form-field-note" x-show="activeProfile.config.pdfa.standard === 'pdfa'" x-text="$app.t('pdfExport.print.blackTextKOnlyPdfa')"></p>
              <p class="card-form-field-note" x-text="$app.t('pdfExport.print.blackTextKOnlyHint')"></p>
            </div>
          </div>

          <!-- PDF-Norm (PDF/A · PDF/X · kein) — Ausgabestandard der Datei. -->
          <p class="card-form-section-divider" x-text="$app.t('pdfExport.print.group.norm')"></p>
          <div x-id="['fld']" class="card-form-row">
            <label :id="$id('fld')" class="card-form-label" x-text="$app.t('pdfExport.norm.standard')"></label>
            <div class="card-form-field">
              <div :aria-labelledby="$id('fld')" x-data="combobox($app.t('pdfExport.norm.standard'))"
                   x-modelable="value" x-model="activeProfile.config.pdfa.standard"
                   x-effect="options = [{ value: 'pdfa', label: $app.t('pdfExport.norm.pdfa') }, { value: 'pdfx', label: $app.t('pdfExport.norm.pdfx') }, { value: 'none', label: $app.t('pdfExport.norm.none') }]"
></div>
              <p class="card-form-field-note" x-show="activeProfile.config.pdfa.standard === 'pdfa'" x-text="$app.t('pdfExport.norm.hintPdfa')"></p>
              <p class="card-form-field-note" x-show="activeProfile.config.pdfa.standard === 'pdfx'" x-text="$app.t('pdfExport.norm.hintPdfx')"></p>
              <p class="card-form-field-note" x-show="activeProfile.config.pdfa.standard === 'none'" x-text="$app.t('pdfExport.norm.hintNone')"></p>
            </div>
          </div>
        </div>
      </div>
