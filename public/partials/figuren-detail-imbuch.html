<!-- Figur-Detail: Im Buch (Auftritte, Beziehungen, Zeitstrahl)
     Fragment der Figurenübersicht — eingebunden via `<!-- @include figuren-detail-imbuch -->`
     in figuren-detail.html. String-seitiger Include statt DOM-Placeholder, weil
     der Block INNERHALB des `x-for` über die Figuren steht (querySelector steigt
     nicht in Template-Content ab). Scope ist damit `figurenCard` + die
     Schleifenvariable `f`; Root-Zugriffe laufen über `$app`.
-->
<!-- ===== Gruppe: Im Buch (Auftritte, Beziehungen, Zeitstrahl) ===== -->
<section class="figur-group" x-show="f.kapitel?.length > 1 || $app.songsByFigurId.get(f.id)?.length || f.eltern_ids?.length || f.geschwister_ids?.length || f.beziehungen?.length || f.lebensereignisse?.length">
  <h4 class="figur-group-title" x-text="$app.t('figuren.group.imBuch')"></h4>
  <!-- Kapitelauftritte -->
  <div class="figur-kapitelauftritte" x-show="f.kapitel?.length > 1">
    <div class="bewertung-section-title" x-text="$app.t('figuren.field.kapitelauftritte')"></div>
    <!-- Klick setzt den Kapitel-Filter der Figurenliste (bewusst keine Navigation). -->
    <div class="entity-refs figur-tags-row">
      <template x-for="(k, ki) in (f.kapitel || [])" :key="ki">
        <button type="button" class="entity-ref"
                x-entity-ref="{ type: 'kapitel', id: k.chapter_id, name: k.name, count: k.haeufigkeit, onOpen: () => { $store.catalogUi.figurenFilters.kapitel = k.name; $store.catalogUi.figurenFilters.seite = '' } }"></button>
      </template>
    </div>
  </div>
  <!-- Präsenz-Streifen dieser Figur (Auftritte je Kapitel + Wendepunkt-Marker) -->
  <!-- @include figuren-presence-strip -->
  <!-- Musikgeschmack — abgeleitet aus song_figures-Rollup -->
  <div x-show="$app.songsByFigurId.get(f.id)?.length" class="figur-musikgeschmack">
    <div class="bewertung-section-title" x-text="$app.t('figuren.field.musikgeschmack')"></div>
    <div class="figur-tags-row">
      <template x-for="s in ($app.songsByFigurId.get(f.id) || [])" :key="s.id">
        <button type="button" class="entity-ref" x-entity-ref="{ type: 'song', id: s.id, label: (s.titel || '') + (s.interpret ? ' — ' + s.interpret : '') }"></button>
      </template>
    </div>
  </div>
  <!-- Familie -->
  <div x-show="f.eltern_ids?.length || f.geschwister_ids?.length">
    <div class="bewertung-section-title" x-text="$app.t('figuren.field.familie')"></div>
    <!-- Verwandtschafts-Pfeil vor der Referenz: ↑ Elternteil, ⇔ Geschwister. -->
    <div class="entity-refs figur-tags-row">
      <template x-for="pid in (f.eltern_ids || [])" :key="'e'+pid">
        <span class="figur-rel">
          <span class="figur-rel-mark" role="img" :aria-label="$app.t('figuren.rel.parent')" :data-tip="$app.t('figuren.rel.parent')">↑</span>
          <button type="button" class="entity-ref" x-entity-ref="{ type: 'figur', id: pid }"></button>
        </span>
      </template>
      <template x-for="sid in (f.geschwister_ids || [])" :key="'s'+sid">
        <span class="figur-rel">
          <span class="figur-rel-mark" role="img" :aria-label="$app.t('figuren.rel.sibling')" :data-tip="$app.t('figuren.rel.sibling')">⇔</span>
          <button type="button" class="entity-ref" x-entity-ref="{ type: 'figur', id: sid }"></button>
        </span>
      </template>
    </div>
  </div>
  <!-- Beziehungen -->
  <div x-show="f.beziehungen?.length">
    <div class="bewertung-section-title" x-text="$app.t('figuren.field.beziehungen')"></div>
    <div class="figur-bz-list">
      <template x-for="(bz, i) in (f.beziehungen || [])" :key="i">
        <div class="figur-beziehung-item">
          <span class="figur-bz-typ" :class="'figur-bz-' + bz.typ" x-text="$app.t('figuren.bz.' + bz.typ)"></span>
          <button type="button" class="entity-ref" x-entity-ref="{ type: 'figur', id: bz.figur_id }"></button>
          <span x-show="bz.machtverhaltnis && bz.machtverhaltnis !== 0" class="figur-bz-macht" :class="bz.machtverhaltnis > 0 ? 'figur-bz-macht--positiv' : 'figur-bz-macht--negativ'" x-text="bz.machtverhaltnis > 0 ? '↑'.repeat(Math.abs(bz.machtverhaltnis)) : '↓'.repeat(Math.abs(bz.machtverhaltnis))"></span>
          <span x-show="bz.beschreibung" class="card-hint card-hint--sm" x-text="'– ' + bz.beschreibung"></span>
          <template x-if="bz.belege?.length">
            <!-- Beleg: Seite (per ID oder Kapitel+Seitenname), sonst Kapitel. -->
            <span class="entity-refs figur-bz-belege">
              <template x-for="(bg, bi) in (bz.belege || [])" :key="bi">
                <button type="button" class="entity-ref"
                        x-entity-ref="(bg.page_id || (!bg.chapter_id && bg.seite))
                          ? { type: 'seite', id: bg.page_id, name: bg.seite, kapitel: bg.kapitel }
                          : { type: 'kapitel', id: bg.chapter_id, name: bg.kapitel }"></button>
              </template>
            </span>
          </template>
        </div>
      </template>
    </div>
  </div>
  <!-- Lebensereignisse / Zeitstrahl -->
  <div x-show="f.lebensereignisse?.length">
    <div class="bewertung-section-title" x-text="$app.t('figuren.field.zeitstrahl')"></div>
    <div class="global-zeitstrahl-body">
      <template x-for="(ev, i) in (f.lebensereignisse || [])" :key="i">
        <!-- Dieselbe `figure_events`-Zeile wie in der Ereignisse-Karte, aber
             bewusst KEIN geteiltes Fragment: dort traegt die Zeile die
             Bruecke zum Jahres-Band (Auswahl, Listen-Index, Abschnitts-
             Trenner), die es in der Figuren-Karte nicht gibt. Geteilt
             sind Datums-Formatierung und Subtyp-Codierung — also das,
             was denselben Datensatz sonst je Karte anders aussehen liesse. -->
        <div class="gz-item"
             :class="[ ev.typ === 'extern' ? 'gz-item--extern' : '',
                       'gz-item--subtyp-' + (ev.subtyp || 'sonstiges') ]">
          <div class="gz-marker" :class="ev.typ === 'extern' ? 'gz-marker--extern' : ''"></div>
          <div class="gz-content">
            <div class="gz-datum-row">
              <span class="gz-datum" x-text="formatEventDate(ev)"></span>
              <span class="gz-subtyp-badge"
                    :class="'gz-subtyp-badge--' + (ev.subtyp || 'sonstiges')">
                <svg class="icon gz-subtyp-icon" aria-hidden="true"><use :href="'/icons.svg#' + subtypIcon(ev.subtyp || 'sonstiges')"/></svg>
                <span x-text="$app.t('events.subtyp.' + (ev.subtyp || 'sonstiges'))"></span>
              </span>
              <template x-if="ev.typ === 'extern'">
                <span class="gz-extern-badge" x-text="$app.t('figuren.external')"></span>
              </template>
            </div>
            <div class="gz-ereignis internal-link" @click="$app.openEreignisseMitFigur(f.id)" x-text="ev.ereignis"></div>
            <div x-show="ev.kapitel || ev.seite" class="entity-refs gz-meta">
              <template x-if="ev.kapitel">
                <button type="button" class="entity-ref" x-entity-ref="{ type: 'kapitel', id: ev.chapter_id, name: ev.kapitel }"></button>
              </template>
              <template x-if="ev.seite">
                <button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', id: ev.page_id, name: ev.seite, kapitel: ev.kapitel }"></button>
              </template>
            </div>
            <div x-show="ev.bedeutung" class="gz-bedeutung" x-text="ev.bedeutung"></div>
          </div>
        </div>
      </template>
    </div>
  </div>
</section>
