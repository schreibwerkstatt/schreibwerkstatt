    <!-- Erweitert-Tab: anbieterübergreifendes KI-Tuning, Editor-Laufzeit und Aufbewahrung.
         Provider-spezifische Werte liegen im Panel ihres Providers, Instanz-Identität unter «Allgemein». -->
    <section x-bind="panel('advanced')" class="admin-settings-section">
      <p class="muted-msg" x-text="$app.t('admin.settings.advanced.disclaimer')"></p>

      <div class="admin-settings-subsection">
        <h4 class="admin-settings-subheading"><span x-text="$app.t('admin.settings.section.global')"></span></h4>
        <p class="muted-msg muted-msg--sm" x-text="$app.t('admin.settings.help.advancedGlobal')"></p>
        <div x-data="settingField({ k: 'ai.chars_per_token', type: 'num', label: 'admin.settings.label.aiCharsPerToken', num: { step: 0.1, min: 1, max: 10 }, help: 'admin.settings.help.charsPerToken' })"></div>
      </div>

      <div class="admin-settings-subsection">
        <h4 class="admin-settings-subheading"><span x-text="$app.t('admin.settings.advanced.lektoratTitle')"></span></h4>
        <div x-data="settingField({ k: 'ai.lektorat_batch_concurrency', type: 'num', label: 'admin.settings.label.aiLektoratBatchConcurrency', num: { step: 1, min: 1, max: 8 } })"></div>
        <div x-data="settingField({ k: 'ai.lektorat_stylistic_cap', type: 'num', num: { integer: true, min: 1, max: 200 }, label: 'admin.settings.label.lektoratStylisticCap', help: 'admin.settings.help.lektoratStylisticCap' })"></div>
        <div x-data="settingField({ k: 'ai.lektorat_chunk_chars', type: 'num', num: { integer: true, min: 0, max: 200000 }, label: 'admin.settings.label.lektoratChunkChars', help: 'admin.settings.help.lektoratChunkChars' })"></div>
      </div>

      <div class="admin-settings-subsection">
        <h4 class="admin-settings-subheading"><span x-text="$app.t('admin.settings.advanced.editorTitle')"></span></h4>
        <div x-data="settingField({ k: 'editor.lock_ttl_min', type: 'num', label: 'admin.settings.label.editorLockTtl', num: { integer: true, min: 1, max: 1440 }, help: 'admin.settings.help.editorLockTtl' })"></div>
      </div>

      <div class="admin-settings-subsection">
        <h4 class="admin-settings-subheading"><span x-text="$app.t('admin.settings.advanced.retentionTitle')"></span></h4>
        <p class="muted-msg muted-msg--sm" x-text="$app.t('admin.settings.advanced.retentionHint')"></p>
        <div x-data="settingField({ k: 'app.page_revision_limit', type: 'num', label: 'admin.settings.label.appPageRevisionLimit', num: { integer: true, min: 1, max: 500 }, help: 'admin.settings.help.pageRevisionLimit' })"></div>
        <div x-data="settingField({ k: 'app.job_runs_retention_days', type: 'num', label: 'admin.settings.label.jobRunsRetentionDays', num: { integer: true, min: 0, max: 3650 }, help: 'admin.settings.help.jobRunsRetentionDays' })"></div>
        <div x-data="settingField({ k: 'app.chat_job_runs_retention_days', type: 'num', label: 'admin.settings.label.chatJobRunsRetentionDays', num: { integer: true, min: 0, max: 3650 }, help: 'admin.settings.help.chatJobRunsRetentionDays' })"></div>
        <div x-data="settingField({ k: 'app.usage_events_retention_days', type: 'num', label: 'admin.settings.label.usageEventsRetentionDays', num: { integer: true, min: 0, max: 3650 }, help: 'admin.settings.help.usageEventsRetentionDays' })"></div>
      </div>
    </section>
