<!-- Stil-Heatmap: Kapitel × Metrik. Klick auf eine Zelle öffnet Treffer-Beispiele. -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/stil-card.js. Der
  `showStilCard`-Flag bleibt im Root (Hash-Router, Exklusivität), fachlicher
  State (stilData, stilLoading, …) lebt in dieser Komponente.
-->
<div class="card card--stil" x-data="stilCard" x-show="$app.showStilCard" x-cloak>
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('stil.title')"></span>
      <div class="card-subline" x-show="stilData?.lastUpdated && !stilSyncing && !stilLoading">
        <span class="card-timestamp" x-text="stilLastUpdatedLabel()"></span>
      </div>
    </div>
    <div class="card-header-aside">
      <div class="card-actions">
        <button type="button" class="icon-btn icon-btn--ghost" @click="runStilSync()" :disabled="stilSyncing || stilLoading"
                :data-tip="$app.t('stil.recompute')" :aria-label="$app.t('stil.recompute')">
          <span x-show="stilSyncing" class="spinner"></span>
          <svg x-show="!stilSyncing" class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div x-show="stilStatus" class="card-status" x-html="stilStatus"></div>

  <div x-show="!stilLoading && !stilSyncing && !stilHasData()"
       class="muted-msg muted-msg--spaced" x-text="$app.t('stil.emptyState')"></div>

  <template x-if="stilHasData()">
    <div class="heatmap-wrap">
      <div class="heatmap-legend" x-text="$app.t('stil.legend', { n: stilMinWords })"></div>

      <div class="heatmap-scroll">
        <table class="heatmap-table">
          <thead>
            <tr>
              <th class="heatmap-rowhead" x-text="$app.t('stil.chapter')"></th>
              <th class="heatmap-numcol" x-text="$app.t('stil.words')"></th>
              <template x-for="m in stilMetricDefs" :key="m.key">
                <th :data-tip="stilMetricTip(m.key)">
                  <span x-text="$app.t(m.label)"></span>
                </th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template x-for="c in stilRows()" :key="c.key">
              <tr>
                <th class="heatmap-rowhead" scope="row">
                  <span class="heatmap-rowhead-main"
                        :class="{ 'internal-link': c.key !== '__uncat__' }"
                        @click="c.key !== '__uncat__' && stilJumpToChapter(c.key)"
                        x-text="stilChapterName(c.name)"></span>
                  <span class="heatmap-rowhead-sub" x-text="$app.t('stil.pagesCount', { n: c.pageCount })"></span>
                </th>
                <td class="heatmap-numcol" x-text="c.wordsLabel"></td>
                <template x-for="m in stilMetricDefs" :key="m.key">
                  <td class="heatmap-cell"
                      :class="[c.cells[m.key].cls, { 'heatmap-cell--active': activeStilDetailKey === c.cells[m.key].detailKey }]"
                      :style="c.cells[m.key].vars"
                      :data-tip="c.cells[m.key].lowData ? $app.t('heatmap.lowData', { n: stilMinWords }) : ''"
                      @click="c.cells[m.key].clickable && toggleStilDetail(c.key, m.key)"
                      x-text="c.cells[m.key].text">
                  </td>
                </template>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <div class="stil-heatmap-foot">
        <span class="heatmap-legend" x-show="stilHasApproxP90()" x-text="$app.t('stil.legendApprox')"></span>
        <!-- Querverweis: Wiederholungen hier zählen pro Seite, buchweit zählt der Wortschatz. -->
        <button type="button" class="internal-link stil-wortschatz-link" @click="stilOpenWortschatz()"
                :data-tip="$app.t('stil.wortschatzLinkTip')" x-text="$app.t('stil.wortschatzLink')"></button>
      </div>

      <!-- Detail-Panel: Treffer-Beispiele für die angeklickte Zelle.
           Werden pro Zelle nachgeladen (/history/style-samples) — siehe
           public/js/book/stil-heatmap.js#toggleStilDetail. -->
      <template x-if="stilDetailLoading">
        <div class="heatmap-detail">
          <div class="muted-msg"><span class="spinner"></span><span x-text="$app.t('stil.detail.loading')"></span></div>
        </div>
      </template>
      <template x-if="stilDetail && !stilDetailLoading">
        <div class="heatmap-detail">
          <div class="card-section-head card-section-head--baseline">
            <span class="heatmap-detail-title"
                  x-text="$app.t('stil.detail.title', {
                    metric: stilDetail.metricLabel,
                    chapter: stilDetail.chapterName,
                  })"></span>
            <button type="button" class="btn-close heatmap-detail-close"
                    @click="closeStilDetail()"
                    :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
          </div>
          <div class="heatmap-detail-list">
            <template x-if="stilDetail.entries.length === 0">
              <div class="muted-msg" x-text="$app.t('stil.detail.empty')"></div>
            </template>
            <template x-for="page in stilDetail.entries" :key="page.page_id">
              <div class="heatmap-detail-page">
                <div class="heatmap-detail-page-header">
                  <button type="button" class="entity-ref"
                          x-entity-ref="{ type: 'seite', id: page.page_id, label: page.page_name, onOpen: () => stilJumpToPage(page.page_id) }"></button>
                  <span class="heatmap-detail-page-count" x-text="$app.t('fehlerHeatmap.detail.countLabel', { n: page.count })"></span>
                </div>
                <template x-if="page.tokens">
                  <div class="heatmap-detail-token-groups">
                    <template x-for="(g, i) in page.tokens" :key="i">
                      <div class="heatmap-detail-token-group">
                        <span class="tag stil-repetition-word heatmap-detail-token" x-text="g.token"></span>
                        <div class="heatmap-detail-token-sentences">
                          <template x-for="(sentence, j) in g.sentences" :key="j">
                            <span class="heatmap-detail-original" x-text="sentence"></span>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
                <template x-if="page.words">
                  <div class="stil-repetitions-words">
                    <template x-for="w in page.words" :key="w.token">
                      <span class="tag stil-repetition-word" x-text="w.token + ' · ' + w.count"></span>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
          <button type="button" class="internal-link stil-wortschatz-link" x-show="stilDetail.metricKey === 'repetition_score'"
                  @click="stilOpenWortschatz()" :data-tip="$app.t('stil.wortschatzLinkTip')" x-text="$app.t('stil.wortschatzLink')"></button>
        </div>
      </template>
    </div>
  </template>

  <!--
    Satzrhythmus-Band. Zeigt die Satzlängen-SEQUENZ pro Kapitel — das ist der
    Teil, den die Heatmap oben nicht zeigen kann: dort steht ein Mittelwert, und
    derselbe Mittelwert entsteht aus lauter gleich langen Sätzen wie aus dem
    ständigen Wechsel kurz/lang. Der Unterschied ist der Rhythmus.
    Berechnung: lib/stil-rhythmus.js (serverseitig), Anzeige:
    public/js/book/stil-rhythmus.js.
  -->
  <template x-if="stilHasData() && stilHasRhythm()">
    <div class="stil-rhythm">
      <div class="stil-rhythm-head">
        <h3 class="stil-rhythm-title" x-text="$app.t('stil.rhythm.title')"></h3>
        <p class="stil-rhythm-sub"
           x-text="$app.t('stil.rhythm.sub', { max: stilNum(stilRhythmData().scaleMax, 0) })"></p>
        <p class="stil-rhythm-sub" x-show="stilData?.book?.sentence_len_p90 != null"
           x-text="$app.t('stil.rhythm.bookP90', { p90: (stilData?.book?.sentence_len_p90_exact === false ? '≈ ' : '') + stilNum(stilData?.book?.sentence_len_p90, 0) })"></p>
      </div>

      <div class="stil-rhythm-rows">
        <template x-for="r in stilRhythmData().rows" :key="r.key">
          <div class="stil-rhythm-row">
            <div class="stil-rhythm-label">
              <span class="stil-rhythm-name"
                    :class="{ 'internal-link': r.key !== '__uncat__' }"
                    @click="r.key !== '__uncat__' && stilJumpToChapter(r.key)"
                    x-text="stilChapterName(r.name)"></span>
              <span class="stil-rhythm-meta"
                    x-text="$app.t('stil.rhythm.meta', { n: r.count, avg: stilNum(r.mean), p90: r.p90 })"></span>
            </div>

            <svg class="stil-rhythm-band" :viewBox="stilRhythmData().viewBox"
                 preserveAspectRatio="none" role="img"
                 :aria-label="$app.t('stil.rhythm.bandAria', { chapter: stilChapterName(r.name), avg: stilNum(r.mean), longest: r.longest })">
              <polygon class="stil-rhythm-area" :points="r.points"></polygon>
            </svg>

            <div class="stil-rhythm-stats">
              <span class="stil-rhythm-swing"
                    :class="'stil-rhythm-swing--' + stilSwingKind(r.swing)"
                    :data-tip="$app.t('stil.rhythm.swingTip')"
                    x-text="stilNum(r.swing, 2)"></span>
              <span class="stil-rhythm-swing-word" x-text="stilSwingLabel(r.swing)"></span>
              <span class="stil-rhythm-repeat"
                    :data-tip="$app.t('stil.rhythm.repeatTip')"
                    x-text="stilPercent(r.repeatRatio)"></span>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- Satzanfänge: Rangliste des jeweils ersten Wortes, buchweit oder für ein Kapitel. -->
  <template x-if="stilOpenerData().total > 0">
    <div class="stil-openers">
      <div class="stil-rhythm-head">
        <div class="stil-openers-titlebar">
          <h3 class="stil-rhythm-title" x-text="$app.t('stil.openers.title')"></h3>
          <div x-data="combobox($app.t('stil.openers.scope'), $app.t('stil.openers.wholeBook'))"
               x-modelable="value" x-model="stilOpenerChapter"
               x-effect="options = (stilData?.chapterOpeners || []).map(c => ({ value: c.key, label: stilChapterName(c.name) }))"></div>
        </div>
        <p class="stil-rhythm-sub"
           x-text="$app.t('stil.openers.sub', {
             distinct: stilNum(stilOpenerView().distinct, 0),
             total: stilNum(stilOpenerView().total, 0),
             repeats: stilNum(stilOpenerView().repeats, 0),
             pct: stilPercent(stilOpenerView().repeatRatio),
           })"></p>
      </div>
      <ul class="stil-opener-list">
        <template x-for="o in stilOpenerView().top" :key="o.word">
          <li class="stil-opener-row">
            <span class="stil-opener-word" x-text="o.word"></span>
            <span class="stil-opener-bar">
              <span class="stil-opener-fill" :style="{ '--opener-bar': (o.bar * 100) + '%' }"></span>
            </span>
            <span class="stil-opener-count" x-text="stilNum(o.count, 0)"></span>
            <span class="stil-opener-share" x-text="stilPercent(o.share)"></span>
          </li>
        </template>
      </ul>
    </div>
  </template>

  <!-- Seiten da, aber noch keine Sequenz-Felder (Seiten auf älterer metrics_version). -->
  <div class="muted-msg muted-msg--spaced"
       x-show="stilHasData() && !stilHasRhythm() && !stilSyncing && !stilLoading"
       x-text="$app.t('stil.rhythm.pending')"></div>
</div>
