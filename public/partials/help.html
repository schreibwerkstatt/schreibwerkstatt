<!-- Hilfe & Funktionen: zwei Reiter — Funktionsueberblick (gruppiert, filterbar,
     „Oeffnen" springt zur Karte) und die Release-Notizen („Neuigkeiten").
     Alpine.data-Sub-Komponente — siehe public/js/cards/help-card.js. Inhalt
     des Funktions-Reiters: public/js/cards/help-catalog.js. Neuigkeiten kommen
     aus changelog/. -->
<div class="card card--help" x-data="helpCard" x-show="$app.showHelpCard" x-cloak>
  <div class="card-header">
    <span class="card-title" x-text="$app.t('help.title')"></span>
  </div>

  <div x-data="tabs(['features','changelog'])" x-modelable="value" x-model="helpTab">
    <div class="tabs tabs--scrollable" x-bind="tablist">
      <template x-for="tab in tabs" :key="tab">
        <button class="tabs-btn" x-bind="tabBtn(tab)">
          <span x-text="$app.t('help.tab.' + tab)"></span>
          <span class="tabs-btn-count help-tab-new"
                x-show="tab === 'changelog' && isNewRelease($store.shell.changelogLatest)"
                x-text="$app.t('changelog.newBadge')"></span>
        </button>
      </template>
    </div>

    <!-- Reiter „Funktionen" -->
    <div class="help-tab-panel" x-bind="panel('features')">
      <p class="card-hint card-hint--lead card-section" x-text="$app.t('help.intro')"></p>

      <div class="filter-bar card-section">
        <span class="filter-search-wrap">
          <input type="text" class="filter-search-input filter-search-input--wide" x-model="helpQuery"
                 :placeholder="$app.t('help.filter')" :aria-label="$app.t('help.filter')">
          <button type="button" class="search-clear--icon" x-show="helpQuery" x-cloak @click="helpQuery = ''"
                  :aria-label="$app.t('search.clear')" :data-tip="$app.t('search.clear')">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg>
          </button>
        </span>
      </div>

      <p class="card-hint card-section" x-show="helpSections().length === 0" x-cloak
         x-text="$app.t('help.noResults')"></p>

      <template x-for="sec in helpSections()" :key="sec.group">
        <section class="help-group card-section">
          <h3 class="help-group-title" x-text="$app.t(sec.labelKey)"></h3>
          <ul class="help-features">
            <template x-for="e in sec.entries" :key="e.key">
              <li class="help-feature">
                <div class="help-feature-head">
                  <h4 class="help-feature-title" x-text="$app.t(e.titleKey)"></h4>
                  <button type="button" class="btn-compact btn-compact--ghost help-feature-open"
                          x-show="e.open" :disabled="!e.available"
                          :data-tip="e.reasonKey ? $app.t(e.reasonKey) : null"
                          @click="helpOpen(e)" x-text="$app.t('help.open')"></button>
                </div>
                <p class="card-hint" x-text="$app.t(e.descKey)"></p>
                <div class="help-feature-needs" x-show="e.needs.length > 0">
                  <template x-for="n in e.needs" :key="n.key">
                    <span class="badge badge-neutral" x-text="helpNeedLabel(n)"></span>
                  </template>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </template>
    </div>

    <!-- Reiter „Neuigkeiten" -->
    <div class="help-tab-panel" x-bind="panel('changelog')">
      <p class="card-hint card-hint--lead card-section">
        <span x-text="$app.t('changelog.intro')"></span>
        <span class="changelog-current" x-show="$store.shell.appVersion" x-cloak
              x-text="$app.t('changelog.current', { version: $store.shell.appVersion })"></span>
      </p>

      <div x-show="changelogLoading" x-skeleton="3" x-cloak></div>
      <p class="card-form-error card-section" x-show="changelogError" x-cloak x-text="changelogError"></p>
      <div class="card-empty card-section"
           x-show="!changelogLoading && !changelogError && changelogReleases.length === 0" x-cloak>
        <p class="card-empty-text" x-text="$app.t('changelog.empty')"></p>
      </div>

      <ol class="changelog-list card-section" x-show="changelogReleases.length > 0" x-cloak>
        <template x-for="rel in changelogReleases" :key="rel.version">
          <li class="changelog-release">
            <div class="changelog-release-head">
              <h3 class="changelog-version" x-text="'v' + rel.version"></h3>
              <span class="changelog-date" x-text="changelogDate(rel.date)"></span>
              <span class="badge-ok changelog-new" x-show="isNewRelease(rel.version)"
                    x-text="$app.t('changelog.newBadge')"></span>
            </div>
            <ul class="changelog-entries">
              <template x-for="(e, i) in rel.entries" :key="i">
                <li class="changelog-entry" :class="'changelog-entry--' + e.kind">
                  <span class="changelog-kind" x-text="$app.t('changelog.kind.' + e.kind)"></span>
                  <span class="changelog-text" x-text="changelogText(e)"></span>
                </li>
              </template>
            </ul>
          </li>
        </template>
      </ol>
    </div>
  </div>
</div>
