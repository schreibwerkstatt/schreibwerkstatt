    <!-- Jobs-Tab -->
    <section x-show="adminSettingsTab === 'jobs'" class="admin-settings-section">
      <div x-data="settingField({ k: 'jobs.max_concurrent', type: 'num', label: 'admin.settings.label.jobsMaxConcurrent', num: { step: 1, min: 1, max: 8 } })"></div>
      <div x-data="settingField({ k: 'jobs.book_chat.mode', type: 'select', label: 'admin.settings.label.jobsBookChatMode', opts: [{ value: 'auto', label: 'auto' }, { value: 'agent', label: 'agent' }, { value: 'classic', label: 'classic' }] })"></div>
      <div x-data="settingField({ k: 'jobs.book_chat.max_tool_iter', type: 'num', label: 'admin.settings.label.jobsBookChatMaxToolIter', num: { step: 1, min: 1, max: 50 } })"></div>
      <div x-data="settingField({ k: 'jobs.book_chat.max_tool_iter_local', type: 'num', label: 'admin.settings.label.jobsBookChatMaxToolIterLocal', num: { step: 1, min: 0, max: 50 }, help: 'admin.settings.help.jobsBookChatMaxToolIterLocal' })"></div>
      <div x-data="settingField({ k: 'jobs.book_chat.tool_set', type: 'select', label: 'admin.settings.label.jobsBookChatToolSet', help: 'admin.settings.help.jobsBookChatToolSet', opts: [{ value: 'auto', label: 'auto' }, { value: 'slim', label: 'slim' }, { value: 'full', label: 'full' }] })"></div>
      <div x-data="settingField({ k: 'jobs.book_chat.max_input_tokens_per_answer', type: 'num', label: 'admin.settings.label.jobsBookChatMaxInputTokensPerAnswer', num: { step: 10000, min: 0, max: 50000000 }, help: 'admin.settings.help.jobsBookChatMaxInputTokensPerAnswer' })"></div>
      <div x-data="settingField({ k: 'jobs.book_chat.token_budget', type: 'num', label: 'admin.settings.label.jobsBookChatTokenBudget', num: { step: 1, min: 0, max: 2000000 } })"></div>
      <div x-data="settingField({ k: 'jobs.book_chat.rag_top_k', type: 'num', label: 'admin.settings.label.jobsBookChatRagTopK', num: { step: 1, min: 1, max: 200 } })"></div>
      <div x-data="settingField({ k: 'jobs.book_chat.pre_rag_top_k', type: 'num', label: 'admin.settings.label.jobsBookChatPreRagTopK', num: { step: 1, min: 0, max: 50 } })"></div>
      <div x-data="settingField({ k: 'jobs.book_chat.pre_rag_chars', type: 'num', label: 'admin.settings.label.jobsBookChatPreRagChars', num: { step: 100, min: 0, max: 200000 } })"></div>
      <div x-data="settingField({ k: 'jobs.page_chat.pre_rag_top_k', type: 'num', label: 'admin.settings.label.jobsPageChatPreRagTopK', num: { step: 1, min: 0, max: 20 } })"></div>
      <div x-data="settingField({ k: 'jobs.research_chat.max_tool_iter', type: 'num', label: 'admin.settings.label.jobsResearchChatMaxToolIter', num: { step: 1, min: 1, max: 50 } })"></div>
      <div x-data="settingField({ k: 'jobs.plot_chat.max_tool_iter', type: 'num', label: 'admin.settings.label.jobsPlotChatMaxToolIter', num: { step: 1, min: 1, max: 50 } })"></div>
      <div x-data="settingField({ k: 'jobs.research_chat.max_web_searches', type: 'num', label: 'admin.settings.label.jobsResearchChatMaxWebSearches', num: { step: 1, min: 1, max: 100 }, help: 'admin.settings.help.jobsResearchChatMaxWebSearches' })"></div>
    </section>
