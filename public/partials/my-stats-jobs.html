<!-- KI-Jobs: eigene Läufe je Job-Typ (Dauer, Tokens, Fehler), über alle Bücher
     oder ein gewähltes; Zeile aufklappen → letzte Läufe. display:contents-Wrapper
     (.card--mystats .overview-grid > [id^="partial-my-stats-"]) → das Tile bleibt
     direktes Grid-Child. Logik: public/js/cards/my-stats-jobs-methods.js. -->
<div class="overview-tile overview-tile--wide mystats-jobs-tile" x-id="['jobs-title', 'jobs-book']">
  <div class="overview-tile-label">
    <span :id="$id('jobs-title')" x-text="$app.t('mystats.jobs.title')"></span>
    <span class="mystats-scope-tag" x-text="myStatsScope('lifetime')"></span>
  </div>
  <p class="card-hint card-hint--sm" x-text="$app.t('mystats.jobs.hint')"></p>

  <div class="mystats-jobs-controls">
    <span class="card-form-label" :id="$id('jobs-book')" x-text="$app.t('mystats.jobs.book')"></span>
    <div :aria-labelledby="$id('jobs-book')"
         x-data="combobox($app.t('mystats.jobs.allBooks'), $app.t('mystats.jobs.allBooks'))"
         x-modelable="value" x-model="myJobsBookId"
         x-effect="options = ($store.nav.books || []).map(b => ({ value: String(b.id), label: b.name }))"
         @combobox-change="$nextTick(() => loadMyJobStats())"></div>
  </div>

  <div x-show="myJobStatsLoading && !myJobStats" class="muted-msg muted-msg--sm" x-text="$app.t('jobStats.loading')"></div>
  <div x-show="myJobStats && myJobStats.length === 0" class="muted-msg muted-msg--sm" x-text="$app.t('jobStats.empty')"></div>
  <div x-show="myJobStats && myJobStats.length > 0" class="job-stats-scroll">
  <table class="job-stats-table" :aria-labelledby="$id('jobs-title')"
         x-data="sortableTable({
           rows: () => myJobStatsRows(),
           defaultKey: 'lastRun',
           defaultDir: 'desc',
           types: { typeName: 'string', avgDuration: 'number', avgTokens: 'number', lastRun: 'date', count: 'number' },
           persistKey: 'myJobStats'
         })">
    <thead>
      <tr>
        <th x-bind="sortTh('typeName')"
            x-text="$app.t('jobStats.col.type')"></th>
        <th x-bind="sortTh('avgDuration')"
            :data-tip="$app.t('jobStats.col.avgDurationTitle')" x-text="$app.t('jobStats.col.avgDuration')"></th>
        <th x-bind="sortTh('avgTokens')"
            :data-tip="$app.t('jobStats.col.avgTokensTitle')" x-text="$app.t('jobStats.col.avgTokens')"></th>
        <th x-bind="sortTh('lastRun')"
            x-text="$app.t('jobStats.col.lastRun')"></th>
        <th x-bind="sortTh('count')"
            :data-tip="$app.t('jobStats.col.runsTitle')" x-text="$app.t('jobStats.col.runs')"></th>
      </tr>
    </thead>
    <template x-for="row in sorted" :key="row.type">
      <tbody>
        <tr class="job-stats-row job-stats-row--clickable"
            :class="{ 'job-stats-row--open': myJobsExpandedType === row.type }"
            role="button" tabindex="0"
            :aria-expanded="myJobsExpandedType === row.type ? 'true' : 'false'"
            @click="toggleMyJobRuns(row.type)"
            @keydown.enter.prevent="toggleMyJobRuns(row.type)"
            @keydown.space.prevent="toggleMyJobRuns(row.type)"
            :data-tip="$app.t('jobStats.expandHint')">
          <td>
            <span class="history-chevron" :class="{ open: myJobsExpandedType === row.type }" aria-hidden="true"></span>
            <span x-text="row.typeName"></span>
          </td>
          <td x-text="row.avgDurationFmt"></td>
          <td x-text="row.avgTokensFmt"></td>
          <td x-text="$app.formatLastRun(row.lastRun)"></td>
          <td>
            <span x-text="row.count"></span>
            <span x-show="row.errorCount > 0" class="job-stats-errors">
              / <span x-text="row.errorCount"></span> <svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg>
            </span>
          </td>
        </tr>
        <tr x-show="myJobsExpandedType === row.type" class="job-stats-runs-row">
          <td colspan="5">
            <div x-show="myJobRunsLoading && !myJobRuns[row.type]" class="muted-msg muted-msg--sm" x-text="$app.t('jobStats.loading')"></div>
            <div x-show="myJobRuns[row.type] && myJobRuns[row.type].length === 0" class="muted-msg muted-msg--sm" x-text="$app.t('jobStats.runs.empty')"></div>
            <div class="table-scroll" x-show="myJobRuns[row.type] && myJobRuns[row.type].length > 0">
            <table class="job-runs-table">
              <thead>
                <tr>
                  <th x-text="$app.t('jobStats.runs.col.when')"></th>
                  <th x-show="!myJobsBookId" x-text="$app.t('mystats.jobs.colBook')"></th>
                  <th x-text="$app.t('jobStats.runs.col.status')"></th>
                  <th x-text="$app.t('jobStats.runs.col.duration')"></th>
                  <th x-text="$app.t('jobStats.runs.col.tokens')"></th>
                  <th x-text="$app.t('jobStats.runs.col.detail')"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="run in (myJobRuns[row.type] || [])" :key="run.jobId">
                  <tr>
                    <td x-text="$app.formatLastRun(run.endedAt || run.startedAt || run.queuedAt)"></td>
                    <td x-show="!myJobsBookId" x-text="_myJobsBookName(run.bookId) || '—'"></td>
                    <td>
                      <span class="job-run-status" :class="'job-run-status--' + run.status"
                            x-text="$app.t('jobStats.runs.status.' + run.status)"></span>
                    </td>
                    <td x-text="run.durationFmt"></td>
                    <td x-text="run.tokensFmt"></td>
                    <td class="job-run-detail">
                      <span x-show="run.error" class="job-run-error" :data-tip="$app.t(run.error, run.errorParams)" x-text="$app.t(run.error, run.errorParams)"></span>
                      <span x-show="!run.error" class="job-run-muted">—</span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            </div>
          </td>
        </tr>
      </tbody>
    </template>
  </table>
  </div>
</div>
