<!-- Admin-Settings (Runtime-Configs) -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/admin-settings-card.js.
  `showAdminSettingsCard` + `toggleAdminSettingsCard` im Root. Nur sichtbar
  bei $store.session.currentUser.role === 'admin'; Frontend-Guard zusaetzlich zum
  Server-side requireAdmin (lib/admin-mw.js).
-->
<div class="card card--admin-settings" x-data="adminSettingsCard" x-show="$app.showAdminSettingsCard" x-cloak
     @keydown="$editKeys($event, { save: () => !(adminSettingsLoading || adminSettingsSaving) && adminSettingsSave() })">
  <div class="card-header">
    <span class="card-title" x-text="$app.t('admin.settings.title')"></span>
    <div class="card-actions">
      <button type="button" class="icon-btn icon-btn--ghost" @click="adminSettingsReload()" :disabled="adminSettingsLoading || adminSettingsSaving" :data-tip="$app.t('common.refresh')" :aria-label="$app.t('common.refresh')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg></button>
      <button type="button" @click="adminSettingsSave()" :disabled="adminSettingsLoading || adminSettingsSaving">
        <span x-show="adminSettingsSaving" class="spinner"></span>
        <span x-text="adminSettingsSaving ? $app.t('common.saving') : $app.t('common.save')"></span>
      </button>
    </div>
  </div>

  <div x-show="adminSettingsLoading" x-skeleton="5" x-cloak></div>
  <div x-show="adminSettingsError" class="error-msg error-msg--banner" x-text="adminSettingsError"></div>
  <div x-show="adminSettingsSaved" class="success-msg success-msg--banner">
    <span x-text="$app.tn('admin.settings.saved', adminSettingsSavedCount)"></span>
  </div>

  <div x-show="!adminSettingsLoading && Object.keys(adminSettingsMap).length"
       x-data="tabs(adminSettingsTabs)" x-modelable="value" x-model="adminSettingsTab">
    <!-- Tab-Leiste: Reiterliste aus admin/admin-settings-tabs.js (SSoT) -->
    <div class="tabs tabs--scrollable" x-bind="tablist">
      <template x-for="t in tabs" :key="t">
        <button class="tabs-btn" x-bind="tabBtn(t)" x-text="$app.t('admin.settings.tab.' + t)"></button>
      </template>
    </div>

    <!-- @include admin-settings-auth -->

    <!-- @include admin-settings-provider -->

    <!-- @include admin-settings-smtp -->

    <!-- @include admin-settings-jobs -->

    <!-- @include admin-settings-cron -->

    <!-- @include admin-settings-pdfa -->

    <!-- @include admin-settings-analytics -->

    <!-- @include admin-settings-languagetool -->

    <!-- @include admin-settings-stt -->

    <!-- @include admin-settings-tts -->

    <!-- @include admin-settings-image -->

    <!-- @include admin-settings-embed -->

    <!-- @include admin-settings-geocode -->

    <!-- @include admin-settings-websearch -->

    <!-- @include admin-settings-api -->

    <!-- @include admin-settings-advanced -->

    <!-- Test-Result-Anzeige (pro Tab gescoped via kind→tab-Mapping) -->
    <div class="admin-settings-test-result" role="status"
         x-show="adminSettingsTestVisible()">
      <strong x-text="$app.t('admin.settings.test.' + (adminSettingsTestResult?.ok ? 'ok' : 'fail'))"></strong>
      <span x-show="adminSettingsTestResult?.latency_ms" x-text="' · ' + adminSettingsTestResult?.latency_ms + ' ms'"></span>
      <span x-show="adminSettingsTestResult?.kind === 'websearch' && adminSettingsTestResult?.result_count != null" x-text="' · ' + $app.t('admin.settings.test.resultCount', { n: adminSettingsTestResult?.result_count })"></span>
      <span x-show="adminSettingsTestResult?.unresponsive?.length" x-text="' · ' + $app.t('admin.settings.test.unresponsive', { list: (adminSettingsTestResult?.unresponsive || []).join(', ') })"></span>
      <span x-show="adminSettingsTestResult?.error" x-text="' · ' + adminSettingsTestErrorText(adminSettingsTestResult)"></span>
    </div>
  </div>
</div>
