<!-- Schauplatz-Liste (View-Mode 'list'). Fragment-Include von orte.html, lebt
     im Scope von `orteCard`. Unterorte stehen eingerückt unter ihrem Elternort
     (orte-card.js#_nestByParent); das Detail trägt Auswertung + Pflege. -->
<template x-if="$store.catalog.orte.length > 0 && viewMode === 'list'">
<div class="entity-list entity-list--accented ort-list">
  <p class="muted-msg muted-msg--sm" x-show="orteFiltered.length === 0" x-text="$app.t('common.noMatch')"></p>
  <template x-for="o in listWindowed(orteFiltered)" :key="o.id">
    <div :class="{ 'ort-list-item--child': ortDepth(o.id) > 0 }" :style="{ '--ort-depth': ortDepth(o.id) }">
      <!-- Zeile (DESIGN.md «Listen-Anriss»): Titel-Knopf öffnet das Bearbeiten,
           Chevron-Knopf und übriger Zeilenkörper klappen auf/zu; ⋯, Rechtsklick
           und Long-Press öffnen das Aktionsmenü (orte-menu.html). -->
      <div class="entity-row hover-reveal-host" :class="{ 'entity-row--stale': o.stale, 'entity-row--selected': $store.catalogUi.selectedOrtId === o.id }" :data-ortid="o.id"
           @click="ortRowBodyClick(o, $event)"
           @contextmenu="ortOpenMenu($event, o)" x-long-press>
        <span class="tag entity-typ-tag truncate" x-text="ortTypLabel(o.typ)"></span>
        <span class="entity-row-title"><button type="button" class="entity-row-title-btn text-link" @click.stop="openOrtEdit(o)"
                :data-tip="$app.t('orte.edit.editTitle')" x-text="o.name"></button></span>
        <span x-show="o.manually_created" class="tag ort-manual-tag" :data-tip="$app.t('orte.manualCreatedHint')" x-text="$app.t('orte.manualCreated')"></span>
        <span x-show="o.stale" class="tag tag--stale" :data-tip="$app.t('orte.staleHint')" x-text="$app.t('orte.staleBadge')"></span>
        <template x-if="o.stale">
        <button type="button" class="btn-compact entity-row-action"
                aria-haspopup="dialog" :aria-expanded="mergePick.kind === 'ort' && mergePick.sourceId === String(o.id)"
                @click.stop="openMergePick($event, 'ort', o)"
                :data-tip="$app.t('merge.rowTip')" x-text="$app.t('merge.rowAction')"></button>
        </template>
        <template x-if="o.stale || o.manually_created">
        <button type="button" class="icon-btn danger entity-row-action"
                @click.stop="$app.deleteOrt(o)"
                :aria-label="$app.t('common.delete')" :data-tip="$app.t(o.stale ? 'entity.deleteStale' : 'orte.deleteManual')">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
        </button>
        </template>
        <span x-show="o.land" class="tag ort-land-tag" x-text="landLabel(o.land)"></span>
        <span x-show="o.stimmung" class="ort-stimmung truncate" x-text="o.stimmung"></span>
        <template x-if="o.kapitel?.length">
          <span class="entity-refs entity-refs--collapse-mobile">
            <button type="button" class="entity-ref" x-entity-ref="{ type: 'kapitel', id: o.kapitel[0].chapter_id, name: o.kapitel[0].name }"></button>
            <template x-if="o.kapitel.length > 1">
              <span class="entity-ref-more" x-text="'+' + (o.kapitel.length - 1)"></span>
            </template>
          </span>
        </template>
        <button type="button" class="icon-btn icon-btn--ghost entity-row-action hover-reveal"
                aria-haspopup="menu" :aria-expanded="isActionMenuOpen('ort:' + o.id)"
                @click="ortOpenMenu($event, o)"
                :data-tip="$app.t('common.moreActions')" :aria-label="$app.t('common.moreActions')">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#more-horizontal"/></svg>
        </button>
        <button type="button" class="row-expand"
                :aria-expanded="$store.catalogUi.selectedOrtId === o.id"
                @click="ortToggleOpen(o)" :aria-label="$app.t('common.details')">
          <span class="history-chevron" :class="{ open: $store.catalogUi.selectedOrtId === o.id }" aria-hidden="true"></span>
        </button>
      </div>
      <div x-show="$store.catalogUi.selectedOrtId === o.id" class="entity-detail">
        <template x-if="isEditingOrt(o.id)">
          <div class="ort-edit-inline" @click.outside="commitOrtEdit($event)">
            <!-- @include orte-edit -->
          </div>
        </template>
        <template x-if="!isEditingOrt(o.id) && $store.catalogUi.selectedOrtId === o.id">
          <div>
            <!-- @include orte-detail -->
          </div>
        </template>
      </div>
    </div>
  </template>
  <button type="button" class="btn-compact list-window-more"
          x-show="listWindowRest(orteFiltered) > 0" x-cloak
          x-list-more="listWindowMore()" @click="listWindowMore()"
          x-text="$app.t('common.showMore', { n: listWindowRest(orteFiltered) })"></button>
</div>
</template>
