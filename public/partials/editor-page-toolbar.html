<!-- Page-Editor-Toolbar des Notebook-Editors. Lebt im sticky
     `.editor-card__topbar` (via Placeholder in editor-notebook.html), damit sie
     über die Sticky-Region permanent sichtbar bleibt — auch beim Scrollen tief
     in die Seite (Vollbild). Root-Scope.

     Gruppen (docs/notebook-editor.md „Seiten-Toolbar"):
       links   Undo/Redo · «Einfügen» (Bild, Tabelle, Diagramm, Beleg,
               Querverweis, Trennlinie — am Caret, Fragment
               editor-page-toolbar-insert) · Anführungszeichen normalisieren ·
               Abschnitt hier teilen
       rechts  «Ansicht»-Menü (Zoom, Breite, Steuerzeichen, Figuren-Markierung,
               Titelkopf — Fragment editor-page-toolbar-view) · Vollbild
     Menüs nur über das `menu()`-Primitiv (harte Regel „Aktionsmenü").
     `@mousedown.prevent` an allem, was am Caret wirkt: hält Fokus und Caret im
     contenteditable. -->
<div class="page-editor-toolbar" x-show="editMode && !focusActive" x-cloak>
  <button type="button" class="icon-btn"
          :disabled="!notebookCanUndo()"
          :data-tip="withHotkey(t('editor.toolbar.undoTitle'), 'undo')" :aria-label="t('editor.toolbar.undoTitle')"
          @click="notebookUndo()">
    <svg class="icon" aria-hidden="true"><use href="/icons.svg#undo"/></svg>
  </button>
  <button type="button" class="icon-btn"
          :disabled="!notebookCanRedo()"
          :data-tip="withHotkey(t('editor.toolbar.redoTitle'), 'redo')" :aria-label="t('editor.toolbar.redoTitle')"
          @click="notebookRedo()">
    <svg class="icon" aria-hidden="true"><use href="/icons.svg#redo"/></svg>
  </button>
  <span class="action-sep" aria-hidden="true"></span>
  <!-- @include editor-page-toolbar-insert -->
  <span class="action-sep" aria-hidden="true"></span>
  <!-- Anführungszeichen normalisieren: häufiger Handgriff, darum direkt in der
       Leiste (auch auf Mobile). Rückmeldung («3 ersetzt») im Tooltip. -->
  <button type="button" class="icon-btn"
          :class="{ 'is-active': quotesNormalizedFlash }"
          :data-tip="quotesNormalizedFlash
            ? (quotesNormalizedFlash.count > 0
                ? t('editor.toolbar.quotesDone', { count: quotesNormalizedFlash.count })
                : t('editor.toolbar.quotesNone'))
            : t('editor.toolbar.quotesTitle')"
          :aria-label="t('editor.toolbar.quotesTitle')"
          @mousedown.prevent
          @click="normalizeQuotes()">
    <svg class="icon" aria-hidden="true"><use href="/icons.svg#quote"/></svg>
  </button>
  <!-- Abschnitt am Caret teilen (edit/split.js). `@mousedown.prevent` hält
       den Caret im contenteditable, sonst gäbe es keinen Schnittpunkt. -->
  <button type="button" class="icon-btn"
          :data-tip="t('editor.split.title')" :aria-label="t('editor.split.title')"
          @mousedown.prevent
          @click="splitSectionHere()">
    <svg class="icon" aria-hidden="true"><use href="/icons.svg#scissors"/></svg>
  </button>

  <span class="page-editor-toolbar__spacer" aria-hidden="true"></span>

  <!-- @include editor-page-toolbar-view -->
  <button type="button" class="icon-btn"
          :aria-pressed="pageEditorFullscreen"
          :data-tip="pageEditorFullscreen ? t('graph.fullscreenClose') : t('graph.fullscreen')"
          :aria-label="pageEditorFullscreen ? t('graph.fullscreenClose') : t('graph.fullscreen')"
          @click="togglePageEditorFullscreen()">
    <svg class="icon" aria-hidden="true"><use :href="pageEditorFullscreen ? '/icons.svg#minimize-2' : '/icons.svg#maximize-2'"/></svg>
  </button>

  <!-- STT-Diktat-Mic schwebt im Editorfeld unten rechts (siehe
       editor-body-edit.html), nicht hier in der Toolbar. -->
</div>
