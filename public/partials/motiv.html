<!-- Motiv-Werkstatt (Themen & Motive als Konstellation) -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/motiv-card.js.
  Themen = Cluster, Motive = Naben (Grösse = Ist-Dichte aus motif_occurrences),
  Motiv↔Motiv-Beziehungen = Kanten, Soll-Layer (Figuren/Beats/Kapitel) zuschaltbar.
  KI-Motiverkennung (Job motif-scan) füllt den Ist-Index; nie generativ im Text.
-->
<div class="card card--motiv fullscreen-shell" x-data="motivCard" x-show="$app.showMotivCard" x-cloak
     @keydown="onPanelKeydown($event)">
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('motiv.title')"></span>
      <div class="card-subline" x-show="motifs.length > 0">
        <span class="card-timestamp"
              x-text="$app.t('motiv.stats', { motifs: motivStats().motifs, themes: motivStats().themes, withOcc: motivStats().withOcc, ghosts: motivStats().ghosts })"></span>
      </div>
    </div>
    <div class="card-header-aside">
      <div class="card-actions card-actions--grouped">
        <!-- Buendel 1: die KI-/Index-Laeufe (Brainstorm, frischer Brainstorm,
             Motiverkennung). Buendel 2: Ansichts-Steuerung des Graphen.
             Buendel 3: Vollbild. Getrennt durch `.action-sep` — eine flache
             Sechserreihe liest sich als eine Aktionsart. -->
        <button type="button" class="icon-btn icon-btn--ghost"
                @click="runBrainstorm()" :disabled="brainstorming"
                :data-tip="$app.t('motiv.brainstorm.run')" :aria-label="$app.t('motiv.brainstorm.run')">
          <span x-show="brainstorming" class="spinner"></span>
          <svg x-show="!brainstorming" class="icon" aria-hidden="true"><use href="/icons.svg#lightbulb"/></svg>
        </button>
        <button type="button" class="icon-btn icon-btn--ghost"
                @click="runBrainstorm(true)" :disabled="brainstorming"
                :data-tip="$app.t('motiv.brainstorm.runFresh')" :aria-label="$app.t('motiv.brainstorm.runFresh')">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#zap"/></svg>
        </button>
        <button type="button" class="icon-btn icon-btn--ghost"
                @click="runScan()" :disabled="scanning || !motifs.length"
                :data-tip="$app.t('motiv.scan.run')" :aria-label="$app.t('motiv.scan.run')">
          <span x-show="scanning" class="spinner"></span>
          <svg x-show="!scanning" class="icon" aria-hidden="true"><use href="/icons.svg#search"/></svg>
        </button>
        <!-- Ansichts-Steuerung des Graphen: nur in der Konstellation. Im
             Verlaufsband und in den Befunden gibt es nichts anzuordnen — ein
             Knopf, der dort wortlos nichts tut, liest sich als Defekt.
             Trennstrich und Gruppe tragen dieselbe Bedingung (Muster aus
             editor-page-actions.html); `.action-group` ist `display: contents`
             und bricht den Flex-Fluss der Leiste nicht.
             Zoom und Einpassen stehen bewusst NICHT hier, sondern am Graphen
             selbst (`.motiv-graph-controls`): sie verstellen den Ausschnitt, den
             man dabei ansieht. `resetLayout()` bleibt im Kartenkopf, weil es
             nicht die Ansicht aendert, sondern die gespeicherte Anordnung
             verwirft. -->
        <span class="action-sep" aria-hidden="true" x-show="motivView === 'graph'"></span>
        <span class="action-group" x-show="motivView === 'graph'">
          <button type="button" class="icon-btn icon-btn--ghost" @click="resetLayout()"
                  :data-tip="$app.t('motiv.graph.resetLayout')" :aria-label="$app.t('motiv.graph.resetLayout')">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#undo"/></svg>
          </button>
        </span>
        <span class="action-sep" aria-hidden="true"></span>
        <button type="button" class="icon-btn icon-btn--ghost"
                :class="{ 'is-active': motivFullscreen }"
                :aria-pressed="motivFullscreen"
                @click="toggleMotivFullscreen()"
                :aria-label="motivFullscreen ? $app.t('motiv.fullscreenExit.tip') : $app.t('motiv.fullscreen.tip')"
                :data-tip="motivFullscreen ? $app.t('motiv.fullscreenExit.tip') : $app.t('motiv.fullscreen.tip')"><svg class="icon" aria-hidden="true"><use :href="motivFullscreen ? '/icons.svg#minimize-2' : '/icons.svg#maximize-2'"/></svg></button>
      </div>
    </div>
  </div>

  <!-- Scan-Fortschritt -->
  <div class="motiv-progress" x-show="scanning" x-cloak>
    <div class="progress-bar" :style="{ '--progress': scanProgress + '%' }"></div>
  </div>

  <div x-show="errorMessage" class="card-status card-status--error" x-text="errorMessage"></div>

  <!-- Ansicht-Reiter: eigene Zeile, nichts anderes darin. Die Ansicht
       (Konstellation / Verlaufsband / Befunde) ist die uebergeordnete Achse der
       Karte und waehlt aus, was darunter ueberhaupt steht — steht sie in
       derselben Zeile wie die Anlege-Felder, ist sie ein Knopf unter vielen. -->
  <div class="tabs tabs--scrollable motiv-view-tabs" role="tablist" :aria-label="$app.t('motiv.view.label')">
    <button type="button" class="tabs-btn" role="tab"
            :class="{ 'tabs-btn--active': motivView === 'graph' }" :aria-selected="motivView === 'graph'"
            @click="setMotivView('graph')" x-text="$app.t('motiv.view.graph')"></button>
    <button type="button" class="tabs-btn" role="tab"
            :class="{ 'tabs-btn--active': motivView === 'band' }" :aria-selected="motivView === 'band'"
            @click="setMotivView('band')" x-text="$app.t('motiv.view.band')"></button>
    <button type="button" class="tabs-btn" role="tab"
            :class="{ 'tabs-btn--active': motivView === 'checks' }" :aria-selected="motivView === 'checks'"
            @click="setMotivView('checks')">
      <span x-text="$app.t('motiv.view.checks')"></span>
      <span class="tabs-btn-count" x-show="checks.length" x-text="checks.length"></span>
    </button>
  </div>

  <!-- Anlege-Leiste: Thema und Motiv anlegen (beide Formen in EINER Zeile). -->
  <div class="motiv-toolbar">
    <div class="motiv-toolbar-group">
      <input type="text" class="motiv-add-input" x-model="newThemeName" data-spellcheck="spelling"
             :placeholder="$app.t('motiv.theme.namePlaceholder')" @keydown.enter="addTheme()">
      <button type="button" class="btn-compact" @click="addTheme()" :disabled="busy || !newThemeName.trim()" x-text="$app.t('motiv.theme.add')"></button>
    </div>
    <div class="motiv-toolbar-group">
      <input type="text" class="motiv-add-input" x-model="newMotifName" data-spellcheck="spelling"
             :placeholder="$app.t('motiv.motif.namePlaceholder')" @keydown.enter="addMotif()">
      <div class="motiv-theme-select" x-data="combobox($app.t('motiv.motif.themeOptional'), $app.t('motiv.noTheme'))"
           x-modelable="value" x-model="newMotifThemeId" x-effect="options = themeOptions()"></div>
      <button type="button" class="btn-compact" @click="addMotif()" :disabled="busy || !newMotifName.trim()" x-text="$app.t('motiv.motif.add')"></button>
    </div>
  </div>

  <!-- Soll-Layer der Konstellation: eigene Zeile statt am Ende der Anlege-Leiste.
       Sie schalten, WAS der Graph zeigt, gelten also nur für die Graph-Ansicht —
       in der Anlege-Zeile brachen sie je nach Kartenbreite ohnehin auf eine
       eigene, halb leere Zeile um. -->
  <div class="motiv-layer-toggles" x-show="motivView === 'graph'"
       role="group" :aria-label="$app.t('motiv.layer.label')">
    <!-- Umschalter, kein Sprung: `<button>` + `:aria-pressed` (wie der Vollbild-
         Schalter im Kartenkopf). `.is-active` traegt nur die Optik. -->
    <button type="button" class="motiv-layer-btn" :class="{ 'is-active': layerFigures }"
            :aria-pressed="layerFigures" @click="toggleLayer('figures')" x-text="$app.t('motiv.layer.figures')"></button>
    <button type="button" class="motiv-layer-btn" :class="{ 'is-active': layerBeats }"
            :aria-pressed="layerBeats" @click="toggleLayer('beats')" x-text="$app.t('motiv.layer.beats')"></button>
    <button type="button" class="motiv-layer-btn" :class="{ 'is-active': layerChapters }"
            :aria-pressed="layerChapters" @click="toggleLayer('chapters')" x-text="$app.t('motiv.layer.chapters')"></button>
  </div>

  <!-- Scan-Status: warnt, wenn die semantische Erkennung aus ist (nur wörtliche
       Trigger), sonst bietet sie Embeddings-Refresh für frische Fundstellen. -->
  <div class="motiv-hint motiv-hint--warn" x-show="!semanticActive()" x-cloak>
    <svg class="icon" aria-hidden="true"><use href="/icons.svg#alert-triangle"/></svg>
    <span x-text="$app.t('motiv.hint.semanticOff')"></span>
  </div>
  <div class="motiv-hint motiv-hint--action" x-show="semanticActive() && embedIndexStale" x-cloak>
    <span class="motiv-hint-text" x-text="$app.t('motiv.hint.semanticOn')"></span>
    <button type="button" class="btn-compact" @click="refreshEmbedIndex()" :disabled="indexing">
      <span x-show="indexing" class="spinner"></span>
      <span x-text="$app.t('motiv.index.refresh')"></span>
    </button>
  </div>

  <div class="motiv-layout" x-show="motivView === 'graph'">
    <!-- Konstellations-Graph -->
    <div id="motiv-graph" class="motiv-graph-container" role="img" :aria-label="$app.t('motiv.graph.ariaLabel')"></div>
    <!-- Minimale Steuerelemente am Graphen (wie in der Figuren-Karte): Zoom und
         Einpassen. Als Auflage in der Ecke der Zeichenflaeche statt als eigene
         Zeile — `.motiv-layout` ist ein Zwei-Spalten-Grid, ein drittes Kind
         waere eine dritte Rasterzelle; und im Vollbild bleiben sie so am Bild.
         Bezugsrahmen ist dieselbe Grid-Origin wie beim Hover-Tooltip. -->
    <div class="motiv-graph-controls" role="group" :aria-label="$app.t('motiv.graph.controls')">
      <button type="button" class="icon-btn icon-btn--ghost" @click="zoomGraph(1.3)"
              :data-tip="$app.t('graph.zoomIn')" :aria-label="$app.t('graph.zoomIn')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
      </button>
      <button type="button" class="icon-btn icon-btn--ghost" @click="zoomGraph(0.77)"
              :data-tip="$app.t('graph.zoomOut')" :aria-label="$app.t('graph.zoomOut')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#minus"/></svg>
      </button>
      <button type="button" class="icon-btn icon-btn--ghost" @click="fitGraph()"
              :data-tip="$app.t('motiv.graph.fit')" :aria-label="$app.t('motiv.graph.fit')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#scan"/></svg>
      </button>
    </div>
    <!-- Hover-Detail-Tooltip (absolut über dem Graph, positioniert in graph.js) -->
    <div id="motiv-tooltip" class="graph-tooltip"></div>

    <!-- Seitenpanel (nested Partial — HTML-Partial-LOC-Limit) -->
    <div id="partial-motiv-panel"></div>
  </div>

  <!-- Kapitel-Verlaufsband: Motiv × Kapitel als Heatmap (Ist-Dichte über den
       Buchbogen). Zeigt, wo ein Motiv trägt und wo es verschwindet — die
       Konstellation zeigt nur OB, nicht WO. Reines Lesen, nie generativ.
       Nested Partial — HTML-Partial-LOC-Limit. -->
  <div id="partial-motiv-band" class="motiv-band-wrap" x-show="motivView === 'band'" x-cloak></div>

  <!-- Konsistenz-Befunde: deterministische Messung der Motiv-Kanten gegen den
       Ist-Index (nested Partial — HTML-Partial-LOC-Limit). Kein KI-Lauf. -->
  <div id="partial-motiv-befunde" x-show="motivView === 'checks'" x-cloak></div>

  <!-- KI-Brainstorm-Lauf-Historie: persistierte Läufe pro Buch, unter Graph +
       Panel. Klick lädt die Vorschläge in das Panel direkt darunter
       (selectedBrainstormRunId). Wie der Plot-/Werkstatt-Run-Verlauf. -->
  <div class="history-bar" x-show="brainstormRuns.length > 0" x-cloak>
    <div class="history-heading" x-text="$app.t('motiv.brainstorm.runs', { count: brainstormRuns.length })"></div>
    <template x-for="r in brainstormRuns" :key="r.id">
      <div class="history-item hover-reveal-host" :class="{ 'history-item--open': selectedBrainstormRunId === r.id }"
           @click="openBrainstormRun(r)">
        <span class="history-date" x-text="formatRunDate(r.created_at)"></span>
        <span class="tag" x-text="$app.t('motiv.brainstorm.vorschlagCount', { n: r.vorschlag_count })"></span>
        <span x-show="r.model" class="tag" x-text="r.model"></span>
        <span class="history-chevron" :class="{ open: selectedBrainstormRunId === r.id }" aria-hidden="true"></span>
        <button type="button" class="history-item-delete hover-reveal"
                @click.stop="deleteBrainstormRun(r.id)"
                :data-tip="$app.t('common.deleteEntry')"
                :aria-label="$app.t('common.deleteEntry')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg></button>
      </div>
    </template>
  </div>

  <!-- KI-Vorschläge (Brainstorm): unten beim Verlauf, damit sie den Graphen nicht
       überdecken. Frischer Lauf wie wieder-geöffneter Lauf füllen dasselbe Panel;
       übernehmen legt Thema/Motiv an, nie im Text. -->
  <div class="motiv-suggestions" x-show="suggestions.length" x-cloak>
    <div class="card-section-head">
      <h4 class="motiv-panel-heading" x-text="$app.t('motiv.brainstorm.title')"></h4>
      <button type="button" class="icon-btn icon-btn--ghost" @click="_clearSuggestionPanel()"
              :data-tip="$app.t('motiv.brainstorm.closePanel')" :aria-label="$app.t('motiv.brainstorm.closePanel')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg>
      </button>
    </div>
    <div class="motiv-suggestion-list">
      <template x-for="(s, i) in suggestions" :key="i">
        <div class="motiv-suggestion">
          <div class="motiv-sugg-body">
            <span class="badge-source" x-text="$app.t('motiv.brainstorm.typ.' + s.typ)"></span>
            <span class="motiv-sugg-name" x-text="s.name"></span>
            <span class="card-hint card-hint--sm" x-text="s.beschreibung" x-show="s.beschreibung"></span>
            <span class="motiv-sugg-triggers" x-show="s.trigger_terms && s.trigger_terms.length"
                  x-text="(s.trigger_terms || []).join(', ')"></span>
          </div>
          <div class="motiv-sugg-actions">
            <div class="motiv-sugg-theme" x-show="s.typ === 'motiv' && themes.length"
                 x-data="combobox($app.t('motiv.motif.themeOptional'), $app.t('motiv.noTheme'))"
                 x-modelable="value" x-model="s.themeIdDraft" x-effect="options = themeOptions()"></div>
            <button type="button" class="btn-compact" @click="adoptSuggestion(s)" x-text="$app.t('motiv.brainstorm.adopt')"></button>
            <button type="button" class="icon-btn icon-btn--ghost" @click="dismissSuggestion(s)"
                    :data-tip="$app.t('motiv.brainstorm.dismiss')" :aria-label="$app.t('motiv.brainstorm.dismiss')">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg>
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- @include motiv-graph-menu -->
</div>
