<!-- Bucheditor: Konflikt-Auflösung beim Block-Level-Merge (cards/book-editor/
     conflict.js). Dialog-Inhalt geteilt mit Notebook/Focus
     (partials/conflict-blocks.html), eigener State (`conflictResolution` und
     `conflictUi*` der Bucheditor-Karte). Teleportiert in die Karten-Wurzel,
     damit es im Native-Vollbild im Top-Layer bleibt. Abbrechen verwirft nichts:
     Block und Banner bleiben, «Konflikt lösen …» öffnet das Modal neu. -->
<template x-teleport=".card--bookeditor">
  <div class="conflict-overlay" x-show="conflictResolution && $app.showBookEditorCard" x-cloak role="alert"
       x-trap.inert.noscroll="conflictResolution && $app.showBookEditorCard"
       aria-modal="true" @keydown.escape.window="conflictResolution && conflictUiCancel()">
    <!-- @include conflict-blocks -->
  </div>
</template>
