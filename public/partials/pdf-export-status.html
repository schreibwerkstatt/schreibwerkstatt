      <!-- Persistenter Footer: Speichern gilt für alle Tabs (Profil-Config) -->
      <div class="card-actions">
        <span class="pdfx-dirty-mark" x-show="isDirty() && !saving" x-cloak x-text="$app.t('pdfExport.dirty.indicator')"></span>
        <span class="card-form-saved" x-show="savedAt" x-cloak x-transition.opacity.duration.250ms x-text="$app.t('pdfExport.saved')"></span>
        <button type="button" data-label-ok :class="{ primary: isDirty() }" :disabled="saving" @click="saveActiveProfile()">
          <span x-show="saving" class="spinner"></span>
          <span x-text="saving ? $app.t('common.saving') : $app.t('common.save')"></span>
        </button>
      </div>

      <!-- Progress / Errors -->
      <div class="export-progress" x-show="exporting || (exportProgress > 0 && !exportError)">
        <div class="progress-bar-wrap">
          <div class="progress-bar" :style="{ '--progress': exportProgress + '%' }"></div>
        </div>
        <p class="card-form-field-note" x-text="exportStatus"></p>
      </div>
      <p class="card-form-error" x-show="exportError" x-text="exportError"></p>

      <!-- Befunde des letzten Exports: bleibende, wegklickbare Liste
           (pdf-export-warnings.js). Texte nur via x-text — kein x-html-Sink. -->
      <div class="card-form-warn pdfx-warn-list" x-show="exportWarnings.length" x-cloak role="status">
        <div class="pdfx-warn-head">
          <strong x-text="$app.t(exportWarningsSample ? 'pdfExport.warn.titleSample' : 'pdfExport.warn.title', { count: exportWarnings.length })"></strong>
          <button type="button" class="icon-btn icon-btn--ghost" @click="dismissWarnings()"
                  :data-tip="$app.t('pdfExport.warn.dismiss')" :aria-label="$app.t('pdfExport.warn.dismiss')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
        </div>
        <ul>
          <template x-for="w in exportWarnings" :key="w.id">
            <li :class="'is-' + w.level" x-text="w.text"></li>
          </template>
        </ul>
      </div>
