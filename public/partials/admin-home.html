<!-- Admin-Landing: Tile-Grid mit Direkt-Einstiegen in die Admin-Karten.
     Erscheint nur für plain Admin ($store.session.currentUser.isAdmin && !$store.session.devMode), wenn
     keine andere Admin-/Profil-Karte offen ist. Sidebar + Buchwahl sind in
     diesem Modus ausgeblendet — die App reduziert sich auf reine Verwaltung.
     Kacheln, Reihenfolge und Texte kommen aus der Karten-Registry
     (`admin`-Feld in EXCLUSIVE_CARDS, public/js/cards/feature-registry.js). -->
<div class="card card--bookoverview book-overview"
     x-show="isAdminOnly && !adminCardOpen && !showUserSettingsCard"
     x-cloak>
  <div class="card-header">
    <span class="card-title" x-text="t('admin.home.title')"></span>
  </div>
  <div class="overview-grid">
    <template x-for="c in adminHomeCards" :key="c.key">
      <button type="button"
              class="overview-tile"
              :class="'card--' + c.partial"
              @click="$app[c.toggle]()">
        <div class="overview-tile-label" x-text="t(c.admin.label)"></div>
        <div class="overview-tile-value" x-text="t(c.admin.title)"></div>
        <div class="card-hint" x-text="t(c.admin.desc)"></div>
      </button>
    </template>
  </div>
</div>
