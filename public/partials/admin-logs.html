<!-- Admin: Logs -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/admin-logs-card.js.
  `showAdminLogsCard` + `toggleAdminLogsCard` im Root. Nur sichtbar bei
  $store.session.currentUser.role === 'admin'.
-->
<div class="card card--admin-logs" x-data="adminLogsCard" x-show="$app.showAdminLogsCard" x-cloak>
  <div class="card-header">
    <span class="card-title" x-text="$app.t('admin.logs.title')"></span>
    <div class="card-actions">
      <!-- Live-Tail gilt nur ohne Filter: gefiltert ist der Knopf gesperrt und aus. -->
      <button :aria-pressed="adminLogsLiveOn() ? 'true' : 'false'" type="button"
              class="admin-logs-livetail"
              :class="adminLogsLiveOn() ? 'admin-logs-livetail--on' : ''"
              :disabled="adminLogsFiltered()"
              @click="adminLogsToggleLiveTail()"
              :data-tip="adminLogsFiltered() ? $app.t('admin.logs.liveTailFiltered') : $app.t('admin.logs.liveTail')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#radio"></use></svg>
        <span x-text="$app.t('admin.logs.liveTail')"></span>
      </button>
      <button type="button" class="icon-btn icon-btn--ghost" @click="adminLogsClearAndLive()" :disabled="adminLogsLoading" :data-tip="$app.t('common.refresh')" :aria-label="$app.t('common.refresh')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg></button>
    </div>
  </div>

  <!-- Filter-Toolbar: Felder wenden sich nach kurzer Pause selbst an
       (admin-logs.js#_adminLogsScheduleApply). Comboboxen tragen ihren Namen
       per aria-labelledby, die Textfelder sitzen im <label>. -->
  <div class="admin-logs-filter">
    <div class="admin-logs-filter-label" x-id="['fld']">
      <span :id="$id('fld')" x-text="$app.t('admin.logs.filter.level')"></span>
      <div x-data="combobox({ placeholder: $app.t('admin.logs.filter.allLevels'), emptyLabel: $app.t('admin.logs.filter.allLevels') })"
           :aria-labelledby="$id('fld')"
           x-modelable="value" x-model="adminLogsFilter.level"
           x-effect="options = adminLogsLevels"></div>
    </div>
    <div class="admin-logs-filter-label" x-id="['fld']">
      <span :id="$id('fld')" x-text="$app.t('admin.logs.filter.scope')"></span>
      <div x-data="combobox({ placeholder: $app.t('admin.logs.filter.allScopes'), emptyLabel: $app.t('admin.logs.filter.allScopes') })"
           :aria-labelledby="$id('fld')"
           x-modelable="value" x-model="adminLogsFilter.scope"
           x-effect="options = adminLogsScopeOptions()"></div>
    </div>
    <label class="admin-logs-filter-label">
      <span x-text="$app.t('admin.logs.filter.user')"></span>
      <input type="text" class="card-form-input" x-model="adminLogsFilter.user"
             :placeholder="$app.t('admin.logs.filter.userPh')">
    </label>
    <label class="admin-logs-filter-label">
      <span x-text="$app.t('admin.logs.filter.book')"></span>
      <input type="text"
             x-data="numInput({ integer: true, min: 1, grouping: false })"
             x-modelable="value" x-model="adminLogsFilter.book"
             class="card-form-input"
             :placeholder="$app.t('admin.logs.filter.bookPh')">
    </label>
    <label class="admin-logs-filter-label admin-logs-filter-label--wide">
      <span x-text="$app.t('admin.logs.filter.search')"></span>
      <input type="text" class="card-form-input" x-model="adminLogsFilter.q"
             :placeholder="$app.t('admin.logs.filter.searchPh')">
    </label>
    <div class="admin-logs-filter-actions" x-show="adminLogsHasFilter() || adminLogsFiltered()">
      <button type="button" @click="adminLogsClearAndLive()" :disabled="adminLogsLoading" x-text="$app.t('admin.logs.clearFilter')"></button>
    </div>
  </div>
  <p class="muted-msg muted-msg--sm" x-show="adminLogsServerTz"
     x-text="$app.t('admin.logs.serverTz', { tz: adminLogsServerTz })"></p>

  <div x-show="adminLogsError" class="error-msg card-section" x-text="adminLogsError"></div>
  <div x-show="adminLogsRotatedHint" class="muted-msg card-section" x-text="$app.t('admin.logs.rotated')"></div>
  <div x-show="adminLogsStreamError" class="muted-msg card-section" x-text="$app.t('admin.logs.streamError')"></div>
  <button type="button" class="admin-logs-pending" x-show="adminLogsPending.length" @click="adminLogsFirstPage()"
          x-text="$app.t('admin.logs.pending', { n: adminLogsPending.length })"></button>

  <!-- Log-Liste -->
  <!-- Der Query-Container sitzt auf diesem Wrapper, NICHT auf der Karte:
       Floating UI (x-anchor) haelt jeden `container-type != normal` fuer einen
       Containing Block, der Browser nicht — die Filter-Comboboxen darueber
       klappten sonst um den Karten-Offset verschoben auf. Im Wrapper geht kein
       Popover auf. Gegated: tests/e2e-app/combobox-anchoring.spec.js -->
  <div class="log-list-wrap">
    <div class="log-list" x-show="adminLogsEntries.length">
      <template x-for="e in adminLogsPageEntries()" :key="e._k">
        <div class="log-row" :class="'log-row--' + e.level">
          <span class="log-row-ts" x-text="adminLogsFmtTs(e.ts)"></span>
          <span class="log-badge" :class="'log-badge--' + e.level" x-text="e.level.toUpperCase()"></span>
          <span class="log-row-scope truncate" x-text="e.scope || '-'"></span>
          <span class="log-row-user truncate" x-text="e.user || '-'"></span>
          <span class="log-row-book truncate" x-text="e.book ? ('#' + e.book) : '-'"></span>
          <span class="log-row-msg" x-text="e.msg"></span>
          <button type="button" class="log-row-toggle"
                  x-show="e.stack && e.stack.length"
                  @click="adminLogsToggleStack(e)"
                  :aria-expanded="adminLogsExpanded[String(e._k)] ? 'true' : 'false'"
                  :aria-label="$app.t('admin.logs.toggleStack')">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#chevron-down"></use></svg>
          </button>
          <pre class="log-stack" x-show="e.stack && adminLogsExpanded[String(e._k)]" x-text="(e.stack || []).join('\n')"></pre>
        </div>
      </template>
    </div>
  </div>

  <div x-show="adminLogsLoading && !adminLogsEntries.length" x-skeleton="6" x-cloak></div>
  <p x-show="!adminLogsEntries.length && !adminLogsLoading && !adminLogsError" class="muted-msg muted-msg--sm" x-text="$app.t('admin.logs.empty')"></p>

  <!-- Footer: Seiten + Downloads -->
  <div class="admin-logs-footer">
    <div class="admin-logs-pager" x-show="adminLogsEntries.length">
      <button type="button" class="icon-btn icon-btn--ghost" @click="adminLogsPrevPage()"
              :disabled="adminLogsPage === 0"
              :data-tip="$app.t('admin.logs.prevPage')" :aria-label="$app.t('admin.logs.prevPage')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#chevron-left"/></svg></button>
      <span class="muted-msg muted-msg--sm"
            x-text="$app.t(adminLogsHasMore ? 'admin.logs.pageOfMore' : 'admin.logs.pageOf', { page: adminLogsPage + 1, pages: adminLogsPageCount() })"></span>
      <button type="button" class="icon-btn icon-btn--ghost" @click="adminLogsNextPage()"
              :disabled="adminLogsLoading || !adminLogsCanNext()"
              :data-tip="$app.t('admin.logs.nextPage')" :aria-label="$app.t('admin.logs.nextPage')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#chevron-right"/></svg></button>
    </div>
    <div class="admin-logs-downloads" x-show="adminLogsFiles.length">
      <span class="muted-msg muted-msg--sm" x-text="$app.t('admin.logs.download')"></span>
      <template x-for="f in adminLogsFiles" :key="f.key">
        <button type="button" class="admin-logs-download-btn" @click="adminLogsDownload(f)"
                :disabled="!!adminLogsDownloading" :aria-busy="adminLogsDownloading === f.key ? 'true' : 'false'">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#download"></use></svg>
          <span x-text="f.path"></span>
        </button>
      </template>
    </div>
  </div>
</div>
