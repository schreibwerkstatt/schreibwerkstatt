<!-- Bibliotheks-Picker der Quellen-Karte: die eigene Bibliothek minus dem,
     was dieser Arbeit schon zugeordnet ist. Fragment von partials/sources.html
     (via `<!-- @include sources-picker -->`), kein eigener x-data-Scope —
     Methoden in public/js/sources/manage.js, gespreadet in `sourcesCard`. -->
  <div class="sources-picker" x-show="srcPickerOpen" x-cloak>
    <div class="sources-picker-head">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#book-open"/></svg>
      <span class="sources-picker-title" x-text="$app.t('sources.picker.title')"></span>
      <div class="filter-bar filter-bar--inline">
        <span class="filter-search-wrap sources-picker-search">
          <input type="text" class="filter-search-input" x-model="srcPoolFilter"
                 :placeholder="$app.t('sources.picker.search')" :aria-label="$app.t('sources.picker.search')">
          <button type="button" class="search-clear--icon" x-show="srcPoolFilter" @click="srcPoolFilter = ''"
                  :aria-label="$app.t('search.clear')" :data-tip="$app.t('search.clear')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
        </span>
        <div x-data="combobox($app.t('sources.filter.tag'), $app.t('sources.filter.allTags'))"
             x-modelable="value" x-model="srcPoolTag"
             x-effect="options = srcTagOptions()"></div>
      </div>
      <button type="button" class="icon-btn icon-btn--ghost" @click="closeSourcePicker()"
              :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
    </div>
    <div x-show="srcPoolLoading" x-skeleton="4" x-cloak></div>
    <p class="card-form-error" x-show="srcPoolError" x-cloak x-text="srcPoolError"></p>
    <p class="muted-msg muted-msg--sm" x-show="!srcPoolLoading && !srcPoolError && srcPool.length === 0" x-cloak
       x-text="$app.t('sources.picker.empty')"></p>
    <p class="muted-msg muted-msg--sm" x-show="srcPool.length > 0 && srcPoolRows().length === 0" x-cloak
       x-text="$app.t('sources.noMatch')"></p>
    <ul class="sources-picker-list" x-show="srcPoolRows().length > 0">
      <template x-for="p in srcPoolRows()" :key="p.id">
        <li class="sources-picker-item">
          <span class="sources-picker-entry">
            <span class="sources-picker-author" x-text="p._author || '—'"></span>
            <span class="sources-picker-entry-title" x-text="p.title || $app.t('sources.untitled')"></span>
            <span class="sources-picker-meta">
              <span class="tag entity-typ-tag" x-text="p._typeLabel"></span>
              <span x-show="p.year" x-text="p.year"></span>
              <template x-for="t in (p.tags || [])" :key="t"><span class="tag sources-tag" x-text="t"></span></template>
              <span class="sources-picker-books" x-show="p.book_count > 0"
                    x-text="$app.t('sources.picker.usedInN', { n: p.book_count })"></span>
            </span>
          </span>
          <button type="button" class="btn-compact" @click="addSourceFromLibrary(p)" :disabled="sourcesBusy">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
            <span x-text="$app.t('sources.picker.add')"></span>
          </button>
        </li>
      </template>
    </ul>
  </div>
