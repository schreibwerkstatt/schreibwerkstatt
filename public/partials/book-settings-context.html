    <div class="card-form-grid" x-bind="panel('context')" x-cloak>

    <section class="book-settings-section">
      <h3 class="card-section-title" x-text="$app.t('book.settings.section.context')"></h3>

      <div class="card-form-row card-form-row--top">
        <label class="card-form-label" for="bs-buchkontext" x-text="$app.t('book.settings.context')"></label>
        <div class="book-settings-kontext-wrap">
          <p class="card-form-hint" x-text="$app.t('book.settings.context.hint')"></p>
          <textarea
            id="bs-buchkontext"
            class="card-form-textarea"
            x-model="bookSettingsBuchKontext"
            :placeholder="$app.t('book.settings.contextPlaceholder')"
            rows="4"
            maxlength="2000"
            data-spellcheck="spelling"
          ></textarea>
          <p class="card-form-hint" x-text="(bookSettingsBuchKontext || '').length + ' / 2000'"></p>
        </div>
      </div>

      <div class="card-form-row card-form-row--top">
        <label class="card-form-label" for="bs-stilprofil" x-text="$app.t('book.settings.stilprofil')"></label>
        <div class="book-settings-kontext-wrap">
          <p class="card-form-hint" x-text="$app.t('book.settings.stilprofil.hint')"></p>
          <textarea
            id="bs-stilprofil"
            class="card-form-textarea"
            x-model="bookSettingsStilprofil"
            :placeholder="$app.t('book.settings.stilprofil.placeholder')"
            rows="8"
            maxlength="6000"
            data-spellcheck="spelling"
          ></textarea>
          <div class="book-settings-stilprofil-actions">
            <button type="button" class="btn-compact"
                    @click="generateStilprofil()"
                    :disabled="stilprofilGenerating"
                    x-text="stilprofilGenerating ? $app.t('book.settings.stilprofil.generating') : $app.t('book.settings.stilprofil.generate')"></button>
            <button type="button" class="btn-compact"
                    @click="adoptAuthorProfile()"
                    :disabled="stilprofilAdopting"
                    x-text="$app.t('book.settings.stilprofil.fromAuthor')"></button>
            <span class="card-form-hint" x-text="(bookSettingsStilprofil || '').length + ' / 6000'"></span>
          </div>
          <p class="card-form-error" x-show="stilprofilError" x-text="stilprofilError" x-cloak></p>
        </div>
      </div>

      <p class="card-form-section-divider" x-text="$app.t('book.settings.group.statusGoals')"></p>

      <div class="card-form-row">
        <span class="card-form-label" id="bs-status-label" x-text="$app.t('book.settings.status')"></span>
        <div class="form-stack" role="group" aria-labelledby="bs-status-label">
          <label class="form-check">
            <input type="checkbox" id="bs-finished" x-model="bookSettingsIsFinished">
            <span>
              <span class="form-check-title" x-text="$app.t('book.settings.finished')"></span>
              <span class="form-check-desc" x-text="$app.t('book.settings.finished.desc')"></span>
            </span>
          </label>
          <label class="form-check">
            <input type="checkbox" id="bs-exclude-stats" x-model="bookSettingsExcludeFromStats">
            <span>
              <span class="form-check-title" x-text="$app.t('book.settings.excludeFromStats')"></span>
              <span class="form-check-desc" x-text="$app.t('book.settings.excludeFromStats.desc')"></span>
            </span>
          </label>
        </div>
      </div>

      <div class="card-form-row">
        <label class="card-form-label" for="bs-daily-goal" x-text="$app.t('book.settings.dailyGoalChars')"></label>
        <div class="card-form-field">
          <input type="text" class="form-num" id="bs-daily-goal"
                 x-data="numInput({ step: 100, min: 100, max: 50000 })"
                 x-modelable="value" x-model="bookSettingsDailyGoalChars">
          <p class="card-form-field-note" x-text="$app.t('book.settings.dailyGoalCharsHint')"></p>
        </div>
      </div>

      <div class="card-form-row">
        <label class="card-form-label" for="bs-goal-target" x-text="$app.t('book.settings.goalTargetChars')"></label>
        <div class="card-form-field">
          <input type="text" class="form-num" id="bs-goal-target"
                 x-data="numInput({ step: 1000, min: 0, max: 20000000 })"
                 x-modelable="value" x-model="bookSettingsGoalTargetChars">
          <p class="card-form-field-note" x-text="$app.t('book.settings.goalTargetCharsHint')"></p>
        </div>
      </div>

      <div class="card-form-row">
        <label class="card-form-label" for="bs-goal-deadline" x-text="$app.t('book.settings.goalDeadline')"></label>
        <div class="card-form-field">
          <input type="date" class="card-form-input" id="bs-goal-deadline" x-model="bookSettingsGoalDeadline">
          <p class="card-form-field-note" x-text="$app.t('book.settings.goalDeadlineHint')"></p>
        </div>
      </div>

      <p class="card-form-section-divider" x-text="$app.t('book.settings.group.realism')"></p>

      <div class="card-form-row">
        <span class="card-form-label" id="bs-orte-label" x-text="$app.t('book.settings.orte')"></span>
        <div class="form-stack" role="group" aria-labelledby="bs-orte-label">
          <label class="form-check">
            <input type="checkbox" id="bs-orte-real" x-model="bookSettingsOrteReal">
            <span>
              <span class="form-check-title" x-text="$app.t('book.settings.orteReal')"></span>
              <span class="form-check-desc" x-text="$app.t('book.settings.orteReal.desc')"></span>
            </span>
          </label>
        </div>
      </div>

      <div class="card-form-row" x-show="bookSettingsOrteReal" x-cloak>
        <span class="card-form-label" id="bs-land-label" x-text="$app.t('book.settings.schauplatzLand')"></span>
        <div class="card-form-field">
          <div aria-labelledby="bs-land-label" x-data="combobox($app.t('book.settings.schauplatzLand.placeholder'), $app.t('book.settings.schauplatzLand.none'))"
               x-modelable="value" x-model="bookSettingsSchauplatzLand"
               x-effect="options = bookSettingsLandOptions()"></div>
          <p class="card-form-field-note" x-text="$app.t('book.settings.schauplatzLand.hint')"></p>
        </div>
      </div>

      <div class="card-form-row">
        <span class="card-form-label" id="bs-zeitlinie-label" x-text="$app.t('book.settings.zeitlinie')"></span>
        <div class="form-stack" role="group" aria-labelledby="bs-zeitlinie-label">
          <label class="form-check">
            <input type="checkbox" id="bs-zeitlinie-real" x-model="bookSettingsZeitlinieReal">
            <span>
              <span class="form-check-title" x-text="$app.t('book.settings.zeitlinieReal')"></span>
              <span class="form-check-desc" x-text="$app.t('book.settings.zeitlinieReal.desc')"></span>
            </span>
          </label>
          <label class="form-check" x-show="$store.config.factcheckEnabled" x-cloak>
            <input type="checkbox" id="bs-weltfakten-real" x-model="bookSettingsWeltfaktenRealPruefen">
            <span>
              <span class="form-check-title" x-text="$app.t('book.settings.weltfaktenRealPruefen')"></span>
              <span class="form-check-desc" x-text="$app.t('book.settings.weltfaktenRealPruefen.desc')"></span>
            </span>
          </label>
        </div>
      </div>
    </section>

    <!-- Recherche-Profil: steuert AUSSCHLIESSLICH den Recherche-Chat
         (docs/recherche-chat.md). Eigener Schreibpfad /booksettings/:id/research;
         der Header-Speichern-Knopf schreibt ihn mit. -->
    <section class="book-settings-section" x-show="$store.config.researchChatEnabled" x-cloak>
      <h3 class="card-section-title" x-text="$app.t('book.settings.section.research')"></h3>
      <p class="card-hint" x-text="$app.t('book.settings.research.hint')"></p>

      <div class="card-form-row card-form-row--top">
        <label class="card-form-label" for="bs-research-profile" x-text="$app.t('book.settings.research.profile')"></label>
        <div class="book-settings-kontext-wrap">
          <textarea
            id="bs-research-profile"
            class="card-form-textarea"
            x-model="bookResearchProfile"
            :placeholder="$app.t('book.settings.research.profilePlaceholder')"
            rows="5"
            maxlength="1500"
            data-spellcheck="spelling"
          ></textarea>
          <p class="card-form-hint" x-text="(bookResearchProfile || '').length + ' / 1500'"></p>
        </div>
      </div>

      <div class="card-form-row card-form-row--top">
        <label class="card-form-label" for="bs-research-domains" x-text="$app.t('book.settings.research.domains')"></label>
        <div class="book-settings-kontext-wrap">
          <p class="card-form-hint" x-text="$app.t('book.settings.research.domainsHint')"></p>
          <textarea
            id="bs-research-domains"
            class="card-form-textarea"
            x-model="bookResearchDomains"
            :placeholder="$app.t('book.settings.research.domainsPlaceholder')"
            rows="4"
            spellcheck="false"
          ></textarea>
          <div class="book-settings-preset-row">
            <template x-for="preset in researchDomainPresets()" :key="preset.key">
              <button type="button" class="btn-compact"
                      @click="applyResearchPreset(preset.key)"
                      x-text="researchPresetLabel(preset.key)"></button>
            </template>
          </div>
          <p class="card-form-hint" x-text="$app.t('book.settings.research.domainsCount', { n: researchDomainCount() })"></p>
        </div>
      </div>
    </section>

    </div><!-- /tab: context -->
