<!-- Ideen-Board: alle Notizen und Pendenzen eines Buches auf einem Brett.
     Bahnen (Zeilen) sind die Anker im Buch — Kapitel bzw. Seite, in Buch-
     Reihenfolge; Spalten sind die Bearbeitungsstufen. Damit beantwortet die
     Karte, was die Ideen-Karte neben dem Editor nicht kann: was ist im GANZEN
     Buch noch offen, und wie weit ist es.

     Derselbe Bestand fuer Bahnen, Spalten und Zaehler — eine `/ideen/board`-
     Antwort, davor eine Filterleiste. Verschoben wird per Drag am Griff
     (SortableJS, Logik in public/js/book/ideen-board/actions.js); der
     tastaturerreichbare Weg sind die Stufen-Knoepfe auf der Karte. Innerhalb
     einer Spalte ordnet der Drag nur, solange sie in ihrer urspruenglichen
     Position steht (`ideen.sort_order`); sortiert wird pro Spalte im Kopf. -->
<div class="card card--ideenboard fullscreen-shell" id="ideen-board-card" x-data="ideenBoardCard"
     x-show="$app.showIdeenBoardCard" x-cloak>
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-title" x-text="$app.t('ideenBoard.title')"></span>
      <div class="card-subline" x-text="$app.t('ideenBoard.subline')"></div>
    </div>
    <!-- Ideen-Chat-Panel (chat/ideen-chat.js): Vorschläge an die Ideen, einzeln übernehmen -->
    <button type="button" class="icon-btn icon-btn--ghost" :class="{ 'is-active': ideenChatOpen }" :aria-pressed="ideenChatOpen" @click="toggleIdeenChat()" :aria-label="$app.t('ideenBoard.chat.toggle')" :data-tip="$app.t('ideenBoard.chat.toggle')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#message-square"/></svg></button>
    <button type="button" class="icon-btn icon-btn--ghost" :class="{ 'is-active': ideenBoardFullscreen }" :aria-pressed="ideenBoardFullscreen" @click="toggleIdeenBoardFullscreen()" :aria-label="ideenBoardFullscreen ? $app.t('ideenBoard.fullscreenExit.tip') : $app.t('ideenBoard.fullscreen.tip')" :data-tip="ideenBoardFullscreen ? $app.t('ideenBoard.fullscreenExit.tip') : $app.t('ideenBoard.fullscreen.tip')"><svg class="icon" aria-hidden="true"><use :href="ideenBoardFullscreen ? '/icons.svg#minimize-2' : '/icons.svg#maximize-2'"/></svg></button>
  </div>

  <div x-show="errorMessage" class="card-status card-status--error" x-text="errorMessage"></div>

  <!-- Board links, Ideen-Chat rechts daneben (ab 1280px; schmaler steht der
       Chat per `order` über dem Board). Reine Layout-Klammer. -->
  <div class="aside-split aside-split--aside-first" :class="{ 'aside-split--on': ideenChatOpen }">
  <div class="ideen-main">

  <!-- Feature-Tipp: offene Ideen an Abschnitten/Kapiteln → Erledigt-Check des Ideen-Chats -->
  <template x-if="$store.hints.isOpen('ideenBoard.erledigtCheck') && ideenCheckTipDue()">
    <div class="feature-tip ideen-board-tip" role="note">
      <span class="feature-tip__text" x-text="$app.t('hint.ideenErledigt.text')"></span>
      <button type="button" class="feature-tip__action" @click="$store.hints.dismiss('ideenBoard.erledigtCheck'); startIdeenErledigtCheck()" x-text="$app.t('hint.ideenErledigt.action')"></button>
      <button type="button" class="icon-btn icon-btn--ghost feature-tip__close" @click="$store.hints.dismiss('ideenBoard.erledigtCheck')" :data-tip="$app.t('hint.dismiss')" :aria-label="$app.t('hint.dismiss')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
    </div>
  </template>

  <!-- @include ideen-board-toolbar -->

  <!-- @include ideen-board-add -->

  <!-- @include ideen-link-picker -->

  <div x-show="loading" class="muted-msg" x-text="$app.t('ideenBoard.loading')"></div>
  <div x-show="!loading && totalCount() === 0" class="muted-msg" x-text="$app.t('ideenBoard.empty')"></div>
  <div x-show="!loading && totalCount() > 0 && (isListView() ? listRows().length === 0 : lanes().length === 0)" class="muted-msg"
       x-text="$app.t('ideenBoard.emptyFiltered')"></div>

  <!-- @include ideen-board-grid -->

  <!-- @include ideen-board-list -->
  </div><!-- /.ideen-main -->

  <!-- Ideen-Chat-Panel (ausgelagert; File-Limit) -->
  <div id="partial-ideen-chat" class="aside-split-aside"></div>
  </div><!-- /.aside-split -->
</div>
