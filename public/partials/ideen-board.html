<!-- Ideen-Board: alle Notizen und Pendenzen eines Buches auf einem Brett.
     Bahnen (Zeilen) sind die Anker im Buch — Kapitel bzw. Seite, in Buch-
     Reihenfolge; Spalten sind die Bearbeitungsstufen. Damit beantwortet die
     Karte, was die Ideen-Karte neben dem Editor nicht kann: was ist im GANZEN
     Buch noch offen, und wie weit ist es.

     Derselbe Bestand fuer Bahnen, Spalten und Zaehler — eine `/ideen/board`-
     Antwort, davor eine Filterleiste. Verschoben wird per Drag am Griff
     (SortableJS, Logik in public/js/book/ideen-board/actions.js); der
     tastaturerreichbare Weg sind die Stufen-Knoepfe auf der Karte. Innerhalb
     einer Spalte ordnet der Drag nur, solange sie in ihrer urspruenglichen
     Position steht (`ideen.sort_order`); sortiert wird pro Spalte im Kopf. -->
<div class="card card--ideenboard fullscreen-shell" id="ideen-board-card" x-data="ideenBoardCard"
     x-show="$app.showIdeenBoardCard" x-cloak>
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-title" x-text="$app.t('ideenBoard.title')"></span>
      <div class="card-subline" x-text="$app.t('ideenBoard.subline')"></div>
    </div>
    <button type="button" class="btn-compact ideen-board-stages-toggle" @click="stagesOpen = !stagesOpen"
            :aria-expanded="stagesOpen" :class="{ 'is-active': stagesOpen }"
            :data-tip="$app.t('ideenBoard.stages.tip')" x-text="$app.t('ideenBoard.stages.toggle')"></button>
    <!-- Ideen-Chat-Panel (chat/ideen-chat.js): Vorschläge an die Ideen, einzeln übernehmen -->
    <button type="button" class="icon-btn icon-btn--ghost" :class="{ 'is-active': ideenChatOpen }" :aria-pressed="ideenChatOpen" @click="toggleIdeenChat()" :aria-label="$app.t('ideenBoard.chat.toggle')" :data-tip="$app.t('ideenBoard.chat.toggle')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#message-square"/></svg></button>
    <button type="button" class="icon-btn icon-btn--ghost" :class="{ 'is-active': ideenBoardFullscreen }" :aria-pressed="ideenBoardFullscreen" @click="toggleIdeenBoardFullscreen()" :aria-label="ideenBoardFullscreen ? $app.t('ideenBoard.fullscreenExit.tip') : $app.t('ideenBoard.fullscreen.tip')" :data-tip="ideenBoardFullscreen ? $app.t('ideenBoard.fullscreenExit.tip') : $app.t('ideenBoard.fullscreen.tip')"><svg class="icon" aria-hidden="true"><use :href="ideenBoardFullscreen ? '/icons.svg#minimize-2' : '/icons.svg#maximize-2'"/></svg></button>
  </div>

  <div x-show="errorMessage" class="card-status card-status--error" x-text="errorMessage"></div>

  <!-- Board links, Ideen-Chat rechts daneben (ab 1280px; schmaler steht der
       Chat per `order` über dem Board). Reine Layout-Klammer. -->
  <div class="ideen-split" :class="{ 'ideen-split--chat': ideenChatOpen }">
  <div class="ideen-main">

  <!-- @include ideen-board-stages -->

  <!-- @include ideen-board-toolbar -->

  <!-- @include ideen-board-add -->

  <!-- @include ideen-link-picker -->

  <div x-show="loading" class="muted-msg" x-text="$app.t('ideenBoard.loading')"></div>
  <div x-show="!loading && totalCount() === 0" class="muted-msg" x-text="$app.t('ideenBoard.empty')"></div>
  <div x-show="!loading && totalCount() > 0 && lanes().length === 0" class="muted-msg"
       x-text="$app.t('ideenBoard.emptyFiltered')"></div>

  <!-- Der Query-Container sitzt auf diesem Wrapper, NICHT auf der Karte: ein
       `container-type` ist fuer Floating UI (x-anchor) ein Containing Block,
       fuer den Browser aber keiner — ein am Trigger verankertes
       `position: fixed`-Dropdown (Combobox/Entity-Picker) bekaeme dann
       Koordinaten relativ zur Karte und landete um deren Offset daneben.
       Darum umschliesst der Container nur das Raster, in dem kein Popover
       aufgeht. Gegated: tests/e2e-app/combobox-anchoring.spec.js -->
  <div class="ideen-board-wrap">
    <div class="ideen-board" :class="'ideen-board--cols-' + statuses().length"
         x-show="!loading && lanes().length > 0" x-cloak>
      <!-- Spaltenkoepfe: Stufe + Gesamtzahl ueber den ganzen Bestand (nicht ueber
           die gefilterte Sicht — sonst zeigte die Spalte „verworfen" beim
           Ausblenden eine 0 und damit das Gegenteil der Wahrheit). -->
      <div class="ideen-board-head">
        <div class="ideen-board-head-lane" x-text="$app.t('ideenBoard.laneColumn')"></div>
        <template x-for="st in statuses()" :key="st">
          <div class="ideen-board-head-col"
               :class="'ideen-board-head-col--' + st + (isStageActive(st) ? '' : ' ideen-board-head-col--inactive')">
            <span class="board-col-title" x-text="statusLabel(st)"
                  :data-tip="isStageActive(st) ? null : inactiveStageTip(st)"></span>
            <span class="board-col-count" x-text="statusTotal(st)"></span>
            <!-- Sortierung DIESER Spalte: ein Kriterium waehlen, nochmal klicken
                 kehrt die Richtung um; der Reset holt die urspruengliche,
                 per Drag gesetzte Position zurueck. Bewusst Knoepfe statt
                 Combobox — im Raster darf kein verankertes Popover aufgehen
                 (container-type, siehe Wrapper unten). -->
            <span class="ideen-board-col-sort">
              <span class="seg-toggle" role="group" :aria-label="$app.t('ideenBoard.sort.label')">
                <button type="button" :class="{ 'seg-toggle--active': colSort(st).by === 'created' }" :aria-pressed="colSort(st).by === 'created'"
                        @click="setColumnSort(st, 'created')" :data-tip="sortKeyTip(st, 'created')" :aria-label="sortKeyTip(st, 'created')">
                  <span x-text="sortKeyLabel('created')"></span><svg class="icon" aria-hidden="true" x-show="colSort(st).by === 'created'"><use :href="sortDirIcon(st)"/></svg>
                </button>
                <button type="button" :class="{ 'seg-toggle--active': colSort(st).by === 'title' }" :aria-pressed="colSort(st).by === 'title'"
                        @click="setColumnSort(st, 'title')" :data-tip="sortKeyTip(st, 'title')" :aria-label="sortKeyTip(st, 'title')">
                  <span x-text="sortKeyLabel('title')"></span><svg class="icon" aria-hidden="true" x-show="colSort(st).by === 'title'"><use :href="sortDirIcon(st)"/></svg>
                </button>
              </span>
              <button type="button" class="icon-btn icon-btn--ghost"
                      x-show="!isColumnManual(st)" @click="resetColumnSort(st)"
                      :data-tip="$app.t('ideenBoard.sort.reset')" :aria-label="$app.t('ideenBoard.sort.reset')">
                <svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-ccw"/></svg>
              </button>
            </span>
          </div>
        </template>
      </div>

      <template x-for="lane in lanes()" :key="lane.lane.key">
        <div class="ideen-board-row" :class="'ideen-board-row--' + lane.lane.kind + ' ideen-board-row--depth-' + Math.min(lane.lane.depth || 1, 4)">
          <!-- Bahnbeschriftung mit zwei unabhaengigen Klapp-Griffen (Zustand in
               collapsedLanes/collapsedChapters, pro Buch im localStorage):
               Chevron = KARTEN dieser Bahn, Abschnitts-Griff = TEILBAUM einer
               Kapitel-Bahn. Ansicht, kein Filter: Verborgenes zaehlt in den
               Zellen. Die Gliederung zeigt der Einzug (depth-N). -->
          <div class="ideen-board-lane">
            <div class="ideen-board-lane-head">
              <button type="button" class="ideen-board-fold" @click="toggleLaneFold(lane.lane)"
                      :aria-expanded="!lane.collapsed"
                      :data-tip="foldLaneTip(lane)" :aria-label="foldLaneTip(lane)">
                <span class="history-chevron" :class="{ open: !lane.collapsed }" aria-hidden="true"></span>
              </button>
              <button type="button" class="ideen-board-lane-title internal-link"
                      @click="openLane(lane.lane)"
                      :disabled="lane.lane.kind === 'unknown' || lane.lane.kind === 'book'"
                      :data-tip="$app.t('ideenBoard.openLane')"
                      x-text="laneLabel(lane.lane)"></button>
            </div>
            <div class="ideen-board-lane-meta">
              <button type="button" class="ideen-board-pages"
                      x-show="lane.lane.kind === 'chapter' && lane.childLanes > 0"
                      @click="toggleChapterFold(lane.lane)"
                      :aria-expanded="!lane.childCollapsed"
                      :data-tip="foldChapterTip(lane)" :aria-label="foldChapterTip(lane)">
                <span class="history-chevron" :class="{ open: !lane.childCollapsed }" aria-hidden="true"></span>
                <span x-text="$app.t('ideenBoard.lanePages', { n: lane.childLanes })"></span>
              </button>
              <span class="ideen-board-lane-count" x-text="lane.count"></span>
            </div>
          </div>

          <template x-for="st in statuses()" :key="st">
            <!-- SortableJS-Container: haelt ausser dem x-for-Anker nur die Karten.
                 `data-idee-status-cell` traegt die Ziel-Stufe, `data-idee-lane`
                 bindet die Drop-Gruppe an DIESE Bahn — eine verankerte Karte
                 wechselt die Spalte, nie die Zeile (die Zeile ist ihr Anker im
                 Buch). Nur eine offene Buch-Idee darf in eine Kapitel-/
                 Abschnitts-Bahn: das ordnet sie zu. -->
            <div class="ideen-board-cell" :class="'ideen-board-cell--' + st"
                 :data-idee-status-cell="st" :data-idee-lane="lane.lane.key">
              <template x-for="idee in (lane.collapsed ? [] : lane.columns[st])" :key="idee.id">
                <div class="idee-board-card hover-reveal-host" :class="'idee-board-card--' + st"
                     :data-idee-card-id="idee.id">
                  <!-- Kartenaktionen schweben oben rechts und erscheinen erst auf
                       Zuwendung: in der Zeile der Stufen-Knoepfe nehmen sie so viel
                       Breite, dass deren drei Wortmarken dreizeilig umbrechen. -->
                  <div class="idee-board-card-actions hover-reveal">
                    <button type="button" class="icon-btn icon-btn--ghost"
                            @click.stop="startEdit(idee)" :disabled="busy"
                            :data-tip="$app.t('ideen.edit')" :aria-label="$app.t('ideen.edit')">
                      <svg class="icon" aria-hidden="true"><use href="/icons.svg#pencil"/></svg>
                    </button>
                    <button type="button" class="icon-btn icon-btn--ghost" x-show="canAssign(idee)"
                            @click.stop="startAssign(idee)" :disabled="busy"
                            :data-tip="$app.t('ideenBoard.assign')" :aria-label="$app.t('ideenBoard.assign')">
                      <svg class="icon" aria-hidden="true"><use href="/icons.svg#move-horizontal"/></svg>
                    </button>
                    <button type="button" class="icon-btn icon-btn--ghost"
                            @click.stop="openLinkPicker($event, idee)" :disabled="busy"
                            :data-tip="$app.t('ideen.link.add')" :aria-label="$app.t('ideen.link.add')">
                      <svg class="icon" aria-hidden="true"><use href="/icons.svg#external-link"/></svg>
                    </button>
                    <button type="button" class="icon-btn icon-btn--ghost icon-btn--danger"
                            @click.stop="deleteIdee(idee)" :disabled="busy"
                            :data-tip="$app.t('ideen.delete')" :aria-label="$app.t('ideen.delete')">
                      <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
                    </button>
                  </div>
                  <!-- Griff neben dem Text statt in einer eigenen Kopfzeile: er ist
                       das Einzige, was auf der Karte dauerhaft sichtbar waere, und
                       stuende dort als leerer Streifen ueber jeder Notiz. Er bleibt
                       die einzige Greifflaeche (SortableJS handle), damit Text,
                       Chips und Knoepfe voll klickbar bleiben. -->
                  <div class="idee-board-card-body">
                    <span class="idee-board-grip" :data-tip="dragTip(idee)" :aria-label="dragTip(idee)">
                      <svg class="icon" aria-hidden="true"><use href="/icons.svg#grip-vertical"/></svg>
                    </span>
                    <div class="idee-board-card-main">
                      <template x-if="editingId !== idee.id">
                        <div class="idee-board-text" x-text="idee.content"></div>
                      </template>
                      <template x-if="editingId === idee.id">
                        <div class="idee-board-edit">
                          <textarea class="ideen-input" x-model="editingDraft" rows="3" :disabled="busy"
                                    data-spellcheck="spelling"
                                    @keydown.enter="if(!$event.isComposing && $event.keyCode !== 229 && !$event.shiftKey && !$event.ctrlKey && !$event.metaKey) { $event.preventDefault(); saveEdit(idee); }"
                                    @keydown.escape="cancelEdit()"></textarea>
                          <div class="idee-edit-actions">
                            <button type="button" class="btn-compact" @click="saveEdit(idee)" :disabled="busy" x-text="$app.t('ideen.save')"></button>
                            <button type="button" class="btn-compact" @click="cancelEdit()" :disabled="busy" x-text="$app.t('ideen.cancel')"></button>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>

                  <!-- Verknuepfungs-Chips unter Griff UND Text, buendig mit der
                       Kartenkante: neben dem Griff eingerueckt sassen sie als
                       Fortsetzung des Textes statt als eigene Zeile. -->
                  <!-- @include ideen-link-chips -->

                  <!-- Stufen-Knoepfe: derselbe Schreibpfad wie der Drag, aber mit
                       der Tastatur erreichbar. Sie stehen ueber die ganze Breite,
                       weil drei Wortmarken in einer 13rem-Spalte sonst dreizeilig
                       umbrechen. -->
                  <div class="idee-board-steps hover-reveal" role="group" :aria-label="$app.t('ideenBoard.setStatus')">
                    <template x-for="target in statuses()" :key="target">
                      <button type="button" class="idee-board-step"
                              :class="'idee-board-step--' + target"
                              x-show="target !== st && isStageActive(target)"
                              @click.stop="setIdeeStatus(idee, target)" :disabled="busy"
                              :data-tip="$app.t('ideenBoard.moveTo', { status: statusLabel(target) })"
                              :aria-label="$app.t('ideenBoard.moveTo', { status: statusLabel(target) })"
                              x-text="statusLabel(target)"></button>
                    </template>
                  </div>
                </div>
              </template>
              <!-- Was die Klappung in dieser Zelle verbirgt (eigene Karten und/oder
                   die Karten gefalteter Seiten-Bahnen). Kein Knopf: die Griffe
                   stehen in der Bahn, hier zaehlt nur — eine eingeklappte Pendenz
                   soll trotzdem nicht von einer verlorenen zu unterscheiden sein. -->
              <span class="ideen-board-folded" x-show="lane.hidden[st] > 0"
                    :data-tip="$app.t('ideenBoard.foldedHint', { n: lane.hidden[st] })"
                    x-text="'+' + lane.hidden[st]"></span>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>
  </div><!-- /.ideen-main -->

  <!-- Ideen-Chat-Panel (ausgelagert; File-Limit) -->
  <div id="partial-ideen-chat" class="ideen-chat-slot"></div>
  </div><!-- /.ideen-split -->
</div>
