<!-- Import-Karte: Tagebuch-ZIP (YYYY/Monat/Tagesdatei), Manuskript-Dokument
     (nach Ueberschriften-Ebenen zerlegt) oder .swbook-Bundle. -->
<div class="card card--folderimport" id="folder-import-card" x-data="folderImportCard" x-show="$app.showFolderImportCard" x-cloak>
  <div class="card-header">
    <span class="card-title" x-text="$app.t('folderImport.title')"></span>
    <span class="card-subtitle" x-text="$app.t('folderImport.subtitle')"></span>
  </div>

  <div class="folder-import-body" x-show="!jobId">
    <div class="folder-import-row">
      <label class="folder-import-label" x-text="$app.t('folderImport.kindLabel')"></label>
      <div x-data="radioGroup()" x-modelable="value" x-model="importKind"
           x-effect="options = [
             { value: 'diary',      label: $app.t('folderImport.kind.diary') },
             { value: 'manuscript', label: $app.t('folderImport.kind.manuscript') },
             { value: 'swbook',     label: $app.t('folderImport.kind.swbook') }
           ]"
           @radio-change="file = null; fileName = ''; fileSize = 0; preview = null; errorMessage = ''"></div>
    </div>

    <div class="folder-import-merge-info" x-show="importKind === 'swbook'" x-text="$app.t('folderImport.swbookHint')"></div>
    <div class="folder-import-merge-info" x-show="importKind === 'manuscript'" x-text="$app.t('folderImport.manuscript.hint')"></div>

    <div class="folder-import-row" x-show="importKind !== 'swbook'">
      <label class="folder-import-label" x-text="$app.t('folderImport.modeLabel')"></label>
      <div x-data="radioGroup()" x-modelable="value" x-model="mode"
           x-effect="options = [
             { value: 'new-book', label: $app.t('folderImport.mode.newBook') },
             { value: 'merge', label: $app.t('folderImport.mode.merge'), disabled: !$store.nav.selectedBookId }
           ]"></div>
    </div>

    <div class="folder-import-row" x-show="importKind === 'diary'">
      <label class="folder-import-label" x-text="$app.t('folderImport.grouping.label')"></label>
      <div class="folder-import-field">
        <div x-data="radioGroup()" x-modelable="value" x-model="grouping"
             x-effect="options = [
               { value: 'year-month', label: $app.t('folderImport.grouping.yearMonth') },
               { value: 'year',       label: $app.t('folderImport.grouping.year') },
               { value: 'flat',       label: $app.t('folderImport.grouping.flat') }
             ]"></div>
        <div class="card-hint" x-text="$app.t('folderImport.grouping.hint.' + grouping)"></div>
      </div>
    </div>

    <div class="folder-import-row" x-show="importKind !== 'swbook' && mode === 'new-book'">
      <label class="folder-import-label" x-text="$app.t('folderImport.bookName')"></label>
      <input type="text" class="folder-import-input" x-model="bookName"
             :placeholder="$app.t('folderImport.bookNamePlaceholder')">
    </div>

    <div class="folder-import-merge-info" x-show="importKind !== 'swbook' && mode === 'merge'" x-text="$app.t('folderImport.mergeInto', { name: $app.selectedBookName || '' })"></div>

    <!-- @include folder-import-manuscript -->

    <div class="folder-import-drop"
         :class="{ 'has-file': !!file }"
         x-data="fileDrop({ accept: () => importKind === 'swbook' ? '.swbook,.zip,application/zip'
                                        : importKind === 'manuscript' ? '.docx,.doc,.odt,.abw'
                                        : '.zip,application/zip' })"
         @file-drop="setFile($event.detail.file)">
      <div class="folder-import-drop-label">
        <div class="folder-import-drop-text" x-show="!file"
             x-text="$app.t(importKind === 'manuscript' ? 'folderImport.manuscript.dropZone' : 'folderImport.dropZone')"></div>
        <div class="folder-import-drop-file" x-show="file">
          <strong x-text="fileName"></strong>
          <span class="folder-import-size" x-text="(fileSize / 1024 / 1024).toFixed(1) + ' MB'"></span>
        </div>
      </div>
    </div>

    <div class="folder-import-actions">
      <button type="button" class="btn-compact" :disabled="!canSubmit" @click="submit()">
        <span x-text="$app.t('folderImport.start')"></span>
      </button>
    </div>

    <div class="folder-import-error" x-show="errorMessage" x-text="errorMessage"></div>

    <div class="folder-import-help" x-show="importKind === 'diary'">
      <p x-text="$app.t('folderImport.help.line1')"></p>
      <ul>
        <li x-text="$app.t('folderImport.help.struct')"></li>
        <li x-text="$app.t('folderImport.help.formats')"></li>
        <li x-text="$app.t('folderImport.help.chapters')"></li>
      </ul>
    </div>
  </div>

  <div class="folder-import-progress" x-show="jobId && !result">
    <div class="folder-import-status" x-html="runningStatusHtml"></div>
    <div class="progress-bar">
      <div class="progress-bar-fill" :style="{ '--progress': jobProgress + '%' }"></div>
    </div>
  </div>

  <div class="folder-import-result" x-show="result">
    <h3 x-text="$app.t('folderImport.result.title')"></h3>
    <ul>
      <li x-text="$app.t('folderImport.result.pages', { n: result?.pagesCreated || 0 })"></li>
      <li x-text="$app.t('folderImport.result.chapters', { n: result?.chaptersCreated || 0 })"></li>
      <li x-show="(result?.skipped?.length || 0) > 0"
          x-text="$app.t('folderImport.result.skipped', { n: result?.skipped?.length || 0 })"></li>
      <li x-show="result?.extras?.analysis"
          x-text="$app.t('folderImport.result.analysis', { figures: result?.extras?.analysis?.figures || 0, locations: result?.extras?.analysis?.locations || 0, scenes: result?.extras?.analysis?.scenes || 0 })"></li>
      <li x-show="(result?.extras?.analysis?.skippedRows || 0) > 0"
          x-text="$app.t('folderImport.result.analysisScopeSkipped', { rows: result?.extras?.analysis?.skippedRows || 0 })"></li>
      <li x-show="result?.extras?.lektorat"
          x-text="$app.t('folderImport.result.lektorat', { n: result?.extras?.lektorat?.pageChecks || 0 })"></li>
      <li x-show="result?.extras?.chats"
          x-text="$app.t('folderImport.result.chats', { sessions: result?.extras?.chats?.sessions || 0, messages: result?.extras?.chats?.messages || 0 })"></li>
      <li x-show="result?.extras?.research"
          x-text="$app.t('folderImport.result.research', { items: result?.extras?.research?.items || 0, links: result?.extras?.research?.links || 0 })"></li>
      <li x-show="(result?.extras?.research?.linksDropped || 0) > 0"
          x-text="$app.t('folderImport.result.researchLinksDropped', { n: result?.extras?.research?.linksDropped || 0 })"></li>
      <li class="folder-import-result-warn" x-show="(result?.failed || 0) > 0"
          x-text="$app.t('folderImport.result.failed', { n: result?.failed || 0 })"></li>
      <li class="folder-import-result-warn" x-show="result?.extras?.error"
          x-text="$app.t('folderImport.result.extrasFailed')"></li>
    </ul>
    <div class="card-hint" x-show="result?.headingMap"
         x-text="$app.t('folderImport.result.headingMap', { map: result?.headingMap || '' })"></div>
    <div x-data="collapsible()" x-show="(result?.outline?.length || 0) > 0" class="folder-import-outline-block">
      <button type="button" class="collapsible-toggle" x-bind="trigger">
        <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
        <span x-text="$app.t('folderImport.manuscript.outlineDetails')"></span>
      </button>
      <ul class="folder-import-outline" x-bind="panel" x-cloak>
        <template x-for="(node, idx) in resultOutlineFlat" :key="idx">
          <li :class="'folder-import-outline-item is-' + node.type" :style="{ '--outline-depth': node.depth }">
            <span class="folder-import-outline-name" x-text="node.name"></span>
            <span class="folder-import-outline-meta" x-show="node.type === 'page'"
                  x-text="$app.t('folderImport.manuscript.pageChars', { n: node.chars || 0 })"></span>
          </li>
        </template>
      </ul>
    </div>
    <div x-data="collapsible()" x-show="(result?.skipped?.length || 0) > 0" class="folder-import-skipped-block">
      <button type="button" class="collapsible-toggle" x-bind="trigger">
        <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
        <span x-text="$app.t('folderImport.result.skippedDetails')"></span>
      </button>
      <ul class="folder-import-skipped" x-bind="panel" x-cloak>
        <template x-for="(s, idx) in (result?.skipped || [])" :key="idx">
          <li>
            <code x-text="s.path || s.name || ''"></code>
            <span x-text="' — ' + s.reason"></span>
          </li>
        </template>
      </ul>
    </div>
    <div x-data="collapsible()" x-show="(result?.auditLog?.length || 0) > 0" class="folder-import-log-block">
      <button type="button" class="collapsible-toggle" x-bind="trigger">
        <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
        <span x-text="$app.t('folderImport.result.logDetails', { n: result?.auditLog?.length || 0 })"></span>
      </button>
      <ul class="folder-import-log" x-bind="panel" x-cloak>
        <template x-for="(entry, idx) in (result?.auditLog || [])" :key="idx">
          <li :class="'folder-import-log-line is-' + entry.level">
            <time x-text="fmtLogTime(entry.ts)"></time>
            <span x-text="entry.msg"></span>
          </li>
        </template>
      </ul>
    </div>
    <div class="folder-import-actions">
      <button type="button" class="btn-compact" @click="reset()" x-text="$app.t('folderImport.again')"></button>
    </div>
  </div>
</div>
