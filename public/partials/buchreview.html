<!-- Buchbewertung -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/book-review-card.js.
  `showBookReviewCard` bleibt am Root; fachlicher State (Loading/Progress/
  Status/Out/selectedBookReviewId, PollTimer) lebt in der Sub.
  bookReviewHistory bleibt im Root (tree.js/loadPages schreibt, user-settings
  liest beim Danger-Reset).
-->
<div class="card card--review" x-data="bookReviewCard" x-show="$app.showBookReviewCard" x-cloak>
  <div class="card-header">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('review.title')"></span>
    </div>
    <div class="card-actions">
      <button type="button" class="icon-btn icon-btn--ghost" @click="runBookReview()" :disabled="bookReviewLoading"
              :data-tip="bookReviewOut ? $app.t('review.rerun') : $app.t('review.start')"
              :aria-label="bookReviewOut ? $app.t('review.rerun') : $app.t('review.start')">
        <span x-show="bookReviewLoading" class="spinner"></span>
        <svg x-show="!bookReviewLoading" class="icon" aria-hidden="true"><use href="/icons.svg#scale"/></svg>
      </button>
    </div>
  </div>
  <div x-job-progress="{ active: bookReviewLoading, progress: bookReviewProgress, status: bookReviewStatus, timer: '_reviewPollTimer' }"></div>
  <div x-html="bookReviewOut"></div>

  <!-- Buchbewertungs-Verlauf -->
  <div x-show="$app.bookReviewHistory.length > 0"
       x-data="{ runRow: bookReviewRunRow() }"
       class="card-history-section"
       :class="{ 'card-history-section--borderless': !bookReviewOut }">
    <div class="history-heading" x-text="$app.t('review.history')"></div>
    <template x-for="r in $app.bookReviewHistory" :key="r.id">
      <div>
        <!-- @include run-history-row -->
        <div x-show="selectedBookReviewId === r.id" class="history-detail">
          <div x-html="r.review_json ? _renderReviewHtml(r.review_json) : ''"></div>
        </div>
      </div>
    </template>
  </div>
</div>
