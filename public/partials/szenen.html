<!-- Szenenanalyse -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/szenen-card.js.
  Fachdaten (szenen, figuren, orte) leben in Alpine.store('catalog'),
  Filter/Auswahl/Stand in Alpine.store('catalogUi'). Verteilung und Grid sind
  eigene Fragmente (szenen-uebersicht.html, szenen-grid.html) im selben Scope.
-->
<div class="card card--szenen" x-data="szenenCard" x-show="$app.showSzenenCard" x-cloak>
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('szenen.title')"></span>
      <div class="card-subline" x-show="updatedLabel && !szenenLoading">
        <span class="card-timestamp" x-text="$app.t('common.asOf', { date: updatedLabel })"></span>
      </div>
    </div>
  </div>

  <div x-show="szenenError" class="card-status card-status--error" role="alert" x-text="szenenError"></div>

  <!-- Leer-Hinweis mit CTA -->
  <div x-show="!$store.catalog.szenen.length && !szenenLoading" class="card-empty">
    <p class="card-empty-text" x-text="$app.t('common.noAnalysisYet')"></p>
    <p class="card-empty-hint" x-text="$app.t('empty.szenen.hint')"></p>
    <button type="button" class="primary card-empty-cta"
            @click="$app.alleAktualisieren()"
            :disabled="$store.jobs.alleAktualisierenLoading || !$store.nav.selectedBookId">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#rotate-cw"/></svg>
      <span x-text="$app.t('header.updateAll')"></span>
    </button>
  </div>

  <!-- Skeleton während des ersten Ladens -->
  <div x-show="szenenLoading && !$store.catalog.szenen.length" class="entity-skeleton entity-list--accented" x-cloak>
    <template x-for="i in 6" :key="i">
      <div class="entity-skeleton-row">
        <span class="entity-skeleton-cell entity-skeleton-cell--anchor"></span>
        <span class="entity-skeleton-cell entity-skeleton-cell--title"></span>
        <span class="entity-skeleton-cell entity-skeleton-cell--meta"></span>
      </div>
    </template>
  </div>

  <!-- @include szenen-uebersicht -->

  <!-- Alle Szenen -->
  <div x-show="$store.catalog.szenen.length > 0" class="szenen-liste-section">
    <!-- Ansicht-Umschalter (Liste / Grid) -->
    <div class="tabs entity-view-toggle" role="tablist" :aria-label="$app.t('szenen.viewLabel')">
      <template x-for="m in ['list','grid']" :key="m">
        <button type="button" role="tab"
                class="tabs-btn"
                :class="{ 'tabs-btn--active': viewMode === m }"
                :aria-selected="viewMode === m"
                @click="viewMode = m"
                x-text="$app.t('szenen.view.' + m)"></button>
      </template>
    </div>
    <!-- Filter-Leiste -->
    <div class="filter-bar">
      <span class="filter-search-wrap">
        <input type="text" x-model="$store.catalogUi.szenenFilters.suche" :placeholder="$app.t('szenen.searchPlaceholder')" :aria-label="$app.t('szenen.searchPlaceholder')" class="filter-search-input">
        <button type="button" class="search-clear--icon" x-show="$store.catalogUi.szenenFilters.suche" @click="$store.catalogUi.szenenFilters.suche=''" :aria-label="$app.t('search.clear')" :data-tip="$app.t('search.clear')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
      </span>
      <!-- Zähler ohne stale-Szenen; die stehen unten mit eigenem Hinweis. -->
      <div class="tabs">
        <button type="button" class="tabs-btn"
                :class="{ 'tabs-btn--active': $store.catalogUi.szenenFilters.wertung === '' }"
                @click="$store.catalogUi.szenenFilters.wertung = ''">
          <span x-text="$app.t('common.all')"></span>
          <span class="tabs-btn-count" x-text="activeCount"></span>
        </button>
        <template x-for="w in ['stark','mittel','schwach']" :key="w">
          <button type="button" class="tabs-btn"
                  :class="{ 'tabs-btn--active': $store.catalogUi.szenenFilters.wertung === w }"
                  :disabled="wertungCounts[w] === 0 && $store.catalogUi.szenenFilters.wertung !== w"
                  @click="$store.catalogUi.szenenFilters.wertung = $store.catalogUi.szenenFilters.wertung === w ? '' : w">
            <span x-text="$app.t('szenen.rating.' + w)"></span>
            <span class="tabs-btn-count" x-text="wertungCounts[w]"></span>
          </button>
        </template>
      </div>
      <div x-data="catalogFilter('figur')"
           x-modelable="value" x-model="$store.catalogUi.szenenFilters.figurId"
           x-effect="options = $store.catalog.figuren.filter(f => $store.catalog.szenen.some(s => s.fig_ids.includes(f.id))).map(f => ({value: f.id, label: f.kurzname || f.name}))"
           >
      </div>
      <div x-data="catalogFilter('chapter')"
           x-modelable="value" x-model="$store.catalogUi.szenenFilters.kapitelId"
           x-effect="options = kapitelOptionen"
           @combobox-change="$store.catalogUi.szenenFilters.seiteId = ''"
           >
      </div>
      <div x-data="catalogFilter('page')"
           x-modelable="value" x-model="$store.catalogUi.szenenFilters.seiteId"
           x-effect="_disabled = !$store.catalogUi.szenenFilters.kapitelId || seitenOptionen.length === 0; options = seitenOptionen"
           :class="{'combobox-wrap--disabled': _disabled}"
           >
      </div>
      <div x-show="$store.catalog.orte.length > 0"
           x-data="catalogFilter('ort')"
           x-modelable="value" x-model="$store.catalogUi.szenenFilters.ortId"
           x-effect="options = $store.catalog.orte.filter(o => $store.catalog.szenen.some(s => (s.ort_ids||[]).includes(o.id))).map(o => ({value: o.id, label: o.name}))"
           >
      </div>
      <span class="filter-count" x-text="szenenFiltered.length + ' / ' + $store.catalog.szenen.length"></span>
    </div>
    <!-- Stale-Szenen: Hinweis + Sammel-Löschen (Einzel-Löschen an der Zeile) -->
    <div x-show="staleCount > 0" class="szenen-stale-row">
      <span class="card-hint" :data-tip="$app.t('szenen.staleHint')" x-text="$app.t('szenen.staleSummary', { n: staleCount })"></span>
      <button type="button" class="btn-compact danger" :disabled="staleDeleting" @click="deleteAllStale()"
              x-text="$app.t('szenen.deleteAllStale')"></button>
    </div>
    <!-- Kompakte Szenen-Liste -->
    <div x-show="viewMode === 'list'" class="entity-list entity-list--accented">
      <template x-for="s in szenenFiltered" :key="s.id">
        <div>
          <div class="entity-row"
               :data-szeneid="s.id"
               :class="{ 'entity-row--selected': $store.catalogUi.selectedSzeneId === s.id, 'entity-row--stale': s.stale }"
               @click="$store.catalogUi.selectedSzeneId = $store.catalogUi.selectedSzeneId === s.id ? null : s.id">
            <span class="severity-tag"
                  :class="'severity-tag--' + wertungOf(s)"
                  x-text="$app.t('szenen.rating.' + wertungOf(s))"></span>
            <!-- Titel + Anriss des Kommentars (Begründung/Verbesserungshinweis); voll im Detail. -->
            <span class="szenen-row-main">
              <span class="entity-row-title" x-text="s.titel"></span>
              <span class="szenen-row-snippet" x-show="s.kommentar && $store.catalogUi.selectedSzeneId !== s.id" x-text="s.kommentar"></span>
            </span>
            <span x-show="s.stale" class="tag tag--stale" :data-tip="$app.t('szenen.staleHint')" x-text="$app.t('szenen.staleBadge')"></span>
            <button type="button" x-show="s.stale" class="icon-btn danger entity-row-delete"
                    @click.stop="deleteStale(s)"
                    :aria-label="$app.t('common.delete')" :data-tip="$app.t('entity.deleteStale')">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
            </button>
            <!-- Stelle ist primäre Info der Szene: bleibt auch mobil sichtbar. -->
            <span class="entity-refs">
              <template x-if="s.kapitel">
                <button type="button" class="entity-ref" x-entity-ref="{ type: 'kapitel', id: s.chapter_id, name: s.kapitel, label: kapitelLabel(s.chapter_id, s.kapitel) }"></button>
              </template>
              <template x-if="s.seite">
                <button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', id: s.page_id, name: s.seite, kapitel: s.kapitel }"></button>
              </template>
            </span>
            <span class="history-chevron" :class="{ open: $store.catalogUi.selectedSzeneId === s.id }" aria-hidden="true"></span>
          </div>
          <div x-show="$store.catalogUi.selectedSzeneId === s.id" class="entity-detail" x-cloak>
            <p x-show="s.kommentar" x-text="s.kommentar" class="entity-detail-text"></p>
            <button type="button" class="btn-compact entity-detail-actions" x-show="$store.config.semanticSearchEnabled" @click.stop="$app.findSimilar('scene', s.id, s.titel)" x-text="$app.t('search.semantic.similarEntity')"></button>
            <div x-show="(s.fig_ids || []).length > 0" class="entity-meta-row">
              <span class="entity-meta-label" x-text="$app.t('szenen.figuren')"></span>
              <span class="entity-refs">
                <template x-for="figId in (s.fig_ids || [])" :key="figId">
                  <button type="button" class="entity-ref" x-entity-ref="{ type: 'figur', id: figId }"></button>
                </template>
              </span>
            </div>
            <div x-show="(s.ort_ids || []).length > 0" class="entity-meta-row">
              <span class="entity-meta-label" x-text="$app.t('szenen.orte')"></span>
              <span class="entity-refs">
                <template x-for="ortId in (s.ort_ids || [])" :key="'o'+ortId">
                  <button type="button" class="entity-ref" x-entity-ref="{ type: 'ort', id: ortId }"></button>
                </template>
              </span>
            </div>
            <div x-data="{ beatOwnerId: s.id }"><!-- @include plot-backlinks --></div>
          </div>
        </div>
      </template>
    </div>

    <!-- @include szenen-grid -->
  </div>
</div>
