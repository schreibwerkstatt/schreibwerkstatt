<!-- Custom-PDF-Export — Profile + Editor + Trigger -->
<!--
  Alpine.data-Sub-Komponente — public/js/cards/pdf-export-card.js.
  Aufbau identisch zu Word/EPUB (export-shared.css): Header mit Scope-Picker +
  Export, Hint, einzeilige Profil-Leiste (Combobox + Icon-Aktionen), Anlege-
  Zeile, Tabs, Speichern-Footer unten. Tabs (Self-Publishing-Workflow):
  Format / Schrift / Kapitel / Kopf & Seitenzahlen / Titelei & Verzeichnis /
  Cover / Druck. Seitennummerierung + Kopf-/Fusszeile sind bewusst in einem
  Tab zentralisiert; PDF-Norm ist Teil des Druck-Tabs.
  Pattern-Konformität (DESIGN.md): Combobox statt <select>, .tabs / .tabs-btn,
  Standard-Buttons, .card-form-row, .collapsible-toggle + .history-chevron,
  .card-form-saved / .card-form-error.
-->
<div class="card card--pdfexport pdf-export-card" x-data="pdfExportCard" x-show="$app.showPdfExportCard" x-cloak
     @keydown="$editKeys($event, { save: () => !saving && saveActiveProfile() })">
  <div class="card-header">
    <span class="card-title" x-text="$app.t('pdfExport.title')"></span>
    <div class="card-actions">
      <div class="export-scope-picker" x-show="!exporting">
        <div x-data="combobox({ placeholder: $app.t('export.scope.label'), compact: false })"
             x-modelable="value" x-model="exportScope"
             x-effect="options = exportScopeOptions()"></div>
        <div x-show="exportScope === 'book' && exportSnapshots.length"
             x-data="combobox({ placeholder: $app.t('export.snapshot.label'), compact: false })"
             x-modelable="value" x-model="exportSnapshotId"
             x-effect="options = exportSnapshotOptions()"></div>
        <div x-show="exportScope === 'chapter'"
             x-data="combobox({ placeholder: $app.t('export.scope.pickChapter'), compact: false })"
             x-modelable="value" x-model="exportChapterId"
             x-effect="options = exportChapterOptions()"></div>
        <button type="button"
                class="kapitel-include-subs-btn"
                x-show="exportScope === 'chapter' && selectedChapterHasSubs()"
                @click="exportIncludeSubchapters = !exportIncludeSubchapters"
                :class="{ primary: exportIncludeSubchapters }"
                :aria-pressed="exportIncludeSubchapters"
                :data-tip="$app.t('pdfExport.includeSubchaptersTip')">
          <svg class="icon" aria-hidden="true">
            <use :href="exportIncludeSubchapters ? '/icons.svg#check' : '/icons.svg#chevron-down'"/>
          </svg>
          <span x-text="$app.t('pdfExport.includeSubchapters')"></span>
        </button>
        <div x-show="exportScope === 'page'"
             x-data="combobox({ placeholder: $app.t('export.scope.pickPage'), compact: false })"
             x-modelable="value" x-model="exportPageId"
             x-effect="options = exportPageOptions()"></div>
      </div>
      <button type="button"
              x-show="!exporting"
              :disabled="!$store.nav.selectedBookId || !activeProfile"
              :data-tip="!$store.nav.selectedBookId ? $app.t('pdfExport.export.noBookHint') : $app.t('pdfExport.sampleTip')"
              @click="exportSample()">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#scan"/></svg>
        <span x-text="$app.t('pdfExport.sample')"></span>
      </button>
      <button type="button"
              class="primary"
              x-show="!exporting"
              :disabled="!$store.nav.selectedBookId || !activeProfile"
              :data-tip="!$store.nav.selectedBookId ? $app.t('pdfExport.export.noBookHint') : ''"
              @click="exportPdf()">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#download"/></svg>
        <span x-text="$app.t('pdfExport.export')"></span>
      </button>
      <button type="button" data-label-ok
              x-show="exporting"
              @click="cancelExport()">
        <span class="spinner"></span>
        <span x-text="$app.t('pdfExport.cancel')"></span>
      </button>
    </div>
  </div>

  <p class="card-form-hint" x-text="$app.t('pdfExport.hint')"></p>

  <!-- Profil-Leiste (einzeilig): Auswahl-Combobox + Aktionen (neu/standard/löschen) -->
  <div x-id="['fld']" class="export-profile-bar">
    <label :id="$id('fld')" class="card-form-label card-form-label--inline" x-text="$app.t('pdfExport.profile')"></label>
    <div :aria-labelledby="$id('fld')" class="export-profile-pick"
         x-data="combobox({ placeholder: $app.t('pdfExport.profile'), compact: false })"
         x-modelable="value" x-model="activeProfileId"
         x-effect="options = profiles.map(p => ({ value: p.id, label: p.name + (p.is_default ? ' ★' : '') }))"
         @combobox-change="onProfilePick($event.detail)"></div>
    <button type="button" class="export-profile-btn" :data-tip="$app.t('pdfExport.newProfile')" :aria-label="$app.t('pdfExport.newProfile')"
            @click="toggleProfileRow('create')">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
    </button>
    <button type="button" class="export-profile-btn" :data-tip="$app.t('pdfExport.templateProfile')" :aria-label="$app.t('pdfExport.templateProfile')"
            @click="toggleProfileRow('template')">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#book-open"/></svg>
    </button>
    <button type="button" class="export-profile-btn" x-show="activeProfile"
            :data-tip="$app.t('pdfExport.renameProfile')" :aria-label="$app.t('pdfExport.renameProfile')" @click="beginRename()">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#pencil"/></svg>
    </button>
    <button type="button" class="export-profile-btn" x-show="activeProfile"
            :data-tip="$app.t('pdfExport.duplicateProfile')" :aria-label="$app.t('pdfExport.duplicateProfile')" @click="withDirtyGuard(() => duplicateProfile())">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#copy"/></svg>
    </button>
    <button type="button" class="export-profile-btn" x-show="activeProfile && !activeProfile.is_default"
            :data-tip="$app.t('pdfExport.makeDefault')" :aria-label="$app.t('pdfExport.makeDefault')" @click="setDefault(activeProfileId)">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#check"/></svg>
    </button>
    <button type="button" class="export-profile-btn" x-show="activeProfile"
            :data-tip="$app.t('pdfExport.exportProfile')" :aria-label="$app.t('pdfExport.exportProfile')" @click="exportProfileConfig()">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#download"/></svg>
    </button>
    <button type="button" class="export-profile-btn"
            :data-tip="$app.t('pdfExport.importProfile')" :aria-label="$app.t('pdfExport.importProfile')" @click="$refs.importInput.click()">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#file-plus"/></svg>
    </button>
    <input type="file" hidden x-ref="importInput" accept="application/json,.json"
           @change="const f = $event.target.files[0]; $event.target.value = ''; withDirtyGuard(() => importProfileConfig(f))">
    <button type="button" class="export-profile-btn" x-show="profiles.length > 1"
            :data-tip="$app.t('pdfExport.deleteProfile')" :aria-label="$app.t('pdfExport.deleteProfile')" @click="deleteProfile(activeProfileId)">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
    </button>
  </div>

  <!-- Profil umbenennen (eingeklappt) -->
  <div class="export-create-row export-rename-row" x-show="_profileRow === 'rename'" x-cloak>
    <input type="text" class="card-form-input" x-model="renameValue"
           :placeholder="$app.t('pdfExport.renamePlaceholder')" maxlength="80"
           @keydown.enter="$enter($event, () => renameProfile())" data-spellcheck="spelling">
    <button type="button" class="primary" data-label-ok
            :disabled="!renameValue.trim()" @click="renameProfile()"
            x-text="$app.t('common.save')"></button>
  </div>

  <!-- Gestaltungs-Vorlage übernehmen (eingeklappt). Legt ein NEUES Profil an;
       das aktive bleibt unberührt. -->
  <div class="export-template-row" x-show="_profileRow === 'template'" x-cloak>
    <div class="export-create-row">
      <div class="export-template-pick"
           x-data="combobox({ placeholder: $app.t('pdfExport.templatePlaceholder'), compact: false })"
           x-modelable="value" x-model="templateSel"
           x-effect="options = templateOptions()"></div>
      <button type="button" class="primary" data-label-ok
              :disabled="creating || !templateSel"
              @click="applyTemplate()"
              x-text="$app.t('pdfExport.templateApply')"></button>
    </div>
    <p class="card-form-field-note" x-show="templateSel" x-text="templateDescription()"></p>
    <p class="card-form-field-note" x-show="!templateSel" x-text="$app.t('pdfExport.templateHint')"></p>
  </div>

  <!-- Neues Profil anlegen (eingeklappt) -->
  <div class="export-create-row" x-show="_profileRow === 'create'" x-cloak>
    <input type="text" class="card-form-input" x-model="newProfileName"
           :placeholder="$app.t('pdfExport.newPlaceholder')" maxlength="80"
           @keydown.enter="$enter($event, () => createProfile())" data-spellcheck="spelling">
    <label class="export-create-clone">
      <span class="export-create-clone-label" x-text="$app.t('pdfExport.cloneLabel')"></span>
      <div x-data="combobox({ placeholder: $app.t('pdfExport.cloneNone'), compact: false })"
           x-modelable="value" x-model="cloneFromId"
           x-effect="options = [{ value: '', label: $app.t('pdfExport.cloneNone') }, ...profiles.map(p => ({ value: p.id, label: p.name }))]"
></div>
    </label>
    <button type="button" class="primary" data-label-ok
            :disabled="creating || !newProfileName.trim()"
            @click="createProfile()"
            x-text="$app.t('pdfExport.create')"></button>
  </div>

  <template x-if="_formMounted && activeProfile">
    <div x-data="tabs(['layout','font','chapter','pagination','frontmatter','apparat','cover','print'])"
         x-modelable="value" x-model="activeTab">
      <!-- Einfach/Experte (DESIGN.md .seg-toggle) + Ungespeichert-Marke -->
      <div class="pdfx-mode-bar">
        <span class="card-form-label card-form-label--inline" x-text="$app.t('pdfExport.mode.label')"></span>
        <div class="seg-toggle" role="group" :aria-label="$app.t('pdfExport.mode.label')">
          <button type="button" :class="{ 'seg-toggle--active': uiMode === 'simple' }" :aria-pressed="uiMode === 'simple'"
                  @click="setUiMode('simple')" x-text="$app.t('pdfExport.mode.simple')"></button>
          <button type="button" :class="{ 'seg-toggle--active': uiMode === 'expert' }" :aria-pressed="uiMode === 'expert'"
                  @click="setUiMode('expert')" x-text="$app.t('pdfExport.mode.expert')"></button>
        </div>
        <span class="pdfx-dirty-mark" x-show="isDirty()" x-cloak role="status" x-text="$app.t('pdfExport.dirty.indicator')"></span>
      </div>
      <p class="card-form-field-note" x-show="uiMode === 'simple'" x-text="$app.t('pdfExport.mode.simpleHint')"></p>
      <!-- Tabs (DESIGN.md .tabs / Alpine.data('tabs')) -->
      <div class="tabs tabs--scrollable export-tabs" x-bind="tablist">
        <template x-for="tab in tabs" :key="tab">
          <button class="tabs-btn"
                  x-show="tabVisible(tab)"
                  x-bind="tabBtn(tab)"
                  x-text="$app.t('pdfExport.tab.' + tab)"></button>
        </template>
      </div>

      <!-- @include pdf-export-layout -->
      <!-- @include pdf-export-font -->
      <!-- @include pdf-export-chapter -->
      <!-- @include pdf-export-pagination -->
      <!-- @include pdf-export-frontmatter -->
      <!-- @include pdf-export-apparat -->
      <!-- @include pdf-export-cover -->
      <!-- @include pdf-export-print -->

      <!-- @include pdf-export-status -->
    </div>
  </template>
</div>
