<!-- Referenz-Slot (read-only Begleitpanel neben dem Notebook-Editor).
     Alpine.data-Sub-Komponente — public/js/cards/reference-card.js.
     Sichtbarkeit am Root (asideSlot === 'reference', abgeleitet showReferenceCard);
     fachlicher State in der Sub. Teilt die Leiste neben dem Editor mit Seiten-
     Chat + Ideen (layout/aside-split.css). Nie schreibend. -->
<div class="card card--reference aside-split-aside" id="reference-card" x-data="referenceCard" x-show="$app.showReferenceCard" x-cloak>
  <div class="card-header">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="referenceScope === 'page' && referenceHasContext() ? ($app.currentPage?.name || '') : $app.t('reference.wholeBook')"></span>
      <span class="card-title" x-text="$app.t('reference.title')"></span>
    </div>
    <div class="card-actions">
      <button type="button" class="icon-btn icon-btn--ghost"
              :class="{ 'is-active': referenceScope === 'book' }"
              @click="toggleReferenceScope()"
              :data-tip="referenceScope === 'page' ? $app.t('reference.scope.toBook') : $app.t('reference.scope.toContext')"
              :aria-label="referenceScope === 'page' ? $app.t('reference.scope.toBook') : $app.t('reference.scope.toContext')">
        <svg class="icon" aria-hidden="true"><use :href="'/icons.svg#' + (referenceScope === 'book' ? 'book-open' : 'scroll')"/></svg>
      </button>
    </div>
    <button type="button" class="btn-card-close" @click="$app.toggleReferenceCard()" :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
  </div>

  <!-- Der Eyebrow nennt den Abschnitt bzw. «Ganzes Buch»; der Hinweis sagt,
       was der Kontext umfasst (Abschnitt + Kapitel), statt den Namen zu wiederholen. -->
  <div class="card-hint card-hint--sm card-section" x-text="referenceScope === 'page'
        ? (referenceHasContext()
            ? (_currentChapterName() ? $app.t('reference.scope.contextNote', { chapter: _currentChapterName() }) : $app.t('reference.scope.contextNoteSolo'))
            : $app.t('reference.scope.noContext'))
        : $app.t('reference.scope.bookNote')"></div>

  <!-- Tabs (DESIGN.md .tabs / Alpine.data('tabs')). Nur der Tablist im tabs-
       Scope; die Panels lesen referenceTab direkt aus der Karte. -->
  <div class="card-section" x-data="tabs(referenceTabs())"
       x-modelable="value" x-model="referenceTab">
    <div class="tabs tabs--scrollable" x-bind="tablist">
      <button class="tabs-btn" x-bind="tabBtn('plan')" x-show="referenceTabVisible('plan')">
        <span x-text="$app.t('reference.tab.plan')"></span>
        <span class="reference-tab-count" x-show="referenceCount('plan') > 0" x-text="referenceCount('plan')"></span>
      </button>
      <button class="tabs-btn" x-bind="tabBtn('figuren')">
        <span x-text="$app.t('reference.tab.figuren')"></span>
        <span class="reference-tab-count" x-show="referenceCount('figuren') > 0" x-text="referenceCount('figuren')"></span>
      </button>
      <button class="tabs-btn" x-bind="tabBtn('orte')">
        <span x-text="$app.t('reference.tab.orte')"></span>
        <span class="reference-tab-count" x-show="referenceCount('orte') > 0" x-text="referenceCount('orte')"></span>
      </button>
      <button class="tabs-btn" x-bind="tabBtn('szenen')">
        <span x-text="$app.t('reference.tab.szenen')"></span>
        <span class="reference-tab-count" x-show="referenceCount('szenen') > 0" x-text="referenceCount('szenen')"></span>
      </button>
      <button class="tabs-btn" x-bind="tabBtn('ereignisse')">
        <span x-text="$app.t('reference.tab.ereignisse')"></span>
        <span class="reference-tab-count" x-show="referenceCount('ereignisse') > 0" x-text="referenceCount('ereignisse')"></span>
      </button>
      <button class="tabs-btn" x-bind="tabBtn('recherche')">
        <span x-text="$app.t('reference.tab.recherche')"></span>
        <span class="reference-tab-count" x-show="referenceCount('recherche') > 0" x-text="referenceCount('recherche')"></span>
      </button>
      <button class="tabs-btn" x-bind="tabBtn('quellen')" x-show="referenceTabVisible('quellen')">
        <span x-text="$app.t('reference.tab.quellen')"></span>
        <span class="reference-tab-count" x-show="referenceCount('quellen') > 0" x-text="referenceCount('quellen')"></span>
      </button>
      <button class="tabs-btn" x-bind="tabBtn('verwandt')" x-show="referenceTabVisible('verwandt')">
        <span x-text="$app.t('reference.tab.verwandt')"></span>
        <span class="reference-tab-count" x-show="referenceCount('verwandt') > 0" x-text="referenceCount('verwandt')"></span>
      </button>
    </div>
  </div>

  <div class="reference-body aside-split-scroll">
    <!-- @include reference-plan -->

    <!-- Figuren -->
    <div x-show="referenceTab === 'figuren'" class="reference-panel">
      <template x-if="referenceFiguren().length === 0">
        <div class="muted-msg muted-msg--sm muted-msg--block" x-text="$app.t('reference.empty.figuren')"></div>
      </template>
      <template x-for="fig in referenceFiguren()" :key="'rf-' + (fig.id ?? fig.name)">
        <div class="reference-row">
          <div class="reference-row-head">
            <span class="reference-row-title" x-text="fig.name"></span>
            <span x-show="fig.typ" class="tag" x-text="$app.t('figuren.type.' + fig.typ)"></span>
            <span x-show="$app.figurJahrLabel(fig)" class="tag" :data-tip="$app.t('figuren.jahrAlterTip')" x-text="$app.figurJahrLabel(fig)"></span>
            <span x-show="fig.geburtstag" class="tag" :data-tip="$app.t('figuren.birthYearTip')" x-text="$app.t('figuren.birthYear', { jahr: fig.geburtstag })"></span>
            <span x-show="fig.refCtx === 'chapter'" class="tag" :data-tip="$app.t('reference.ctx.chapterTip')" x-text="$app.t('reference.ctx.chapter')"></span>
          </div>
          <div class="reference-row-sub" x-show="fig.rolle" x-text="fig.rolle"></div>
          <div class="reference-row-desc" x-show="fig.beschreibung" x-text="fig.beschreibung"></div>
        </div>
      </template>
    </div>

    <!-- Orte -->
    <div x-show="referenceTab === 'orte'" class="reference-panel">
      <template x-if="referenceOrte().length === 0">
        <div class="muted-msg muted-msg--sm muted-msg--block" x-text="$app.t('reference.empty.orte')"></div>
      </template>
      <template x-for="ort in referenceOrte()" :key="'ro-' + (ort.id ?? ort.name)">
        <div class="reference-row">
          <div class="reference-row-head">
            <span class="reference-row-title" x-text="ort.name"></span>
            <span x-show="ort.refCtx === 'chapter'" class="tag" :data-tip="$app.t('reference.ctx.chapterTip')" x-text="$app.t('reference.ctx.chapter')"></span>
          </div>
          <div class="reference-row-desc" x-show="ort.beschreibung" x-text="ort.beschreibung"></div>
        </div>
      </template>
    </div>

    <!-- Szenen -->
    <div x-show="referenceTab === 'szenen'" class="reference-panel">
      <template x-if="referenceSzenen().length === 0">
        <div class="muted-msg muted-msg--sm muted-msg--block" x-text="$app.t('reference.empty.szenen')"></div>
      </template>
      <template x-for="s in referenceSzenen()" :key="'rs-' + s.id">
        <div class="reference-row">
          <div class="reference-row-head">
            <span class="reference-row-title" x-text="s.titel || $app.t('entities.scene')"></span>
            <span x-show="s.wertung" class="tag" :class="'badge--wertung-' + s.wertung" x-text="s.wertung"></span>
            <span x-show="s.refCtx === 'chapter'" class="tag" :data-tip="$app.t('reference.ctx.chapterTip')" x-text="$app.t('reference.ctx.chapter')"></span>
          </div>
          <div class="reference-row-desc" x-show="s.zusammenfassung || s.beschreibung" x-text="s.zusammenfassung || s.beschreibung"></div>
          <div class="reference-row-sub reference-row-refs" x-show="referenceRowPageIds(s).length">
            <span x-text="$app.t('reference.ctx.onPages')"></span>
            <span class="entity-refs">
              <template x-for="pid in referenceRowPageIds(s)" :key="'pg-' + pid">
                <button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', id: pid }"></button>
              </template>
            </span>
          </div>
        </div>
      </template>
    </div>

    <!-- Ereignisse (konsolidierte Chronologie) -->
    <div x-show="referenceTab === 'ereignisse'" class="reference-panel">
      <template x-if="referenceEreignisse().length === 0">
        <div class="muted-msg muted-msg--sm muted-msg--block" x-text="$app.t('reference.empty.ereignisse')"></div>
      </template>
      <template x-for="(ev, ei) in referenceEreignisse()" :key="'re-' + (ev.id ?? ei)">
        <div class="reference-row">
          <div class="reference-row-head">
            <span class="reference-row-title" x-text="ev.ereignis"></span>
            <span x-show="referenceEventDate(ev)" class="tag" x-text="referenceEventDate(ev)"></span>
            <span x-show="ev.refCtx === 'chapter'" class="tag" :data-tip="$app.t('reference.ctx.chapterTip')" x-text="$app.t('reference.ctx.chapter')"></span>
          </div>
          <!-- Kapitel als Anzeige-Referenz (static): ein Sprung in die
               Kapitelbewertung schlösse den Editor, neben dem der Slot steht. -->
          <div class="reference-row-sub reference-row-refs" x-show="referenceEventChapters(ev).length">
            <span class="entity-refs">
              <template x-for="(k, ki) in referenceEventChapters(ev)" :key="'k-' + ki">
                <span class="entity-ref" x-entity-ref="{ ...k, static: true }"></span>
              </template>
            </span>
          </div>
          <div class="reference-row-sub reference-row-refs" x-show="referenceRowPageIds(ev).length">
            <span x-text="$app.t('reference.ctx.onPages')"></span>
            <span class="entity-refs">
              <template x-for="pid in referenceRowPageIds(ev)" :key="'pg-' + pid">
                <button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', id: pid }"></button>
              </template>
            </span>
          </div>
        </div>
      </template>
    </div>

    <!-- Recherche -->
    <div x-show="referenceTab === 'recherche'" class="reference-panel">
      <div x-show="referenceRechercheLoading" class="card-status" x-text="$app.t('reference.loading')"></div>
      <div class="search-status search-status--error" x-show="referenceRechercheError && !referenceRechercheLoading"
           x-text="referenceRechercheError"></div>
      <template x-if="!referenceRechercheLoading && !referenceRechercheError && referenceRechercheItems().length === 0">
        <div class="muted-msg muted-msg--sm muted-msg--block" x-text="$app.t('reference.empty.recherche')"></div>
      </template>
      <template x-for="item in referenceRechercheItems()" :key="'rr-' + item.id">
        <div class="reference-row-group">
          <div class="reference-row reference-row--clickable internal-link"
               @click="refIsTranscript(item) ? refIvToggle(item.id) : openRechercheItem(item)"
               :data-tip="refIsTranscript(item) ? $app.t('interview.openTip') : $app.t('reference.recherche.openTip')">
            <div class="reference-row-head">
              <span class="history-chevron" x-show="refIsTranscript(item)"
                    :class="{ open: refIvOpenId === item.id }" aria-hidden="true"></span>
              <span class="reference-row-title" x-text="referenceRechercheText(item)"></span>
              <span class="tag" x-text="referenceRechercheKind(item)"></span>
              <span x-show="item.refCtx === 'chapter'" class="tag" :data-tip="$app.t('reference.ctx.chapterTip')" x-text="$app.t('reference.ctx.chapter')"></span>
            </div>
            <div class="reference-row-desc" x-show="item.title && item.body" x-text="item.body"></div>
            <div class="reference-row-sub" x-show="item.source" x-text="item.source"></div>
          </div>

          <!-- @include reference-oton -->
        </div>
      </template>
    </div>

    <!-- Quellen: welche Quellen sind hier belegt (Seite/Kapitel bzw. ganzes Buch).
         Der Fund-Index ist die Ableitung der Quellennachweise im Seiten-HTML;
         gepflegt wird die Quelle im Quellenverzeichnis — dorthin verlinkt jede
         Zeile. Read-only. -->
    <div x-show="referenceTab === 'quellen'" class="reference-panel">
      <div x-show="referenceSourcesLoading" class="card-status" x-text="$app.t('reference.loading')"></div>
      <div class="search-status search-status--error" x-show="referenceSourcesError && !referenceSourcesLoading"
           x-text="referenceSourcesError"></div>
      <template x-if="!referenceSourcesLoading && !referenceSourcesError && referenceQuellen().length === 0">
        <div class="muted-msg muted-msg--sm muted-msg--block" x-text="$app.t('reference.empty.quellen')"></div>
      </template>
      <template x-for="row in referenceQuellen()" :key="'rq-' + row.source.id">
        <div class="reference-row reference-row--clickable internal-link" @click="openReferenceSource(row)"
             :data-tip="$app.t('reference.quellen.openTip')">
          <div class="reference-row-head">
            <span class="reference-row-title" x-text="referenceQuelleTitle(row)"></span>
            <span class="tag" x-text="referenceQuelleCount(row)"></span>
            <span x-show="row.refCtx === 'chapter'" class="tag" :data-tip="$app.t('reference.ctx.chapterTip')" x-text="$app.t('reference.ctx.chapter')"></span>
          </div>
          <div class="reference-row-sub" x-show="referenceQuelleMeta(row)" x-text="referenceQuelleMeta(row)"></div>
          <div class="reference-row-sub reference-row-refs" x-show="referenceQuellePages(row).length">
            <span x-text="$app.t('reference.quellen.citedIn')"></span>
            <span class="entity-refs">
              <template x-for="pid in referenceQuellePages(row)" :key="'qp-' + pid">
                <button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', id: pid }"></button>
              </template>
            </span>
            <span x-show="referenceQuelleMore(row)" x-text="referenceQuelleMore(row)"></span>
          </div>
        </div>
      </template>
    </div>

    <!-- @include reference-verwandt -->
  </div>
</div>
