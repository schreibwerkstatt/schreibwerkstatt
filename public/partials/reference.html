<!-- Referenz-Slot (read-only Begleitpanel neben dem Notebook-Editor).
     Alpine.data-Sub-Komponente — public/js/cards/reference-card.js.
     Sichtbarkeit am Root (asideSlot === 'reference', abgeleitet showReferenceCard);
     fachlicher State in der Sub. Teilt die Leiste neben dem Editor mit Seiten-
     Chat + Ideen (layout/aside-split.css). Nie schreibend. -->
<div class="card card--reference aside-split-aside" id="reference-card" x-data="referenceCard" x-show="$app.showReferenceCard" x-cloak>
  <div class="card-header">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="referenceScope === 'page' && referenceHasContext() ? ($app.currentPage?.name || '') : $app.t('reference.wholeBook')"></span>
      <span class="card-title" x-text="$app.t('reference.title')"></span>
    </div>
    <div class="card-actions">
      <button type="button" class="icon-btn icon-btn--ghost"
              :class="{ 'is-active': referenceScope === 'book' }"
              @click="toggleReferenceScope()"
              :data-tip="referenceScope === 'page' ? $app.t('reference.scope.toBook') : $app.t('reference.scope.toContext')"
              :aria-label="referenceScope === 'page' ? $app.t('reference.scope.toBook') : $app.t('reference.scope.toContext')">
        <svg class="icon" aria-hidden="true"><use :href="'/icons.svg#' + (referenceScope === 'book' ? 'book-open' : 'scroll')"/></svg>
      </button>
    </div>
    <button type="button" class="btn-card-close" @click="$app.toggleReferenceCard()" :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
  </div>

  <!-- Der Eyebrow nennt den Abschnitt bzw. «Ganzes Buch»; der Hinweis sagt,
       was der Kontext umfasst (Abschnitt + Kapitel), statt den Namen zu wiederholen. -->
  <div class="card-hint card-hint--sm card-section" x-text="referenceScope === 'page'
        ? (referenceHasContext()
            ? (_currentChapterName() ? $app.t('reference.scope.contextNote', { chapter: _currentChapterName() }) : $app.t('reference.scope.contextNoteSolo'))
            : $app.t('reference.scope.noContext'))
        : $app.t('reference.scope.bookNote')"></div>

  <!-- Tabs (DESIGN.md .tabs / Alpine.data('tabs')). Nur der Tablist im tabs-
       Scope; die Panels lesen referenceTab direkt aus der Karte. -->
  <div class="card-section" x-data="tabs(referenceTabs())"
       x-modelable="value" x-model="referenceTab">
    <div class="tabs tabs--scrollable" x-bind="tablist">
      <button class="tabs-btn" x-bind="tabBtn('plan')" x-show="referenceTabVisible('plan')">
        <span x-text="$app.t('reference.tab.plan')"></span>
        <span class="tabs-btn-count" x-show="referenceCount('plan') > 0" x-text="referenceCount('plan')"></span>
      </button>
      <button class="tabs-btn" x-bind="tabBtn('figuren')">
        <span x-text="$app.t('reference.tab.figuren')"></span>
        <span class="tabs-btn-count" x-show="referenceCount('figuren') > 0" x-text="referenceCount('figuren')"></span>
      </button>
      <button class="tabs-btn" x-bind="tabBtn('orte')">
        <span x-text="$app.t('reference.tab.orte')"></span>
        <span class="tabs-btn-count" x-show="referenceCount('orte') > 0" x-text="referenceCount('orte')"></span>
      </button>
      <button class="tabs-btn" x-bind="tabBtn('szenen')">
        <span x-text="$app.t('reference.tab.szenen')"></span>
        <span class="tabs-btn-count" x-show="referenceCount('szenen') > 0" x-text="referenceCount('szenen')"></span>
      </button>
      <button class="tabs-btn" x-bind="tabBtn('ereignisse')">
        <span x-text="$app.t('reference.tab.ereignisse')"></span>
        <span class="tabs-btn-count" x-show="referenceCount('ereignisse') > 0" x-text="referenceCount('ereignisse')"></span>
      </button>
      <button class="tabs-btn" x-bind="tabBtn('weltfakten')">
        <span x-text="$app.t('reference.tab.weltfakten')"></span>
        <span class="tabs-btn-count" x-show="referenceCount('weltfakten') > 0" x-text="referenceCount('weltfakten')"></span>
      </button>
      <button class="tabs-btn" x-bind="tabBtn('recherche')">
        <span x-text="$app.t('reference.tab.recherche')"></span>
        <span class="tabs-btn-count" x-show="referenceCount('recherche') > 0" x-text="referenceCount('recherche')"></span>
      </button>
      <button class="tabs-btn" x-bind="tabBtn('quellen')" x-show="referenceTabVisible('quellen')">
        <span x-text="$app.t('reference.tab.quellen')"></span>
        <span class="tabs-btn-count" x-show="referenceCount('quellen') > 0" x-text="referenceCount('quellen')"></span>
      </button>
      <button class="tabs-btn" x-bind="tabBtn('verwandt')" x-show="referenceTabVisible('verwandt')">
        <span x-text="$app.t('reference.tab.verwandt')"></span>
        <span class="tabs-btn-count" x-show="referenceCount('verwandt') > 0" x-text="referenceCount('verwandt')"></span>
      </button>
    </div>
  </div>

  <!-- Jeder Reiter hängt an `x-if`, nicht `x-show`: nur der aktive steht im DOM.
       Mit `x-show` baute ein Scope-Wechsel alle Reiter neu (grosses Buch: ~22K
       Knoten). Die Zähler der Reiterleiste rechnen aus den Daten, nicht aus dem DOM. -->
  <div class="reference-body aside-split-scroll">
    <!-- @include reference-plan -->

    <!-- Figuren -->
    <template x-if="referenceTab === 'figuren'">
    <div class="reference-panel" x-data="{ rowKind: 'figur' }">
      <template x-if="referenceFiguren().length === 0">
        <div class="muted-msg muted-msg--sm muted-msg--block" x-text="$app.t('reference.empty.figuren')"></div>
      </template>
      <template x-for="row in listWindowed(referenceFiguren(), 'figuren')" :key="'rf-' + (row.id ?? row.name)">
        <div class="reference-row reference-row--clickable internal-link" @click="openReferenceEntity('figur', row.id)" data-ref-jump
             :data-tip="$app.t('reference.figuren.openTip')">
          <div class="reference-row-head">
            <span class="figur-typ-dot" :class="'figur-typ-dot--' + (row.typ || 'unknown')"></span>
            <span class="reference-row-title" x-text="row.name"></span>
            <span x-show="row.typ" class="tag" x-text="$app.t('figuren.type.' + row.typ)"></span>
            <span x-show="$app.figurJahrLabel(row)" class="tag" :data-tip="$app.figurJahrTip(row)" x-text="$app.figurJahrLabel(row)"></span>
            <span x-show="row.geburtstag" class="tag" :data-tip="$app.t('figuren.birthYearTip')" x-text="$app.t('figuren.birthYear', { jahr: row.geburtstag })"></span>
            <span x-show="row.refCtx === 'chapter'" class="tag" :data-tip="$app.t('reference.ctx.chapterTip')" x-text="$app.t('reference.ctx.chapter')"></span>
          </div>
          <div class="reference-row-sub" x-show="row.rolle" x-text="row.rolle"></div>
          <div class="reference-row-desc" x-show="row.beschreibung" x-text="row.beschreibung"></div>
          <!-- @include reference-row-tail -->
        </div>
      </template>
      <button type="button" class="btn-compact list-window-more"
              x-show="listWindowRest(referenceFiguren(), 'figuren') > 0" x-cloak
              x-list-more="listWindowMore('figuren')" @click="listWindowMore('figuren')"
              x-text="$app.t('common.showMore', { n: listWindowRest(referenceFiguren(), 'figuren') })"></button>
    </div>
    </template>

    <!-- Orte -->
    <template x-if="referenceTab === 'orte'">
    <div class="reference-panel" x-data="{ rowKind: 'ort' }">
      <template x-if="referenceOrte().length === 0">
        <div class="muted-msg muted-msg--sm muted-msg--block" x-text="$app.t('reference.empty.orte')"></div>
      </template>
      <template x-for="row in listWindowed(referenceOrte(), 'orte')" :key="'ro-' + (row.id ?? row.name)">
        <div class="reference-row reference-row--clickable internal-link" @click="openReferenceEntity('ort', row.id)" data-ref-jump
             :data-tip="$app.t('reference.orte.openTip')">
          <div class="reference-row-head">
            <span class="reference-row-title" x-text="row.name"></span>
            <span x-show="row.typ" class="tag" x-text="referenceOrtTyp(row)"></span>
            <span x-show="row.refCtx === 'chapter'" class="tag" :data-tip="$app.t('reference.ctx.chapterTip')" x-text="$app.t('reference.ctx.chapter')"></span>
          </div>
          <div class="reference-row-sub" x-show="referenceOrtMeta(row)" x-text="referenceOrtMeta(row)"></div>
          <div class="reference-row-desc" x-show="row.beschreibung" x-text="row.beschreibung"></div>
          <!-- @include reference-row-tail -->
        </div>
      </template>
      <button type="button" class="btn-compact list-window-more"
              x-show="listWindowRest(referenceOrte(), 'orte') > 0" x-cloak
              x-list-more="listWindowMore('orte')" @click="listWindowMore('orte')"
              x-text="$app.t('common.showMore', { n: listWindowRest(referenceOrte(), 'orte') })"></button>
    </div>
    </template>

    <!-- Szenen -->
    <template x-if="referenceTab === 'szenen'">
    <div class="reference-panel" x-data="{ rowKind: 'szene' }">
      <template x-if="referenceSzenen().length === 0">
        <div class="muted-msg muted-msg--sm muted-msg--block" x-text="$app.t('reference.empty.szenen')"></div>
      </template>
      <template x-for="row in listWindowed(referenceSzenen(), 'szenen')" :key="'rs-' + row.id">
        <div class="reference-row reference-row--clickable internal-link" @click="openReferenceEntity('szene', row.id)" data-ref-jump
             :data-tip="$app.t('reference.szenen.openTip')">
          <div class="reference-row-head">
            <span class="reference-row-title" x-text="row.titel || $app.t('entities.scene')"></span>
            <span x-show="row.wertung" class="tag" :class="'badge--wertung-' + row.wertung" x-text="row.wertung"></span>
            <span x-show="row.refCtx === 'chapter'" class="tag" :data-tip="$app.t('reference.ctx.chapterTip')" x-text="$app.t('reference.ctx.chapter')"></span>
          </div>
          <div class="reference-row-desc" x-show="row.zusammenfassung || row.beschreibung" x-text="row.zusammenfassung || row.beschreibung"></div>
          <!-- @include reference-row-tail -->
        </div>
      </template>
      <button type="button" class="btn-compact list-window-more"
              x-show="listWindowRest(referenceSzenen(), 'szenen') > 0" x-cloak
              x-list-more="listWindowMore('szenen')" @click="listWindowMore('szenen')"
              x-text="$app.t('common.showMore', { n: listWindowRest(referenceSzenen(), 'szenen') })"></button>
    </div>
    </template>

    <!-- @include reference-ereignisse -->

    <!-- @include reference-weltfakten -->

    <!-- Recherche -->
    <template x-if="referenceTab === 'recherche'">
    <div class="reference-panel" x-data="{ rowKind: 'recherche' }">
      <div x-show="referenceRechercheLoading" x-skeleton="4" x-cloak></div>
      <div class="search-status search-status--error" x-show="referenceRechercheError && !referenceRechercheLoading"
           x-text="referenceRechercheError"></div>
      <template x-if="!referenceRechercheLoading && !referenceRechercheError && referenceRechercheItems().length === 0">
        <div class="muted-msg muted-msg--sm muted-msg--block" x-text="$app.t('reference.empty.recherche')"></div>
      </template>
      <template x-for="row in referenceRechercheItems()" :key="'rr-' + row.id">
        <div class="reference-row-group">
          <div class="reference-row reference-row--clickable internal-link"
               @click="refIsTranscript(row) ? refIvToggle(row.id) : openRechercheItem(row)"
               :data-ref-jump="!refIsTranscript(row)"
               :data-tip="refIsTranscript(row) ? $app.t('interview.openTip') : $app.t('reference.recherche.openTip')">
            <div class="reference-row-head">
              <span class="history-chevron" x-show="refIsTranscript(row)"
                    :class="{ open: refIvOpenId === row.id }" aria-hidden="true"></span>
              <span class="reference-row-title" x-text="referenceRechercheText(row)"></span>
              <span class="tag" x-text="referenceRechercheKind(row)"></span>
              <span x-show="row.refCtx === 'chapter'" class="tag" :data-tip="$app.t('reference.ctx.chapterTip')" x-text="$app.t('reference.ctx.chapter')"></span>
            </div>
            <div class="reference-row-sub" x-show="row.source" x-text="row.source"></div>
            <div class="reference-row-desc" x-show="row.title && row.body" x-text="row.body"></div>
            <!-- @include reference-row-tail -->
          </div>

          <!-- @include reference-oton -->
        </div>
      </template>
    </div>
    </template>

    <!-- Quellen: welche Quellen sind hier belegt (Seite/Kapitel bzw. ganzes Buch).
         Der Fund-Index ist die Ableitung der Quellennachweise im Seiten-HTML;
         gepflegt wird die Quelle im Quellenverzeichnis — dorthin verlinkt jede
         Zeile. Read-only. -->
    <template x-if="referenceTab === 'quellen'">
    <div class="reference-panel">
      <div x-show="referenceSourcesLoading" x-skeleton="4" x-cloak></div>
      <div class="search-status search-status--error" x-show="referenceSourcesError && !referenceSourcesLoading"
           x-text="referenceSourcesError"></div>
      <template x-if="!referenceSourcesLoading && !referenceSourcesError && referenceQuellen().length === 0">
        <div class="muted-msg muted-msg--sm muted-msg--block" x-text="$app.t('reference.empty.quellen')"></div>
      </template>
      <template x-for="row in referenceQuellen()" :key="'rq-' + row.source.id">
        <div class="reference-row reference-row--clickable internal-link" @click="openReferenceSource(row)" data-ref-jump
             :data-tip="$app.t('reference.quellen.openTip')">
          <div class="reference-row-head">
            <span class="reference-row-title" x-text="referenceQuelleTitle(row)"></span>
            <span class="tag" x-text="referenceQuelleCount(row)"></span>
            <span x-show="row.refCtx === 'chapter'" class="tag" :data-tip="$app.t('reference.ctx.chapterTip')" x-text="$app.t('reference.ctx.chapter')"></span>
          </div>
          <div class="reference-row-sub" x-show="referenceQuelleMeta(row)" x-text="referenceQuelleMeta(row)"></div>
          <div class="reference-row-sub reference-row-refs" x-show="referenceQuellePages(row).length">
            <span x-text="$app.t('reference.quellen.citedIn')"></span>
            <span class="entity-refs">
              <template x-for="pid in referenceQuellePages(row)" :key="'qp-' + pid">
                <button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', id: pid }"></button>
              </template>
            </span>
            <span x-show="referenceQuelleMore(row)" x-text="referenceQuelleMore(row)"></span>
          </div>
        </div>
      </template>
    </div>
    </template>

    <!-- @include reference-verwandt -->
  </div>
</div>
