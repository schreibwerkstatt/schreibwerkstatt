<!-- Motiv-Werkstatt: Seitenpanel (nested via <div id="partial-motiv-panel">, motivCard-Scope).
     Ohne Auswahl: Themen-Liste. Mit Auswahl: Editor (Name/Thema/Beschreibung/Trigger) +
     Fundstellen (Ist) + Soll-Verknüpfungen + Motiv↔Motiv-Beziehungen. Cmd/Ctrl+S / Escape
     panel-weit via onPanelKeydown am Karten-Root (motiv.html). -->
<aside class="motiv-panel">
  <!-- Ohne Auswahl: Themen-Liste + Hinweis -->
  <template x-if="!selectedMotif() && !selectedTheme()">
    <div>
      <p class="muted-msg" x-show="motifs.length" x-text="$app.t('motiv.panel.pickHint')"></p>
      <p class="muted-msg" x-show="!motifs.length" x-text="$app.t('motiv.empty.hint')"></p>
      <div class="motiv-theme-list" x-show="themes.length">
        <h4 class="motiv-panel-heading" x-text="$app.t('motiv.theme.listTitle')"></h4>
        <!-- Nur x-for-Anker + Zeilen im Sortable-Container (Drop-Index sauber, h4 aussen). -->
        <div class="motiv-theme-rows" x-init="_initThemeSortable($el)">
          <template x-for="t in themes" :key="t.id">
            <div class="motiv-theme-row hover-reveal-host" :data-theme-id="t.id">
              <span class="motiv-drag-grip" aria-hidden="true" :data-tip="$app.t('motiv.theme.dragHint')">
                <svg class="icon" aria-hidden="true"><use href="/icons.svg#grip-vertical"/></svg>
              </span>
              <!-- Thema-Farbe: Swatch öffnet ein Palette-Popover (theme-aware --palette-*). -->
              <div class="color-picker">
                <button type="button" class="color-picker__swatch"
                        :style="{ '--col-accent': 'var(--palette-' + themeSwatchKey(t) + ')' }"
                        @click.stop="toggleThemeColorPicker(t.id)"
                        :data-tip="$app.t('motiv.theme.color')" :aria-label="$app.t('motiv.theme.color')"></button>
                <div class="color-picker__popover" x-show="themeColorPickerId === t.id" x-cloak
                     @click.outside="themeColorPickerId === t.id && (themeColorPickerId = null)">
                  <button type="button" class="color-picker__opt color-picker__opt--none"
                          :class="{ 'color-picker__opt--on': !t.farbe }"
                          @click="setThemeColor(t, null)"
                          :data-tip="$app.t('motiv.theme.colorAuto')" :aria-label="$app.t('motiv.theme.colorAuto')"></button>
                  <template x-for="key in themeColorKeys()" :key="key">
                    <button type="button" class="color-picker__opt"
                            :style="{ '--col-accent': 'var(--palette-' + key + ')' }"
                            :class="{ 'color-picker__opt--on': t.farbe === key }"
                            @click="setThemeColor(t, key)" :aria-label="key"></button>
                  </template>
                </div>
              </div>
              <button type="button" class="motiv-theme-name" @click="selectTheme(t.id)"
                      x-text="t.name" :data-tip="$app.t('motiv.theme.editTip')"></button>
              <button type="button" class="icon-btn icon-btn--ghost hover-reveal" @click="deleteTheme(t)"
                      :data-tip="$app.t('common.delete')" :aria-label="$app.t('common.delete')">
                <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
              </button>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- @include motiv-panel-theme -->

  <!-- Mit Auswahl: Motiv-Editor -->
  <template x-if="selectedMotif()">
    <div class="motiv-editor">
      <div class="motiv-editor-head">
        <div class="motiv-editor-titlerow">
          <!-- Rueckweg wie im Themen-Editor: `selectMotif(null)` committet ausstehende
               Edits und faellt auf die Themen-Liste zurueck (derselbe Weg, den Escape
               nimmt). Ohne den Knopf war der Motiv-Editor der einzige Panel-Zustand
               ohne sichtbaren Ausgang. -->
          <button type="button" class="icon-btn icon-btn--ghost" @click="selectMotif(null)" :disabled="busy"
                  :data-tip="$app.t('motiv.motif.backToList')" :aria-label="$app.t('motiv.motif.backToList')">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#arrow-left"/></svg>
          </button>
          <input type="text" class="motiv-name-input" x-model="editName" data-spellcheck="spelling"
                 @keydown.enter="saveMotifEdit()">
          <button type="button" class="icon-btn icon-btn--ghost" @click="deleteMotif(selectedMotif())"
                  :data-tip="$app.t('motiv.motif.delete')" :aria-label="$app.t('motiv.motif.delete')">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
          </button>
        </div>
        <div class="motiv-editor-actions" x-show="motifDirty()" x-cloak>
          <button type="button" class="icon-btn icon-btn--ghost icon-btn--success"
                  @click="saveMotifEdit()" :disabled="busy || !editName.trim()"
                  :data-tip="$app.t('common.save')" :aria-label="$app.t('common.save')">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#check"/></svg>
          </button>
          <button type="button" class="icon-btn icon-btn--ghost"
                  @click="cancelMotifEdit()" :disabled="busy"
                  :data-tip="$app.t('common.cancel')" :aria-label="$app.t('common.cancel')">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg>
          </button>
        </div>
      </div>

      <label class="motiv-field-label" x-text="$app.t('motiv.motif.theme')"></label>
      <div x-data="combobox($app.t('motiv.motif.themeOptional'), $app.t('motiv.noTheme'))"
           x-modelable="value" x-model="editThemeId" x-effect="options = themeOptions()"></div>

      <label class="motiv-field-label" x-text="$app.t('motiv.motif.beschreibung')"></label>
      <textarea class="motiv-textarea" rows="3" data-spellcheck="spelling"
                :placeholder="$app.t('motiv.motif.beschreibungHint')"
                x-model="editBeschreibung"></textarea>

      <label class="motiv-field-label" x-text="$app.t('motiv.motif.triggers')"></label>
      <input type="text" class="motiv-inline-input" x-model="editTriggers"
             :placeholder="$app.t('motiv.motif.triggersHint')"
             @keydown.enter="saveMotifEdit()">

      <!-- Ideen-Plaketten: eigene Pendenzen, die an diesem Motiv hängen.
           Read-only — gesetzt wird die Kante auf der Ideen-Seite. -->
      <div x-data="{ ideaOwnerId: selectedMotifId }"><!-- @include ideen-backlinks --></div>

      <!-- Ist: Fundstellen (klappbar, Zustand pro Motiv in localStorage) -->
      <div x-data="collapsible(true)" x-modelable="open" x-model="occExpanded">
        <button type="button" class="collapsible-toggle motiv-panel-heading" x-bind="trigger">
          <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
          <span x-text="$app.t('motiv.occ.title')"></span>
          <span class="badge" x-text="selectedMotif()?.occurrenceCount || 0"></span>
        </button>
        <div x-bind="panel" x-cloak>
          <p class="muted-msg" x-show="!occLoading && !occurrences.length" x-text="$app.t('motiv.occ.empty')"></p>
          <div class="motiv-occ-list">
            <template x-for="o in occurrences" :key="o.id">
              <button type="button" class="motiv-occ-row" @click="gotoOccurrence(o)">
                <span class="motiv-occ-loc" x-text="o.page_name ? ((o.chapter_name ? o.chapter_name + ': ' : '') + o.page_name) : (o.scene_titel || '')"></span>
                <span class="motiv-occ-snip" x-text="o.snippet" x-show="o.snippet"></span>
                <span class="motiv-occ-meta">
                  <span class="badge motiv-occ-conf" x-show="o.score != null"
                        x-text="Math.round(o.score * 100) + '%'"
                        :data-tip="$app.t('motiv.occ.confidence')"></span>
                  <span class="badge-source" x-text="$app.t('motiv.occ.source.' + o.source)"></span>
                </span>
              </button>
            </template>
          </div>
        </div>
      </div>

      <!-- Soll: Verknüpfungen (klappbar, Zustand pro Motiv in localStorage).
           Explizites Speichern via Save/Cancel-Icon (kein Auto-Save, Knöpfe sichtbar
           nur bei ungespeicherten Änderungen) — die Entfernen-Knöpfe der Referenzen
           bearbeiten die editXxx-Puffer. Solange etwas ungespeichert ist, sind die
           Referenzen nicht klickbar: der Sprung in eine andere Karte verwürfe den Puffer. -->
      <div x-data="collapsible(true)" x-modelable="open" x-model="linksExpanded">
      <button type="button" class="collapsible-toggle motiv-panel-heading" x-bind="trigger">
        <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
        <span x-text="$app.t('motiv.links.title')"></span>
        <span class="badge" x-text="linkCount()"></span>
      </button>
      <div x-bind="panel" x-cloak>
      <div class="motiv-link-group">
        <span class="motiv-field-label" x-text="$app.t('motiv.link.figures')"></span>
        <div class="entity-refs">
          <template x-for="f in editFigures" :key="'k'+f.figId">
            <span class="entity-ref-group"><button type="button" class="entity-ref" x-entity-ref="{ type: 'figur', id: f.figId, name: f.name, static: motifDirty() }"></button>
              <button type="button" class="entity-ref-remove" @click="toggleLink('figures', f)" :data-tip="$app.t('common.remove')" :aria-label="$app.t('common.remove')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button></span>
          </template>
          <template x-for="f in editDraftFigures" :key="'d'+f.id">
            <span class="entity-ref-group"><button type="button" class="entity-ref" x-entity-ref="{ type: 'werkstatt', id: f.id, label: f.name, static: motifDirty() }"></button>
              <button type="button" class="entity-ref-remove" @click="toggleLink('draftFigures', f)" :data-tip="$app.t('common.remove')" :aria-label="$app.t('common.remove')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button></span>
          </template>
        </div>
        <!-- Eine Combobox, zwei Quellen gruppiert (Komplettanalyse figures + Plotwerkstatt draft_figures);
             Präfix fig:/draft: → addFigureLink wählt die Brücke. Picker-Muster transient + $event.detail,
             weil x-modelable-Sync asynchron ist (Temp-x-model wäre im combobox-change-Handler noch stale). -->
        <div x-data="combobox({ placeholder: $app.t('motiv.link.addFigure'), transient: true })"
             x-effect="options = [
               ...($store.catalog.figuren||[]).map(f=>({value:'fig:'+f.id, label:f.name, group:$app.t('motiv.link.figureGroup.katalog')})),
               ...(allDraftFiguren||[]).map(d=>({value:'draft:'+d.id, label:d.name, group:$app.t('motiv.link.figureGroup.werkstatt')}))
             ]"
             @combobox-change="addFigureLink($event.detail)"></div>
      </div>
      <div class="motiv-link-group">
        <span class="motiv-field-label" x-text="$app.t('motiv.link.beats')"></span>
        <div class="entity-refs">
          <template x-for="b in editBeats" :key="b.id">
            <span class="entity-ref-group"><button type="button" class="entity-ref" x-entity-ref="{ type: 'beat', id: b.id, label: b.titel, static: motifDirty() }"></button>
              <button type="button" class="entity-ref-remove" @click="toggleLink('beats', b)" :data-tip="$app.t('common.remove')" :aria-label="$app.t('common.remove')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button></span>
          </template>
        </div>
        <div x-data="combobox({ placeholder: $app.t('motiv.link.addBeat'), transient: true })"
             x-effect="options = (allActs||[]).flatMap(a=>(allBeats||[]).filter(b=>String(b.actId)===String(a.id)).map(b=>({value:String(b.id),label:b.titel||'?',group:a.name})))"
             @combobox-change="addLink('beats', $event.detail)"></div>
      </div>
      <div class="motiv-link-group">
        <span class="motiv-field-label" x-text="$app.t('motiv.link.chapters')"></span>
        <div class="entity-refs">
          <template x-for="c in editChapters" :key="c.id">
            <span class="entity-ref-group"><button type="button" class="entity-ref" x-entity-ref="{ type: 'kapitel', id: c.id, name: c.name, static: motifDirty() }"></button>
              <button type="button" class="entity-ref-remove" @click="toggleLink('chapters', c)" :data-tip="$app.t('common.remove')" :aria-label="$app.t('common.remove')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button></span>
          </template>
        </div>
        <div x-data="combobox({ placeholder: $app.t('motiv.link.addChapter'), transient: true })"
             x-effect="options = ($store.nav.tree||[]).filter(t=>t.type==='chapter' && !String(t.id).startsWith('solo-')).map(c=>({value:String(c.id),label:c.name}))"
             @combobox-change="addLink('chapters', $event.detail)"></div>
      </div>
      <div class="motiv-link-group">
        <span class="motiv-field-label" x-text="$app.t('motiv.link.pages')"></span>
        <div class="entity-refs">
          <template x-for="p in editPages" :key="p.id">
            <span class="entity-ref-group"><button type="button" class="entity-ref" x-entity-ref="{ type: 'seite', id: p.id, name: p.name, static: motifDirty() }"></button>
              <button type="button" class="entity-ref-remove" @click="toggleLink('pages', p)" :data-tip="$app.t('common.remove')" :aria-label="$app.t('common.remove')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button></span>
          </template>
        </div>
        <div x-data="combobox({ placeholder: $app.t('motiv.link.addPage'), transient: true })"
             x-effect="options = ($store.nav.pages||[]).map(p=>({value:String(p.id),label:p.name,group:p.chapterName||''}))"
             @combobox-change="addLink('pages', $event.detail)"></div>
      </div>
      </div>
      </div>

      <!-- Motiv ↔ Motiv (klappbar, Zustand pro Motiv in localStorage) -->
      <div x-data="collapsible(true)" x-modelable="open" x-model="relationsExpanded">
      <button type="button" class="collapsible-toggle motiv-panel-heading" x-bind="trigger">
        <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
        <span x-text="$app.t('motiv.relations.title')"></span>
        <span class="badge" x-text="relationsForSelected().length"></span>
      </button>
      <div x-bind="panel" x-cloak>
      <!-- Richtung + Beziehungstyp als Klartext, Partner-Motiv als Referenz. Klick
           wählt das Partner-Motiv (selectMotif übernimmt offene Änderungen zuerst). -->
      <div class="entity-refs">
        <template x-for="r in relationsForSelected()" :key="r.id">
          <span class="motiv-rel">
            <span class="motiv-rel-typ" x-text="(r.outgoing ? '→ ' : '← ') + motifRelLabel(r.typ)"></span>
            <span class="entity-ref-group"><button type="button" class="entity-ref" x-entity-ref="{ type: 'motiv', id: r.otherId, label: r.otherName }"></button>
              <button type="button" class="entity-ref-remove" @click="deleteRelation(r)" :data-tip="$app.t('motiv.relations.delete')" :aria-label="$app.t('motiv.relations.delete')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button></span>
          </span>
        </template>
      </div>
      <div class="motiv-relation-add">
        <div x-data="combobox($app.t('motiv.relations.target'), '')" x-modelable="value" x-model="newRelationTargetId"
             x-effect="options = motifs.filter(m=>m.id!==selectedMotifId).map(m=>({value:String(m.id),label:m.name}))"></div>
        <div class="motiv-rel-typ" x-data="combobox($app.t('motiv.relations.typPick'))"
             x-modelable="value" x-model="newRelationTyp"
             x-effect="options = motifRelTypes().map(tp => ({ value: tp, label: motifRelLabel(tp) }))"></div>
        <button type="button" class="btn-compact" @click="addRelation()"
                :disabled="!newRelationTargetId || !newRelationTyp.trim()" x-text="$app.t('motiv.relations.add')"></button>
      </div>
      </div>
      </div>
    </div>
  </template>
</aside>
