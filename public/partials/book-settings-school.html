<!-- Schulsystem des Buchs (Kontext-Tab). Eingebunden via `<!-- @include book-settings-school -->`
     in book-settings-context.html. Methods: js/book/book-settings/school.js,
     Rechnung: js/book/school-path.js. Eigener Schreibpfad /booksettings/:id/schulsystem;
     der Header-Speichern-Knopf schreibt ihn mit. Fehlt bei Buchtypen ohne
     Schullaufbahn (school-path.js#SCHULWEG_OHNE_BUCHTYPEN). -->
<section class="book-settings-section" x-show="schulAbschnittSichtbar()" x-cloak>
  <h3 class="card-section-title" x-text="$app.t('book.settings.section.schule')"></h3>
  <p class="card-hint" x-text="$app.t('book.settings.schule.hint')"></p>

  <div class="card-form-row">
    <label class="card-form-label" x-text="$app.t('book.settings.schule.vorlage')"></label>
    <div class="card-form-field">
      <div x-data="combobox({ placeholder: $app.t('book.settings.schule.vorlage'), emptyLabel: $app.t('book.settings.schule.keins'), compact: false })"
           x-modelable="value" x-model="schulVorlage"
           x-effect="options = schulVorlageOptionen()"
           @combobox-change="onSchulVorlageChange($event.detail)"></div>
      <p class="card-form-field-note" x-show="schulVorlage" x-cloak x-text="$app.t('book.settings.schule.vorlageHint.' + schulVorlage)"></p>
    </div>
  </div>

  <template x-if="bookSchulsystem">
    <div>
      <div class="card-form-row">
        <label class="card-form-label" x-text="$app.t('book.settings.schule.einschulungsalter')"></label>
        <div class="card-form-field">
          <input type="text" class="form-num"
                 x-data="numInput({ integer: true, min: 3, max: 9 })"
                 x-modelable="value" x-model="bookSchulsystem.einschulungsalter">
        </div>
      </div>

      <div class="card-form-row">
        <label class="card-form-label" x-text="$app.t('book.settings.schule.stichtag')"></label>
        <div class="card-form-field">
          <div class="book-settings-preset-row">
            <input type="text" class="form-num" :aria-label="$app.t('book.settings.schule.stichtagTag')"
                   x-data="numInput({ integer: true, min: 1, max: 31 })"
                   x-modelable="value" x-model="bookSchulsystem.stichtag.tag">
            <input type="text" class="form-num" :aria-label="$app.t('book.settings.schule.stichtagMonat')"
                   x-data="numInput({ integer: true, min: 1, max: 12 })"
                   x-modelable="value" x-model="bookSchulsystem.stichtag.monat">
          </div>
          <p class="card-form-field-note" x-text="$app.t('book.settings.schule.stichtagHint')"></p>
        </div>
      </div>

      <div class="card-form-row">
        <label class="card-form-label" x-text="$app.t('book.settings.schule.beginn')"></label>
        <div class="card-form-field">
          <input type="text" class="form-num"
                 x-data="numInput({ integer: true, min: 1, max: 12 })"
                 x-modelable="value" x-model="bookSchulsystem.schuljahr_beginn">
          <p class="card-form-field-note" x-text="$app.t('book.settings.schule.beginnHint')"></p>
        </div>
      </div>

      <p class="card-form-section-divider" x-text="$app.t('book.settings.schule.jahreHint')"></p>
      <template x-for="s in schulStufen()" :key="s.key">
        <div class="card-form-row">
          <label class="card-form-label" x-text="s.label"></label>
          <div class="card-form-field">
            <input type="text" class="form-num"
                   x-data="numInput({ integer: true, min: 1, max: 10 })"
                   x-modelable="value" x-model="bookSchulsystem.jahre[s.key]">
          </div>
        </div>
      </template>

      <div class="card-form-row">
        <label class="card-form-label" x-text="$app.t('book.settings.schule.standardWeg')"></label>
        <div class="card-form-field">
          <div x-data="combobox({ placeholder: $app.t('book.settings.schule.standardWeg'), compact: false })"
               x-modelable="value" x-model="bookSchulsystem.standard_weg"
               x-effect="options = schulWegOptionen()"></div>
          <p class="card-form-field-note" x-text="$app.t('book.settings.schule.standardWegHint')"></p>
        </div>
      </div>

      <div class="card-form-row">
        <label class="card-form-label" x-text="$app.t('book.settings.schule.handlungsjahr')"></label>
        <div class="card-form-field">
          <input type="text" class="form-num"
                 x-data="numInput({ integer: true, min: 1000, max: 2999, grouping: false })"
                 x-modelable="value" x-model="bookHandlungsjahr">
          <p class="card-form-field-note" x-text="$app.t('book.settings.schule.handlungsjahrHint')"></p>
        </div>
      </div>
    </div>
  </template>
</section>
