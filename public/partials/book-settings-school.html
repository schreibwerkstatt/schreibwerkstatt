    <!-- Reiter «Schule»: Schulsystem + Handlungsjahr. Methods: js/book/book-settings/school.js,
         Rechnung: js/book/school-path.js. Eigener Schreibpfad /booksettings/:id/schulsystem;
         der Header-Speichern-Knopf schreibt ihn mit. Reiter fehlt bei Buchtypen ohne
         Schullaufbahn (school-path.js#SCHULWEG_OHNE_BUCHTYPEN). Aus = kein Schulsystem
         (bookSchulsystem null); Figuren-Karte und Buch-Chat rechnen dann keine Klassen. -->
    <div class="card-form-grid" x-bind="panel('school')" x-cloak>
    <section class="book-settings-section">
      <h3 class="card-section-title" x-text="$app.t('book.settings.section.schule')"></h3>

      <div class="card-form-row">
        <span class="card-form-label"></span>
        <div class="card-form-field">
          <label class="form-check">
            <input type="checkbox" id="bs-schule-aktiv" :checked="!!bookSchulsystem" @change="onSchulAktivChange($event.target.checked)">
            <span>
              <span class="form-check-title" x-text="$app.t('book.settings.schule.aktiv')"></span>
              <span class="form-check-desc" x-text="$app.t('book.settings.schule.hint')"></span>
            </span>
          </label>
        </div>
      </div>

      <template x-if="bookSchulsystem">
        <div>
          <div class="card-form-row">
            <label class="card-form-label" id="bs-schule-vorlage-label" x-text="$app.t('book.settings.schule.vorlage')"></label>
            <div class="card-form-field">
              <div x-data="combobox({ placeholder: $app.t('book.settings.schule.vorlage'), compact: false })"
                   aria-labelledby="bs-schule-vorlage-label"
                   x-modelable="value" x-model="schulVorlage"
                   x-effect="options = schulVorlageOptionen()"
                   @combobox-change="onSchulVorlageChange($event.detail)"></div>
              <p class="card-form-field-note" x-show="schulVorlage" x-cloak x-text="$app.t('book.settings.schule.vorlageHint.' + schulVorlage)"></p>
            </div>
          </div>

          <div class="card-form-row">
            <label class="card-form-label" for="bs-schule-einschulungsalter" x-text="$app.t('book.settings.schule.einschulungsalter')"></label>
            <div class="card-form-field">
              <input type="text" class="form-num" id="bs-schule-einschulungsalter"
                     x-data="numInput({ integer: true, min: 3, max: 9 })"
                     x-modelable="value" x-model="schulForm().einschulungsalter">
            </div>
          </div>

          <div class="card-form-row">
            <span class="card-form-label" id="bs-schule-stichtag-label" x-text="$app.t('book.settings.schule.stichtag')"></span>
            <div class="card-form-field">
              <div class="book-settings-preset-row" role="group" aria-labelledby="bs-schule-stichtag-label">
                <input type="text" class="form-num" :aria-label="$app.t('book.settings.schule.stichtagTag')"
                       x-data="numInput({ integer: true, min: 1, max: 31 })"
                       x-modelable="value" x-model="schulForm().stichtag.tag">
                <input type="text" class="form-num" :aria-label="$app.t('book.settings.schule.stichtagMonat')"
                       x-data="numInput({ integer: true, min: 1, max: 12 })"
                       x-modelable="value" x-model="schulForm().stichtag.monat">
              </div>
              <p class="card-form-field-note" x-text="$app.t('book.settings.schule.stichtagHint')"></p>
            </div>
          </div>

          <div class="card-form-row">
            <label class="card-form-label" for="bs-schule-beginn" x-text="$app.t('book.settings.schule.beginn')"></label>
            <div class="card-form-field">
              <input type="text" class="form-num" id="bs-schule-beginn"
                     x-data="numInput({ integer: true, min: 1, max: 12 })"
                     x-modelable="value" x-model="schulForm().schuljahr_beginn">
              <p class="card-form-field-note" x-text="$app.t('book.settings.schule.beginnHint')"></p>
            </div>
          </div>

          <p class="card-form-section-divider" x-text="$app.t('book.settings.schule.jahreHint')"></p>
          <template x-for="s in schulStufen()" :key="s.key">
            <div class="card-form-row">
              <label class="card-form-label" :for="'bs-schule-jahre-' + s.key" x-text="s.label"></label>
              <div class="card-form-field">
                <input type="text" class="form-num" :id="'bs-schule-jahre-' + s.key"
                       x-data="numInput({ integer: true, min: 1, max: 10 })"
                       x-modelable="value" x-model="schulForm().jahre[s.key]">
              </div>
            </div>
          </template>

          <div class="card-form-row">
            <label class="card-form-label" id="bs-schule-standardweg-label" x-text="$app.t('book.settings.schule.standardWeg')"></label>
            <div class="card-form-field">
              <div x-data="combobox({ placeholder: $app.t('book.settings.schule.standardWeg'), compact: false })"
                   aria-labelledby="bs-schule-standardweg-label"
                   x-modelable="value" x-model="schulForm().standard_weg"
                   x-effect="options = schulWegOptionen()"></div>
              <p class="card-form-field-note" x-text="$app.t('book.settings.schule.standardWegHint')"></p>
            </div>
          </div>

          <div class="card-form-row">
            <label class="card-form-label" for="bs-schule-handlungsjahr" x-text="$app.t('book.settings.schule.handlungsjahr')"></label>
            <div class="card-form-field">
              <input type="text" class="form-num" id="bs-schule-handlungsjahr"
                     x-data="numInput({ integer: true, min: 1000, max: 2999, grouping: false })"
                     x-modelable="value" x-model="bookHandlungsjahr">
              <p class="card-form-field-note" x-text="$app.t('book.settings.schule.handlungsjahrHint')"></p>
            </div>
          </div>
        </div>
      </template>
    </section>
    </div><!-- /tab: school -->
