<!-- Komplettanalyse: Primärbutton mit eingebettetem Fortschrittsring + Status-/Aktionsmenü (⋯) -->
<div class="komplett-status-wrap"
     @click.outside="showKomplettStatus = false; komplettStatusByHover = false"
     @mouseenter="if ($store.jobs.alleAktualisierenLoading && !showKomplettStatus) { showKomplettStatus = true; komplettStatusByHover = true }"
     @mouseleave.debounce.400ms="if (komplettStatusByHover && !$el.matches(':hover')) { showKomplettStatus = false; komplettStatusByHover = false }">
  <button type="button"
          class="update-all-btn"
          :class="{ 'update-all-btn--running': $store.jobs.alleAktualisierenLoading }"
          @click="alleAktualisieren()"
          :disabled="$store.jobs.alleAktualisierenLoading || !$store.nav.selectedBookId || bookHasNoText()"
          :data-tip="bookHasNoText() ? t('header.updateAllEmptyBook') : t('header.updateAllTitle')">
    <span class="update-all-btn-ring"
          x-show="$store.jobs.alleAktualisierenLoading"
          :style="{ '--progress': ($store.jobs.alleAktualisierenProgress || 0) + '%' }"
          aria-hidden="true"></span>
    <span class="update-all-btn-icon" x-show="!$store.jobs.alleAktualisierenLoading" aria-hidden="true">
      <svg class="icon"><use href="/icons.svg#rotate-cw"/></svg>
    </span>
    <span class="update-all-btn-label" x-text="t('header.updateAll')"></span>
  </button>
  <button type="button"
          class="icon-btn icon-btn--ghost"
          :class="{ 'is-active': showKomplettStatus }"
          @click="showKomplettStatus = komplettStatusByHover || !showKomplettStatus; komplettStatusByHover = false"
          :disabled="!$store.nav.selectedBookId"
          :data-tip="t('header.statusMenu')"
          :aria-label="t('header.statusMenu')"
          aria-haspopup="dialog"
          :aria-expanded="showKomplettStatus">
    <svg class="icon" aria-hidden="true"><use href="/icons.svg#more-horizontal"/></svg>
  </button>
  <span class="komplett-last-run"
        x-show="!$store.jobs.alleAktualisierenLoading && $store.jobs.alleAktualisierenLastRun"
        x-cloak
        x-text="t('common.asOf', { date: $store.jobs.alleAktualisierenLastRun })"></span>
  <div class="komplett-status-panel" x-show="showKomplettStatus" x-cloak role="dialog" :aria-label="t('komplett.title')">
    <div class="komplett-status-title" x-text="t('komplett.title')"></div>
    <div class="komplett-status-laststamp" x-show="$store.jobs.alleAktualisierenLastRun" x-cloak
         x-text="t('common.asOf', { date: $store.jobs.alleAktualisierenLastRun })"></div>
    <!-- Ohne Lauf in dieser Sitzung (Fortschritt 0, kein Status) nichts zeigen: ein leerer
         Balken mit «Fertig» daneben wäre eine Falschaussage; der Stand steht oben. -->
    <template x-if="$store.jobs.alleAktualisierenLoading || $store.jobs.alleAktualisierenProgress > 0 || $store.jobs.alleAktualisierenStatus">
      <div class="komplett-status-progress">
        <div class="progress-bar-wrap komplett-progress-bar-wrap">
          <div class="progress-bar" :style="{ '--progress': $store.jobs.alleAktualisierenProgress + '%' }"></div>
        </div>
        <div class="komplett-progress-label">
          <span class="komplett-status-text"
                x-text="$store.jobs.alleAktualisierenStatus || t('komplett.done')"
                :data-tip="$store.jobs.alleAktualisierenStatus || t('komplett.done')"></span>
          <span x-show="$store.jobs.alleAktualisierenTokIn > 0 || $store.jobs.alleAktualisierenTokOut > 0" class="komplett-tokens">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#arrow-up"/></svg><span class="komplett-tok-num" x-text="_fmtTok($store.jobs.alleAktualisierenTokIn)"></span>
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#arrow-down"/></svg><span class="komplett-tok-num" x-text="_fmtTok($store.jobs.alleAktualisierenTokOut)"></span>
            <span class="komplett-tok-tps" x-show="$store.jobs.alleAktualisierenTps" x-text="' · ' + Math.round($store.jobs.alleAktualisierenTps) + ' tok/s'"></span>
          </span>
        </div>
        <ul class="komplett-phase-list" x-show="_komplettPhasen().length">
          <template x-for="phase in _komplettPhasen()" :key="phase.key || phase.label">
            <li class="komplett-phase-item" :class="{ 'is-done': phase.done, 'is-active': phase.active }">
              <span class="komplett-phase-icon">
                <svg class="icon" aria-hidden="true"><use :href="phase.done ? '/icons.svg#check' : (phase.active ? '/icons.svg#play' : '/icons.svg#circle')"/></svg>
              </span>
              <span x-text="phase.label"></span>
            </li>
          </template>
        </ul>
      </div>
    </template>
    <ul class="komplett-warnings" x-show="!$store.jobs.alleAktualisierenLoading && $store.jobs.alleAktualisierenWarnings.length" x-cloak>
      <template x-for="w in $store.jobs.alleAktualisierenWarnings" :key="w.key">
        <li class="komplett-warning-item" x-text="t(w.key, w.params)"></li>
      </template>
    </ul>
    <div class="komplett-coverage" x-cloak
         x-show="!$store.jobs.alleAktualisierenLoading && $store.jobs.alleAktualisierenCoverage && $store.jobs.alleAktualisierenCoverage.score !== null"
         :class="{ 'komplett-coverage--low': ($store.jobs.alleAktualisierenCoverage?.score ?? 1) < 0.8 }"
         :data-tip="t('komplett.coverageTip', { erkannt: $store.jobs.alleAktualisierenCoverage?.erkannt || 0, fehlend: $store.jobs.alleAktualisierenCoverage?.fehlend || 0, chapters: $store.jobs.alleAktualisierenCoverage?.sampledChapters || 0 })">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#check"/></svg>
      <span x-text="t('komplett.coverageLabel', { score: Math.round(($store.jobs.alleAktualisierenCoverage?.score || 0) * 100) })"></span>
    </div>
    <!-- Kosten pro Call-Klasse: bewusst NEBEN dem Coverage-Score. Eine Tier-/Effort-
         Umstellung ist nur dann ein Gewinn, wenn die Summe sinkt UND der Recall hält —
         beides muss im selben Blick lesbar sein. Nur für Admins: Autor:innen sehen keine Kosten. -->
    <div class="komplett-cost" x-cloak
         x-show="$store.session.currentUser?.isAdmin && !$store.jobs.alleAktualisierenLoading && $store.jobs.alleAktualisierenCost">
      <div class="komplett-cost-total">
        <span x-text="t('komplett.costTotal', { usd: ($store.jobs.alleAktualisierenCost?.totalUsd ?? 0).toFixed(2) })"></span>
      </div>
      <ul class="komplett-cost-list">
        <template x-for="p in ($store.jobs.alleAktualisierenCost?.phases || [])" :key="p.phase">
          <li class="komplett-cost-item"
              :data-tip="t('komplett.costTip', { calls: p.calls, models: (p.models || []).join(', ') || '–', seconds: p.seconds })">
            <span class="komplett-cost-phase" x-text="t('komplett.costPhase.' + p.phase)"></span>
            <span class="komplett-cost-usd" x-text="'$' + p.usd.toFixed(2)"></span>
          </li>
        </template>
      </ul>
    </div>
    <div class="komplett-status-actions">
      <button type="button"
              class="komplett-status-action-btn"
              @click="showKomplettStatus = false; clearChapterCache()"
              :disabled="$store.jobs.alleAktualisierenLoading || !$store.nav.selectedBookId"
              :data-tip="t('header.clearCacheTitle')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
        <span x-text="t('header.clearCache')"></span>
      </button>
    </div>
  </div>
</div>
