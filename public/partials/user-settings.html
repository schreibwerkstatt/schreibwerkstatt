<!-- Benutzer-Einstellungen -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/user-settings-card.js.
  `showUserSettingsCard` + `toggleUserSettingsCard` im Root, fachlicher State
  (Profil, Default-Präferenzen, Reset-Zone) in dieser Komponente.
-->
<div class="card card--settings" x-data="userSettingsCard" x-show="$app.showUserSettingsCard" x-cloak>
  <div class="card-header">
    <span class="card-title" x-text="$app.t('profile.title')"></span>
    <div class="card-actions">
      <button type="button" data-label-ok @click="saveUserSettings()" :disabled="userSettingsSaving || userSettingsLoading">
        <span x-show="userSettingsSaving" class="spinner"></span>
        <span x-text="userSettingsSaving ? $app.t('common.saving') : $app.t('common.save')"></span>
      </button>
    </div>
  </div>

  <div x-show="userSettingsLoading" class="muted-msg" x-text="$app.t('common.loading')"></div>

  <div x-show="!userSettingsLoading" class="card-form-grid">

    <div class="card-form-row">
      <label class="card-form-label" x-text="$app.t('profile.account')"></label>
      <div class="user-settings-profile">
        <div><strong x-text="userSettingsProfile?.name || '—'"></strong></div>
        <div class="muted-msg muted-msg--sm" x-text="userSettingsProfile?.email || ''"></div>
      </div>
    </div>

    <div class="card-form-row">
      <label class="card-form-label" x-text="$app.t('profile.uiLanguage')"></label>
      <div class="card-form-field">
        <div x-data="radioGroup()"
             x-effect="value = $store.shell.uiLocale; options = userSettingsUiLangOptions()"
             @radio-change="$app.changeLocale($event.detail)"></div>
        <p class="card-form-field-note" x-text="$app.t('profile.uiLanguageHint')"></p>
      </div>
    </div>

    <p class="card-form-section-divider" x-text="$app.t('profile.newBooksHint')"></p>

    <div class="card-form-row">
      <label class="card-form-label" x-text="$app.t('profile.defaultLanguage')"></label>
      <div x-data="radioGroup()" x-modelable="value" x-model="userSettingsDefaultLanguage"
           x-effect="options = userSettingsDefaultLangOptions()"
           @radio-change="userSettingsDefaultRegion = ($event.detail === 'de' ? 'CH' : ($event.detail === 'en' ? 'US' : '')); userSettingsDefaultBuchtyp = ''"></div>
    </div>

    <div class="card-form-row" x-show="userSettingsDefaultLanguage">
      <label class="card-form-label" x-text="$app.t('profile.defaultRegion')"></label>
      <div x-data="radioGroup()" x-modelable="value" x-model="userSettingsDefaultRegion"
           x-effect="options = (userSettingsDefaultLanguage === 'de'
             ? [{ value: 'CH', label: $app.t('region.de.CH') }, { value: 'DE', label: $app.t('region.de.DE') }]
             : userSettingsDefaultLanguage === 'en'
             ? [{ value: 'US', label: $app.t('region.en.US') }, { value: 'GB', label: $app.t('region.en.GB') }]
             : [])"></div>
    </div>

    <div class="card-form-row" x-show="userSettingsDefaultLanguage">
      <label class="card-form-label" x-text="$app.t('profile.defaultBuchtyp')"></label>
      <div x-data="combobox($app.t('profile.defaultBuchtyp'), $app.t('common.notSet'))"
           x-modelable="value" x-model="userSettingsDefaultBuchtyp"
           x-effect="options = userSettingsBuchtypOptions()"
></div>
    </div>

    <p class="card-form-section-divider" x-text="$app.t('profile.editorSection')"></p>

    <div class="card-form-row">
      <label class="card-form-label" x-text="$app.t('profile.focusGranularity')"></label>
      <div class="card-form-field">
        <div x-data="combobox($app.t('profile.focusGranularity'))"
             x-modelable="value" x-model="userSettingsFocusGranularity"
             x-effect="options = userSettingsFocusOptions()"
></div>
        <p class="card-form-field-note" x-text="$app.t('profile.focusGranularityHint')"></p>
      </div>
    </div>

    <p class="card-form-section-divider" x-text="$app.t('profile.writingSection')"></p>

    <div class="card-form-row">
      <label class="card-form-label" x-text="$app.t('profile.dailyGoal')"></label>
      <div class="card-form-field">
        <div class="card-form-goal-edit">
          <input type="text" class="card-form-goal-input"
                 x-data="numInput({ integer: true, min: 0, max: 1440 })"
                 x-modelable="value" x-model="userSettingsDailyGoal"
                 :aria-label="$app.t('profile.dailyGoal')">
          <span class="card-form-goal-unit" x-text="$app.t('mystats.goal.minutesLabel')"></span>
        </div>
        <p class="card-form-field-note" x-text="$app.t('profile.dailyGoalHint')"></p>
      </div>
    </div>

    <p class="card-form-saved" x-show="userSettingsSaved" x-cloak x-transition.opacity.duration.250ms x-text="$app.t('profile.savedMsg')"></p>
    <p class="card-form-error" x-show="userSettingsError" x-text="userSettingsError"></p>

    <template x-if="$store.config.languagetoolEnabled">
      <div class="card-form-row card-form-row--dict" x-data="collapsible()">
        <button type="button" class="collapsible-toggle" x-bind="trigger">
          <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
          <span x-text="$app.t('spellcheck.dict.title')"></span>
          <span class="lt-dict-count" x-text="dictEntries.length"></span>
        </button>
        <div class="lt-dict-body" x-bind="panel" x-cloak>
          <template x-if="!dictEntries.length">
            <p class="muted-msg muted-msg--sm" x-text="$app.t('spellcheck.dict.empty')"></p>
          </template>
          <template x-if="dictEntries.length">
            <div class="lt-dict-search">
              <input type="search"
                     x-model="dictFilter"
                     :placeholder="$app.t('spellcheck.dict.searchPlaceholder')">
            </div>
          </template>
          <div class="lt-dict-list" x-show="dictEntries.length">
            <template x-for="e in dictEntriesFiltered" :key="e.word + '|' + e.book_id + '|' + e.lang">
              <div class="lt-dict-row">
                <span class="lt-dict-word" x-text="e.word"></span>
                <span class="lt-dict-scope muted-msg muted-msg--sm">
                  <span x-text="ltScopeLabel(e.book_id)"></span>
                  <span>: </span>
                  <span x-text="e.lang === '*' ? $app.t('spellcheck.dict.scope_lang_any') : e.lang"></span>
                </span>
                <button type="button" class="lt-dict-remove" @click="removeDictEntry(e)" x-text="$app.t('spellcheck.dict.remove')"></button>
              </div>
            </template>
            <template x-if="dictEntries.length && !dictEntriesFiltered.length">
              <p class="muted-msg muted-msg--sm" x-text="$app.t('spellcheck.dict.noMatch')"></p>
            </template>
          </div>
        </div>
      </div>
    </template>

    <template x-if="$store.config.languagetoolEnabled">
      <div class="card-form-row card-form-row--dict" x-data="collapsible()">
        <button type="button" class="collapsible-toggle" x-bind="trigger">
          <span class="history-chevron" x-bind="chevron" aria-hidden="true"></span>
          <span x-text="$app.t('spellcheck.rules.title')"></span>
          <span class="lt-dict-count" x-text="ltRuleEntries.length"></span>
        </button>
        <div class="lt-dict-body" x-bind="panel" x-cloak>
          <p class="muted-msg muted-msg--sm" x-show="!ltRuleEntries.length" x-text="$app.t('spellcheck.rules.empty')"></p>
          <div class="lt-dict-list" x-show="ltRuleEntries.length">
            <template x-for="e in ltRuleEntries" :key="e.rule_id + '|' + e.book_id">
              <div class="lt-dict-row">
                <span class="lt-dict-word" x-text="e.rule_label || e.rule_id" :data-tip="e.rule_id"></span>
                <span class="lt-dict-scope muted-msg muted-msg--sm" x-text="ltScopeLabel(e.book_id)"></span>
                <button type="button" class="lt-dict-remove" @click="removeLtRule(e)" x-text="$app.t('spellcheck.rules.enable')"></button>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>

    <!-- @include user-settings-ai-access -->

    <!-- @include user-settings-devices -->

    <!-- @include user-settings-clients -->

    <!--
      Konto loeschen (App-Store-Guideline 5.1.1(v)). Gleicher Endpunkt wie im
      nativen macOS-Client: DELETE /me/account. Der Client verlinkt auf #profil,
      wenn der Server die Route nicht kennt — dieser Block ist das Ziel.
    -->
    <div class="card-form-row card-form-row--full">
      <div class="danger-zone">
        <div class="danger-zone-title">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#alert-triangle"/></svg>
          <span x-text="$app.t('profile.deleteAccount.title')"></span>
        </div>
        <div class="danger-zone-row">
          <div class="danger-zone-text" x-text="$app.t('profile.deleteAccount.text')"></div>
          <div class="danger-zone-actions">
            <button type="button" class="danger-zone-btn"
                    @click="deleteAccount()" :disabled="accountDeleting">
              <span x-show="accountDeleting" class="spinner"></span>
              <span x-text="accountDeleting ? $app.t('common.deleting') : $app.t('profile.deleteAccount.button')"></span>
            </button>
          </div>
        </div>
        <p class="card-form-error" x-show="accountDeleteError" x-text="accountDeleteError"></p>
      </div>
    </div>

    <div class="card-form-row card-form-row--full">
      <p class="muted-msg muted-msg--sm">
        <a href="https://github.com/schreibwerkstatt/schreibwerkstatt"
           target="_blank" rel="noopener noreferrer"
           x-text="$app.t('landing.githubLabel')"></a>
      </p>
    </div>
  </div>
</div>
