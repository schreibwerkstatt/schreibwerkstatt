<!-- Benutzer-Einstellungen («Profil & Einstellungen») -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/user-settings-card.js.
  `showUserSettingsCard` + `toggleUserSettingsCard` im Root, fachlicher State in
  dieser Komponente. Reiter nach dem Muster der Bucheinstellungen; jedes Panel
  ist ein Fragment-Include im Scope dieser Karte (ohne eigenes x-data). Reiter-
  Liste = URL_TABS.userSettings (card-request.js), Palette-Sprung je Reiter in
  feature-registry.js.
-->
<div class="card card--settings card--settings-tabs" x-data="userSettingsCard" x-show="$app.showUserSettingsCard" x-cloak
     @keydown="$editKeys($event, { save: () => !userSettingsSaveDisabled() && saveUserSettings() })">
  <div class="card-header">
    <!-- Eyebrow wie in den Bucheinstellungen (dort der Buchname): hält die
         Kopfhöhe fest, ob der Speichern-Knopf steht oder nicht. -->
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="userSettingsProfile?.name || userSettingsProfile?.email || ' '"></span>
      <span class="card-title" x-text="$app.t('profile.title')"></span>
    </div>
    <div class="card-actions">
      <span class="card-form-saved" x-show="userSettingsSaved && !userSettingsError" x-cloak x-transition.opacity.duration.250ms x-text="$app.t('common.settingsSaved')"></span>
      <span class="card-form-error" x-show="userSettingsError" x-text="userSettingsError"></span>
      <!-- Nur auf «Allgemein» (einziger Formular-Reiter) — oder solange dort
           Ungespeichertes liegt, damit es von jedem Reiter aus erreichbar bleibt. -->
      <button type="button" data-label-ok @click="saveUserSettings()" :disabled="userSettingsSaveDisabled()"
              x-show="userSettingsTab === 'general' || userSettingsDirty()">
        <span x-show="userSettingsSaving" class="spinner"></span>
        <span x-text="userSettingsSaving ? $app.t('common.saving') : $app.t('common.save')"></span>
      </button>
    </div>
  </div>

  <div x-show="userSettingsLoading" x-skeleton="5" x-cloak></div>

  <div x-show="!userSettingsLoading"
       x-data="tabs(['general','devices','ai','dict','danger'])"
       x-modelable="value" x-model="userSettingsTab">

    <div class="tabs tabs--scrollable" x-bind="tablist">
      <button class="tabs-btn" x-bind="tabBtn('general')"
              x-text="$app.t('profile.tab.general')"></button>
      <button class="tabs-btn" x-bind="tabBtn('devices')"
              x-text="$app.t('profile.tab.devices')"></button>
      <button class="tabs-btn" x-bind="tabBtn('ai')"
              x-show="aiAccessEnabled || aiAccessStored" x-cloak
              x-text="$app.t('profile.tab.ai')"></button>
      <button class="tabs-btn" x-bind="tabBtn('dict')"
              x-show="$store.config.languagetoolEnabled" x-cloak
              x-text="$app.t('profile.tab.dict')"></button>
      <button class="tabs-btn" x-bind="tabBtn('danger')"
              x-text="$app.t('profile.tab.danger')"></button>
    </div>

    <!-- @include user-settings-general -->

    <!-- @include user-settings-devices -->

    <!-- @include user-settings-ai-access -->

    <!-- @include user-settings-dict -->

    <!-- @include user-settings-danger -->

  </div>
</div>
