<!-- Recherche-/Wissensboard — buchweit geteiltes Archiv für Notizen, Links,
     Zitate, Faktensplitter und Bilder. Optional mit Buch-Entitäten verknüpfbar
     (Kapitel/Seite/Figur/Ort/Szene/Beat) + Tags. Rein kuratierend, nie
     generativ im Buchtext. Hauptkarte (exklusiv).
     Split mit Leiste wie Editor | Abschnitts-Chat (layout/aside-split.css):
     links die Recherche-Karte, rechts der Recherche-Chat als eigene Karte
     (recherche-chat.html). Beide teilen den Scope `rechercheCard` — darum
     traegt der Split x-data, Sichtbarkeit und das Vollbild (Board + Chat
     zusammen). Schmal steht der Chat ueber dem Board (`--aside-first`). -->
<div class="aside-split main-aside-split aside-split--aside-first recherche-split fullscreen-shell"
     x-data="rechercheCard" x-show="$app.showRechercheCard" x-cloak
     x-aside-resize :class="{ 'aside-split--on': researchChatOpen }">
<div class="card card--recherche" id="recherche-card">
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-title" x-text="$app.t('recherche.title')"></span>
      <div class="card-subline" x-text="$app.t('recherche.subtitle')"></div>
    </div>
    <div class="card-header-aside">
      <div class="card-actions card-actions--grouped">
        <!-- Undo/Redo (max 10 Schritte; Kern cards/board-history.js, Records
             book/recherche/history.js) — Liste und Status-Board teilen sie. -->
        <button type="button" class="icon-btn icon-btn--ghost" @click="historyUndo()"
                :disabled="!_undoStack.length || busy"
                :data-tip="$app.withHotkey($app.t('recherche.history.undoTip'), 'undo')" :aria-label="$app.t('recherche.history.undo')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#undo"/></svg></button>
        <button type="button" class="icon-btn icon-btn--ghost" @click="historyRedo()"
                :disabled="!_redoStack.length || busy"
                :data-tip="$app.withHotkey($app.t('recherche.history.redoTip'), 'redo')" :aria-label="$app.t('recherche.history.redo')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#redo"/></svg></button>
        <button type="button" class="icon-btn icon-btn--ghost" x-show="$store.config.researchChatEnabled" :class="{ 'is-active': researchChatOpen }"
                :aria-pressed="researchChatOpen"
                @click="toggleResearchChat()"
                :aria-label="$app.t('recherche.chat.toggle')"
                :data-tip="$app.t('recherche.chat.toggle')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#message-square"/></svg></button>
        <button type="button" class="icon-btn icon-btn--ghost" :aria-pressed="rechercheFullscreen"
                @click="toggleRechercheFullscreen()"
                :aria-label="rechercheFullscreen ? $app.t('recherche.fullscreenExit.tip') : $app.t('recherche.fullscreen.tip')"
                :data-tip="rechercheFullscreen ? $app.t('recherche.fullscreenExit.tip') : $app.t('recherche.fullscreen.tip')"><svg class="icon" aria-hidden="true"><use :href="rechercheFullscreen ? '/icons.svg#minimize-2' : '/icons.svg#maximize-2'"/></svg></button>
        <button type="button" class="icon-btn icon-btn--ghost" @click="$app.toggleRechercheCard()" :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
      </div>
    </div>
  </div>

  <div x-show="errorMessage" class="card-status card-status--error" x-text="errorMessage"></div>
  <!-- Ergebnis-Zeilen der Werkzeuge und Hinweise: bleiben stehen, bis man sie
       wegklickt (ein Befund mit «ungeprüft» soll nicht von selbst verschwinden),
       aber nicht länger. Waehrend ein Lauf noch arbeitet, kein ×. -->
  <div x-show="linkCheckStatus" x-cloak class="card-status">
    <span x-text="linkCheckStatus"></span>
    <button type="button" class="icon-btn icon-btn--ghost recherche-status-dismiss" x-show="!linkCheckRunning"
            @click="linkCheckStatus = ''" :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
  </div>
  <div x-show="crosscheckStatus" x-cloak class="card-status">
    <span x-text="crosscheckStatus"></span>
    <button type="button" class="icon-btn icon-btn--ghost recherche-status-dismiss" x-show="!crosscheckRunning"
            @click="crosscheckStatus = ''" :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
  </div>
  <div x-show="noticeMessage" x-cloak class="card-status">
    <span x-text="noticeMessage"></span>
    <button type="button" class="btn-compact" x-show="_rechercheFiltersActive()" @click="clearFilters()" x-text="$app.t('recherche.filter.reset')"></button>
    <button type="button" class="icon-btn icon-btn--ghost recherche-status-dismiss"
            @click="noticeMessage = ''" :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
  </div>


  <!-- Ansicht-Umschalter (Liste / Status-Board). Zwei Blicke auf DENSELBEN
       Bestand: die Liste zeigt, was gesammelt ist, das Board, wo es auf dem Weg
       in den Buchtext steht. Filterleiste und Sortierung gelten fuer beide —
       darum steht der Umschalter darueber und nicht in der Filterleiste. -->
  <div x-show="!loading && hasBestand()" class="tabs entity-view-toggle" role="tablist" :aria-label="$app.t('recherche.viewLabel')">
    <template x-for="m in ['list','status']" :key="m">
      <button type="button" role="tab"
              class="tabs-btn"
              :class="{ 'tabs-btn--active': viewMode === m }"
              :aria-selected="viewMode === m"
              @click="viewMode = m"
              x-text="$app.t('recherche.view.' + m)"></button>
    </template>
  </div>

  <!-- Toolbar: Anlegen + Filter -->
  <div class="card-toolbar">
    <button type="button" class="btn-compact" @click="startCreate()" :disabled="busy">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
      <span x-text="$app.t('recherche.new')"></span>
    </button>
    <!-- Werkzeuge fuers ganze Board: selten gebraucht, darum hinter einem Knopf
         statt als zwei breite Knoepfe in der Toolbar (menu.js). -->
    <span x-data="menu()" x-show="hasBestand()">
      <button type="button" class="icon-btn icon-btn--ghost" x-bind="trigger" aria-haspopup="menu"
              :class="{ 'is-active': open }"
              :data-tip="$app.t('recherche.tools.tip')" :aria-label="$app.t('recherche.tools.tip')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#more-horizontal"/></svg>
      </button>
      <div class="context-menu context-menu--dropdown" x-bind="panel" x-cloak>
        <button type="button" class="context-menu-item context-menu-item--icon" role="menuitem"
                @click="checkLinks()" :disabled="linkCheckRunning" :data-tip="$app.t('recherche.linkCheck.tip')">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#external-link"/></svg>
          <span x-text="$app.t('recherche.linkCheck.btn')"></span>
        </button>
        <button type="button" class="context-menu-item context-menu-item--icon" role="menuitem"
                @click="runCrosscheck()" :disabled="crosscheckRunning" :data-tip="$app.t('recherche.crosscheck.tip')">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#check"/></svg>
          <span x-text="$app.t('recherche.crosscheck.btn')"></span>
        </button>
      </div>
    </span>
    <div class="filter-bar filter-bar--inline">
      <div x-data="combobox($app.t('recherche.filter.allKinds'), $app.t('recherche.filter.allKinds'))"
           x-modelable="value" x-model="filterKind"
           x-effect="options = kindOptions()"
           @combobox-change="filterKind = $event.detail; applyFilters()"></div>
      <div x-data="combobox($app.t('recherche.filter.allTags'), $app.t('recherche.filter.allTags'))"
           x-modelable="value" x-model="filterTag"
           x-effect="options = tagFilterOptions()"
           @combobox-change="filterTag = $event.detail; applyFilters()"></div>
      <!-- Filter nach verknüpfter Entität: Kategorie + konkreter Eintrag -->
      <div x-data="combobox($app.t('recherche.filter.allLinked'), $app.t('recherche.filter.allLinked'))"
           x-modelable="value" x-model="filterLinkedKind"
           x-effect="options = linkKinds()"
           @combobox-change="onLinkedFilterKindChange($event.detail)"></div>
      <div x-show="filterLinkedKind" x-cloak
           x-data="entityPicker({ entity: 'target', placeholder: $app.t('recherche.filter.allLinkedTargets'), emptyLabel: $app.t('recherche.filter.allLinkedTargets'), items: () => linkTargets, kind: () => filterLinkedKind })"
           x-modelable="value" x-model="filterLinkedTargetId"
           @combobox-change="applyLinkedFilter($event.detail)"></div>
      <span class="filter-search-wrap">
        <input type="text" class="filter-search-input filter-search-input--wide"
               :value="filterText"
               @input.debounce.400ms="filterText = $event.target.value; applyFilters()"
               :placeholder="$app.t('recherche.filter.search')"
               :aria-label="$app.t('recherche.filter.search')">
        <button type="button" class="search-clear--icon" x-show="filterText" @click="filterText=''; applyFilters()" :aria-label="$app.t('search.clear')" :data-tip="$app.t('search.clear')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
      </span>
      <div x-data="combobox($app.t('recherche.sort.label'))"
           x-modelable="value" x-model="sortBy"
           x-effect="options = sortOptions()"
           @combobox-change="sortBy = $event.detail; applySort()"></div>
      <!-- Ansicht: Archiv einblenden (book/recherche/board.js#viewMenuSpec) -->
      <!-- @include view-menu -->
      <!-- «n von m»: ein ausgeblendetes Fundstueck ist sonst von einem fehlenden
           nicht zu unterscheiden (Bestand aus GET /research/count). -->
      <span class="filter-count" x-show="!loading && hasBestand()" x-text="countLabel()"></span>
    </div>
  </div>

  <!-- @include recherche-bulk-bar -->

  <!-- Anlegen: Inline-Formular zwischen Toolbar und Liste (wie Quellen). -->
  <!-- @include recherche-create -->

  <!-- Skeleton während Loading vor erstem Datensatz -->
  <div x-show="loading" x-skeleton="4" x-cloak></div>

  <!-- Empty-State mit CTA: kein Eintrag → direkt anlegen. -->
  <div x-show="!loading && !errorMessage && !creating && items.length === 0 && !hasBestand()" class="card-empty" x-cloak>
    <p class="card-empty-text" x-text="$app.t('recherche.empty')"></p>
    <p class="card-empty-hint" x-text="$app.t('recherche.emptyHint')"></p>
    <button type="button" class="primary card-empty-cta" @click="startCreate()" :disabled="busy">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
      <span x-text="$app.t('recherche.new')"></span>
    </button>
  </div>

  <!-- Kein Treffer, obwohl das Buch Fundstuecke hat: Filter/Suche oder das
       ausgeblendete Archiv. Gilt fuer beide Ansichten (derselbe Bestand). -->
  <div x-show="isFilteredEmpty()" x-cloak class="recherche-no-match">
    <p class="muted-msg muted-msg--sm"
       x-text="onlyArchivedHidden() ? $app.t('recherche.noMatchArchived') : $app.t('recherche.noMatch')"></p>
    <button type="button" class="btn-compact" x-show="_rechercheFiltersActive()" @click="clearFilters()" x-text="$app.t('recherche.filter.reset')"></button>
    <button type="button" class="btn-compact" x-show="onlyArchivedHidden()" @click="showArchivedNow()" x-text="$app.t('recherche.filter.showArchived')"></button>
  </div>

  <!-- Schnipsel-Liste (Ansicht „Liste") -->
  <div class="recherche-list" :class="{ 'is-refreshing': refreshing }" x-show="!loading && items.length > 0 && viewMode === 'list'">
    <!-- @include recherche-item -->
  </div>

  <!-- Status-Board (Ansicht „Status"). `x-if` statt `x-show`: die vier Spalten
       laufen je einmal ueber den ganzen Bestand, und das soll nicht bei jedem
       Listen-Render der Liste mitlaufen. Der Preis ist, dass die
       Drag-Container beim Umschalten frisch entstehen — genau darum bindet
       `_ensureStatusBoard()` sie am `viewMode`-Watcher neu. Innen `x-show`
       (nicht wieder `x-if`), damit die Container beim Leeren/Fuellen der Liste
       stehenbleiben und die gebundenen Sortable-Instanzen nicht ins Leere
       zeigen. -->
  <template x-if="viewMode === 'status'">
    <!-- @include recherche-status-board -->
  </template>

  <!-- @include recherche-link-picker -->
  <!-- @include recherche-item-menu -->
</div><!-- /.card--recherche -->

<!-- @include recherche-chat -->
</div><!-- /.recherche-split -->
