<!-- Seiten-Chat -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/chat-card.js.
  showChatCard bleibt am Root; fachlicher State in der Sub.
-->
<div class="card card--chat" id="chat-card" x-data="chatCard" x-show="$app.showChatCard" x-cloak>
  <div class="card-header">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.currentPage?.name || '–'"></span>
      <span class="card-title" x-text="$app.t('chat.title')"></span>
    </div>
    <div class="card-actions">
      <button type="button" class="icon-btn icon-btn--ghost" @click="startNewChatSession()" :disabled="chatLoading" :data-tip="$app.t('chat.newSessionTitle')" :aria-label="$app.t('chat.newSession')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
      </button>
    </div>
    <button type="button" class="btn-card-close" @click="$app.toggleChatCard()" :data-tip="$app.t('common.close')" :aria-label="$app.t('common.close')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
  </div>

  <div class="progress-bar-wrap" x-show="chatProgress > 0 && isChatSessionRunning(chatSessionId)">
    <div class="progress-bar" :style="{ '--progress': chatProgress + '%' }"></div>
  </div>
  <div x-show="chatStatus" class="card-status" x-html="chatStatus"></div>

  <div id="chat-messages" class="chat-messages">
    <div x-show="chatMessages.length === 0" class="chat-empty" x-text="$app.t('chat.emptyPage', { name: $app.currentPage?.name || '' })"></div>

    <template x-for="(msg, msgIdx) in chatMessages" :key="msgIdx">
      <div :class="'chat-msg chat-msg--' + msg.role">
        <div class="chat-msg-bubble">
          <div x-show="msg.role === 'user'" class="chat-msg-text" x-text="msg.content"></div>
          <div x-show="msg.role === 'assistant'" class="chat-msg-text" x-html="_renderChatMarkdown(msg.content)"></div>
          <div x-show="msg.role === 'assistant' && msg.context_info?.parse_fallback" class="chat-msg-hint" x-text="$app.t(msg.context_info?.lost_vorschlaege ? 'chat.parseFallbackLost' : 'chat.parseFallback')"></div>
          <div x-show="msg.role === 'assistant' && msg.context_info?.history_trimmed" class="chat-msg-hint" x-text="$app.t('chat.historyTrimmed', { n: msg.context_info?.history_trimmed || 0 })"></div>
          <div x-show="msg.role === 'assistant' && _chatTokenInfo(msg)" class="chat-token-info" :title="_chatTokenTitle(msg)" x-text="_chatTokenInfo(msg)"></div>
          <!-- @include chat-feedback -->
        </div>

        <!-- Änderungsvorschläge + Titelvarianten (nur Seiten-Chat) -->
        <!-- @include chat-vorschlaege -->
        <!-- @include chat-titel-varianten -->
      </div>
    </template>

    <div x-show="isChatSessionRunning(chatSessionId)" class="chat-skeleton-wrapper">
      <div class="chat-skeleton-line chat-skeleton-line--wide"></div>
      <div class="chat-skeleton-line chat-skeleton-line--narrow"></div>
    </div>
  </div>

  <div class="chat-input-row">
    <textarea
      class="chat-input"
      x-model="chatInput"
      :placeholder="$app.t('chat.placeholder')"
      :aria-label="$app.t('chat.placeholder')"
      rows="2"
      :disabled="chatLoading"
      @keydown.enter="if(!$event.isComposing && $event.keyCode !== 229 && !$event.shiftKey && !$event.ctrlKey && !$event.metaKey) { $event.preventDefault(); sendChatMessage(); }"
    ></textarea>
    <button type="button" class="chat-send-btn" @click="sendChatMessage()" :disabled="chatLoading || !chatInput.trim()" :aria-label="$app.t('chat.send')">
      <span x-show="chatLoading" class="spinner"></span>
      <svg x-show="!chatLoading" class="icon" aria-hidden="true"><use href="/icons.svg#arrow-up"/></svg>
    </button>
  </div>
  <div class="chat-input-hint" x-text="$app.t('chat.inputHint')"></div>

  <div x-show="chatSessions.length > 0" class="card-history-section">
    <div class="chat-history-title" x-text="$app.t('chat.history')"></div>
    <template x-for="s in chatSessions" :key="s.id">
      <div
        class="chat-session-item"
        :class="s.id === chatSessionId ? 'chat-session-item--active' : ''"
        @click="loadChatSession(s.id)"
      >
        <div class="chat-session-preview" x-text="(s.title || s.preview || $app.t('chat.previewEmpty')).slice(0, 80)"></div>
        <div class="chat-session-meta"><span x-show="isChatSessionRunning(s.id)" class="spinner chat-session-running" role="status" :aria-label="$app.t('chat.sessionRunning')" :data-tip="$app.t('chat.sessionRunning')"></span><span x-text="$app.formatDate(s.last_message_at)"></span></div>
        <button type="button" class="chat-session-delete btn-card-close" :disabled="isChatSessionRunning(s.id)" @click.stop="deleteChatSession(s.id)" :data-tip="$app.t('common.delete')" :aria-label="$app.t('common.delete')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg></button>
      </div>
    </template>
  </div>
</div>

<!-- Buch-Chat -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/book-chat-card.js.
-->
<div class="card card--chat" id="book-chat-card" x-data="bookChatCard" x-show="$app.showBookChatCard" x-cloak>
  <div class="card-header">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('chat.titleBook')"></span>
    </div>
    <div class="card-actions">
      <button type="button" class="icon-btn icon-btn--ghost" x-show="isBookChatSessionRunning(bookChatSessionId)" @click="cancelBookChatRun()" :data-tip="$app.t('chat.cancelRunTip')" :aria-label="$app.t('chat.cancelRun')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#square"/></svg>
      </button>
      <button type="button" class="icon-btn icon-btn--ghost" @click="startNewBookChatSession()" :disabled="bookChatLoading" :data-tip="$app.t('chat.newSessionTitle')" :aria-label="$app.t('chat.newSession')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
      </button>
    </div>
  </div>

  <div class="progress-bar-wrap" x-show="bookChatProgress > 0 && isBookChatSessionRunning(bookChatSessionId)">
    <div class="progress-bar" :style="{ '--progress': bookChatProgress + '%' }"></div>
  </div>
  <div x-show="bookChatStatus" class="card-status" x-html="bookChatStatus"></div>

  <div id="book-chat-messages" class="chat-messages">
    <div x-show="bookChatMessages.length === 0" class="chat-empty" x-text="$app.t('chat.emptyBook', { name: $app.selectedBookName || '' })"></div>

    <template x-for="(msg, msgIdx) in bookChatMessages" :key="msgIdx">
      <div :class="'chat-msg chat-msg--' + msg.role">
        <div class="chat-msg-bubble">
          <div x-show="msg.role === 'user'" class="chat-msg-text" x-text="msg.content"></div>
          <div x-show="msg.role === 'assistant'" class="chat-msg-text" x-html="_renderChatMarkdown(msg.content)"></div>
          <!-- Kontext-Info (nur Buch-Chat) -->
          <template x-if="msg.role === 'assistant' && msg.context_info">
            <div x-data="{ expanded: false }"
                 class="chat-context-info">
              <span class="chat-context-label" x-text="$app.t('chat.contextLabel')"></span>

              <!-- Agent-Modus: aufgerufene Werkzeuge -->
              <template x-if="msg.context_info.mode === 'agent'">
                <span>
                  <template x-if="msg.context_info.pre_context">
                    <span class="chat-context-badge"
                          x-text="$app.t('chat.ctxPreContext', { n: msg.context_info.pre_context.count })"></span>
                  </template>
                  <template x-for="(entry, ei) in _toolSummary(msg.context_info.tool_calls)" :key="ei">
                    <span class="chat-context-badge"
                          :class="{ 'chat-context-badge--error': entry.errors > 0 }"
                          x-text="entry.name + (entry.count > 1 ? ' ×' + entry.count : '')"></span>
                  </template>
                </span>
              </template>

              <!-- Klassischer Modus: vorausgewählte Seiten -->
              <template x-if="msg.context_info.mode !== 'agent' && Array.isArray(msg.context_info.pages)">
                <span class="entity-refs">
                  <template x-for="(p, pi) in (expanded ? msg.context_info.pages : (msg.context_info.pages || []).slice(0, 3))" :key="pi">
                    <button type="button" class="entity-ref"
                            x-entity-ref="{ type: 'seite', id: p.id || null, label: p.name }"></button>
                  </template>
                  <button type="button" x-show="(msg.context_info.pages || []).length > 3"
                          class="chat-context-toggle"
                          @click.stop="expanded = !expanded">
                    <template x-if="expanded"><svg class="icon" aria-hidden="true"><use href="/icons.svg#chevron-up"/></svg></template>
                    <template x-if="!expanded"><span x-text="'+' + ((msg.context_info.pages || []).length - 3)"></span></template>
                  </button>
                  <template x-if="msg.context_info.totalPages > (msg.context_info.pages || []).length">
                    <span class="chat-context-total" x-text="$app.t('chat.ofTotalPages', { n: msg.context_info.totalPages })"></span>
                  </template>
                  <template x-if="(msg.context_info.pages || []).length > 0">
                    <span class="chat-context-badge" x-text="$app.t('chat.ctxSeitentext')"></span>
                  </template>
                  <template x-if="msg.context_info.figuren">
                    <span class="chat-context-badge" x-text="$app.t('chat.ctxFiguren')"></span>
                  </template>
                  <template x-if="msg.context_info.review">
                    <span class="chat-context-badge" x-text="$app.t('chat.ctxReview')"></span>
                  </template>
                </span>
              </template>
            </div>
          </template>
          <!-- @include book-chat-msg-extras -->
          <div x-show="msg.role === 'assistant' && _chatTokenInfo(msg)" class="chat-token-info" :title="_chatTokenTitle(msg)" x-text="_chatTokenInfo(msg) + (_bookChatCost(msg) ? ' · ' + _bookChatCost(msg) : '')"></div>
          <!-- @include chat-feedback -->
        </div>
      </div>
    </template>

    <div x-show="isBookChatSessionRunning(bookChatSessionId)" class="chat-skeleton-wrapper">
      <div class="chat-skeleton-line chat-skeleton-line--wide"></div>
      <div class="chat-skeleton-line chat-skeleton-line--narrow"></div>
    </div>
  </div>

  <div class="chat-input-row">
    <textarea
      class="chat-input"
      x-model="bookChatInput"
      :placeholder="$app.t('chat.placeholderBook')"
      :aria-label="$app.t('chat.placeholderBook')"
      rows="2"
      :disabled="bookChatLoading"
      @keydown.enter="if(!$event.isComposing && $event.keyCode !== 229 && !$event.shiftKey && !$event.ctrlKey && !$event.metaKey) { $event.preventDefault(); sendBookChatMessage(); }"
    ></textarea>
    <button type="button" class="chat-send-btn" @click="sendBookChatMessage()" :disabled="bookChatLoading || !bookChatInput.trim()" :aria-label="$app.t('chat.send')">
      <span x-show="bookChatLoading" class="spinner"></span>
      <svg x-show="!bookChatLoading" class="icon" aria-hidden="true"><use href="/icons.svg#arrow-up"/></svg>
    </button>
  </div>
  <div class="chat-input-hint" x-text="$app.t('chat.inputHint')"></div>

  <div x-show="bookChatSessions.length > 0" class="card-history-section">
    <div class="chat-history-title" x-text="$app.t('chat.history')"></div>
    <template x-for="s in bookChatSessions" :key="s.id">
      <div
        class="chat-session-item"
        :class="s.id === bookChatSessionId ? 'chat-session-item--active' : ''"
        @click="loadBookChatSession(s.id)"
      >
        <div class="chat-session-preview" x-text="(s.title || s.preview || $app.t('chat.previewEmpty')).slice(0, 80)"></div>
        <div class="chat-session-meta"><span x-show="isBookChatSessionRunning(s.id)" class="spinner chat-session-running" role="status" :aria-label="$app.t('chat.sessionRunning')" :data-tip="$app.t('chat.sessionRunning')"></span><span x-text="$app.formatDate(s.last_message_at)"></span></div>
        <button type="button" class="chat-session-delete btn-card-close" :disabled="isBookChatSessionRunning(s.id)" @click.stop="deleteBookChatSession(s.id)" :data-tip="$app.t('common.delete')" :aria-label="$app.t('common.delete')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg></button>
      </div>
    </template>
  </div>
</div>
