  <!-- vis-network und Chart.js werden lazy aus public/js/lazy-libs.js nachgeladen,
       sobald die jeweilige Karte (Figuren-Graph / BookStats) geöffnet wird. -->
  <!-- Alpine self-hosted statt CDN: spart externen Roundtrip beim First-Load,
       wird vom Service-Worker zusammen mit der Shell gecached und funktioniert
       offline (Zug-Szenario). Pin per Dateiname; bumpen + SHELL_CACHE erhöhen. -->
  <!-- Alpine-Plugins — MÜSSEN vor dem Alpine-Core stehen, damit ihr
       alpine:init-Listener vor Alpine.start läuft (kein Lazy-Load möglich:
       der Core registriert für jede fehlende Plugin-Direktive einen Stub, der
       nur warnt). Reihenfolge unter den Plugins selbst ist beliebig.
         anchor   — Combobox-Positionierung (Floating UI), x-anchor
         focus    — x-trap für Overlays, die kein natives <dialog> sind
         collapse — x-collapse, animierte Höhe der `collapsible`-Panels
         resize   — x-resize, ResizeObserver als Direktive (nur Neucode) -->
  <script defer src="vendor/alpine-anchor-3.15.12.min.js"></script>
  <script defer src="vendor/alpine-focus-3.15.12.min.js"></script>
  <script defer src="vendor/alpine-collapse-3.15.12.min.js"></script>
  <script defer src="vendor/alpine-resize-3.15.12.min.js"></script>
  <script defer src="vendor/alpine-3.15.12.min.js"></script>
  <!-- Geteilter Tooltip-Layer für [data-tip]. -->
  <script type="module" src="js/tooltip.js"></script>
  <!-- Reichweitenmessung (Plausible, self-hosted). Einziges Gate ist der
       Admin-Toggle; das Script rendert server.js aus app_settings und liefert
       bei ausgeschaltetem Analytics ein no-op. `surface` benennt die Oberflaeche
       und wird als Property mitgeschickt. -->
  <script defer src="js/plausible-init.js?surface=app"></script>
</head>

<div class="site-header-row">
  <div class="site-header-center">
    <h1 @click="resetView()" class="site-title" :data-tip="t('app.titleReset')">
      <img src="schreibwerkstatt_icon.svg" alt="" class="site-logo" width="64" height="64">
      <span x-text="$store.shell.appName"></span>
    </h1>
    <p class="subtitle"><span x-text="t('app.subtitle')"></span></p>
  </div>
  <div class="header-actions" x-show="$store.session.currentUser">
    <div class="header-action-cluster" x-show="$store.session.currentUser && !isAdminOnly && komplettAvailable()" x-cloak>
      <div id="partial-komplett-status"></div>
    </div>
    <!-- Ring + Hilfe + Avatar bleiben eine Gruppe: bricht die Kopfzeile auf
         schmalen Viewports um, wandern sie gemeinsam in die Folgezeile, statt
         dass einer von ihnen einzeln ans Ende der Analyse-Zeile gerissen wird. -->
    <div class="header-action-icons">
      <!-- Heute-Ring im Header: Donut links neben Avatar. Pulsiert bei aktivem
           Schreibtag, fuellt sich gegen book_settings.daily_goal_chars (per Buch).
           Klick oeffnet das Tagesziel-Popover (Link darin fuehrt zu Meine Statistik). -->
      <template x-if="$store.session.currentUser && !isAdminOnly && $store.nav.selectedBookId && $store.progress.dailyProgressBookId == $store.nav.selectedBookId && !$store.progress.dailyProgressIsFinished">
        <span class="header-today-ring-wrap"
              @click.outside="$store.progress.popoverOpen = false"
              @keydown.escape.window="$store.progress.popoverOpen = false">
          <button type="button"
                  class="header-today-ring"
                  :class="{ 'header-today-ring--active': headerTodayRing().active, 'header-today-ring--reached': headerTodayRing().reached, 'header-today-ring--empty': !headerTodayRing().active }"
                  @click="$store.progress.popoverOpen = !$store.progress.popoverOpen"
                  :aria-expanded="$store.progress.popoverOpen"
                  :data-tip="headerTodayRing().active
                    ? t('overview.today.meta', { chars: headerTodayRing().chars.toLocaleString($store.shell.uiLocale === 'de' ? 'de-CH' : 'en-US'), goal: headerTodayRing().goal.toLocaleString($store.shell.uiLocale === 'de' ? 'de-CH' : 'en-US') })
                    : t('overview.today.idle')"
                  :aria-label="t('overview.today.aria', { chars: headerTodayRing().chars, goal: headerTodayRing().goal, pct: headerTodayRing().pct })">
            <svg viewBox="0 0 36 36" aria-hidden="true">
              <circle cx="18" cy="18" :r="headerTodayRing().r"
                      fill="none" stroke="var(--color-border)" stroke-width="4"></circle>
              <circle cx="18" cy="18" :r="headerTodayRing().r"
                      fill="none" stroke="var(--color-accent)" stroke-width="4"
                      stroke-linecap="round"
                      :stroke-dasharray="headerTodayRing().dash + ' ' + headerTodayRing().gap"
                      transform="rotate(-90 18 18)"></circle>
            </svg>
          </button>
          <div class="today-ring-popover" x-show="$store.progress.popoverOpen" x-cloak x-transition.opacity>
            <div class="today-ring-hero">
              <span class="today-ring-donut"
                    :class="{ 'today-ring-donut--reached': headerRingDetail().reached, 'today-ring-donut--empty': !headerRingDetail().active }">
                <svg viewBox="0 0 60 60" aria-hidden="true">
                  <circle cx="30" cy="30" :r="headerRingDetail().r" fill="none" stroke="var(--color-border)" stroke-width="5"></circle>
                  <circle cx="30" cy="30" :r="headerRingDetail().r" fill="none" stroke="var(--color-accent)" stroke-width="5"
                          stroke-linecap="round"
                          :stroke-dasharray="headerRingDetail().dash + ' ' + headerRingDetail().gap"
                          transform="rotate(-90 30 30)"></circle>
                </svg>
                <span class="today-ring-donut-pct" x-text="headerTodayRing().pct + '%'"></span>
              </span>
              <span class="today-ring-hero-text">
                <span class="today-ring-pop-label" x-text="t('todayRing.today')"></span>
                <span class="today-ring-hero-count">
                  <strong x-text="headerTodayRing().chars.toLocaleString($store.shell.uiLocale === 'de' ? 'de-CH' : 'en-US')"></strong>
                  <span x-text="' / ' + headerTodayRing().goal.toLocaleString($store.shell.uiLocale === 'de' ? 'de-CH' : 'en-US') + ' ' + t('bookstats.unit.z')"></span>
                </span>
                <span class="today-ring-hero-streak" x-show="headerStreak() > 0"
                      x-text="t('todayRing.streak') + ': ' + t('mystats.days', { n: headerStreak() })"></span>
              </span>
            </div>

            <div class="today-ring-week-wrap">
              <span class="today-ring-pop-label" x-text="t('todayRing.week')"></span>
              <div class="today-ring-week" role="img" :aria-label="t('todayRing.week')">
                <template x-for="bar in headerWeekBars()" :key="bar.iso">
                  <span class="today-ring-week-col">
                    <span class="today-ring-week-track">
                      <span class="today-ring-week-bar"
                            :class="{ 'today-ring-week-bar--today': bar.isToday, 'today-ring-week-bar--reached': bar.reached }"
                            :style="{ '--bar': Math.max(bar.chars > 0 ? 10 : 3, bar.pct) + '%' }"
                            :data-tip="bar.chars.toLocaleString($store.shell.uiLocale === 'de' ? 'de-CH' : 'en-US') + ' ' + t('bookstats.unit.z')"></span>
                    </span>
                    <span class="today-ring-week-day" :class="{ 'today-ring-week-day--today': bar.isToday }"
                          x-text="headerWeekBarLabel(bar.iso)"></span>
                  </span>
                </template>
              </div>
            </div>

            <button type="button" class="today-ring-pop-link internal-link"
                    @click="$store.progress.popoverOpen = false; toggleMyStatsCard()">
              <span x-text="t('todayRing.fullStats')"></span>
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#arrow-right"/></svg>
            </button>
          </div>
        </span>
      </template>
      <button type="button"
              class="icon-btn icon-btn--ghost header-help-btn"
              x-show="$store.session.currentUser && !isAdminOnly"
              x-cloak
              :aria-pressed="showHelpCard"

        <svg class="icon" aria-hidden="true"><use href="/icons.svg#circle-help"/></svg>
      </button>
      <div id="partial-avatar-menu"></div>
    </div>
  </div>

<!-- Buchwahl + Kontext-Leiste: eine Zeile = Buchwahl links + breiter

<!-- Globale Sidebar-Tooltips (position: fixed; per Hover aus dem Sidebar-
     Markup gefüttert). Hier oben, nicht im Sidebar-Partial — sonst
     dupliziert sich das Markup wenn die Sidebar irgendwann mehrfach gemountet
     wird. -->
<div x-show="showTokLegend"
     x-transition:enter="tok-tt-enter" x-transition:enter-start="tok-tt-hidden" x-transition:enter-end="tok-tt-visible"
     x-transition:leave="tok-tt-enter" x-transition:leave-start="tok-tt-visible" x-transition:leave-end="tok-tt-hidden"
     :style="`left:${tokLegendPos.x}px; top:${tokLegendPos.y - 8}px`"
     class="tok-tooltip"
     @mouseleave="_hideTokTip()"
     x-cloak>
  <div class="tok-tt-row" x-text="tokTooltipData ? t('tok.words', { n: (tokTooltipData.words >= 1000 ? '~' + Math.round(tokTooltipData.words/1000) + 'k' : tokTooltipData.words) }) : ''"></div>
  <div class="tok-tt-row" x-show="tokTooltipData" x-text="tokTooltipData ? t('tok.normseiten', { n: (Math.round((tokTooltipData.chars||0)/1500 * 10) / 10).toLocaleString(_numLocale, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) }) : ''"></div>
  <div class="tok-tt-row" x-show="tokTooltipData && !tokTooltipData._chapterOnly" x-text="tokTooltipData ? t('tok.tokens', { n: (tokTooltipData.tok >= 1000 ? Math.round(tokTooltipData.tok/1000) + 'k' : tokTooltipData.tok) }) : ''"></div>
</div>
<div x-show="showPageStatusTip"
     x-transition:enter="tok-tt-enter" x-transition:enter-start="tok-tt-hidden" x-transition:enter-end="tok-tt-visible"
     x-transition:leave="tok-tt-enter" x-transition:leave-start="tok-tt-visible" x-transition:leave-end="tok-tt-hidden"
     :style="`left:${pageStatusTipPos.x}px; top:${pageStatusTipPos.y - 8}px`"
     class="tok-tooltip page-status-tip"
     x-cloak>
  <template x-for="line in pageStatusTipLines" :key="line">
    <div class="tok-tt-row" x-text="line"></div>
  </template>
</div>

<!-- Confirm-/Prompt-Dialog (Ersatz für window.confirm + window.prompt;
     siehe appConfirm / appPrompt in app-chrome.js).
     Native <dialog> + showModal(): Focus-Trap, Inert-Hintergrund, ESC-Routing
     via cancel-Event. Click auf ::backdrop schliesst (Listener in app-chrome). -->
<dialog id="app-confirm-dialog" class="confirm-dialog"
        x-ref="confirmDialog"
        @cancel.prevent="_resolveConfirmDialog(false)"
        @click="if ($event.target === $el) _resolveConfirmDialog(false)">
  <div class="confirm-dialog-message" x-text="confirmDialogMessage"></div>
  <input type="text" class="confirm-dialog-input"
         x-show="confirmDialogInput"
         x-ref="confirmDialogInput"
         x-model="confirmDialogInputValue"
         :placeholder="confirmDialogInputPlaceholder"
         autocomplete="off" data-bwignore data-1p-ignore data-lpignore="true" data-form-type="other"
         data-spellcheck="spelling"
         @keydown.enter.prevent="_resolveConfirmDialog(true)">
  <div class="confirm-dialog-actions">
    <button type="button" class="confirm-dialog-btn confirm-dialog-btn--cancel"
            x-show="confirmDialogCancelLabel"
            @click="_resolveConfirmDialog(false)" x-text="confirmDialogCancelLabel"></button>
    <button type="button" class="confirm-dialog-btn"
            :class="confirmDialogDanger ? 'confirm-dialog-btn--danger' : 'confirm-dialog-btn--primary'"
            x-ref="confirmDialogConfirmBtn"
            @click="_resolveConfirmDialog(true)"
            x-text="confirmDialogConfirmLabel"></button>
  </div>
</dialog>

<!-- Buch-erstellen-Modal (Trigger: Combobox-Footer "+ Neues Buch …") -->
<dialog id="book-create-dialog" class="book-create-dialog"
        x-data="bookCreateCard"
        x-ref="bookCreateDialog"
        @cancel.prevent="if (!bookCreateBusy) cancelCreateBook()"
        @click="if ($event.target === $el && !bookCreateBusy) cancelCreateBook()">
  <div class="book-create-title" x-text="$app.t('book.create.title')"></div>
  <input type="text"
         class="book-create-input"
         x-ref="bookCreateInput"
         x-model="bookCreateName"
         maxlength="255"
         :placeholder="$app.t('book.create.namePlaceholder')"
         :aria-label="$app.t('book.create.nameLabel')"
         :disabled="bookCreateBusy"
         @keydown.enter.prevent="submitCreateBook()">
  <div class="book-create-field">
    <label class="book-create-label" x-text="$app.t('book.create.buchtypLabel')"></label>
    <div x-data="combobox(() => $app.t('book.create.buchtypLabel'))"
         x-modelable="value" x-model="bookCreateBuchtyp"
         x-effect="options = bookCreateBuchtypOptions()"></div>
  </div>
  <div class="book-create-field" x-show="bookCreateCategoryPool.length > 0" x-cloak>
    <label class="book-create-label" x-text="$app.t('book.create.categoryLabel')"></label>
    <div x-data="combobox(() => $app.t('book.create.categoryLabel'))"
         x-modelable="value" x-model="bookCreateCategoryId"
         x-effect="options = bookCreateCategoryOptions()"></div>
  </div>
  <div class="book-create-error" x-show="bookCreateError" x-cloak x-text="bookCreateError"></div>
  <div class="book-create-actions">
    <button type="button" class="book-create-btn book-create-btn--cancel"
            :disabled="bookCreateBusy"
            @click="cancelCreateBook()"
            x-text="$app.t('book.create.cancel')"></button>
    <button type="button" class="book-create-btn book-create-btn--primary"
            :disabled="bookCreateBusy || !bookCreateName.trim()"
            @click="submitCreateBook()">
      <span x-show="!bookCreateBusy" x-text="$app.t('book.create.submit')"></span>
      <span x-show="bookCreateBusy" x-cloak x-text="$app.t('book.create.submitting')"></span>
    </button>
  </div>
</dialog>

<!-- Job-Queue Footer -->
<div class="job-queue-bar" x-show="$store.jobs.jobQueueItems.length > 0" x-cloak aria-live="polite" aria-atomic="false">
  <span class="job-queue-label" x-text="t('jobQueue.label')"></span>
  <template x-for="job in ($store.jobs.jobQueueExpanded ? $store.jobs.jobQueueItems : $store.jobs.jobQueueItems.slice(0, 3))" :key="job.id">
    <div class="job-queue-pill" :class="'job-queue-pill--' + job.status" @click="navigateToJob(job)" :data-tip="t('jobQueue.jumpTo')">
      <span class="job-queue-pill-label" x-text="t(job.label, job.labelParams)"></span>
      <span class="job-queue-pill-status" x-text="t(job.statusText, job.statusParams)"></span>
      <template x-if="job.status === 'running' && job.progress > 0">
        <span class="job-queue-pill-progress" x-text="job.progress + '%'"></span>
      </template>
      <button type="button" class="job-queue-cancel-btn" @click.stop="cancelJob(job.id)" :data-tip="t('jobQueue.cancel')" :aria-label="t('jobQueue.cancel')"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
    </div>
  </template>
  <button type="button"
          class="job-queue-toggle-btn"
          x-show="$store.jobs.jobQueueItems.length > 3"
          @click="$store.jobs.jobQueueExpanded = !$store.jobs.jobQueueExpanded"
          :data-tip="$store.jobs.jobQueueExpanded ? t('jobQueue.collapse') : t('jobQueue.expand', { count: $store.jobs.jobQueueItems.length - 3 })"
          :aria-label="$store.jobs.jobQueueExpanded ? t('jobQueue.collapse') : t('jobQueue.expand', { count: $store.jobs.jobQueueItems.length - 3 })"
          x-text="$store.jobs.jobQueueExpanded ? '−' : '+' + ($store.jobs.jobQueueItems.length - 3)"></button>
</div>
