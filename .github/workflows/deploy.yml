name: CI + Deploy

on:
  pull_request:
  push:
    branches: [main]

# Der Runner teilt sich den LXC mit der Prod-App (und Bookstack) auf Ceph-RBD.
# Zwei gleichzeitige Laeufe verdoppeln die IO-Last exakt dort, wo sie am meisten
# weh tut. Darum serialisieren statt parallelisieren: PR-Laeufe werden vom
# Nachfolger abgeloest, main-Pushes reihen sich an (ein laufender Deploy darf
# nicht mittendrin abgebrochen werden).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks-and-unit:
    name: Static Checks + Unit-Tests
    # Fork-PRs (head.repo.full_name != eigener Repo) laufen auf GitHub-Infra,
    # damit fremder Code nie auf dem Prod-LXC-Runner landet. Eigene PRs und
    # main-Pushes bleiben auf dem self-hosted Runner ( schnell, shared Cache).
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJson('["self-hosted","prod"]') }}
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Wegwerf-DB auf tmpfs (RAM) statt Ceph-RBD-Storage: eliminiert alle
      # SQLite-Writes der Integration-Job-Pipelines vom langsamen Netz-Storage.
      DB_PATH: /dev/shm/lektorat-ci-${{ github.run_id }}.db

    steps:
      # clean: false — der Default (`git clean -ffdx`) loescht node_modules, was
      # auf dem Netz-Storage 12k Datei-Deletes + anschliessend 12k Neuschreibungen
      # bedeutet. Der Workspace wird stattdessen unten gezielt geputzt.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Workspace putzen (node_modules bewusst ausgenommen)
        run: git clean -ffdx -e node_modules

      - name: Frische DB pro Run (self-hosted Runner persistiert sonst schreibwerkstatt.db)
        run: rm -f "$DB_PATH" "${DB_PATH}-shm" "${DB_PATH}-wal"

      # Kein actions/cache: auf einem Self-hosted-Runner ueberlebt node_modules
      # den Lauf ohnehin (siehe clean: false). Ein Cache-Restore wuerde 189 MB
      # ueber exakt die Dateien entpacken, die schon dastehen. Stattdessen
      # Stempel im node_modules-Baum: faellt der Ordner weg, faellt der Stempel
      # mit und `npm ci` laeuft automatisch wieder.
      - name: Deps installieren (nur bei geaendertem Lockfile)
        run: |
          set -e
          stamp=node_modules/.ci-lock-sha
          want=$(sha256sum package-lock.json | cut -d' ' -f1)
          if [ "$(cat "$stamp" 2>/dev/null)" = "$want" ]; then
            echo "node_modules aktuell (${want:0:12}) — Install uebersprungen"
          else
            npm ci --prefer-offline --no-audit --no-fund
            echo "$want" > "$stamp"
          fi

      - name: Syntax-Check (node --check auf allen JS-/MJS-Dateien)
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f" 2>&1; then
              echo "::error file=$f::Syntaxfehler"
              fail=1
            fi
          done < <(find server.js logger.js lib routes db public/js scripts tools -type f \( -name '*.js' -o -name '*.mjs' \) 2>/dev/null)
          exit $fail

      # Faengt benutzte-aber-nicht-importierte Symbole und Zugriffe auf fehlende
      # Exporte in public/js und im Server-Teil (entsteht beim Aufteilen von
      # Modulen). Der Syntax-Check oben sieht das nicht — die Datei ist ja
      # syntaktisch gueltig; es knallt erst zur Laufzeit.
      - name: Import-Gate (fehlende Imports/Exporte)
        run: npm run test:imports

      - name: Prompt-Config validieren
        run: node scripts/validate-prompt-config.js

      - name: Boot-Smoke (Server startet, /config → 401)
        run: node scripts/boot-smoke.js

      - name: Architektur-Guards (grep-basiert)
        run: |
          set -e
          status=0

          echo "→ Keine statischen Inline-Styles in HTML (style=\"...\")"
          hits=$(grep -rEn '(^|[[:space:]])style="' public/partials public/index.html 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::Statische Inline-Styles gefunden — bitte in style.css auslagern:"
            echo "$hits"
            status=1
          fi

          echo "→ Keine <style>-Blöcke in HTML"
          hits=$(grep -rn --include='*.html' '<style' public/ 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::<style>-Blöcke gefunden — alle Styles gehören in public/style.css:"
            echo "$hits"
            status=1
          fi

          echo "→ JSON_ONLY-Konstante nur in public/js/prompts.js oder public/js/prompts/ (Kommentare ignoriert)"
          hits=$(grep -rHn 'JSON_ONLY' public/js routes lib 2>/dev/null \
                 | grep -v '^public/js/prompts.js:' \
                 | grep -v '^public/js/prompts/' \
                 | grep -Ev '//[^"]*JSON_ONLY' \
                 | grep -Ev '^[^:]+:[0-9]+:[[:space:]]*\*' || true)
          if [ -n "$hits" ]; then
            echo "::error::JSON_ONLY ausserhalb prompts.js / prompts/ referenziert — Prompts gehören nach public/js/prompts.js bzw. public/js/prompts/:"
            echo "$hits"
            status=1
          fi

          echo "→ callAI nur in routes/jobs/ und routes/chat.js"
          hits=$(grep -rln 'callAI(' routes lib 2>/dev/null \
                 | grep -v '^routes/jobs/' \
                 | grep -v '^routes/chat.js$' \
                 | grep -v '^lib/ai.js$' \
                 | grep -v '^lib/ai/' || true)
          if [ -n "$hits" ]; then
            echo "::error::callAI ausserhalb Job-Queue/Chat — KI-Calls müssen als Job-Typ implementiert werden:"
            echo "$hits"
            status=1
          fi

          exit $status

      - name: Unit-Tests ausführen
        run: npm run test:unit

      - name: Integration-Tests ausführen (Job-Pipeline mit Mock-AI)
        run: npm run test:integration

      # Bundle gegen main beider Client-Repos (contract/README.md): eine
      # fehlende Kontaktstelle bricht einen ausgelieferten macOS-/Android-Client
      # und ist rot. Exit 3 = Repo nicht erreichbar → Warnung, kein Bruch: ein
      # GitHub-Ausfall soll keinen Deploy blockieren. „Undeklariert" warnt nur
      # (der Client nutzt etwas, das nicht in contract/editor-surface.json steht).
      - name: Client-Kompatibilität (Editor-Bundle gegen macOS + Android)
        run: |
          set +e
          node scripts/check-clients-compat.js
          rc=$?
          if [ $rc -eq 3 ]; then echo "::warning::Client-Repos nicht erreichbar — Kompatibilität ungeprüft"; exit 0; fi
          exit $rc

  e2e:
    name: Playwright-E2E
    # Fork-PRs auf GitHub-Infra (siehe checks-and-unit) — fremder Code nie auf
    # dem Prod-Runner. Eigene PRs/main-Pushes bleiben self-hosted (Browser-Cache).
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJson('["self-hosted","prod"]') }}
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Workspace putzen (node_modules bewusst ausgenommen)
        run: git clean -ffdx -e node_modules

      - name: Deps installieren (nur bei geaendertem Lockfile)
        run: |
          set -e
          stamp=node_modules/.ci-lock-sha
          want=$(sha256sum package-lock.json | cut -d' ' -f1)
          if [ "$(cat "$stamp" 2>/dev/null)" = "$want" ]; then
            echo "node_modules aktuell (${want:0:12}) — Install uebersprungen"
          else
            npm ci --prefer-offline --no-audit --no-fund
            echo "$want" > "$stamp"
          fi

      # Zwei Engines: die Suite läuft auf Chromium, `*.webkit.spec.js` deckt die
      # Fehlerklassen ab, die nur WebKit zeigt (contenteditable-Selektion bei
      # Padding-Summe >= clientHeight) — siehe projects in playwright.config.js.
      #
      # Kein actions/cache: ~/.cache/ms-playwright liegt ausserhalb des
      # Workspaces und ueberlebt auf einem Self-hosted-Runner jeden Lauf — ein
      # Restore wuerde ~500 MB ueber bereits vorhandene Dateien entpacken.
      # `playwright install` ist selbst idempotent und laedt nur fehlende
      # Browser-Versionen nach. `--with-deps` (apt-get, jedes Mal IO + Netz) nur
      # beim allerersten Lauf auf einem frischen Runner.
      - name: Browser sicherstellen
        run: |
          if [ -d "$HOME/.cache/ms-playwright" ]; then
            npx playwright install chromium webkit
          else
            npx playwright install --with-deps chromium webkit
          fi

      - name: E2E-Tests ausführen
        run: npx playwright test --reporter=list

  # Echte App (playwright.app.config.js, tests/e2e-app/ inkl. smoke.spec.js):
  # bootet `node server.js` mit LOCAL_DEV_MODE + Dev-Seed auf Wegwerf-DBs unter
  # tests/.tmp/ (Ports 8766/8767). Nur diese Schicht faengt Alpine-Expression-
  # Fehler ueber dem kompletten Template-Baum und die Geometrie-Invarianten, die
  # am vollen Shell-CSS haengen — das Fixture-Harness oben sieht beides nicht.
  # Eigener Job statt Step im e2e-Job: ein roter Smoke soll im Checks-Tab als
  # solcher erkennbar sein. Auf dem einen Self-hosted-Runner laufen die Jobs
  # ohnehin nacheinander, parallele Port-Kollisionen gibt es dort nicht.
  #
  # Nur Chromium: das firefox-Projekt der Config bleibt lokal (`npm run
  # test:smoke`); SMOKE_ENGINES=chromium laesst auch dessen Server weg.
  e2e-app:
    name: Playwright gegen die echte App (Smoke + App-Specs)
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJson('["self-hosted","prod"]') }}
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Workspace putzen (node_modules bewusst ausgenommen)
        run: git clean -ffdx -e node_modules

      - name: Deps installieren (nur bei geaendertem Lockfile)
        run: |
          set -e
          stamp=node_modules/.ci-lock-sha
          want=$(sha256sum package-lock.json | cut -d' ' -f1)
          if [ "$(cat "$stamp" 2>/dev/null)" = "$want" ]; then
            echo "node_modules aktuell (${want:0:12}) — Install uebersprungen"
          else
            npm ci --prefer-offline --no-audit --no-fund
            echo "$want" > "$stamp"
          fi

      - name: Browser sicherstellen
        run: |
          if [ -d "$HOME/.cache/ms-playwright" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Zwei Shards gleichzeitig, je mit eigenem Server + eigener Wegwerf-DB
      # (SMOKE_SHARD → Ports/DB/outputDir, siehe playwright.app.config.js). Pro
      # Shard bleibt `workers: 1`, die Specs einer Datei-Gruppe teilen weiter
      # genau einen Seed-Stand. Seriell brauchte die Suite ~4,5 min fast nur
      # fuer den Grundaufwand pro Test (Browser + SPA-Boot), nicht fuer IO.
      # Mehr als zwei nicht: ein Shard belegt ~1,3 GB, der LXC teilt seine 6 GB
      # mit der Prod-App. Ausgabe pro Shard gepuffert und danach am Stueck
      # ausgegeben, damit die Reports nicht ineinanderlaufen.
      - name: App-Specs ausführen (Chromium, 2 Shards)
        env:
          SMOKE_ENGINES: chromium
        run: |
          n=2
          for i in $(seq 1 $n); do
            SMOKE_SHARD=$i npx playwright test --config=playwright.app.config.js \
              --project=chromium --shard=$i/$n --reporter=list > "shard-$i.log" 2>&1 &
            pids[$i]=$!
          done
          status=0
          for i in $(seq 1 $n); do
            if ! wait "${pids[$i]}"; then status=1; echo "::error::App-Specs Shard $i/$n rot"; fi
          done
          for i in $(seq 1 $n); do
            echo "::group::Shard $i/$n"; cat "shard-$i.log"; echo "::endgroup::"
          done
          # Zusammenfassung ausserhalb der Gruppen, damit sie ohne Aufklappen sichtbar ist.
          for i in $(seq 1 $n); do
            echo "Shard $i/$n: $(grep -E '^\s+[0-9]+ (passed|failed|flaky|skipped)' "shard-$i.log" | tr -s ' ' | tr '\n' ' ')"
          done
          exit $status

  deploy:
    name: Deploy auf Prod-LXC
    needs: [checks-and-unit, e2e, e2e-app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, prod]
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # clean: false auch hier — sonst loescht der Deploy-Job das node_modules,
      # das die beiden Test-Jobs im selben Workspace stehen lassen, und der
      # naechste Lauf muesste zwingend neu installieren.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Workspace putzen (node_modules bewusst ausgenommen)
        run: git clean -ffdx -e node_modules

      - name: Deploy
        run: bash deploy/deploy.sh

  # Demo-Instanz auf eigener LXC, eigener Runner (Label `demo`). Bewusst KEIN
  # `needs: deploy`: die beiden Ziele sind unabhaengig, ein Prod-Fehler soll die
  # Demo nicht auf einem alten Stand einfrieren (und umgekehrt). Beide haengen
  # aber an denselben Tests — die Demo bekommt nie einen ungetesteten Commit.
  #
  # Auf der Demo-LXC laufen keine Tests: der Runner dort braucht nur Node +
  # rsync + systemctl-Rechte, kein Playwright und kein node_modules im Workspace.
  deploy-demo:
    name: Deploy auf Demo-LXC
    needs: [checks-and-unit, e2e, e2e-app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, demo]
    # Kein `environment:` wie bei Prod: die Demo braucht keine Repo-Secrets (ihre
    # Credentials stehen in der .env auf der Instanz) und keine Approval-Gate.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Muessen zur Installation passen (deploy/install-demo.sh, gleiche
      # Defaults). Wer die Demo mit abweichendem INSTALL_DIR/SERVICE/PORT/
      # RUN_USER installiert hat, zieht die Werte hier nach — sonst deployt der
      # Job an einen Pfad, den kein Service liest.
      SW_FLAVOUR: demo
      SW_INSTALL_DIR: /opt/schreibwerkstatt-demo
      SW_SERVICE: schreibwerkstatt-demo
      SW_OWNER: swdemo
      SW_PORT: '3738'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Workspace putzen (node_modules bewusst ausgenommen)
        run: git clean -ffdx -e node_modules

      - name: Deploy
        run: bash deploy/deploy.sh

      # Der Golden-Snapshot wird hier absichtlich NICHT neu aufgenommen — er
      # wuerde den Stand festschreiben, den der letzte Reviewer hinterlassen hat.
      # Die Ausgabe zeigt stattdessen, wie alt er ist: ein Snapshot, der viele
      # Schemaversionen zurueckliegt, ist ein Hinweis, ihn bewusst zu erneuern.
      # `|| true`: rein informativ — ein fehlender Snapshot oder eine nicht
      # lesbare .env darf einen erfolgreichen Deploy nicht rot faerben.
      - name: Reset-Zustand anzeigen
        run: bash deploy/demo-reset.sh status "$SW_INSTALL_DIR/.env" || true
