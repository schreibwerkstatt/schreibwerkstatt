<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <title>Tagebuch-Rückblick Test Harness</title>
  <link rel="stylesheet" href="/public/css/tokens.css">
  <link rel="stylesheet" href="/public/css/components/year-month-heatmap.css">
  <link rel="stylesheet" href="/public/css/page/tagebuch-rueckblick.css">
  <style>
    body { margin: 0; padding: 24px; font: 16px/1.5 system-ui, sans-serif; }
  </style>
</head>
<body>
  <!-- Slim-Variante des Partials. Combobox durch <select> ersetzt (wie das
       Ereignisse-Harness die catalogFilter-Combobox umgeht). Render-Block für
       Themen/Tage/Zusammenfassung/Belege nach dem Partial (data-test-Hooks). -->
  <div id="root" class="card card--tagebuchRueckblick" x-data="tagebuchRueckblickCard" x-show="$app.showTagebuchRueckblickCard">
    <div class="card-actions rb-actions">
      <select data-test="zeitraum" x-model="rueckblickZeitraum">
        <option value="">—</option>
        <template x-for="opt in availableZeitraeume()" :key="opt.value">
          <option :value="opt.value" x-text="opt.label"></option>
        </template>
      </select>
      <button type="button" data-test="run" @click="runTagebuchRueckblick()" :disabled="!canRunRueckblick()">
        <span x-text="rbLatestEntry() ? 'rerun' : 'run'"></span>
      </button>
    </div>

    <p data-test="fresh" x-text="rueckblickFreshness().state"></p>
    <div class="rb-empty" data-test="empty" x-show="rueckblickEmpty">leer</div>

    <div class="rb-result" data-test="result" x-show="hasRueckblickResult()">
      <div class="rb-summary" data-test="summary">
        <template x-for="(para, i) in rueckblickParagraphs()" :key="i">
          <p x-text="para"></p>
        </template>
      </div>
      <div class="rb-facets">
        <span class="rb-facet-chips" data-test="themen">
          <template x-for="(t, i) in rbThemen()" :key="i">
            <button type="button" class="rb-chip" :data-test="'theme-' + t.label"
                    :class="{ 'rb-chip--active': rbBeleg.key === 'themen:'+t.label }"
                    @click="toggleBeleg('themen:'+t.label, t.label, t.belege)">
              <span x-text="t.label"></span><span class="rb-chip-count" x-show="t.haeufigkeit > 1" x-text="t.haeufigkeit"></span>
            </button>
          </template>
        </span>
        <!-- Belegtage des aktiven Stichworts (inline) -->
        <div class="rb-belege-strip" data-test="belege-strip" x-show="rbBeleg.key">
          <div class="rb-timeline" data-test="timeline">
            <template x-for="tk in rbTimeline()" :key="tk.datum">
              <span class="rb-timeline-tick" :class="{ 'rb-timeline-tick--hit': tk.beleg }" :style="{ '--pos': tk.pos + '%' }"></span>
            </template>
          </div>
          <span class="rb-belege-strip-label" x-text="rbBeleg.label"></span>
          <span class="rb-belege-strip-days">
            <template x-for="(d, i) in rbBeleg.belege" :key="i">
              <button type="button" class="rb-belege-day" :data-test="'beleg-' + d" @click="gotoBelegTag(d)" x-text="belegLabel(d)"></button>
            </template>
          </span>
        </div>
      </div>
      <ul class="rb-tage" data-test="tage">
        <template x-for="(tag, i) in (rueckblickResult?.bemerkenswerteTage || [])" :key="i">
          <li class="rb-tag-item">
            <button type="button" class="rb-tag-datum" :data-test="'tag-' + tag.datum" @click="gotoRueckblickTag(tag.datum)"
                    :disabled="!canGotoTag(tag.datum)" x-text="tag.datum"></button>
            <span class="rb-tag-text" x-text="tag.begruendung"></span>
          </li>
        </template>
      </ul>
    </div>

    <div class="card-history-section" data-test="history" x-show="rueckblickHistory.length > 0">
      <input type="text" class="rb-history-search" data-test="history-search" x-model="rbHistorySearch" placeholder="suche">
      <template x-for="entry in filteredRueckblickHistory()" :key="entry.id">
        <div class="history-item" :data-test="'hist-' + entry.id" @click="openRueckblickHistory(entry)">
          <span class="rb-history-zeitraum" x-text="zeitraumLabel(entry.zeitraum)"></span>
          <span class="history-date" x-text="rueckblickEntryDate(entry.created_at)"></span>
          <button type="button" :data-test="'hist-del-' + entry.id" @click.stop="deleteRueckblickHistory(entry.id)">x</button>
        </div>
      </template>
    </div>

  </div>

  <script type="module">
    const { registerTagebuchRueckblickCard } = await import('/public/js/cards/tagebuch-rueckblick-card.js');

    // fetch stubben: active-job-Check (onVisible) + Run-POST liefern harmlose
    // Antworten, damit kein Netzwerkfehler den Console-Guard auslöst.
    const _resp = (obj) => ({ ok: true, status: 200, json: async () => obj, clone() { return _resp(obj); } });
    window.__selectedTag = null;
    // History-Liste: nur Metadaten; Ergebnisse kommen per /history/rueckblick-entry/:id.
    window.__MOCK_RESULTS = {
      11: { themen: [{ label: 'April-Thema', haeufigkeit: 1, belege: ['2024-04-02'] }], personen: [], orte: [], bemerkenswerteTage: [], zusammenfassung: 'April-Rückblick.' },
      12: { themen: [], personen: [], orte: [], bemerkenswerteTage: [], zusammenfassung: 'März-Rückblick.' },
    };
    window.__MOCK_HISTORY = [
      { id: 11, zeitraum: '2024-04', model: 'claude', entry_count: 1, created_at: '2024-05-01T09:00:00Z' },
      { id: 12, zeitraum: '2024-03', model: 'claude', entry_count: 2, created_at: '2024-04-01T09:00:00Z' },
    ];
    // Coverage = Server-SSoT der Datierung (routes/jobs/rueckblick-dates.js).
    window.__MOCK_COVERAGE = {
      months: {
        '2023-12': { entries: 1, newest: 0, rueckblick: null },
        '2024-03': { entries: 2, newest: 0, rueckblick: { id: 12, created_at: '2024-04-01T09:00:00Z' } },
        '2024-04': { entries: 1, newest: 0, rueckblick: { id: 11, created_at: '2024-05-01T09:00:00Z' } },
      },
      years: {
        '2023': { entries: 1, newest: 0, rueckblick: null },
        '2024': { entries: 3, newest: 0, rueckblick: null },
      },
      days: { '2023-12-31': 4, '2024-03-04': 1, '2024-03-15': 2, '2024-04-02': 3 },
      minYear: 2023, maxYear: 2024,
    };
    window.fetch = async (url, opts) => {
      const u = String(url);
      if (u.includes('/jobs/active')) return _resp({ jobId: null });
      if (u.includes('/jobs/rueckblick')) return _resp({ jobId: 'mock-job-1' });
      if (u.includes('/history/rueckblick-coverage/')) return _resp(window.__MOCK_COVERAGE);
      if (u.includes('/history/rueckblick-search/')) {
        const q = decodeURIComponent(u.split('q=')[1] || '').toLowerCase();
        const ids = Object.entries(window.__MOCK_RESULTS)
          .filter(([, r]) => JSON.stringify(r).toLowerCase().includes(q)).map(([id]) => Number(id));
        return _resp({ ids });
      }
      const entry = /\/history\/rueckblick-entry\/(\d+)/.exec(u);
      if (entry) {
        const id = Number(entry[1]);
        const meta = window.__MOCK_HISTORY.find(e => e.id === id);
        return _resp({ ...meta, result_json: window.__MOCK_RESULTS[id] });
      }
      if (u.includes('/history/rueckblick/')) {
        if (opts?.method === 'DELETE') return _resp({ ok: true });
        return _resp({ current_model: 'claude', entries: window.__MOCK_HISTORY });
      }
      return _resp({});
    };

    const PAGES = [
      { id: 1, name: '2024-03-04' },
      { id: 2, name: '2024-03-15' },
      { id: 3, name: '2024-04-02' },
      { id: 4, name: '2023-12-31' },
      { id: 5, name: 'Über mich' }, // nicht datiert → ignoriert
    ];

    document.addEventListener('alpine:init', () => {
      window.__app = window.Alpine.reactive({
        selectedBookId: 1,
        selectedBookName: 'Mein Tagebuch',
        // Start false; nach Mount auf true geflippt → $watch fängt die steigende
        // Flanke (wie im echten App-Pfad: Partial-Inject vor Flag-Set) und ruft
        // onShow → onOpen (Default-Zeitraum).
        showTagebuchRueckblickCard: false,
        uiLocale: 'de',
        pages: PAGES,
        t: (k, params) => params ? `${k} ${JSON.stringify(params)}` : k,
        selectPage: (p) => { window.__selectedTag = p?.name || null; },
      });
      window.Alpine.magic('app', () => window.__app);
      // Nav-State lebt in Alpine.store('nav') (kein Root-Proxy mehr). Die Permalink-
      // Spiegel rueckblickEntryId/pendingRueckblickZeitraum liegen ebenfalls hier.
      window.Alpine.store('nav', { books: [], selectedBookId: 1, pages: PAGES, tree: [], rueckblickEntryId: null, pendingRueckblickZeitraum: null });
      // Shell-State (App-Meta) lebt in Alpine.store('shell') — tagebuch-rueckblick.js
      // liest Alpine.store('shell').uiLocale (Datums-Locale).
      window.Alpine.store('shell', { uiLocale: 'de' });
      registerTagebuchRueckblickCard();
    });

    document.addEventListener('alpine:initialized', () => {
      // Steigende Flanke des Show-Flags auslösen (onShow → onOpen).
      window.__app.showTagebuchRueckblickCard = true;
      setTimeout(() => { window.__harnessReady = true; }, 50);
    });

    const s = document.createElement('script');
    s.src = '/public/vendor/alpine-3.15.12.min.js';
    document.head.appendChild(s);
  </script>
</body>
</html>
