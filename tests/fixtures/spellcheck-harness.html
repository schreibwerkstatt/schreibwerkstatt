<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <title>Spellcheck Test Harness</title>
  <link rel="stylesheet" href="/public/css/tokens.css">
  <link rel="stylesheet" href="/public/css/editor/spellcheck.css">
  <style>
    body { margin: 0; padding: 24px; font: 16px/1.6 system-ui, sans-serif; }
    .editor-wrap { position: relative; max-width: 720px; margin: 0 auto; }
    .editor-root {
      min-height: 200px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="editor-wrap">
    <div class="editor-root" id="editor" contenteditable="true" spellcheck="false"><p>Der Jungen ging in den Walld. Die Sonne scheinet hell.</p></div>
  </div>

  <script type="module">
    import { createSpellcheckController } from '/public/js/cards/editor-spellcheck/controller.js';
    import { applySpellcheckReplacement } from '/public/js/editor/shared/apply-replacement.js';
    import { stripLektoratMarks } from '/public/js/editor/shared/html-clean.js';

    const params = new URLSearchParams(location.search);
    const kind = params.get('kind') || 'notebook';

    const root = document.getElementById('editor');
    root.classList.add({
      notebook: 'page-content-view--editing',
      focus: 'focus-editor__content',
      book: 'book-editor-page-body',
    }[kind]);

    // Wie dispatch.js: bei Notebook/Focus ist der Editier-Root gleichzeitig der
    // Scroll-Container — der Popover haengt dort als Kind IM contenteditable.
    // Der Bucheditor scrollt am Window (Popover an <body>). Diese Aufteilung
    // muss der Harness spiegeln, sonst testet er den Popover-Mount nie am Ort,
    // an dem er in Produktion Waisen-Knoten erzeugen kann.
    const scrollContainer = kind === 'book' ? null : root;

    const ctl = createSpellcheckController({
      root,
      scrollContainer,
      getHtml: () => root.innerHTML,
      onApplyReplacement: (range, text) => applySpellcheckReplacement(range, text),
      editorKind: kind,
      getBookLocale: () => 'de-DE',
      getBookId: () => 1,
      getPageId: () => 1,
      isEnabled: () => true,
      // Ohne ?i18n=1 liefert i18n den rohen Key — wie die i18n-Bridge des
      // macOS-Clients; optionale Popover-Knoepfe bleiben dann aus.
      i18n: params.get('i18n') ? (key) => `T:${key}` : (key) => key,
    });

    ctl.attach();

    window.__spellcheckCtl = ctl;
    window.__applySpellcheckReplacement = applySpellcheckReplacement;
    // Save-Pfad-Stellvertreter: beide Editoren serialisieren via
    // stripLektoratMarks(content.innerHTML).
    window.__stripLektoratMarks = stripLektoratMarks;
    window.__harnessReady = true;
  </script>
</body>
</html>
