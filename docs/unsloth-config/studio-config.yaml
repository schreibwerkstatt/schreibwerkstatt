# ─────────────────────────────────────────────────────────────────────────
# Unsloth-Studio Training-Config (Studio-natives Format)
#
# Kommentierte Fassung des Default-Profils der Fine-Tuning-Export-Karte
# (Ministral 3 8B, 20 GB). Andere Profile lädt die Karte direkt herunter;
# Werte-Quelle public/js/book/finetune-profiles.js, Gleichstand gegated
# durch tests/unit/finetune-profiles.test.mjs.
#
# Keys entsprechen exakt dem Schema, das Studio über „Training Config →
# Save" exportiert (studio/frontend/src/features/training/lib/
# yaml-config.ts + model-defaults.ts im Unsloth-Repo). Studio liest nur
# die Abschnitte training/lora/logging; TrainingArguments-Namen
# (num_train_epochs, per_device_train_batch_size, train_on_responses_only,
# lora.r …) ignoriert es beim Import still.
#
# Verwendung: ERST das Modell wählen, DANN in Studio → „Training Config →
# Upload" diese Datei hochladen. Die Modellwahl lädt Studios Modell-
# Defaults (für Chat-Modelle u. a. packing=true) und überschreibt einen
# vorher importierten Stand. Dataset wird weiterhin in der GUI gewählt.
#
# Ziel: Ministral-3-8B-Instruct-2512 QLoRA auf 1× RTX 4000 Ada (20 GB
# VRAM) mit den JSONL-Exports der Fine-Tuning-Export-Karte.
#
# Vor dem Import in Studio noch in der GUI einstellen:
#   1. Dataset-Spalte: train.jsonl (Upload/Local), val.jsonl als Eval-File.
#   2. Advanced:       unsloth/Ministral-3-8B-Instruct-2512-unsloth-bnb-4bit,
#                      Method = QLoRA.
#
# Hinweis Tokenizer: Ministral 3 nutzt Tekken (Mistral-Common >= 1.8.6).
# Chat-Template rendert [INST]/[/INST] um User-Turns,
# System-Prompts in [SYSTEM_PROMPT]/[/SYSTEM_PROMPT]. Unsloth-Studio kümmert
# sich selbst um die Masking-Marker — `train_on_completions` reicht.
#
# Hinweis fehlende Keys: Studios Schema kennt keine Entsprechung zu
# `save_total_limit`, `bf16/fp16` (auto), `max_grad_norm`. Eval läuft
# implizit als „steps", sobald eval_steps > 0 und ein Eval-File gesetzt ist.
# ─────────────────────────────────────────────────────────────────────────

training:
  # ─── Step-vs-Epoch-Strategie ─────────────────────────────────────────
  # max_steps=0 → Epochen-gesteuert. num_epochs=2 ist Default für
  # Welt-Internalisierung. In Studio: „Use Epochs"-Toggle aktivieren.
  max_steps: 0
  num_epochs: 2

  # ─── Batching (20-GB-VRAM-Profil für 8B) ─────────────────────────────
  # effektive Batch = 2 × 8 = 16. VRAM-Peak ~12–15 GB. Bei OOM:
  # batch_size 1, gradient_accumulation_steps 16.
  batch_size: 2
  gradient_accumulation_steps: 8

  # ─── Sequenzlänge ────────────────────────────────────────────────────
  # 4096 matcht Export-Filter (max_seq_tokens=4096). p95 unserer Samples
  # ≈ 1500 Tokens → 2.7× Headroom. Bei OOM auf 2048 reduzieren.
  max_seq_length: 4096

  # ─── Optimizer & LR-Schedule ─────────────────────────────────────────
  # adamw_8bit halbiert Optimizer-State-VRAM. Cosine statt linear:
  # stabiler bei 2 Epochen. warmup_ratio rechnet Studio nur bei
  # max_steps > 0 um — bei Epochen-Steuerung zählt warmup_steps (absolut).
  # 20 Steps ≈ 1–3 % eines typischen Buch-Runs.
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 20
  weight_decay: 0.01
  optim: adamw_8bit

  # ─── Packing ─────────────────────────────────────────────────────────
  # Studios Modell-Default für Chat-Modelle ist true — hier bewusst false,
  # nach dem Import in der GUI prüfen. false erhält Sample-Grenzen. Wichtig für pageCont/chapTrans/scnTrans-
  # Samples aus dem Export — Packing würde unabhängige Fortsetzungen in
  # eine Sequenz mischen.
  packing: false

  # ─── Eval, Early-Stopping, Checkpointing ─────────────────────────────
  # Studio steuert Eval/Save über die Step-Intervalle. Early-Stopping
  # zählt Evaluationen ohne neuen eval_loss-Bestwert; nach `patience`
  # davon in Folge stoppt der Run, und am Ende werden die Gewichte der
  # besten Evaluation zurückgeschrieben (wirkt wie load_best_model_at_end).
  # Braucht val.jsonl als Eval-File, sonst ohne Wirkung.
  eval_steps: 200
  early_stopping_patience: 3
  save_steps: 400

  # ─── Loss-Masking (wichtigster Qualitäts-Hebel) ──────────────────────
  # Studio-Schlüssel: train_on_completions (entspricht Unsloths
  # train_on_responses_only). Ohne das lernt das Modell auch aus System-
  # Prompts und User-Fragen, Buch-Stil verwässert messbar. Instruction-/
  # Response-Marker werden intern aus dem Chat-Template des gewählten
  # Modells abgeleitet — für Ministral 3 sind das [INST]/[/INST].
  # Verifizieren vor dem Run:
  #   python -c "from unsloth import FastModel; \
  #     _, tok = FastModel.from_pretrained('unsloth/Ministral-3-8B-Instruct-2512-unsloth-bnb-4bit', load_in_4bit=True); \
  #     print(tok.apply_chat_template([{'role':'user','content':'x'},{'role':'assistant','content':'y'}], tokenize=False))"
  train_on_completions: true

  # ─── Reproduzierbarkeit ──────────────────────────────────────────────
  random_seed: 42

  # ─── Memory-Tricks ───────────────────────────────────────────────────
  # "unsloth" statt true = Unsloths schnellere Gradient-Checkpointing-
  # Variante (~30 % Speedup gegen Standard-HF-Checkpointing).
  gradient_checkpointing: unsloth

lora:
  # ─── Rang & Alpha ────────────────────────────────────────────────────
  # r=32 ist Sweet-Spot für "Welt internalisieren". Studio-Default 16 ist
  # zu klein — verliert Kapazität für Figuren/Orte. alpha = r (Unsloth-
  # Empfehlung). Bei 8B ist auf 20 GB auch r=64 möglich (Faktenwiedergabe,
  # siehe finetuning.md §4).
  lora_r: 32
  lora_alpha: 32

  # ─── Dropout ─────────────────────────────────────────────────────────
  # 0 ist am schnellsten dank Unsloths Fused-LoRA-Patch. Bei Over-Training
  # auf 0.05 hochsetzen.
  lora_dropout: 0

  # ─── Target-Module ───────────────────────────────────────────────────
  # Alle Attention- + MLP-Projections. Partielle Sets (nur q/v) trainieren
  # schneller, lernen aber Welt-Fakten schlechter.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

  # ─── Welche Layer-Gruppen trainieren (Ministral-3-spezifisch) ────────
  # Ministral 3 enthält einen Pixtral-Vision-Encoder (0.4B). Für reines
  # Text-Finetuning ist vision=false Pflicht — sonst werden Vision-
  # Gewichte ohne Bilddaten angefasst (VRAM-Waste, potenziell Corruption
  # bei späterer multimodaler Nutzung). Andere Gruppen an lassen.
  finetune_vision_layers: false
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true

  # RSLoRA/LoftQ/DoRA bringen bei r=32 nur marginalen Effekt — aus lassen.
  use_rslora: false
  use_loftq: false
  use_dora: false

logging:
  # TensorBoard-Kurve eval/loss ist der wichtigste Blick während des Runs.
  enable_tensorboard: true
  tensorboard_dir: runs
  log_frequency: 20
  enable_wandb: false
