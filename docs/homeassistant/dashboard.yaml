# Schreibwerkstatt — Lovelace-Dashboard
# Settings → Dashboards → Add Dashboard → New dashboard from scratch
# → drei Punkte oben rechts → Raw configuration editor → Inhalt einfügen.

title: Schreibwerkstatt
views:
  - title: Übersicht
    path: schreibwerkstatt
    icon: mdi:fountain-pen-tip
    cards:
      - type: markdown
        content: |
          ## Schreibwerkstatt
          Version **{{ states('sensor.schreibwerkstatt_version') }}** ·
          {{ states('sensor.schreibwerkstatt_active_users_24h') }} aktiv 24h ·
          {{ states('sensor.schreibwerkstatt_active_users_7d') }} aktiv 7d

      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.schreibwerkstatt_writing_today_minutes
            name: Geschrieben heute
            icon: mdi:pencil
          - type: entity
            entity: sensor.schreibwerkstatt_lektorat_today_minutes
            name: Lektorat heute
            icon: mdi:book-edit
          - type: entity
            entity: sensor.schreibwerkstatt_stt_today_minutes
            name: Diktiert heute
            icon: mdi:microphone
          - type: entity
            entity: sensor.schreibwerkstatt_stt_chars_today
            name: Zeichen diktiert heute
            icon: mdi:microphone-message

      - type: glance
        title: Heute
        columns: 4
        entities:
          - entity: sensor.schreibwerkstatt_words_today
            name: Wörter
          - entity: sensor.schreibwerkstatt_cost_usd_today
            name: Kosten heute
          - entity: sensor.schreibwerkstatt_cost_usd_month
            name: Kosten Monat
          - entity: sensor.schreibwerkstatt_billed_usd_month
            name: Abgerechnet

      - type: glance
        title: Server
        columns: 5
        entities:
          - entity: sensor.schreibwerkstatt_uptime
            name: Laufzeit
          - entity: sensor.schreibwerkstatt_memory_rss
            name: RAM
          - entity: sensor.schreibwerkstatt_db_size
            name: DB
          - entity: sensor.schreibwerkstatt_js_errors_24h
            name: JS-Fehler 24h
          - entity: sensor.schreibwerkstatt_registrations_pending
            name: Anfragen

      - type: glance
        title: Betrieb
        columns: 5
        entities:
          - entity: sensor.schreibwerkstatt_jobs_done_24h
            name: Jobs ok 24h
          - entity: sensor.schreibwerkstatt_jobs_failed_24h
            name: Jobs Fehler 24h
          - entity: sensor.schreibwerkstatt_jobs_in_memory
            name: Jobs im RAM
          - entity: sensor.schreibwerkstatt_devices
            name: Geräte
          - entity: sensor.schreibwerkstatt_heap_used
            name: Heap
          - entity: sensor.schreibwerkstatt_db_schema_version
            name: Schema

      - type: glance
        title: Inhalte
        columns: 5
        entities:
          - entity: sensor.schreibwerkstatt_books
            name: Bücher
          - entity: sensor.schreibwerkstatt_chapters
            name: Kapitel
          - entity: sensor.schreibwerkstatt_pages
            name: Abschnitte
          - entity: sensor.schreibwerkstatt_chars
            name: Zeichen
          - entity: sensor.schreibwerkstatt_normseiten
            name: Normseiten

      - type: glance
        title: User
        columns: 5
        entities:
          - entity: sensor.schreibwerkstatt_users_active
            name: Aktiv
          - entity: sensor.schreibwerkstatt_users_invited
            name: Eingeladen
          - entity: sensor.schreibwerkstatt_users_suspended
            name: Suspendiert
          - entity: sensor.schreibwerkstatt_active_users_24h
            name: 24h
          - entity: sensor.schreibwerkstatt_active_users_7d
            name: 7d

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.schreibwerkstatt_jobs_running
            name: Jobs laufend
            min: 0
            max: 5
            severity:
              green: 0
              yellow: 2
              red: 4
          - type: gauge
            entity: sensor.schreibwerkstatt_jobs_queued
            name: Jobs in Queue
            min: 0
            max: 10
            severity:
              green: 0
              yellow: 3
              red: 7

      - type: glance
        title: KI-Kosten & Tokens (kumuliert)
        columns: 4
        entities:
          - entity: sensor.schreibwerkstatt_cost_usd_total
            name: Kosten USD
          - entity: sensor.schreibwerkstatt_tokens_in_total
            name: Input
          - entity: sensor.schreibwerkstatt_tokens_out_total
            name: Output
          - entity: sensor.schreibwerkstatt_cache_hit_ratio
            name: Cache-Hit
          - entity: sensor.schreibwerkstatt_cost_usd_by_type_total
            name: Kosten nach Typ (Summe)
          - entity: sensor.schreibwerkstatt_billed_diff_usd_month
            name: Abweichung Abrechnung

      - type: glance
        title: Block-Merge (Stale-Write-Konflikte)
        columns: 4
        entities:
          - entity: sensor.schreibwerkstatt_merge_silent_total
            name: Auto-Merge
          - entity: sensor.schreibwerkstatt_merge_conflicts_shown_total
            name: Banner
          - entity: sensor.schreibwerkstatt_merge_conflicts_resolved_total
            name: Aufgelöst
          - entity: sensor.schreibwerkstatt_merge_fallback_overwrite_total
            name: Overwrite

      - type: history-graph
        title: Zeichen-Wachstum 7d
        hours_to_show: 168
        entities:
          - entity: sensor.schreibwerkstatt_chars

      - type: history-graph
        title: Job-Queue 24h
        hours_to_show: 24
        entities:
          - entity: sensor.schreibwerkstatt_jobs_running
          - entity: sensor.schreibwerkstatt_jobs_queued

      - type: history-graph
        title: Schreib- / Lektorat- / Diktat-Minuten heute
        hours_to_show: 24
        entities:
          - entity: sensor.schreibwerkstatt_writing_today_minutes
          - entity: sensor.schreibwerkstatt_lektorat_today_minutes
          - entity: sensor.schreibwerkstatt_stt_today_minutes

      - type: history-graph
        title: Kosten USD heute / Monat (7d)
        hours_to_show: 168
        entities:
          - entity: sensor.schreibwerkstatt_cost_usd_today
          - entity: sensor.schreibwerkstatt_cost_usd_month

      - type: history-graph
        title: Kosten USD (kumuliert, 30d)
        hours_to_show: 720
        entities:
          - entity: sensor.schreibwerkstatt_cost_usd_total
